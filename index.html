  // widest point, the waist and the tail curve are unchanged; only the necks are gone.
  const invBeta=(t,lo,hi)=>{ for(let k=0;k<44;k++){ const m=(lo+hi)*0.5;
    if(beta(m)<t) lo=m; else hi=m; } return (lo+hi)*0.5; };
  const uN=S.noseW>0?invBeta(S.noseW,0,up):0, uT=S.tailW>0?invBeta(S.tailW,1,up):1;
  const hw=u=>W*beta(uN+(uT-uN)*u)*close(u);
  // thickness runs to nothing at both tips, so the loft closes on a thin edge the
  // way a real board does, with its fullest point just ahead of centre
  const th=u=>Math.pow(Math.sin(Math.PI*Math.pow(Math.max(0,Math.min(1,u)),S.thSkew||1.0)),S.thPow||0.5)*close(u);
  const rock=u=>S.rockN*Math.pow(Math.max(0,(S.noseR-u)/S.noseR),2.2)
                +S.rockT*Math.pow(Math.max(0,(u-1+S.tailR)/S.tailR),2.2);
  // a swallow tail is the middle of the tail cut forward, so it is a shift in z
  const swal=S.swallow?(u,v)=>-S.swallow*_sm(0.80,1,u)*(1-Math.pow(Math.abs(v),1.7)):null;
  // an asymmetric board is genuinely two different halves: the heel side can run
  // wider and its tail can be cut forward of the toe side's
  const asW=(v)=>v<0?(S.asymW||1):1;
  const notch=(u,v)=>(swal?swal(u,v):0)
    +(S.asymZ&&v<0?-S.asymZ*_sm(0.62,1,u)*Math.abs(v):0);

  const pos=[],col=[],idx=[];
  const c=new THREE.Color();
  for(let i=0;i<=NU;i++){
    const u=i/NU, w=hw(u), t=th(u), r=rock(u);
    for(let j=0;j<NR;j++){
      const phi=j/NR*Math.PI*2;
      const v=Math.sin(phi), sAbs=Math.abs(v), top=Math.cos(phi)>=0;
      const prof=Math.pow(Math.max(0,1-sAbs*sAbs), top?(S.deckPow||0.56):(S.hullPow||0.42));
      pos.push(w*v*asW(v), r+(top?T*t*prof:-T*(S.hullK||0.62)*t*prof), (u-0.5)*L+notch(u,v));
      S.paint(c,u,v,top);
      col.push(c.r,c.g,c.b);
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<NR;j++){
    const j2=(j+1)%NR, A=i*NR+j, B=i*NR+j2, C=(i+1)*NR+j, D=(i+1)*NR+j2;
    idx.push(A,C,B, B,C,D);
  }
  // cap the two tips: the rings there are all but closed, but a fan seals them
  for(const [ring,fwd] of [[0,false],[NU,true]]){
    const base=pos.length/3, u=ring/NU;
    pos.push(0,rock(u),(u-0.5)*L+notch(u,0));
    S.paint(c,u,0,true); col.push(c.r,c.g,c.b);
    for(let j=0;j<NR;j++){
      const j2=(j+1)%NR;
      if(fwd)idx.push(base,ring*NR+j,ring*NR+j2); else idx.push(base,ring*NR+j2,ring*NR+j);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,color:0xffffff,
    roughness:S.rough!==undefined?S.rough:0.27,metalness:0.02});
  // wet-looking but not mirrored: a low sun on a glassier finish blows the deck out
  // to white and the paint scheme stops reading at all
  mat.envMapIntensity=0.40;
  const mesh=new THREE.Mesh(g,mat);

  const grp=new THREE.Group(); grp.add(mesh);
  // grip pad: a thin skin lying on the deck over the back third
  // a twin-tip carries two of them, one under each binding, rather than one long strip
  const padRanges=S.pads||[[S.padU0||0.735,S.padU1||0.945]];
  if(S.pad!==false)for(const [P0,P1] of padRanges){
    const PU=34, PV=18, pp=[], pi=[];
    const wide=S.padW||0.56;
    for(let i=0;i<=PU;i++){
      // a pad covers the back foot, not the back half: narrower than the outline and
      // rounded off at both ends so it reads as a pad rather than a paint job
      const e=Math.sin(Math.PI*Math.min(1,Math.max(0,i/PU)))*0.5+0.5;
      const u=P0+(P1-P0)*i/PU, w=hw(u)*wide*Math.pow(e,0.35), t=th(u), r=rock(u);
      for(let j=0;j<=PV;j++){
        const v=-1+2*j/PV;
        const prof=Math.pow(Math.max(0,1-v*v*0.64),S.deckPow||0.56);
        pp.push(w*v*asW(v), r+T*t*prof+0.006, (u-0.5)*L+notch(u,v*0.8));
      }
    }
    for(let i=0;i<PU;i++)for(let j=0;j<PV;j++){
      const A=i*(PV+1)+j, B=A+1, C=A+PV+1, D=C+1;
      pi.push(A,C,B, B,C,D);
    }
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
    pg.setIndex(pi); pg.computeVertexNormals();
    grp.add(new THREE.Mesh(pg,PBR({color:S.padCol||0x22262b,roughness:0.78,metalness:0.0})));
  }
  // fins
  const finMat=PBR({color:S.finCol||0x14181d,roughness:0.14,metalness:0.05,envMapIntensity:1.2});
  // The cluster is normalised before anything is built. Fins are grouped by station — by
  // their z — and within a station every fin off the stringer is GENERATED from the first
  // of them: same size, same profile, same rake, same distance out, mirrored. Three
  // hand-typed numbers are not trusted to agree with each other.
  // A fin ON the stringer keeps its own size. A big centre fin between smaller side bites
  // is a real 2+1 setup and worth having; it just has to be deliberate rather than three
  // fins that happen to differ.
  const stations=new Map();
  for(const f of S.fins){ const k=f.z.toFixed(4);
    if(!stations.has(k))stations.set(k,[]); stations.get(k).push(f); }
  const FINS=[];
  for(const grp of stations.values()){
    for(const f of grp)if(f.x===0)FINS.push(f);
    const side=grp.filter(f=>f.x!==0);
    if(side.length){
      // Cant is capped at about seven and a half degrees, which is the top of the range a
      // shaper actually sets. The spec numbers run as high as 0.26 — near fifteen degrees —
      // but nothing had ever been calibrated against them, because until now cant was being
      // turned into a fore-and-aft tilt rather than a lean, so the figure was never seen.
      const m0=side[0], ax=Math.abs(m0.x), ct=Math.min(Math.abs(m0.cant||0),FIN_CANT_MAX);
      // cant leans a fin's TIP outward toward its own rail, so its sign follows the rail
      for(const f of side)FINS.push({...m0, x:f.x<0?-ax:ax, cant:f.x<0?-ct:ct});
    }
  }
  for(const f of FINS){
    const sh=new THREE.Shape();
    const cL=f.c, d=f.d, ft=f.t||0.030, rk=f.rake===undefined?0.10:f.rake;
    sh.moveTo(-cL*0.5,0);
    sh.bezierCurveTo(-cL*0.30,-d*0.44, -cL*0.02+rk,-d*0.82, cL*0.14+rk,-d);
    sh.bezierCurveTo(cL*0.30+rk*0.5,-d*0.66, cL*0.42,-d*0.30, cL*0.5,0);
    sh.lineTo(-cL*0.5,0);
    const fg=new THREE.ExtrudeGeometry(sh,{depth:ft,bevelEnabled:true,
      bevelSize:ft*0.45,bevelThickness:ft*0.40,bevelSegments:3,curveSegments:26});
    fg.translate(0,0,-ft/2);
    const m=new THREE.Mesh(fg,finMat);
    // Cant has to happen about the board's fore-aft axis, and AFTER the quarter turn that
    // lays the fin across the board. Under the default XYZ order three.js builds Rx·Ry·Rz,
    // so rotation.z ran FIRST — spinning the fin inside its own plane, which the quarter
    // turn then converted into a fore-and-aft tilt. Opposite signs on the two rails meant
    // one fin leaned forwards and the other backwards: measured, every one of the 33
    // boards carrying a side pair failed a mirror test, by up to 0.13 on Coco Egg, all of
    // it in z. ZYX builds Rz·Ry·Rx, so the quarter turn goes first and the cant then leans
    // the tip out toward the rail, which is what cant is.
    m.rotation.order='ZYX';
    // MINUS a quarter turn, not plus. Rake sweeps the fin's tip toward the shape's +x, and
    // a positive quarter turn put that at world -z — the nose. Every fin on every board was
    // raking FORWARD: measured on Razorline, tip at z 1.863 against a root at 2.045, so the
    // tip led the base by 0.18 instead of trailing it. Turning the other way is a rotation
    // rather than a mirror, so the winding and the normals are untouched.
    // The extra angle is toe-in: a side fin is not set square to the stringer, its leading
    // edge is angled a couple of degrees in toward the nose, and that is half of why a fin
    // cluster reads as a cluster rather than as three fins near each other. Turning further
    // about +y carries the trailing edge outboard and the leading edge in, which is toe-in
    // for the fin on the +x rail and mirrors for the other. A fin on the stringer has
    // nothing to toe toward, so it stays square.
    m.rotation.y=-Math.PI/2+(f.x===0?0:(f.x>0?1:-1)*FIN_TOE);
    // A fin is bolted to the hull, so it has to sit ON the hull and INSIDE the rail. Both
    // were checked at the fin's CENTRE only, which is the one place the arithmetic put it
    // — so both checks passed and both were wrong. A fin is not a point: its root is a
    // straight chord up to two thirds of a metre long, and over that length the hull
    // curves away underneath it and the outline narrows around it.
    //
    // The hull curves fore-and-aft under the root — rocker plus the thickness running out
    // toward the tail — so a root set to the hull's depth at its middle lifts clear of it
    // at the ends. Sampled along the chord instead of at the middle, roots stood as much
    // as 0.049 below the surface on Riptide Wake, which is the daylight you can see.
    // The root now goes to the HIGHEST the hull reaches anywhere along the chord: every
    // other point is then buried in foam, which shows as nothing at all.
    //
    // And the outline narrows toward the tail across the same span, so a fin held inside
    // the half-width at its middle still hangs out at its aft end. Clamped against the
    // NARROWEST the board gets along the chord, Midnight Gun was reaching 1.086 of it.
    const halfT=ft*0.5, lean=Math.abs(Math.sin(f.cant||0))*d;
    const SAMP=8, zAt=k=>f.z+(-0.5+k/SAMP)*cL;
    // An asymmetric board's two rails are genuinely different — one runs wider, and its
    // tail is cut forward of the other's — so a fin placed against the hull it actually
    // sits on lands at a different depth on each side, and the pair stops mirroring. Both
    // sides are therefore worked out for EVERY fin and the safe one is taken: the narrower
    // half-width to clamp against, the higher hull to seat on. On the roomier rail the fin
    // ends up a little further in and a little deeper into the foam, which shows as
    // nothing, and the pair mirrors exactly.
    const SIDES=(S.asymW||S.asymZ)?[-1,1]:[f.x<0?-1:1];
    let halfMin=Infinity;
    for(const sg of SIDES){
      const aw=sg<0?(S.asymW||1):1;
      for(let k=0;k<=SAMP;k++)
        halfMin=Math.min(halfMin,hw(Math.max(0,Math.min(1,0.5+zAt(k)/L)))*aw);
    }
    // a base a fifth of the half-width in from the rail, and a tip that still clears it
    const room=Math.max(0.01,Math.min(halfMin*0.80-halfT, halfMin*0.92-lean));
    const x=f.x===0?0:(f.x<0?-1:1)*Math.min(Math.abs(f.x),room);
    // A swallow tail or an asymmetric cut moves the surface FORWARD of its own station, so
    // the hull under a given z is not at u = 0.5 + z/L but at some larger u. Solving for it
    // is what closed the last of the gaps: on the notched boards — Asymmetric, Tangerine
    // Fish, Volt, Throw-Up — sampling the plain station left up to 0.017 of daylight.
    let rootY=-Infinity;
    for(const sg of SIDES){
      const aw=sg<0?(S.asymW||1):1;
      const uAt=zz=>{ let uu=Math.max(0,Math.min(1,0.5+zz/L));
        for(let it=0;it<3;it++){
          const hh=hw(uu)*aw, vv=hh>1e-5?Math.min(0.999,Math.abs(x)/hh)*sg:0;
          uu=Math.max(0,Math.min(1,0.5+(zz-notch(uu,vv))/L));
        }
        return uu; };
      for(let k=0;k<=SAMP;k++){
        const uu=uAt(zAt(k)), hh=hw(uu)*aw;
        const vv=hh>1e-5?Math.min(0.999,Math.abs(x)/hh):0;
        const pf=Math.pow(Math.max(0,1-vv*vv),S.hullPow||0.42);
        rootY=Math.max(rootY, rock(uu)-T*(S.hullK||0.62)*th(uu)*pf);
      }
    }
    m.position.set(x, rootY+0.004, f.z);
    m.rotation.z=f.cant||0;
    grp.add(m);
  }
  // ---- hydrofoil: a mast hanging under the hull with a wing and a stabiliser on it ----
  if(S.foil){
    const F=S.foil;
    const fm=PBR({color:F.col||0x1a1e24,roughness:0.18,metalness:0.42,envMapIntensity:1.5});
    const FZ=F.z===undefined?0.35:F.z, H=F.h||1.30, FUS=F.fus||1.35;
    const u0=0.5+FZ/L;
    const yTop=rock(u0)-T*(S.hullK||0.62)*th(u0)*0.92;
    // the mast is a very tall, very thin aerofoil — the same section as a fin, stretched
    const mc=F.chord||0.42, mt=F.t||0.055;
    const ms=new THREE.Shape();
    ms.moveTo(-mc*0.5,0);
    ms.bezierCurveTo(-mc*0.34,-H*0.34,-mc*0.24,-H*0.72,-mc*0.30,-H);
    ms.lineTo(mc*0.24,-H);
    ms.bezierCurveTo(mc*0.34,-H*0.70,mc*0.44,-H*0.34,mc*0.5,0);
    ms.lineTo(-mc*0.5,0);
    const mg=new THREE.ExtrudeGeometry(ms,{depth:mt,bevelEnabled:true,bevelSize:mt*0.40,
      bevelThickness:mt*0.35,bevelSegments:3,curveSegments:22});
    mg.translate(0,0,-mt/2);
    const mast=new THREE.Mesh(mg,fm);
    mast.rotation.y=Math.PI/2; mast.position.set(0,yTop,FZ);
    grp.add(mast);
    const fus=new THREE.Mesh(new THREE.CylinderGeometry(0.046,0.032,FUS,14),fm);
    fus.rotation.x=Math.PI/2; fus.position.set(0,yTop-H+0.04,FZ-0.04);
    grp.add(fus);
    // a wing planform lying flat: the shape's own Y becomes fore-and-aft, the extrusion
    // becomes thickness, so a swept crescent comes out as a wing rather than a fin
    const wing=(span,chord,sweep,thick)=>{
      const w=new THREE.Shape();
      w.moveTo(-span/2,sweep);
      w.bezierCurveTo(-span*0.24,-chord*0.42, span*0.24,-chord*0.42, span/2,sweep);
      w.bezierCurveTo(span*0.24,sweep+chord*0.62, -span*0.24,sweep+chord*0.62, -span/2,sweep);
      const g2=new THREE.ExtrudeGeometry(w,{depth:thick,bevelEnabled:true,bevelSize:thick*0.45,
        bevelThickness:thick*0.40,bevelSegments:2,curveSegments:24});
      g2.translate(0,0,-thick/2);
      return g2;
    };
    const SP=F.span||1.30, WC=F.wc||0.34;
    const fw=new THREE.Mesh(wing(SP,WC,0.10,0.044),fm);
    fw.rotation.x=-Math.PI/2; fw.position.set(0,yTop-H+0.02,FZ-FUS*0.42);
    grp.add(fw);
    const rw=new THREE.Mesh(wing(SP*0.46,WC*0.60,0.05,0.032),fm);
    rw.rotation.x=-Math.PI/2; rw.position.set(0,yTop-H+0.08,FZ+FUS*0.46);
    grp.add(rw);
  }
  grp.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return grp;
}
// paint helpers: everything is authored in sRGB and moved into linear by vivid()
function _mix(c,hex,k){const t=vivid(hex,1.25);c.lerp(t,k);return c;}
// A multi-stop fade. The stops are pre-built Colors rather than hex, because this runs
// once per vertex on a board with fourteen thousand of them and converting in here is not
// free — and because they have to be pushed through vivid() first, the way _mix does it.
function _ramp(c,stops,t){
  t=Math.max(0,Math.min(1,t));
  let i=0; while(i<stops.length-2&&t>stops[i+1][0])i++;
  const a=stops[i], b=stops[i+1];
  c.copy(a[1]).lerp(b[1],(t-a[0])/(b[0]-a[0]||1));
  return c;
}
function deckScheme(o){
  const sw=o.sw||0.022, ra=o.railAt||0.88;
  return (c,u,v,top)=>{
    const s=Math.abs(v);
    if(top){
      c.copy(vivid(o.deck,o.vivid===undefined?1.35:o.vivid));
      if(o.bands){                                   // resin bands sprayed across the deck
        for(const [at,wid,hex] of o.bands)c.lerp(vivid(hex,1.4),Math.max(0,1-Math.abs(u-at)/wid));
      }
      if(o.stringer&&s<sw)c.copy(vivid(o.stringer,1.3));
      if(o.vstripes)for(const [at,wd,hex] of o.vstripes)
        if(Math.abs(s-at)<wd)_mix(c,hex,1-Math.abs(s-at)/wd);
      if(s>ra)_mix(c,o.rail,_sm(ra,1.0,s));
    } else {
      c.copy(vivid(o.hull,1.2));
      if(o.stringer&&s<sw)c.copy(vivid(o.stringer,1.3));
      if(o.pin&&s>ra-0.08&&s<ra+0.02)_mix(c,o.pin,1-Math.abs(s-(ra-0.03))/0.05);
      if(s>ra+0.02)_mix(c,o.rail,_sm(ra+0.02,1.0,s));
    }
  };
}
// ---------- pattern paint ----------
// The lofted boards get their graphics from the same per-vertex paint callback the
// plain ones use, so a monogram, a spray blob and a race livery are all just a
// function of where you are on the deck. u runs nose to tail, v across the rails.
const _hash=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);};
function _noise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=xf*xf*(3-2*xf), b=yf*yf*(3-2*yf);
  return (_hash(xi,yi)*(1-a)+_hash(xi+1,yi)*a)*(1-b)
       + (_hash(xi,yi+1)*(1-a)+_hash(xi+1,yi+1)*a)*b;
}
function _fbm(x,y){let s=0,m=0.5,f=1;for(let i=0;i<4;i++){s+=_noise(x*f,y*f)*m;f*=2.07;m*=0.5;}return s;}
const _rep=x=>((x%1)+1)%1;                       // wrap into 0..1 whatever the sign
// lay a graphic over a normal paint scheme rather than replacing it, so every one of
// these still gets its rails, hull and stringer for free
function artScheme(o){
  const base=deckScheme(o);
  return (c,u,v,top)=>{
    base(c,u,v,top);
    if(o.art&&(top||o.both))o.art(c,u,v,top);
    if(top&&o.sw&&Math.abs(v)<(o.sw||0)&&o.stringer)c.copy(vivid(o.stringer,1.3));
  };
}
// ---------- sponsor decals ----------
// A real GT car is not a paint job. It is a paint job under two hundred stickers, and the
// density of them is most of what makes one read as a race car rather than a coloured car.
// None of these say anything: at the size a board is ever actually seen, lettering IS a
// row of bars, so that is what they are — a panel, a margin, and bars inside it. No real
// marks and no real names anywhere.
function _sticker(c,u,v,pu,pv,h,w,bg,fg,bars){
  if(Math.abs(u-pu)>h||Math.abs(v-pv)>w)return;
  _mix(c,bg,1);
  if(Math.abs(u-pu)<h*0.82&&Math.abs(v-pv)<w*0.56){
    const t=_rep((u-pu+h)/(h*2)*(bars||8));
    if(t<0.52)_mix(c,fg,1);
  }
}
// A scattered field of them. Deterministic, so a board is the same board every time it is
// lofted and the photograph in the shop matches the one you ride.
function _decals(c,u,v,seed,n,u0,u1,vLo,vHi,pal){
  for(let i=0;i<n;i++){
    const a2=_hash(seed+i*7.3,i*3.1), b2=_hash(i*5.7,seed-i*2.9), d2=_hash(seed*1.7+i,i*11.3);
    const pu=u0+(u1-u0)*a2;
    const pv=(vLo+(vHi-vLo)*b2)*(_hash(i*1.9,seed)<0.5?1:-1);
    const p=pal[Math.floor(_hash(i*13.1,seed*0.7)*pal.length)%pal.length];
    _sticker(c,u,v,pu,pv,0.009+d2*0.015,0.020+_hash(i*2.3,seed)*0.028,
             p[0],p[1],3+Math.floor(d2*5));
  }
}
// the number roundel every car carries on its door
function _roundel(c,u,v,pu,pv,r,bg,fg,ring){
  const du=(u-pu)/r, dv=(v-pv)/(r*2.1), d=Math.hypot(du,dv);
  if(d>1.08)return;
  _mix(c, d>0.88?(ring===undefined?fg:ring) : bg, 1);
  if(d<0.84&&Math.abs(dv)<0.60){
    const t=_rep((u-pu+r*0.62)/(r*1.24)*3);
    if(t<0.44)_mix(c,fg,1);
  }
}
// a rectangle of colour on the deck — a sponsor patch, a number plate, a label
function _patch(c,u,v,pu,pv,h,w,hex,k){
  if(Math.abs(u-pu)<h&&Math.abs(v-pv)<w)_mix(c,hex,k===undefined?1:k);
}
// Hand-painted china sprigs. u and v are on wildly different scales — u spans six feet of
// board, v only the seventy centimetres across it — so every one of these has to correct
// for the aspect or the bloom comes out as a long smear down the deck instead of a flower.
// ASP is roughly (length / half-width), and it is passed rather than assumed because the
// boards are not all the same shape.
function _bloom(c,u,v,pu,pv,r,petal,heart,np,asp){
  const dx=(u-pu)*(asp||18), dy=v-pv;
  const d=Math.hypot(dx,dy);
  if(d>r*1.2)return;
  const a=Math.atan2(dy,dx);
  const pr=r*(0.58+0.42*Math.abs(Math.cos(a*(np||5)*0.5)));   // scalloped petal edge
  if(d<pr)_mix(c,petal,0.92);
  if(d<r*0.27)_mix(c,heart,0.95);
}
function _sprigLeaf(c,u,v,pu,pv,r,col,ang,asp){
  const A=ang||0, ca=Math.cos(A), sa=Math.sin(A);
  const dx=(u-pu)*(asp||18), dy=v-pv;

  {id:'leaf', name:"De Soto's Leaf", price:3000,
   blurb:'One leaf off a beach almond, dried flat and waxed. An ant needs nothing bigger.',
   // The outline IS the leaf, rather than a leaf painted onto a surfboard. The nose is the
   // point, so noseW is almost nothing and the closing arc brings it to a fine tip; the
   // widest part sits at 0.55 because a leaf carries its width low, toward the stem; and

   // leaf is — which also makes it the loosest thing in the rack that still holds a line.
   // nr is the number that matters here, not nu. The veins sweep across the rings, not
   // along them: from midrib to rail a vertex crosses two whole vein cycles, so the ring
   // count is what decides whether a vein is a line or a row of dots. 84 rings put barely
   // one vertex inside each vein and it came out as stitching.
   spec:{nu:190,nr:124,L:5.20,W:0.90,T:0.100,noseA:1.10,tailA:0.90,noseW:0.03,tailW:0.30,
     rockN:0.18,noseR:0.34,rockT:0.045,tailR:0.30,deckPow:0.78,hullPow:0.70,hullK:0.92,

       sw:0,railAt:0.94,vivid:1.4,both:true,
       // Everything here fades in and out with _sm rather than switching on a threshold.
       // A hard test against a vertex grid is what turned the first cut of these veins into
       // dashed stitching: the band only lights the vertices that happen to land inside it,
       // and between them the interpolation drops back to the blade. A smooth falloff is
       // sampled correctly at any resolution, which is the same lesson the ocean taught.
       art:(c,u,v,top)=>{
         const a=Math.abs(v);
         _ramp(c,LEAF_BLADE,u);                     // point to base
         if(!top)_mix(c,0xa9c977,0.55);             // the underside of a leaf is always paler
         // A soft mottle, the unevenness of a real blade. Deliberately much coarser than
         // the vein spacing — at a similar frequency the two beat against each other and
         // chop the veins into segments.
         const mott=_fbm(u*4.5,v*3.0);
         _mix(c,mott>0.5?0x74b333:0x2c6b1a,Math.abs(mott-0.5)*0.5);

         // run out, so the family is u + k*|v| — the fractional power puts the bend near
         // the rib, which is where a leaf actually bends it.
         const q=u+0.30*Math.pow(a,0.78);
         const vw=0.150*(1-0.40*a);                 // and they thin out toward the margin
         const vd=Math.abs(_rep(q*7.0)-0.5);

         if(_hash(Math.floor(u*26),Math.floor(v*14))>0.977)_mix(c,0x6d4f1c,0.5);

         // outline curve has no way to make a serration that would read at this size.
         _mix(c,0x1d4a12,_sm(0.93,0.985,a+0.014*Math.abs(Math.sin(u*Math.PI*30)))*0.9);

   blurb:'Hybrid egg. Tailored, round everywhere, and far quicker than it looks.',
   spec:{nu:240,nr:62,L:5.75,W:0.76,T:0.170,noseA:0.80,tailA:0.82,noseW:0.22,tailW:0.28,
     rockN:0.26,noseR:0.35,rockT:0.09,tailR:0.26,deckPow:0.62,hullPow:0.46,hullK:0.64,
     padCol:0x15151a,finCol:0xd63a2a,
     paint:artScheme({deck:0xf4f2ee,hull:0xfbfaf7,rail:0xd63a2a,pin:0xd63a2a,stringer:0x14141a,
       sw:0.016,railAt:0.88,vivid:1.1,
       art:(c,u,v)=>{
         // square cells, and big enough that the spurs read as teeth rather than
         // merging into diagonal stripes
         const X=v*3.2, Y=u*25.0;
         const cx=Math.floor(X), cy=Math.floor(Y), fx=X-cx, fy=Y-cy;
         let on=((cx+cy)&1)===0;
         // Teeth push OUT of each dark cell into its pale neighbour. Flipping whole
         // corners instead, which is what this did before, joins the cells up along
         // the diagonal and the check collapses into stripes.
         if(!on){
           if(fx+fy<0.44)on=true;
           if(fx+fy>1.56)on=true;
         }
         if(on)_mix(c,0x14141a,1);
       }}),
     fins:[{x:0,z:2.04,c:0.58,d:0.55,t:0.032,rake:0.18},

  // FATHOM. Every other board in this rack imitates a style — a log, a fish, a spray
  // job, a race livery. Not one of them is a READOUT. This one is: the deck carries a

  // of a handful of sines crossing at angles. It is sampled across the board instead of
  // across the water and quantised into depth bands, so what you are standing on is a
  // slice of the swell you are riding, printed cold.
  //
  // It samples its own field rather than calling waveH: the ocean's is tuned to metres
  // of open water and would come out flat across two units of foam. Same construction,
  // scaled to the object.

  // Everything else follows from that. The shape is a mid-length displacement hull —
  // long, narrow, pulled-in nose, rounded pin — because it should look like an instrument
  // and not a toy. The palette is ink and bone with one cold accent, so the pattern
  // carries the board and nothing competes with it. And there are depth graduations

// Board stats, derived from the hull rather than typed in by hand.
//
// Every board already carries its real shape — length, width, thickness, rocker — and
// that IS the physics. Deriving the numbers from it means a 9'6" log comes out stable,
// tough and slow to turn, and a little fish comes out loose and poppy, automatically and
// consistently, with no table to keep in sync with the art. The bars in the shop then
// explain the shape you are looking at instead of being invented next to it.
//
// The trade-off is the point: size buys speed and toughness, smallness buys turn and
// pop. Price moves the total only a little — enough that a grind is worth something
// without making the board you start on junk.
// ---------------------------------------------------------------------------
const STAT_KEYS=['speed','turn','air','tough'];

function computeStats(){
  const raw={}, lo={}, hi={};

    const S=b.spec; if(!S)continue;
    const L=S.L, W=S.W, T=S.T, rock=(S.rockN||0)+(S.rockT||0), vol=L*W*T;
    raw[b.id]={
      speed: L*0.90 + T*7.0 - rock*2.2,        // length and foam hold speed, rocker scrubs it
      turn : rock*4.0 + W*2.2 - L*0.75,        // rocker and width turn, length resists
      air  : 1/vol + rock*1.5,                 // a small light board pops and spins
      tough: vol*3.0 + T*5.0                   // foam is what survives a hit
    };
  }
  for(const k of STAT_KEYS){
    lo[k]=Infinity; hi[k]=-Infinity;
    for(const id in raw){ lo[k]=Math.min(lo[k],raw[id][k]); hi[k]=Math.max(hi[k],raw[id][k]); }
  }
  // the fallback for an id that is not in the rack; Astro's own five-across is pinned in
  // its spec, so it survives the budgeting below rather than being recomputed over
  const out={astro:{speed:5,turn:5,air:5,tough:5}};
  for(const b of BOARDS){
    if(!raw[b.id])continue;
    const v={};
    for(const k of STAT_KEYS){
      const n=(raw[b.id][k]-lo[k])/Math.max(1e-6,hi[k]-lo[k]);
      v[k]=Math.round(2+n*7);                        // 2..9, so nothing is empty or full yet
    }
    // A hull cannot tell you everything. An electric board's speed is in its motor, not
    // its outline, so a spec may state a stat outright — and a stated one is pinned, so
    // the balancing below never quietly walks it back.
    const pin={};
    if(b.spec.stat)for(const k in b.spec.stat){ v[k]=b.spec.stat[k]; pin[k]=1; }
    // Every board is then held to a budget set by its price. Without this the totals come
    // out wherever the geometry happens to land, and some board is simply better than a
    // dearer one — which makes the shop a lottery instead of a choice.
    const target=18+Math.round(b.price/11000*4);      // 18 at the cheap end, 23 at the top
    let tot=STAT_KEYS.reduce((a2,k)=>a2+v[k],0);
    // Price buys SPECIALISATION, not a flat lift: spare points go to whatever the board
    // is already best at and cuts come off what it is already worst at. Spreading them
    // evenly instead turned the dearest board in the game into four middling bars, which
    // told you nothing about what riding it is like.
    const free=k2=>!pin[k2];
    while(tot>target){
      const k=STAT_KEYS.filter(k2=>free(k2)&&v[k2]>2).sort((a2,b2)=>v[a2]-v[b2])[0];
      if(!k)break; v[k]--; tot--;
    }
    while(tot<target){
      const k=STAT_KEYS.filter(k2=>free(k2)&&v[k2]<10).sort((a2,b2)=>v[b2]-v[a2])[0];

    // two, near it sits low where a ground line belongs.
    const SAND=new THREE.Color(0xd9bd8e), PALE=new THREE.Color(0xe8dcc2),

    // frame. On a 40-tall plane the sky sat above t=0.2 and the visible band only reached

// ---------------------------------------------------------------------------
// The beach the full-screen look stands on. Hidden for the shop's thumbnail pass —
// those are photographed onto transparency and laid on the card's own gradient, and a
// beach baked into a 148px tile fights the board's graphics instead of setting them off.
//
// The sky and the sea are the game's own shaders, but on their OWN uniforms rather than
// the shared ones. Sharing meant the preview inherited whatever hour the last run had
// wandered into — which is how it came out at dusk. These are pinned to a bright
// afternoon and stay there. Only the wave clock is copied across, so the swell still
// rolls rather than standing still.
// ---------------------------------------------------------------------------
let prevOcean=null, prevSky=null, beachLife=null, cardSet=null, cardShadow=null;
const _ss2=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
let SAND_LIT=0x484848, PALM_LIT=0x3c3c3c, beachShadow=null, beachSand0=0;   // set by measurement, see the note on the sand
// ---- one palm, built as a single buffer geometry ----
// Trunk, frond spines and every leaflet go into one set of arrays and come out as one
// mesh: a palm is a few hundred separate blades, and a few hundred draw calls for a piece
// of scenery is not worth it. Colour is per-vertex, so the whole tree is one material.
function buildPalm(seed){
  const P=[],N=[],C=[],I=[];
  let rs=seed*9301+49297;
  const R=()=>{rs=(rs*9301+49297)%233280; return rs/233280;};
  const col=new THREE.Color();
  const push=(x,y,z,c)=>{ P.push(x,y,z); C.push(c.r,c.g,c.b); return P.length/3-1; };

  // --- trunk: a curve that leans out over the water and straightens near the crown,
  // lofted as tapered rings with the ring-scars a palm actually has cut into the radius
  const H=10.6+R()*2.0, lean=0.40+R()*0.20, TS=58, TR=18;
  // More curve than a lean: a coconut palm's trunk is a long C that leaves the sand at an
  // angle, straightens through the middle and comes back upright under the crown. A single
  // sine plus a quadratic reads as a stick propped over; the cubic gives it the reverse
  // bend near the top.
  const bend=t=>new THREE.Vector3(
    Math.sin(t*1.62)*lean*H*0.62 + t*t*lean*H*0.46 - t*t*t*lean*H*0.30,
    t*H,
    -Math.sin(t*0.85)*lean*H*0.20);
  // A coconut palm's trunk is not a smooth pole: the old leaf bases leave hard rings that
  // spiral slowly up it, with fibre running between them. Three tones with real distance
  // between them, so the rings read as cut in rather than as a faint stripe.
  const BARK1=new THREE.Color(0xd8a866), BARK2=new THREE.Color(0x3b2a14), BARK3=new THREE.Color(0xffdca0);
  const ringsIdx=[];
  for(let i=0;i<=TS;i++){
    const t=i/TS, c0=bend(t), c1=bend(Math.min(1,t+0.01));
    const dir=c1.clone().sub(c0).normalize();
    const sideA=new THREE.Vector3(0,1,0).cross(dir).normalize();
    const sideB=dir.clone().cross(sideA).normalize();
    // taper, with a slight swell at the foot the way a palm flares into the sand
    const rad=(0.72-0.40*t)*(1+Math.pow(1-t,4)*1.5)*0.5;
    const row=[];
    for(let j=0;j<TR;j++){
      const a=j/TR*Math.PI*2;
      const w=sideA.clone().multiplyScalar(Math.cos(a)).add(sideB.clone().multiplyScalar(Math.sin(a)));
      // the rings climb in a slow spiral rather than stacking level, which is what stops
      // them looking like a machined thread
      const sp2=t*23.0 + a/(Math.PI*2)*0.6;
      const ring=Math.abs(((sp2%1)+1)%1-0.5)*2;       // 1 on the ridge, 0 in the groove
      const groove=Math.pow(1-ring,2.0);
      const fibre=_noise(a*7.0,t*95);                  // vertical fibre between the rings
      const rr=rad*(1-groove*0.13*(1-t*0.3));
      col.copy(BARK2).lerp(BARK1,0.30+ring*0.62+(fibre-0.5)*0.34);
      if(Math.cos(a)>0.1)col.lerp(BARK3,0.42*Math.cos(a)*(0.45+ring*0.55));
      row.push(push(c0.x+w.x*rr, c0.y+w.y*rr, c0.z+w.z*rr, col));
    }
    ringsIdx.push(row);
  }
  for(let i=0;i<TS;i++)for(let j=0;j<TR;j++){
    const a=ringsIdx[i][j], b=ringsIdx[i][(j+1)%TR], c=ringsIdx[i+1][j], d=ringsIdx[i+1][(j+1)%TR];
    I.push(a,c,b, b,c,d);
  }

  // --- crown: the fronds
  const top=bend(1), topDir=bend(1).sub(bend(0.97)).normalize();
  const NF=15+((R()*4)|0);
  // Much further apart than before. The crown was three greens within a few per cent of
  // each other, so every frond came out the same flat sheet and the whole thing read as one
  // shape. With a deep shadow green and a sunlit one there is depth between the fronds.
  const G1=new THREE.Color(0x2f7a26), G2=new THREE.Color(0xa8e85c), G3=new THREE.Color(0x0d3312);
  for(let f=0;f<NF;f++){
    const az=f/NF*Math.PI*2+R()*0.22;
    // how far the frond starts out horizontal before it droops: the outer ones hang, the
    // inner ones stand up, which is what gives a palm crown its shape rather than a mop
    const rise=0.30+R()*0.85;
    const len=5.4+R()*2.6;
    const SEG=22;
    const fTint=(R()-0.5)*0.34;                      // this frond's own share of the light
    const dirH=new THREE.Vector3(Math.cos(az),0,Math.sin(az));
    const spine=k=>{
      const t=k/SEG;
      // out and up, then over and down — a quadratic arc with gravity on the tail
      const y=rise*len*Math.sin(t*1.35)-len*0.62*t*t*t;
      return new THREE.Vector3(dirH.x*len*t*0.96, y, dirH.z*len*t*0.96)
        .add(topDir.clone().multiplyScalar(0.35)).add(top);
    };
    let prevL=null,prevR=null,prevC=null;
    for(let k=0;k<=SEG;k++){
      const t=k/SEG, p=spine(k), p2=spine(Math.min(SEG,k+1));
      const tan=p2.clone().sub(p).normalize();
      const side=tan.clone().cross(new THREE.Vector3(0,1,0)).normalize();
      if(side.lengthSq()<0.01)side.set(1,0,0);
      const up=side.clone().cross(tan).normalize();
      // the spine itself: a thin tapered rib so the frond has a stem, not just leaves
      const rib=0.085*(1-t*0.82);
      col.copy(G3).lerp(G1,0.42);                    // the spine stays in shadow
      const cL=push(p.x-side.x*rib,p.y-side.y*rib,p.z-side.z*rib,col);
      const cR=push(p.x+side.x*rib,p.y+side.y*rib,p.z+side.z*rib,col);
      if(prevL!==null)I.push(prevL,cL,prevR, prevR,cL,cR);
      prevL=cL; prevR=cR;
      // leaflets: one either side, angled back along the frond and drooping more as the
      // frond runs out. Tapered to a point, and every one a slightly different green.
      if(k>0&&k<SEG){
        const lw=(1.30-Math.abs(t-0.42)*1.25)*(0.72+R()*0.5);
        if(lw>0.06)for(const sg of [-1,1]){
          const droop=0.30+t*0.95+R()*0.22;
          const outv=side.clone().multiplyScalar(sg).multiplyScalar(lw)
            .add(tan.clone().multiplyScalar(lw*0.62))
            .add(up.clone().multiplyScalar(-droop*lw*0.9));
          // leaflets that hang further down are further into the crown's own shade, and
          // each frond carries its own tint so they do not merge into one canopy
          col.copy(G1).lerp(G2,R()*0.95*Math.max(0,1-droop*0.55)+fTint).lerp(G3,t*0.45+droop*0.30);
          const a0=push(p.x,p.y,p.z,col);
          const a1=push(p.x+tan.x*0.30,p.y+tan.y*0.30,p.z+tan.z*0.30,col);
          col.lerp(G3,0.42);                            // dark toward the tip, for depth
          const a2=push(p.x+outv.x,p.y+outv.y,p.z+outv.z,col);
          I.push(a0,a1,a2, a0,a2,a1);            // both faces: a leaf is seen from under
        }
      }
      prevC=p;
    }
  }
  // --- a few coconuts tucked under the crown
  for(let n=0;n<4;n++){
    const a=R()*Math.PI*2, r=0.42+R()*0.30;
    const cx=top.x+Math.cos(a)*r, cy=top.y-0.45-R()*0.4, cz=top.z+Math.sin(a)*r;
    const base=P.length/3, RS=7;
    col.set(0x6b5433);
    for(let i2=0;i2<=RS;i2++)for(let j2=0;j2<=RS;j2++){
      const th=i2/RS*Math.PI, ph=j2/RS*Math.PI*2, rr=0.30;
      push(cx+Math.sin(th)*Math.cos(ph)*rr, cy+Math.cos(th)*rr, cz+Math.sin(th)*Math.sin(ph)*rr,
           col.clone().multiplyScalar(0.78+0.28*Math.sin(th)*Math.cos(ph)));
    }
    for(let i2=0;i2<RS;i2++)for(let j2=0;j2<RS;j2++){
      const a0=base+i2*(RS+1)+j2;
      I.push(a0,a0+RS+1,a0+1, a0+1,a0+RS+1,a0+RS+2);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  geo.setIndex(I);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
    vertexColors:true,color:PALM_LIT,roughness:0.82,metalness:0.0,side:THREE.DoubleSide}));
  m.material.envMapIntensity=0.55;
  return m;
}
function buildBeach(){
  const g=new THREE.Group(); g.visible=false;

  prevSky=skyDome.material.clone();
  prevSky.uniforms.uTop.value=new THREE.Color(0x1a6ed6);
  prevSky.uniforms.uMid.value=new THREE.Color(0x71c4f5);
  prevSky.uniforms.uHorizon.value=new THREE.Color(0xdcf1fc);
  prevSky.uniforms.uGlow.value=new THREE.Color(0xfff6de);
  prevSky.uniforms.uSunX.value=0.42;
  prevSky.uniforms.uGlowAmt.value=0.20;

  sky.renderOrder=-20; g.add(sky);

  // The sea keeps the game's own colours — the preview had its own turquoise, which was a
  // different ocean from the one you actually surf on. Only the LIGHT is pinned, so it
  // stays a bright day rather than following the ride into dusk; swell and foam are copied
  // over live in renderViewer so it moves exactly as the real one does.
  prevOcean=oceanMat.clone();
  prevOcean.uniforms.uSky.value=oceanUniforms.uSky.value.clone();
  prevOcean.uniforms.uDeep.value=oceanUniforms.uDeep.value.clone();
  prevOcean.uniforms.uShallow.value=oceanUniforms.uShallow.value.clone();
  prevOcean.uniforms.uLight.value=1.0;

  // The angled shoreline was a compromise to get dry land into a narrow frame, and it read
  // as a spit cutting across the view rather than as a beach. It runs square now — sand in
  // the foreground, water behind it, horizon above — which is what standing on a beach
  // actually looks like. The room for a palm comes from making the beach DEEP instead:
  // the waterline is a long way back, so there is sand either side of the object to plant
  // something on and still have it land inside the frame.
  //
  // The beach has a profile rather than being a flat sheet at the water's own level. That
  // sheet was the bleed-through: where it met the sea they fought for the same depth and
  // tore into each other, which is the patch of water that kept appearing out on the dry
  // sand. It runs from under the sea at the back up to dry sand at the front, the sea
  // carries over the submerged part, and the shoreline is simply where they cross.
  const _ss=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const sandH=wz=>9.0*_ss(-180,10,wz)-4.6;      // under water past about -84, dry in front

  // The sea is built row by row rather than as a PlaneGeometry, because a uniform grid
  // cannot do both jobs at once. The swell is carried in the vertex shader and its shortest
  // component has a wavelength of about two and a half units, so it needs sub-unit rows to
  // survive — the game's own ocean runs three quarters of a unit per segment. The preview
  // had one sheet at SIX units a segment, eight times coarser, which tessellated every wave
  // flat: that is why it read as a slab of blue that moved slightly rather than as water.
  // But the water also has to run two thousand units out to the horizon, and at three
  // quarters of a unit that is a million vertices.
  // So the rows are spaced geometrically: 0.85 apart at the shore, growing three quarters of
  // a per cent each row until they are seventeen apart at the far edge. Four hundred rows
  // cover the whole distance with the density where the waves are actually legible, and the
  // count comes out about the same as the game's own ocean.
  const SEA_W=250, SEA_NX=280, SEA_NZ=400;

  for(let j=0;j<SEA_NZ;j++)for(let i=0;i<SEA_NX;i++){

  sea.rotation.x=-Math.PI/2; sea.position.set(0,0,40); sea.frustumCulled=false; g.add(sea);

  const SW=760, SD=460, SC=0, SNU=380, SNV=330;
  const sg=new THREE.PlaneGeometry(SW,SD,SNU,SNV);
  const sp=sg.attributes.position, scol=[];
  const C1=new THREE.Color(0xf0c880), C2=new THREE.Color(0xc9ac74), C3=new THREE.Color(0xffe4b0);
  const _c=new THREE.Color(), _WET=new THREE.Color(0x5f5237);
  const _SHALLOW=oceanUniforms.uShallow.value.clone().lerp(new THREE.Color(0x0d3f66),0.45);
  // Height as a plain function of position, so the surface can be sampled either side of a
  // point to get its slope. That is what the shading below needs, and it is the only reason
  // the dunes read at all: white sand lit from a hemisphere has almost no shading of its
  // own, so relief on it is invisible however much of it there is.
  const hAt=(x,wz)=>{

    // a dune. It used to be flat for twenty-six units — and since the near field IS about
    // thirty units deep, that flattened everything you could actually see.
    const flat=_ss(4,13,Math.hypot(x,wz));
    // Three scales, because one is not a landscape. The long swell shapes the beach, the
    // dunes are what you read the surface by at this distance, the ripples catch the light.
    // The long one alone has a wavelength of ninety units — nothing visible in a thirty-unit

    const dune  =(_fbm(x*0.058+11,wz*0.049+7)-0.5)*3.4;
    // Stretched along the shore rather than round. The camera is low, so the beach is seen
    // at a grazing angle and anything square-ish flattens into nothing — but ripples running
    // ACROSS the view present their profile over and over, which is exactly why wind and
    // tide ripples on a real beach are the thing you see from a deck chair.

    // hard at first and then all the way, so what shows through a trough is shallows.

    const dhx=(hAt(x+EPS,wz)-hAt(x-EPS,wz))/(2*EPS);

    // at the top of the tone curve, where ACES compresses everything together — the dunes

    // renders in the middle of the curve is what gives this room to show.
    _c.offsetHSL(0,0,sh*0.32+gr);

  sg.setAttribute('color',new THREE.Float32BufferAttribute(scol,3));
  sg.computeVertexNormals();
  const sand=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({
    vertexColors:true,color:SAND_LIT,roughness:0.99,metalness:0.0}));

    new THREE.MeshBasicMaterial({color:0x5c5138,transparent:true,opacity:0.34,depthWrite:false}));
  beachShadow.rotation.x=-Math.PI/2; g.add(beachShadow);

  for(const [px0,pz0,ry,sc,sd] of [[5.4,-50,0.6,0.92,1],[8.2,-66,-1.9,1.05,5],[-5.6,-56,2.2,0.82,9]]){

// A portrait was capturing whatever pose the rig happened to be left in, and the rig is
// always mid-ride: hunched forward over the nose, feet crossed along the board, head
// craned down the line. That is why every character in the shop looked like it was
// falling over. Stand him up straight for the photo, then put the pose back exactly.
function portraitPose(){
  const js=[pelvis,spine,chestJ,neck,headJ,tailJ,
    legFrontJ.hip,legFrontJ.knee,legFrontJ.ankle,
    legBackJ.hip,legBackJ.knee,legBackJ.ankle,
    armFrontJ.sh,armFrontJ.el,armBackJ.sh,armBackJ.el];
  const keep=js.map(j=>[j,j.position.clone(),j.rotation.clone()]);
  const ears=charEars.map(e=>[e,e.rotation.x]);
  for(const j of js)j.rotation.set(0,0,0);
  pelvis.position.set(0,pelvisHeight(),0.02);
  // the hip sockets sit where the feet go on the board — one ahead of the other. For a
  // portrait they want to be side by side, scaled by whatever the build pulled them in by
  const k=legFrontJ.hip.userData.socket[0]?legFrontJ.hip.position.x/legFrontJ.hip.userData.socket[0]:1;
  legFrontJ.hip.position.set(-0.165*k,0.02,0);
  legBackJ.hip.position.set( 0.165*k,0.02,0);
  const hipKeep=[hipMass.position.clone(),hipMass.rotation.clone(),hipMass.scale.clone()];
  layHips();
  // stood at ease: a touch of knee, feet flat, arms hanging just clear of the belly
  for(const g of [legFrontJ,legBackJ]){
    g.hip.rotation.x=-0.05; g.knee.rotation.x=0.13; g.ankle.rotation.x=-0.08;
  }
  armFrontJ.sh.rotation.set(0.10,0,-0.36); armFrontJ.el.rotation.x=0.26;
  armBackJ.sh.rotation.set(0.10,0, 0.36);  armBackJ.el.rotation.x=0.26;
  for(const e of charEars)e.rotation.x=e.userData.baseX;
  updateLimbs();                       // measures legDrop for the pose just set...
  pelvis.position.y=pelvisHeight();    // ...which is what the hips should sit at
  updateLimbs();

    for(const [j,p,r] of keep){ j.position.copy(p); j.rotation.copy(r); }
    for(const [e,x] of ears)e.rotation.x=x;
    hipMass.position.copy(hipKeep[0]); hipMass.rotation.copy(hipKeep[1]); hipMass.scale.copy(hipKeep[2]);

let shopFillId=0, shopMenuWasUp=false;
function fillThumbs(jobs){
  const mine=++shopFillId;
  const step=()=>{
    if(mine!==shopFillId)return;                 // a redraw superseded this pass
    const t0=performance.now();
    while(jobs.length&&performance.now()-t0<9){
      const [im,make]=jobs.shift();
      const src=make(); if(src)im.src=src;
    }
    if(jobs.length)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawShop(){
  shopList.innerHTML='';
  for(const t of document.querySelectorAll('#shopTabs .tab'))
    t.classList.toggle('on',t.dataset.tab===shopTab);
  const jobs=[];
  if(shopTab==='riders'){
    for(const c of charOrder()){
      const card=shopCard(c,!!ownedChars[c.id],rider===c.id,
        ()=>{ if(coins<c.price)return; coins-=c.price; ownedChars[c.id]=1; noteBuy('rider',c.id,c.price);
          equipChar(c.id); saveGame(); showCoins(); drawShop(); },
        ()=>{ equipChar(c.id); saveGame(); drawShop(); },
        prevCache['c:'+c.id],false,'char');
      if(!prevCache['c:'+c.id])jobs.push([card.querySelector('.thumb'),()=>charPreview(c.id)]);
      shopList.appendChild(card);
    }
  } else {
    for(const b of RACK_ORDER){
      const card=shopCard(b,!!owned[b.id],equipped===b.id,
        ()=>{ if(coins<b.price)return; coins-=b.price; owned[b.id]=1; noteBuy('board',b.id,b.price);
          equipBoard(b.id); saveGame(); showCoins(); drawShop(); },
        ()=>{ equipBoard(b.id); saveGame(); drawShop(); },
        prevCache['b:'+b.id], true, 'board');
      if(!prevCache['b:'+b.id])jobs.push([card.querySelector('.thumb'),()=>boardPreview(b.id)]);
      shopList.appendChild(card);
    }
  }
  if(jobs.length)fillThumbs(jobs);
  showCoins();
}

// The listener sits on the menu, not on the version itself: #ver keeps pointer-events
// none so that during a run a tap at the bottom of the screen is still a tap on the
// water and still jumps. While the menu is up, the tap lands on the menu and this
// checks whether it fell on the version.
overlay.addEventListener('pointerdown',e=>{
  const r=verEl.getBoundingClientRect(), pad=14;
  if(e.clientX<r.left-pad||e.clientX>r.right+pad||e.clientY<r.top-pad||e.clientY>r.bottom+pad){
    tapN=0; verEl.style.opacity=''; return;
  }
  const now=performance.now();
  tapN = now-tapT<1500 ? tapN+1 : 1;                   // the taps have to be a run, not a habit
  tapT=now;
  // no label, but the last two taps light it up, so you know it is counting
  verEl.style.opacity = tapN>=3 ? '0.95' : '';
  if(tapN>=5){ tapN=0; verEl.style.opacity=''; openStats(true); }
});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  `<div class="bar"><i style="width:${Math.round(Math.max(0,Math.min(1,frac))*100)}%"></i></div></div>`;
function hhmm(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60);
  return h?h+'h '+m+'m':(m?m+'m '+Math.floor(sec%60)+'s':Math.floor(sec)+'s');
}

  return ks.map(k=>meter((names&&names[k])||k, o[k]+'  ·  '+Math.round(o[k]/tot*100)+'%', o[k]/o[ks[0]])).join('');
}

const pug=new THREE.Group();
function joint(parent,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g;}
function limb(parent,len,rad,col,ry=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rad*0.85,rad,len,12),mat(col));
  m.position.y=-len/2;parent.add(m);

  cap.position.y=-len;parent.add(cap);

const FUR=0xdCa85f, FUR2=0xdCa85f, CREAM=0xf2dcae, DARK=0x2b1d12;   // warmer, deeper fawn
const furMat=FUR_MAT(FUR), darkMat=PBR({color:DARK,roughness:0.72});
// a penguin's feet are the one part of it that is not black; kept as its own material so
// a foot can be a different colour from the rest of the animal without a second mesh
const footMat=PBR({color:0xf2a01b,roughness:0.45,vivid:1.5});
const handMat=PBR({color:0xf2a01b,roughness:0.45,vivid:1.5});
// A panda's arms and legs are black and its body is white; a corgi wears white socks; a
// raccoon has dark hands. Colour has to be able to stop at a limb, not just at an animal.
const limbMat=PBR({color:0x1b1b20,roughness:0.66,vivid:1.2});

// Short chunky legs mean the hips sit lower, or he floats above his own board.
const PELVIS_Y=0.475;
// how long this character's legs are as a fraction of the pug's. Guessing a fixed pelvis
// drop from it does not work — how much height a shorter leg costs depends on how bent
// the leg is — so the drop is measured from the actual knee and hip angles every frame.
let legS=1, legDrop=0.34;
// How far the ankle hangs below the hip, MEASURED off the posed skeleton rather than
// worked out from the knee angle. The closed form ignored the hip's Y turn, which is
// harmless at the pug's leg length because the error is multiplied by (legS-1) — and
// exactly zero there — but a frog on two-and-three-quarter-length legs multiplied that
// same error by 1.75 and stood with its front foot sunk into the deck.
// Everything below the hip scales with legS, so the drop at normal length is legDrop/legS
// and the pelvis has to rise by the difference.
function pelvisHeight(){ return PELVIS_Y+legDrop*(1-1/legS); }
const pelvis=joint(pug,0,PELVIS_Y,0.02);
// The seat. Party Animals and Gang Beasts bodies are ONE mass all the way down —
// the trunk carries on between the legs and is notched, rather than a belly with two
// pipes hanging under it. This is that carry-on: a rounded block laid along the line
// between the two hip sockets, overlapping the belly above and both haunches below, so
// the silhouette closes up into a single shape with a crotch notch instead of a gap.
const hipMass=new THREE.Mesh(new THREE.SphereGeometry(1,26,20),furMat);
pelvis.add(hipMass);
let hipBuild=[1,1,1];
// The seat has to be laid along whatever line the two hips are actually on. On the board
// that line runs nose-to-tail, because the feet are one in front of the other; stood up
// for a portrait the hips are side by side instead. Laying it once and leaving it is what
// left a sausage hanging off the backside in every portrait — the seat was still bridging
// a stance the legs had moved out of.
function layHips(){
  const hf=legFrontJ.hip.position, hb=legBackJ.hip.position, B=hipBuild;
  const dx=hb.x-hf.x, dz=hb.z-hf.z, span=Math.hypot(dx,dz);
  hipMass.position.set((hf.x+hb.x)*0.5,(hf.y+hb.y)*0.5+0.045,(hf.z+hb.z)*0.5);
  hipMass.rotation.y=Math.atan2(dx,dz);

  // stands proud of the belly as a lump

const spine=joint(pelvis,0,0.16,0);
const chestJ=joint(spine,0,0.30,-0.04);
const neck=joint(chestJ,0,0.30,-0.06);

// The body is rebuilt per character from a width profile rather than being one pug
// scaled three ways. Scaling can only make the same shape bigger or smaller; a profile
// says WHERE the mass sits — a pig is pear-shaped, an otter is a tube, a frog is wide at
// the shoulders and narrow at the hip — and that is what separates one animal from
// another far more than an overall size does.
const bodyGeo=new THREE.SphereGeometry(0.46,32,26);
const bodyBase=bodyGeo.attributes.position.array.slice();
// four widths, from hips to shoulders, smoothly joined
const TORSO_DEF=[1.06,1.03,0.935,0.76];
function shapeTorso(C){
  const W=C.shape||TORSO_DEF, TL=C.tall||1.32, DZ=C.deep||0.86, WX=C.wide||1.14;
  const sm=u=>u*u*(3-2*u);
  const prof=t=>{const g=Math.min(2.999,t*3),i=Math.floor(g),f=sm(g-i);return W[i]*(1-f)+W[i+1]*f;};
  const pos=bodyGeo.attributes.position, a=bodyBase;
  for(let i=0;i<pos.count;i++){
    const x=a[i*3],y=a[i*3+1],z=a[i*3+2];
    const t=Math.max(0,Math.min(1,(y+0.46)/0.92)); // 0 = hips, 1 = shoulders (clamped: pow() of a negative is NaN)
    const w=prof(t);
    pos.setX(i,x*w*WX);
    pos.setZ(i,z*w*DZ);
    pos.setY(i,y*TL+0.258*TL+Math.pow(t,3)*0.06);
  }
  pos.needsUpdate=true;
  bodyGeo.computeVertexNormals();
}

const CHAR_BY_ID={}; for(const c of CHARS)CHAR_BY_ID[c.id]=c;
function buildChar(id){
  const C=CHAR_BY_ID[id]||CHAR_BY_ID.pug;
  clearKit();
  furMat.color.copy(vivid(C.fur,1.5));
  darkMat.color.copy(vivid(C.dark,1.0));
  const noseMat=mat(C.nose,90);
  const inner=PBR({color:C.inner||(C.face==='snout'?0xd4708a:0xe79aa6),roughness:0.6});
  // proportions: how thick the limbs are and how full the body is
  // Proportions. The rig is the same skeleton for everyone — these only change how
  // thick a limb is, how big a foot is and how long an arm is, which is most of what
  // separates one animal's silhouette from another's.
  const L=C.limb||1, A=C.arm||L, B=C.build||[1,1,1], K=C.socket||1;
  const base=m=>m.userData.baseScale||(m.userData.baseScale=m.scale.clone());
  // Leg LENGTH, separately from leg thickness. A corgi is the same dog on a third less
  // leg; without this the only lever is thickness, and every animal ends up standing on
  // the same stilts. Everything below the hip slides up, and the pelvis comes down with
  // it by the same amount so the feet stay on the deck instead of hovering over it.
  legS=C.limbLen||1;
  for(const o of legStretch)o.position.y=o.userData.baseY*legS;
  const lm=C.limbCol?limbMat:furMat;
  if(C.limbCol)limbMat.color.copy(vivid(C.limbCol,1.2));
  for(const m of limbTubes)m.material=lm;
  // how thick the swept limb is, and optionally what shape it is along its length: a
  // sloth's arms are thin and even, a rex's legs are heavy at the thigh
  legThick=L; armThick=A;
  legProf=C.legProf||LEG_PROFILE; armProf=C.armProf||ARM_PROFILE;
  legBlend=C.legBlend||0.16; armBlend=C.armBlend||0.16;
  // a penguin's arm is a paddle: same bones, pressed flat and spread wide
  const FL=C.flipper?1.55:1, FT=C.flipper?0.42:1;
  armFlat=C.flipper?[0.44,1.50]:[1,1];
  const F=C.foot||1, H=C.hand||A;
  // a webbed or splayed foot is a different SHAPE, not just a bigger one
  const FS=C.footShape||[1,1,1];
  for(const m of footMesh){const q=base(m);m.scale.set(q.x*L*F*FS[0],q.y*L*F*FS[1],q.z*L*F*FS[2]);
    m.material=C.footCol?footMat:lm;}
  if(C.footCol)footMat.color.copy(vivid(C.footCol,1.5));
  if(C.handCol)handMat.color.copy(vivid(C.handCol,1.5));
  const HS=C.handShape||[1,1,1];
  for(const m of handMesh){const q=base(m);m.scale.set(q.x*H*FL*HS[0],q.y*H*HS[1],q.z*H*FT*HS[2]);
    m.material=C.handCol?handMat:lm;}
  // the whole arm can be shortened — a rex's are a fraction of the length, and unlike a
  // leg an arm is not standing on anything, so scaling it whole is safe
  const AL=C.armLen||1;
  for(const j of armRoot)j.scale.setScalar(AL);
  // Shoulders follow the body's width automatically — a narrow animal with the pug's
  // shoulder sockets has its arms hanging in the air beside it. Hips do not: they are
  // placed so the feet land on the deck, and moving them slides him off his own board.
  const KA=C.socket||B[0];
  for(const j of limbJoints){
    const q=j.userData.socket, k=armRoot.indexOf(j)>=0?KA:K;
    j.position.set(q[0]*k,q[1],q[2]*k);
  }
  hipBuild=B;
  layHips();
  shapeTorso(C);
  if(typeof updateLimbs==='function')updateLimbs();
  // some animals have a neck and some do not; a cat is mostly neck and a pug has none
  neck.position.y=0.30*(C.neckLen||1);
  torso.scale.set(B[0],B[1],B[2]);
  collar.scale.set(1.15*B[0],1.0*B[1],1.1*B[2]);
  head.scale.set(C.headS?C.headS[0]:1, C.headS?C.headS[1]:1, C.headS?C.headS[2]:1);
  furMat.roughness=C.gloss!==undefined?C.gloss:0.62;
  furMat.metalness=C.metal||0.0;
  kitEyes(C,inner);

  // ---- an insect's body ----
  // Everything overlaps its neighbour on purpose. Built as separate lumps sitting near
  // each other they read as parts floating in formation, which is exactly what the
  // first version looked like; a waist that physically bridges the two and a neck that
  // fills under the head are what make it one animal.
  if(C.segs){
    const shell=PBR({color:C.fur,roughness:C.gloss!==undefined?C.gloss:0.26,
                     metalness:C.metal||0.14,vivid:1.5});
    const band=PBR({color:C.dark,roughness:0.34,metalness:0.1,vivid:1.25});
    const GR=0.345, GZ=0.40, GL=0.50;            // gaster radius, centre, half length
    // the gaster: a big glossy teardrop, front end pushed well inside the thorax
    const gas=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(GR,26,20),shell));
    gas.position.set(0,0.11,GZ);gas.scale.set(0.98,0.98,GL/GR);
    // the segment ridges that make it read as an abdomen and not an egg
    for(let i=0;i<3;i++){
      const dz=(i-0.55)*0.135;
      const rr=GR*0.985*Math.sqrt(Math.max(0.12,1-(dz/GL)*(dz/GL)));
      const b=kit(spine,new THREE.Mesh(new THREE.TorusGeometry(rr,0.016,8,28),band));
      b.position.set(0,0.11,GZ+dz);
    }
    // petiole: a real tapered bridge from the back of the thorax into the gaster
    const pet=kit(spine,new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.085,0.30,16),shell));
    pet.position.set(0,0.17,0.15);pet.rotation.x=Math.PI/2;
    // the thorax, sitting over the shared body so the shoulders have something to be on
    const th=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(0.205,20,16),shell));
    th.position.set(0,0.37,-0.02);th.scale.set(1.0,0.98,1.14);
    // and the neck, filling the space under the head
    const nk=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(0.165,18,14),shell));
    nk.position.set(0,0.60,-0.03);nk.scale.set(1,0.95,1);
  }
  // ---- antennae ----
  if(C.feelers){
    const shell=PBR({color:C.feelerCol||C.dark,roughness:0.3,metalness:0.12,vivid:1.45});
    for(const sx of [-1,1]){
      const base=new THREE.Group();
      base.position.set(sx*0.13,0.30,-0.22);
      // a positive turn about Z tips the local up-axis toward -X, so this sign is what
      // sent each antenna across to the other side of the head and crossed them
      base.rotation.set(-0.55,0,-sx*0.50);
      headJ.add(base); kitParts.push(base);
      const a1=kit(base,new THREE.Mesh(new THREE.CylinderGeometry(0.019,0.026,0.30,8),shell));
      a1.position.y=0.15;
      const elb=new THREE.Group(); elb.position.y=0.30; elb.rotation.x=0.95; base.add(elb); kitParts.push(elb);
      const a2=kit(elb,new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.019,0.26,8),shell));
      a2.position.y=0.13;
      const tip=kit(elb,new THREE.Mesh(new THREE.SphereGeometry(0.028,10,8),shell));
      tip.position.y=0.27;
      charEars.push(base);
      base.userData.baseX=base.rotation.x; base.userData.side=sx;
    }
  }
  // ---- chest bib: the pale front a penguin or an otter wears ----
  if(C.bib){
    const bm=PBR({color:C.bib,roughness:0.62,vivid:1.2});
    // an otter wears a pale throat, a penguin wears a whole shirt front — same patch,
    // scaled, or every animal with one ends up looking like a bear with a belly
    const bs=C.bibS===undefined?1:C.bibS;
    const b=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(0.30,22,18),bm));
    b.position.set(0,0.30+(1-bs)*0.22,-0.16);b.scale.set(0.98*bs,1.55*bs,0.98);
    const t=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.30,20,16),bm));
    t.position.set(0,-0.15,-0.16);t.scale.set(0.80*bs,0.58*bs,0.94);   // carries up under the chin
  }

  // ---- quills ----
  // Laid over the upper half of the body in rings, each one pushed out along the surface
  // normal so they fan the way a porcupine's do instead of all pointing the same way.
  if(C.quills){
    const qm=PBR({color:C.quillCol||0x2b2419,roughness:0.42,vivid:1.1});
    const tm=PBR({color:C.quillTip||0xf2e6c8,roughness:0.5,vivid:1.2});
    // Put them ON the body by using the same numbers the torso is built from, rather
    // than guessing a radius — otherwise they float off a wide animal and sink into a
    // narrow one. Each stands along its own outward normal, raked back.
    const W=C.shape||TORSO_DEF, TL=C.tall||1.32, DZ=C.deep||0.86, WX=C.wide||1.14, B2=C.build||[1,1,1];
    const sm2=u=>u*u*(3-2*u);
    const prof=t2=>{const g2=Math.min(2.999,t2*3),i2=Math.floor(g2),f2=sm2(g2-i2);return W[i2]*(1-f2)+W[i2+1]*f2;};
    const up=new THREE.Vector3(0,1,0), dir=new THREE.Vector3();
    for(let ring=0;ring<6;ring++){
      const t2=0.20+ring*0.135;
      const y0=t2*0.92-0.46, r0=Math.sqrt(Math.max(0.02,0.46*0.46-y0*y0)), w=prof(t2);
      const y=y0*TL+0.258*TL;
      const n=7+ring*2;
      for(let i=0;i<n;i++){
        const a3=(i/(n-1)-0.5)*Math.PI*1.45;          // across the back, never the belly
        const x=Math.sin(a3)*r0*w*WX*B2[0], z=Math.cos(a3)*r0*w*DZ*B2[2];
        const L2=0.26+Math.sin(t2*Math.PI)*0.26;
        dir.set(x,0.30,z).normalize();                // out from the spine and raked back
        const q=kit(spine,new THREE.Mesh(new THREE.ConeGeometry(0.030,L2,6),qm));
        q.position.set(x*0.94,y,z*0.94);
        q.quaternion.setFromUnitVectors(up,dir);
        const tip=kit(spine,new THREE.Mesh(new THREE.ConeGeometry(0.021,L2*0.36,6),tm));
        tip.position.set(x*0.94,y,z*0.94).addScaledVector(dir,L2*0.44);
        tip.quaternion.copy(q.quaternion);
      }
    }
  }

  // ---- an angler's lure ----
  // The one thing in the cast that is not just a shape: the bulb on the end of the stalk
  // is dim in the afternoon and burns at dusk, off the same time-of-day figure the sky
  // is lerped from. A deep-sea fish carrying its own light out into the sunset.
  if(C.lure){
    const stalk=PBR({color:C.dark,roughness:0.55,vivid:1.1});
    let par=headJ;
    for(let i=0;i<5;i++){
      const seg=kit(par,new THREE.Mesh(new THREE.CylinderGeometry(0.030-i*0.004,0.038-i*0.004,0.16,8),stalk));
      seg.position.y=0.08;
      const nx=new THREE.Group();
      nx.position.y=0.16;
      nx.rotation.x=i===0?-0.30:-0.34;              // up off the skull, then over the brow
      if(i===0)nx.position.set(0,0.30,-0.06);
      par.add(nx); kitParts.push(nx); par=nx;
    }
    lureMat=new THREE.MeshStandardMaterial({color:0x1d3a30,emissive:new THREE.Color(C.lureCol||0x8ff2d8),
      emissiveIntensity:1.0,roughness:0.30});
    const bulb=kit(par,new THREE.Mesh(new THREE.SphereGeometry(0.085,18,14),lureMat));
    bulb.position.y=0.06;
    lureGlow=kit(par,new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12),
      new THREE.MeshBasicMaterial({color:C.lureCol||0x8ff2d8,transparent:true,opacity:0.18,
        blending:THREE.AdditiveBlending,depthWrite:false})));
    lureGlow.position.y=0.06; lureGlow.renderOrder=2;
  } else { lureMat=null; lureGlow=null; }

  // ---- toes and fingers ----
  // Hung off the foot and hand meshes so they inherit whatever shape those ended up —
  // a long narrow foot gets long narrow toes without a second set of numbers.
  if(C.toes)for(const f of footMesh)for(let i=0;i<C.toes;i++){
    const u=(i-(C.toes-1)/2);
    const t=kit(f,new THREE.Mesh(new THREE.SphereGeometry(0.062,12,10),f.material));
    t.position.set(u*0.105,0.01,-0.125);t.scale.set(0.85,1.0,1.5);
  }
  if(C.fingers)for(const h of handMesh)for(let i=0;i<C.fingers;i++){
    const u=(i-(C.fingers-1)/2);
    const t=kit(h,new THREE.Mesh(new THREE.SphereGeometry(0.052,12,10),h.material));
    t.position.set(u*0.086,0.0,-0.100);t.scale.set(0.80,0.95,1.15);
  }

  // ---- claws ----
  // A sloth's whole silhouette is the hooks on the end of it, and a lizard and a rex have
  // toes. They hang off the hand mesh so they inherit whatever size that character's
  // hands ended up.
  if(C.claws){
    const cm=PBR({color:C.clawCol||0x3b2f24,roughness:0.38,vivid:1.1});
    for(const h of handMesh)for(let i=0;i<C.claws;i++){
      const a2=(i-(C.claws-1)/2)*0.62;
      // a cone points +Y, so a NEGATIVE turn about X swings it down and FORWARD; the
      // positive one had every claw raked backwards out of the back of the hand
      const c=kit(h,new THREE.Mesh(new THREE.ConeGeometry(0.032,0.165,7),cm));
      c.position.set(Math.sin(a2)*0.072,-0.070,-Math.cos(a2)*0.072);
      c.rotation.set(-2.45,0,a2*0.35);
    }
  }

  // ---- muzzle ----
  if(C.face==='pug'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.22,18,14),darkMat));
    m.position.set(0,-0.08,-0.34);m.scale.set(1.1,0.85,0.95);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),noseMat)).position.set(0,-0.05,-0.51);
    const t=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),mat(0xff8fa0)));
    t.position.set(0,-0.17,-0.42);t.scale.set(0.8,1.5,0.6);
  } else if(C.face==='snout'){
    const m=kit(headJ,new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.175,0.20,18),inner));
    m.rotation.x=Math.PI/2;m.position.set(0,-0.06,-0.44);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.032,10,8),mat(0x8f4a5e,60)));
      n.position.set(sx*0.058,-0.05,-0.545);n.scale.set(1,1.3,0.5);
    }
  } else if(C.face==='cat'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.17,16,13),furMat));
    m.position.set(0,-0.10,-0.32);m.scale.set(1.15,0.78,0.92);
    const n=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.052,0.07,4),noseMat));
    n.rotation.x=Math.PI/2;n.position.set(0,-0.04,-0.47);
  } else if(C.face==='bunny'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.16,16,13),furMat));
    m.position.set(0,-0.11,-0.31);m.scale.set(1.2,0.80,0.95);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8),noseMat)).position.set(0,-0.05,-0.45);
    for(const sx of [-1,1]){
      const t=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.045,0.07,0.03),mat(0xfffdf6)));
      t.position.set(sx*0.028,-0.155,-0.42);
    }
  } else if(C.face==='rodent'){
    // a short muzzle with the two front teeth a rodent never stops showing
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.155,16,13),
      C.muzzle?PBR({color:C.muzzle,roughness:0.64,vivid:1.15}):furMat));
    m.position.set(0,-0.10,-0.335);m.scale.set(1.05,0.82,1.15);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.048,12,10),noseMat)).position.set(0,-0.055,-0.475);
    for(const sx of [-1,1]){
      const t=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.046,0.085,0.028),mat(0xfffbe8)));
      t.position.set(sx*0.028,-0.165,-0.425);t.rotation.x=0.10;
    }
  } else if(C.face==='angler'){
    const D=C.headS||[1,1,1];
    // The jaw IS the fish. A wide hinged mouth carried low and forward, a gum line, and
    // needle teeth that cross past each other because they are too long to close over.
    const jaw=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.34,22,16),furMat));
    jaw.position.set(0,-0.20*D[1],-0.16*D[2]);jaw.scale.set(1.12*D[0],0.56,1.10*D[2]);
    const gum=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.30,20,14),
      PBR({color:0x5d2130,roughness:0.5})));
    gum.position.set(0,-0.11*D[1],-0.22*D[2]);gum.scale.set(1.02*D[0],0.30,0.98*D[2]);
    const tooth=mat(0xf4efe0,60);
    for(let i=0;i<9;i++){
      const t2=(i/8-0.5), z=-0.30-Math.cos(t2*2.1)*0.10;
      for(const up of [1,-1]){
        const c2=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.020,0.115+Math.cos(t2*2.4)*0.05,6),tooth));
        c2.position.set(t2*0.46*D[0],(up>0?-0.055:-0.175)*D[1],z*D[2]);
        c2.rotation.x=up>0?Math.PI:0;
        c2.rotation.z=t2*0.5;
      }
    }
  } else if(C.face==='alien'){
    // barely a face at all: no muzzle, no nose, a thin mouth and two pin-prick nostrils
    const D=C.headS||[1,1,1];
    const mo=kit(headJ,new THREE.Mesh(new THREE.TorusGeometry(0.085,0.015,8,20,Math.PI*0.9),
      PBR({color:C.lip||0x2b3a2c,roughness:0.5})));
    mo.position.set(0,-0.215*D[1],-0.320*D[2]);mo.rotation.set(1.62,0,Math.PI);
    mo.scale.set(D[0],1,1);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.020,8,8),mat(0x24331f,50)));
      n.position.set(sx*0.048*D[0],-0.075*D[1],-0.395*D[2]);
    }
  } else if(C.face==='frog'){
    // a wide flat mouth cut right across the head, and a broad soft jaw under it
    const HD=C.headS||[1,1,1];
    const j=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.33,24,18),furMat));
    j.position.set(0,-0.12,-0.13);j.scale.set(1.12*HD[0],0.62*HD[1],1.05*HD[2]);
    const mouth=kit(headJ,new THREE.Mesh(new THREE.TorusGeometry(0.255,0.034,10,28,Math.PI*1.02),
      PBR({color:C.lip||0x8e1c34,roughness:0.42,vivid:1.2})));
    mouth.position.set(0,-0.085,-0.27);mouth.rotation.set(1.62,0,Math.PI);
    mouth.scale.set(HD[0],1,HD[2]);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.028,10,8),mat(0x1d2a1a,60)));
      n.position.set(sx*0.075,0.055,-0.40);
    }
  } else if(C.face==='lizard'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.20,20,16),furMat));
    m.position.set(0,-0.06,-0.42);m.scale.set(0.86,0.72,1.65);
    const jaw=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.26,0.045,0.44),
      PBR({color:0x2c2118,roughness:0.55})));
    jaw.position.set(0,-0.135,-0.46);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.024,10,8),mat(0x1a2418,60)));
      n.position.set(sx*0.05,-0.02,-0.66);
    }
    for(let i=0;i<7;i++){                              // a crest down the skull
      const t=i/6;
      const sp=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.038-0.018*t,0.11-0.04*t,6),
        PBR({color:C.crest||0xf2a71b,roughness:0.5,vivid:1.5})));
      sp.position.set(0,0.34-t*0.10,-0.02-t*0.30);sp.rotation.x=-0.35-t*0.25;
    }
  } else if(C.face==='rex'){
    // a long heavy skull with a jaw that opens, and a row of teeth in it
    const sk=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.24,22,18),furMat));
    sk.position.set(0,0.02,-0.44);sk.scale.set(0.92,0.86,1.75);
    const jaw=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.19,18,14),furMat));
    jaw.position.set(0,-0.16,-0.46);jaw.scale.set(0.86,0.5,1.6);jaw.rotation.x=0.13;
    const gum=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.30,0.05,0.60),
      PBR({color:0x6d2a34,roughness:0.55})));
    gum.position.set(0,-0.085,-0.52);
    for(let i=0;i<7;i++){
      const z=-0.28-i*0.075;
      for(const sx of [-1,1]){
        const up=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.026,0.075,6),mat(0xfdfaf0,70)));
        up.position.set(sx*0.13,-0.115,z);up.rotation.x=Math.PI;
        const lo=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.022,0.062,6),mat(0xfdfaf0,70)));
        lo.position.set(sx*0.12,-0.145,z);
      }
    }
    const brow=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.10,14,12),darkMat));
    brow.position.set(0,0.19,-0.30);brow.scale.set(1.8,0.5,0.9);
  } else if(C.face==='ant'){
    // a cheerful cartoon ant, so a smile rather than mandibles
    const sm=PBR({color:C.dark,roughness:0.4,vivid:1.2});
    const mouth=kit(headJ,new THREE.Mesh(new THREE.TorusGeometry(0.10,0.019,8,20,Math.PI*0.8),sm));
    mouth.position.set(0,-0.06,-0.31);
    mouth.rotation.set(0.16,0,Math.PI+0.43);
  } else if(C.face==='beak'){
    // beakLen/beakR because a penguin's bill is a long spike and a chicken's is a short
    // stubby wedge, and they are the same part
    const bl=C.beakLen||0.32, br=C.beakR||0.10;
    const b=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(br,bl,10),
      PBR({color:C.beak||0xf2a01b,roughness:0.35,vivid:1.6})));
    b.rotation.x=-Math.PI/2;b.position.set(0,-0.04,-0.34-bl*0.5);
    if(C.headPatch!==false){                   // the penguin's black mask, not everyone's
      const c2=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.17,18,14),darkMat));
      c2.position.set(0,0.06,-0.28);c2.scale.set(1.25,1.05,0.55);
    }
  } else {                                   // a proper snout: corgi, panda
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.19,18,14),
      C.muzzle?PBR({color:C.muzzle,roughness:0.64,vivid:1.15}):furMat));
    m.position.set(0,-0.09,-0.36);m.scale.set(1.0,0.82,1.25);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.062,12,10),noseMat)).position.set(0,-0.045,-0.56);
  }

  // ---- comb and wattles ----
  // A row of soft lobes standing along the crown, tallest in the middle, and a pair
  // hanging under the chin. Nothing else in the roster has them, and without them a
  // chicken is just a small round bird.
  if(C.comb){
    const cm=PBR({color:C.comb,roughness:0.50,vivid:1.4});
    for(let i=0;i<5;i++){
      const t2=i/4, rise=Math.sin(t2*Math.PI);
      const p=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.048+rise*0.052,14,12),cm));
      p.position.set(0, 0.355+rise*0.070, -0.30+t2*0.46);
      p.scale.set(0.40,1.30,0.95);
    }
    for(const sx of [-1,1]){                   // wattles, one either side of the chin
      const w=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.062,14,12),cm));
      w.position.set(sx*0.052,-0.215,-0.325);
      w.scale.set(0.52,1.40,0.72);
    }
  }

  // ---- ears ----
  // whatever shape they are, the ears are registered so the rig can still flap them
  const earAt=(sx,mk)=>{
    const e=kit(headJ,mk());
    e.position.x*=sx; e.rotation.z*=sx; e.rotation.y*=sx;
    e.userData.baseX=e.rotation.x; e.userData.side=sx;
    charEars.push(e); return e;
  };
  for(const sx of [-1,1]){
    if(C.ears==='floppy'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),darkMat);
        e.position.set(0.27,0.26,0.03);e.scale.set(1,1.5,0.65);e.rotation.z=-0.35;return e;});
    } else if(C.ears==='pointed'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.115,0.30,4),furMat);
        e.position.set(0.20,0.42,0.02);e.rotation.z=-0.22;return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.062,0.18,4),inner);
        e.position.set(0.20,0.42,-0.035);e.rotation.z=-0.22;return e;});
    } else if(C.ears==='small'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.10,0.18,4),darkMat);
        e.position.set(0.22,0.34,-0.02);e.rotation.set(0.55,0,-0.30);return e;});
    } else if(C.ears==='big'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.145,0.40,5),furMat);
        e.position.set(0.235,0.46,0.0);e.rotation.z=-0.16;return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.082,0.24,5),inner);
        e.position.set(0.235,0.45,-0.045);e.rotation.z=-0.16;return e;});
    } else if(C.ears==='long'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.085,12,14),furMat);
        e.position.set(0.15,0.60,0.0);e.scale.set(0.75,3.5,0.55);e.rotation.z=-0.13;return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,12),inner);
        e.position.set(0.15,0.60,-0.048);e.scale.set(0.75,3.2,0.35);e.rotation.z=-0.13;return e;});
    } else if(C.ears==='disc'){               // monkey: big flat rounds, low and wide
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.155,18,14),furMat);
        e.position.set(0.345,0.075,-0.03);e.scale.set(0.42,1.02,0.96);return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.105,14,12),inner);
        e.position.set(0.385,0.075,-0.03);e.scale.set(0.30,1.0,0.94);return e;});
    } else if(C.ears==='tuft'){               // sloth: a scruff of fur, no real ear
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.10,14,12),furMat);
        e.position.set(0.30,0.20,0.06);e.scale.set(0.75,1.15,0.75);return e;});
    } else if(C.ears==='hole'){                // frogs and lizards: a disc on the skull
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.CircleGeometry(0.075,16),
        PBR({color:C.drum||0x3f6a2a,roughness:0.45}));
        e.position.set(0.30,0.10,-0.05);e.rotation.y=Math.PI/2;return e;});
    } else if(C.ears!=='none'){               // round
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.135,14,12),darkMat);
        e.position.set(0.29,0.33,0.03);e.scale.set(1,1,0.55);return e;});
    }
  }
  if(C.patches)for(const sx of [-1,1]){
    const p=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.135,14,12),darkMat));
    p.position.set(sx*0.175,0.055,-0.315);p.scale.set(1.05,1.25,0.45);p.rotation.z=sx*0.34;
  }
  if(C.whiskers)for(const sx of [-1,1])for(let i=0;i<3;i++){
    const w=kit(headJ,new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.003,0.30,5),mat(0xfdf6e6)));
    w.position.set(sx*0.13,-0.10+i*0.045,-0.42);
    w.rotation.set(0,0,sx*(Math.PI/2-0.20+i*0.16));
  }

  // chain tails hang off a base that can be pitched: a cat carries one up, a rex
  // holds its out behind as a counterweight
  const tailRoot=(tilt)=>{ if(!tilt)return tailJ;
    const g=new THREE.Group(); g.rotation.x=tilt; tailJ.add(g); kitParts.push(g); return g; };
  if(C.tail==='curl'){
    // the spiral's plane was exactly side-on, so from directly behind the whole tail was
    // edge-on and read as a stick hanging off the back. Turned into three-quarters it
    // reads as a curl from every angle.
    const t=kit(tailJ,new THREE.Mesh(new THREE.TorusGeometry(0.105,0.052,12,22,5.4),furMat));
    t.rotation.set(0.30,1.05,0.20);t.position.set(0.03,0.04,-0.02);
    // a root that fills the rump under the curl. It used to hang below and behind the
    // joint, which put a teardrop dangling off the backside rather than a tail root
    const b=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.085,12,10),furMat));
    b.position.set(0,-0.03,-0.05);b.scale.set(1.15,1.0,1.15);
  } else if(C.tail==='long'){
    let par=tailRoot(C.tailTilt!==undefined?C.tailTilt:0.85);
    for(let i=0;i<7;i++){
      const seg=kit(par,new THREE.Mesh(new THREE.CylinderGeometry(0.055-i*0.005,0.062-i*0.005,0.15,10),furMat));
      seg.position.y=0.075; seg.rotation.x=0;
      const nx=new THREE.Group(); nx.position.y=0.15; nx.rotation.x=-0.30+i*0.09; par.add(nx);
      kitParts.push(nx); par=nx;
    }
  } else if(C.tail==='puff'){
    const t=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.125,14,12),furMat));
    t.position.set(0,0.02,0.05);
  } else if(C.tail==='thick'){                // a counterweight: heavy at the root
    let par=tailRoot(C.tailTilt!==undefined?C.tailTilt:1.35);
    for(let i=0;i<8;i++){
      const r0=0.165-i*0.018, r1=0.158-i*0.018;
      const seg=kit(par,new THREE.Mesh(new THREE.CylinderGeometry(Math.max(0.012,r1),Math.max(0.016,r0),0.20,14),furMat));
      seg.position.y=0.10;
      const nx=new THREE.Group(); nx.position.y=0.20; nx.rotation.x=-0.09+i*0.012; par.add(nx);
      kitParts.push(nx); par=nx;
      if(C.spines&&i<6){
        const sp=kit(seg,new THREE.Mesh(new THREE.ConeGeometry(0.035,0.09,6),
          PBR({color:C.crest||0xd8892a,roughness:0.5,vivid:1.4})));
        sp.position.set(0,0.02,-r0-0.02);sp.rotation.x=-Math.PI/2;
      }
    }
  } else if(C.tail==='flat'){                 // an otter's rudder
    const t=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.13,16,12),furMat));
    t.position.set(0,0.16,0.02);t.scale.set(0.9,2.1,0.42);t.rotation.x=-0.55;
  } else if(C.tail==='stub'){
    const t=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.085,14,12),furMat));
    t.position.set(0,0.03,0.03);t.scale.set(1,1.2,0.8);
  } else if(C.tail==='ringed'){
    let par=tailRoot(C.tailTilt!==undefined?C.tailTilt:0.95);
    for(let i=0;i<7;i++){
      const seg=kit(par,new THREE.Mesh(new THREE.CylinderGeometry(0.058-i*0.004,0.066-i*0.004,0.16,12),
        i%2?darkMat:furMat));
      seg.position.y=0.08;
      const nx=new THREE.Group(); nx.position.y=0.16; nx.rotation.x=-0.34+i*0.10; par.add(nx);
