<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pug Surf</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#7ec8f0; font-family:'Trebuchet MS',sans-serif; touch-action:none; }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:calc(6px + env(safe-area-inset-top,0px)) 4px 0; color:#fff; font-weight:bold;
    text-shadow:0 2px 4px rgba(0,40,80,.55); pointer-events:none; }
  #hud .cell { flex:1 1 0; text-align:center; }
  #hud .lab { display:block; font-size:min(2.9vw,11px); letter-spacing:1.4px; opacity:.72; }
  #hud .val { display:block; font-size:min(5.4vw,21px); line-height:1.15; }
  #trickmsg { position:fixed; top:22%; width:100%; text-align:center; color:#ffdf2e; font-weight:bold; font-size:30px; text-shadow:0 3px 6px rgba(0,40,80,.6); pointer-events:none; opacity:0; transition:opacity .2s; }
  .btn {
    position:fixed; user-select:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; letter-spacing:1.2px; color:#fff;
    text-shadow:0 1px 2px rgba(0,20,40,.45);
    background:linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.08));
    border:1.5px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(12px) saturate(150%); backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 8px 22px rgba(0,25,50,.28), inset 0 1px 0 rgba(255,255,255,.65),
               inset 0 -8px 16px rgba(0,40,80,.16);
    transition:transform .09s ease, box-shadow .09s ease, background .12s ease;
  }
  .btn:active { transform:scale(.93);
    box-shadow:0 3px 10px rgba(0,25,50,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  #jumpBtn { right:20px; bottom:30px; width:94px; height:94px; font-size:19px;
    background:linear-gradient(160deg, rgba(255,214,102,.62), rgba(255,140,46,.30));
    border-color:rgba(255,230,170,.8);
    box-shadow:0 10px 26px rgba(120,60,0,.30), inset 0 1px 0 rgba(255,255,255,.75),
               inset 0 -9px 18px rgba(150,70,0,.20); }
  #ropeBtn { right:20px; bottom:142px; width:94px; height:94px; font-size:17px; display:none;
    background:linear-gradient(160deg, rgba(255,140,200,.58), rgba(210,60,140,.30));
    border-color:rgba(255,190,225,.8);
    box-shadow:0 10px 26px rgba(110,10,70,.30), inset 0 1px 0 rgba(255,255,255,.7),
               inset 0 -9px 18px rgba(120,20,80,.20); }
  /* the trick row is given the width left over beside JUMP and its buttons shrink
     to fit it, so the two can never end up on top of each other on a narrow phone */
  #trickBar { position:fixed; bottom:30px; left:14px; right:124px;
    display:flex; gap:2.2vw; justify-content:flex-start; }
  .tbtn {
    width:min(70px, calc((100vw - 152px)/4 - 2.2vw)); aspect-ratio:1/1;
    border-radius:50%; user-select:none; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:min(14px,3.3vw); letter-spacing:.9px; color:#fff;
    text-shadow:0 1px 2px rgba(0,20,40,.45);
    border:1.5px solid rgba(255,255,255,.5);
    -webkit-backdrop-filter:blur(12px) saturate(150%); backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 7px 18px rgba(0,25,50,.26), inset 0 1px 0 rgba(255,255,255,.6),
               inset 0 -7px 14px rgba(0,40,80,.16);
    transition:transform .09s ease, box-shadow .09s ease;
  }
  .tbtn:active { transform:scale(.9);
    box-shadow:0 2px 8px rgba(0,25,50,.28), inset 0 1px 0 rgba(255,255,255,.45); }
  #spinBtn { background:linear-gradient(160deg, rgba(96,178,255,.62), rgba(30,110,220,.28)); }
  #flipBtn { background:linear-gradient(160deg, rgba(255,166,92,.62), rgba(226,104,26,.28)); }
  #grabBtn { background:linear-gradient(160deg, rgba(126,232,150,.62), rgba(28,168,110,.28)); }
  #handBtn { background:linear-gradient(160deg, rgba(196,152,255,.62), rgba(126,66,214,.28)); }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,40,70,.82); color:#fff; text-align:center; padding:20px;
  }
  #overlay h1 { font-size:min(11vw,54px); color:#ffdf2e; text-shadow:3px 3px 0 #b8641c; }
  #overlay p { margin:12px 0; font-size:min(4.4vw,18px); line-height:1.55; max-width:540px; }
  .go { padding:15px 46px; font-size:20px; font-weight:800;
    letter-spacing:.6px; color:#fff; border:none; border-radius:40px; cursor:pointer;
    background:linear-gradient(165deg,#ffa84e,#f2701a);
    box-shadow:0 10px 24px rgba(120,55,0,.38), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .08s ease, box-shadow .08s ease, filter .12s ease; }
  .go:active { transform:translateY(3px) scale(.985);
    box-shadow:0 4px 12px rgba(120,55,0,.4), inset 0 1px 0 rgba(255,255,255,.4); }
  #overlay .go { margin-top:13px; }
  #overlay .hint { opacity:.85; font-size:min(3.8vw,15px); }
  #zap { position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(190,250,255,.95) 0%, rgba(120,220,255,.55) 26%, rgba(60,140,255,.18) 52%, rgba(0,0,0,0) 74%);
    transition:opacity .28s ease-out; }
  #zap.on { opacity:1; transition:opacity .04s linear; }
  #ver { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); z-index:10;
    color:#fff; opacity:.55; font-size:13px; font-weight:bold; letter-spacing:.5px;
    text-shadow:0 1px 3px rgba(0,40,80,.6); pointer-events:none; }
  #overlay .go.alt { margin-top:9px; padding:12px 30px; font-size:16px;
    background:linear-gradient(165deg,#3fc0e6,#1585ad);
    box-shadow:0 9px 22px rgba(0,70,100,.34), inset 0 1px 0 rgba(255,255,255,.45); }
  #shop { position:fixed; inset:0; z-index:12; background:rgba(6,26,46,.94); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:16px; }
  #shop .shopwrap { width:min(620px,100%); max-height:100%; display:flex; flex-direction:column; }
  #shop .go { align-self:center; margin-top:12px; padding:13px 44px; font-size:18px;
    background:linear-gradient(165deg,#5b7186,#33455a); }
  #overlay #reviveBtn { background:linear-gradient(165deg,#2fd3c2,#0f9e90);
    box-shadow:0 10px 24px rgba(0,90,80,.36), inset 0 1px 0 rgba(255,255,255,.5); margin-bottom:2px; }
  #clip { position:fixed; inset:0; z-index:14; background:rgba(4,18,34,.96); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:18px; }
  #clip .clipbox { width:min(520px,100%); text-align:center; }
  #clip .clipart { position:relative; height:min(46vh,260px); border-radius:16px; overflow:hidden;
    background:linear-gradient(#3a2a6b 0%, #b4496a 42%, #ff8a3c 62%, #1d7fc4 62%, #0d4f8c 100%); }
  #clip .sun { position:absolute; left:50%; top:44%; width:74px; height:74px; margin:-37px 0 0 -37px;
    border-radius:50%; background:#ffe9b0; box-shadow:0 0 60px 24px rgba(255,190,110,.55); }
  #clip .sea { position:absolute; left:0; right:0; bottom:0; height:38%;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.12) 0 2px, rgba(255,255,255,0) 2px 12px); }
  #clip .sweep { position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 62%);
    transform:translateX(-100%); animation:clipsweep 2.1s linear infinite; }
  @keyframes clipsweep { to { transform:translateX(100%); } }
  #clip .clipmsg { margin-top:16px; font-size:min(5vw,20px); font-weight:bold; }
  #shop h2 { font-size:min(6.5vw,26px); color:#ffdf2e; text-shadow:2px 2px 0 #b8641c; margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #shop h2 span { color:#ffe9a8; font-size:min(4.6vw,19px); text-shadow:none; }
  #shopList { overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #shopTabs { display:flex; gap:8px; margin-bottom:11px; }
  #shopTabs .tab { flex:1 1 0; padding:10px 0; font-size:15px; font-weight:800; letter-spacing:.6px;
    color:#cfe2f0; background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.14);
    border-radius:13px; cursor:pointer; transition:background .12s, color .12s, border-color .12s; }
  #shopTabs .tab.on { color:#08222f; border-color:#7fe6dc;
    background:linear-gradient(165deg,#8ff0e4,#3fc7b8); }
  .card .thumb { width:96px; height:72px; flex:none; border-radius:10px;
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.16), rgba(255,255,255,.03));
    object-fit:contain; }
  .card { display:flex; align-items:center; gap:11px; text-align:left; padding:10px 12px; margin-bottom:9px;
    background:rgba(255,255,255,.09); border:2px solid rgba(255,255,255,.16); border-radius:14px; }
  .card.on { border-color:#ffdf2e; background:rgba(255,223,46,.14); }
  .card .nm { font-weight:bold; font-size:17px; }
  .card .bl { font-size:13px; opacity:.82; line-height:1.4; margin-top:2px; }
  .card .act { margin-left:auto; flex:none; }
  .card button { padding:10px 16px; font-size:14px; font-weight:800; color:#fff;
    background:linear-gradient(165deg,#ffa84e,#f2701a); border:none; border-radius:22px;
    box-shadow:0 6px 16px rgba(120,55,0,.34), inset 0 1px 0 rgba(255,255,255,.45); cursor:pointer;
    transition:transform .08s ease; }
  .card button:active { transform:translateY(2px) scale(.98); }
  .card button:disabled { background:linear-gradient(165deg,#63798d,#44586a);
    box-shadow:none; cursor:default; opacity:.7; transform:none; }
  .card .tag { font-size:13px; font-weight:bold; color:#ffdf2e; }
  .hidden { display:none !important; }
  #fatal { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#0a2846; color:#fff; text-align:center; padding:24px; font-size:18px; line-height:1.6; z-index:20; }
</style>

<body>
<div id="hud">
  <div class="cell"><span class="lab">SCORE</span><span class="val" id="hScore">0</span></div>
  <div class="cell"><span class="lab">DIST</span><span class="val" id="hDist">0 m</span></div>
  <div class="cell"><span class="lab">MPH</span><span class="val" id="hSpeed">0</span></div>

</div>
<div id="trickmsg"></div>

</div>

  <h1>🏄 Pug Surf</h1>
  <p id="ovText"></p>
  <button class="go" id="reviveBtn" style="display:none">Watch a clip · get back up</button>
  <button class="go" id="startBtn">Surf</button>
  <button class="go alt" id="shopBtn">Beach shop · <span id="ovCoins">0</span> puka</button>

</div>

<script>
// if the local copy is missing (e.g. the file was opened on its own), fall back to a CDN
if(typeof THREE==='undefined'){
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
}
</script>
<script>
if(typeof THREE==='undefined'){
  document.getElementById('fatal').style.display='flex';
  document.getElementById('overlay').style.display='none';
}
</script>
<script>
if(typeof THREE!=='undefined')(() => {
const hud=document.getElementById('hud'), trickmsg=document.getElementById('trickmsg');
const hScore=document.getElementById('hScore'), hDist=document.getElementById('hDist');
const hSpeed=document.getElementById('hSpeed'), hBest=document.getElementById('hBest');
const jumpBtn=document.getElementById('jumpBtn'), ropeBtn=document.getElementById('ropeBtn');
const trickBar=document.getElementById('trickBar');
const spinBtn=document.getElementById('spinBtn'), flipBtn=document.getElementById('flipBtn'), grabBtn=document.getElementById('grabBtn');
const handBtn=document.getElementById('handBtn');
const overlay=document.getElementById('overlay'), startBtn=document.getElementById('startBtn');
const hCoins=document.getElementById('hCoins'), ovCoins=document.getElementById('ovCoins');
const shop=document.getElementById('shop'), shopBtn=document.getElementById('shopBtn');
const shopList=document.getElementById('shopList'), shopCoins=document.getElementById('shopCoins');

// bump this on every change that ships — it is shown at the bottom of the screen
const VERSION='1.34.0';
document.getElementById('ver').textContent='v'+VERSION;

// ---------- three setup ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd2f5);
const camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
// filmic response instead of raw linear output — highlights roll off like a camera
if(THREE.ACESFilmicToneMapping!==undefined)renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
if(THREE.sRGBEncoding!==undefined)renderer.outputEncoding=THREE.sRGBEncoding;
if(renderer.shadowMap){renderer.shadowMap.enabled=true;
  if(THREE.PCFSoftShadowMap!==undefined)renderer.shadowMap.type=THREE.PCFSoftShadowMap;}
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  if(typeof splatCam!=='undefined'){splatCam.aspect=camera.aspect;splatCam.updateProjectionMatrix();}
  renderer.setSize(innerWidth,innerHeight);
});
const hemi=new THREE.HemisphereLight(0xdfeeff,0x2a7ba8,0.62);scene.add(hemi);
const HEMI_I=0.62;
// bake the sky + ocean colours into an environment map — this is what gives every
// surface real reflections instead of flat shading
function buildEnvironment(){
  if(!THREE.PMREMGenerator)return;
  try{
    const envScene=new THREE.Scene();
    const sky=new THREE.Mesh(new THREE.SphereGeometry(50,24,16),
      new THREE.MeshBasicMaterial({color:0x5fa8cf,side:THREE.BackSide}));
    envScene.add(sky);
    const sea=new THREE.Mesh(new THREE.PlaneGeometry(160,160),
      new THREE.MeshBasicMaterial({color:0x14567f}));
    sea.rotation.x=-Math.PI/2;sea.position.y=-6;envScene.add(sea);
    const sunBall=new THREE.Mesh(new THREE.SphereGeometry(5,16,12),
      new THREE.MeshBasicMaterial({color:0xd8c69a}));
    sunBall.position.set(-22,26,-18);envScene.add(sunBall);
    const pmrem=new THREE.PMREMGenerator(renderer);
    if(pmrem.compileEquirectangularShader)pmrem.compileEquirectangularShader();
    const rt=pmrem.fromScene(envScene,0.04);
    scene.environment=rt.texture;
    pmrem.dispose();
  }catch(e){ /* older builds without PMREM just keep the lights */ }
}
const sunDir=new THREE.Vector3(-0.45,0.75,-0.5).normalize();
const SUN_I=1.75;
const sun=new THREE.DirectionalLight(0xfff2cf,1.75);
sun.position.copy(sunDir.clone().multiplyScalar(60));
sun.castShadow=true;
if(sun.shadow){
  sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;
  const c=sun.shadow.camera;
  if(c){c.left=-22;c.right=22;c.top=22;c.bottom=-22;c.near=1;c.far=140;}
  sun.shadow.bias=-0.0012;sun.shadow.normalBias=0.035;
}
scene.add(sun);
if(sun.target){sun.target.position.set(0,0,0);scene.add(sun.target);}
buildEnvironment();

// ---------- shared wave model ----------
// Real swell: every component propagates at its own speed. In deep water that is
// omega = sqrt(g*k), so short waves travel slower than long ones — dispersion — and
// the interference between them never settles, which is what stops the sea reading
// as one frozen pattern you drive through. Each component also carries an envelope
// travelling at half its phase speed (group velocity), so crests are born at the
// back of a group, peak, and die at the front.
const WAVE_G=9.8, WAVE_TSCALE=1.0;
const WAVES=[
  {dx: 0.00, dz: 1.00, k:0.190, a:1.000, ek:0.38, ep:0.00},
  {dx: 0.60, dz: 0.80, k:0.310, a:0.520, ek:0.42, ep:2.10},
  {dx:-0.74, dz: 0.67, k:0.470, a:0.260, ek:0.50, ep:4.20},
  {dx: 0.40, dz:-0.92, k:0.720, a:0.110, ek:0.58, ep:1.30},
  {dx: 1.00, dz: 0.00, k:1.050, a:0.050, ek:0.66, ep:5.40},
  {dx: 0.86, dz: 0.51, k:1.700, a:0.030, ek:0.72, ep:3.10},   // chop
  {dx:-0.35, dz: 0.94, k:2.600, a:0.016, ek:0.80, ep:0.70},   // finer chop
].map(w=>({...w, w:Math.sqrt(WAVE_G*w.k)*WAVE_TSCALE}));
const ENV_BASE=0.32, ENV_SWING=0.68;      // envelope floor and how far it breathes
// A jet ski's wake is not a separate object floating on the sea — it is the sea. It
// is added straight into the height field as a broad ridge, so the ocean shader
// lights it, foams it and fogs it exactly like every other wave, and the board and
// every floating thing ride over it for free.
const WK_SIGMA=18.0, WK_HALF=64.0;
let wkZ=0, wkA=0, wkX=0;                  // field-space centre, height, lateral centre
function wakeBump(x,z){
  if(wkA<=0.001)return 0;
  const dz=z-wkZ;
  const ez=Math.exp(-(dz*dz)/(2*WK_SIGMA*WK_SIGMA));
  const ax=Math.max(0,Math.min(1,1-Math.abs(x-wkX)/WK_HALF));
  return wkA*ez*ax*ax*(3-2*ax);
}
// A whirlpool is dished into the same field — a smooth bowl the water actually falls
// into, so the shader shades and foams the slope for free and everything afloat rides
// down it rather than hovering over a decal.
const WH_R=13.0;
let whX=0, whZ=0, whA=0;                  // field-space centre and depth
// A real one is a wide dish that turns into a steep throat in the last few metres,
// not an even bowl. The smooth part joins the sea flat at the rim; the spike is what
// makes the hole in the middle.
function whirlProfile(k){ return k*k*(3-2*k)*(1+2.1*Math.pow(k,7)); }
function whirlDip(x,z){
  if(whA<=0.001)return 0;
  const dx=x-whX, dz=z-whZ, d2=dx*dx+dz*dz;
  if(d2>=WH_R*WH_R)return 0;
  return -whA*whirlProfile(1-Math.sqrt(d2)/WH_R);
}
let waveAmp=0.78;                       // current swell height (varies set to set)
// smooth pseudo-random drift so wave size wanders between small and extra-large
function setNoise(t){
  return 0.45*Math.sin(t*0.055)+0.30*Math.sin(t*0.021+2.1)+0.25*Math.sin(t*0.009+4.7);
}
const ZSTRETCH=1.0;                     // natural wave shape again
let WAVE_DRIFT=0.46;                    // how fast the swell rolls past — climbs slightly as you go
function waveComp(W,x,z,t){
  const u=W.dx*x+W.dz*z*ZSTRETCH;
  const env=ENV_BASE+ENV_SWING*Math.sin(u*W.k*W.ek - t*W.w*W.ek*0.5 + W.ep);
  return W.a*env*Math.sin(u*W.k - t*W.w);
}
function waveH(x,z,t){
  let h=0;
  for(const W of WAVES)h+=waveComp(W,x,z,t);
  return h*waveAmp+wakeBump(x,z)+whirlDip(x,z);
}
// the long-period part of the sea only — what a floating object actually rides.
// Short chop is filtered out, so buoys glide over the swell instead of vibrating,
// and because they track the big waves they never get buried by a crest.
function swellH(x,z,t){
  let h=0;
  for(let i=0;i<2;i++)h+=waveComp(WAVES[i],x,z,t);
  return h*waveAmp*1.06+wakeBump(x,z)+whirlDip(x,z);
}
const OCEAN_Z=-90;
let dist=0;

// ---------- GPU ocean ----------
const ZS=1.0;
const glslWaves=WAVES.map(W=>{
  const u=`(${W.dx.toFixed(2)}*p.x+${(W.dz*ZS).toFixed(4)}*p.y)`;
  const ph=`${u}*${W.k.toFixed(3)}-uT*${W.w.toFixed(4)}`;
  const en=`(${ENV_BASE.toFixed(2)}+${ENV_SWING.toFixed(2)}*sin(${u}*${(W.k*W.ek).toFixed(5)}-uT*${(W.w*W.ek*0.5).toFixed(5)}+${W.ep.toFixed(2)}))`;
  // the envelope varies far more slowly than the wave, so the normals treat it as
  // locally constant — visually indistinguishable and much cheaper
  return `e=${en};
h+=${W.a.toFixed(3)}*e*sin(${ph});
dhx+=${W.a.toFixed(3)}*e*${W.k.toFixed(3)}*${W.dx.toFixed(2)}*cos(${ph});
dhz+=${W.a.toFixed(3)}*e*${W.k.toFixed(3)}*${(W.dz*ZS).toFixed(4)}*cos(${ph});`;

// An imported material lands in a scene that is already tone mapped and lit by an
// environment map, which washes a flat colour out — the game's own palette is
// authored saturated to survive it. Give imports the same treatment: the reflection
// strength the rest of the art uses, and the same push away from grey.
function harmonise(m){
  if(!m||!m.isMeshStandardMaterial)return;
  if(m.userData.__tuned)return;
  m.userData.__tuned=1;
  m.envMapIntensity=0.55;                    // what PBR() gives everything else
  const c=m.color;
  if(c&&!m.map){                             // colours only; a texture is left alone
    const avg=(c.r+c.g+c.b)/3, k=0.30;       // already linear, so no colour-space step
    c.r=Math.max(0,Math.min(1,avg+(c.r-avg)*(1+k)));
    c.g=Math.max(0,Math.min(1,avg+(c.g-avg)*(1+k)));
    c.b=Math.max(0,Math.min(1,avg+(c.b-avg)*(1+k)));
  }
}
// True when the file actually shipped a material for this mesh: a texture, a named
// material, or any colour that is not the untouched default white. Those are the
// author's choices and are left exactly as exported — only bare geometry is painted.
function authored(m){
  if(!m)return false;
  if(Array.isArray(m))return m.some(authored);
  if(m.map||m.name)return true;
  const c=m.color;
  return !!c&&(c.r<0.985||c.g<0.985||c.b<0.985);
}
function paintModel(root,table,fallback){
  root.traverse(o=>{
    if(!o.isMesh)return;
    o.castShadow=true;o.receiveShadow=true;
    if(authored(o.material)){
      for(const m of (Array.isArray(o.material)?o.material:[o.material]))harmonise(m);
      return;
    }
    const name=(o.name||'')+' '+((o.parent&&o.parent.name)||'');
    for(const [re,m] of table){ if(re.test(name)){o.material=m;return;} }
    if(fallback)o.material=fallback;
  });
}
// paint it, then size and place it exactly where the built-in shape sat
function skinAndFit(kind,root,target,orient){
  const skin=MODEL_SKINS[kind]||[[],null];
  paintModel(root,skin[0],skin[1]);
  return fitToBox(root,target,orient);
}
function loadModel(file,onReady){
  if(!THREE.GLTFLoader)return;
  new THREE.GLTFLoader().load('models/'+file,
    g=>{ const root=g.scene||g.scenes[0];
         try{ mendMirror(root); onReady(root); }catch(e){ console.warn('model '+file+' failed to fit',e); } },
    undefined,
    ()=>{ /* no such file — keep the built-in shape */ });
}
// measured now, while everything is still at rest and unrotated, because the file
// may not arrive until the rider is already carving
const BOARD_BOX=boxOf(stockBoard);
const BOARD_SLAB=slabY(stockBoard);
loadModel('board.glb',s=>{
  const fitted=skinAndFit('board',s,BOARD_BOX,orientBoard);
  // Match deck to deck rather than box to box. A thin model has nothing like the
  // built-in board's deep fins, so centring the two boxes would perch it on top of
  // the water and leave the rider's feet in the air; lining the decks up puts the
  // hull at the same depth and the feet back on the grip.
  fitted.userData.frame.position.y+=(BOARD_SLAB-slabY(fitted))/fitted.userData.k;
  stockBoard.clear ? stockBoard.clear() : (stockBoard.children.length=0);
  stockBoard.add(fitted);
});

// ---------- the board rack ----------
// Every board bar Astro's own is lofted from a spec rather than modelled: an outline
// curve, a rocker, a rail profile and a paint scheme. Sampling that finely is what
// makes them dense — a little over ten thousand triangles each — and it means a new
// shape is a dozen numbers rather than a new mesh.
const _sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
function buildBoardMesh(S){
  const NU=S.nu||160, NR=S.nr||46, L=S.L, W=S.W, T=S.T;
  // outline: a single-peaked curve whose wide point moves with the two exponents,
  // then blended into whatever width the nose and tail actually finish at
  const a=S.noseA, b=S.tailA, up=a/(a+b);
  const peak=Math.pow(up,a)*Math.pow(1-up,b);
  const beta=u=>Math.pow(Math.max(0,u),a)*Math.pow(Math.max(0,1-u),b)/peak;
  const hw=u=>{
    const kn=1-_sm(0,0.16,u), kt=_sm(0.82,1,u);
    return W*(beta(u)*(1-kn)*(1-kt) + S.noseW*kn + S.tailW*kt);
  };
  // thickness runs to nothing at both tips, so the loft closes on a thin edge the
  // way a real board does, with its fullest point just ahead of centre
  const th=u=>Math.pow(Math.sin(Math.PI*Math.pow(Math.max(0,Math.min(1,u)),S.thSkew||1.0)),S.thPow||0.5);
  const rock=u=>S.rockN*Math.pow(Math.max(0,(S.noseR-u)/S.noseR),2.2)
                +S.rockT*Math.pow(Math.max(0,(u-1+S.tailR)/S.tailR),2.2);
  // a swallow tail is the middle of the tail cut forward, so it is a shift in z
  const notch=(u,v)=>S.swallow?-S.swallow*_sm(0.80,1,u)*(1-Math.pow(Math.abs(v),1.7)):0;

  const pos=[],col=[],idx=[];
  const c=new THREE.Color();
  for(let i=0;i<=NU;i++){
    const u=i/NU, w=hw(u), t=th(u), r=rock(u);
    for(let j=0;j<NR;j++){
      const phi=j/NR*Math.PI*2;
      const v=Math.sin(phi), sAbs=Math.abs(v), top=Math.cos(phi)>=0;
      const prof=Math.pow(Math.max(0,1-sAbs*sAbs), top?(S.deckPow||0.56):(S.hullPow||0.42));
      pos.push(w*v, r+(top?T*t*prof:-T*(S.hullK||0.62)*t*prof), (u-0.5)*L+notch(u,v));
      S.paint(c,u,v,top);
      col.push(c.r,c.g,c.b);
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<NR;j++){
    const j2=(j+1)%NR, A=i*NR+j, B=i*NR+j2, C=(i+1)*NR+j, D=(i+1)*NR+j2;
    idx.push(A,C,B, B,C,D);
  }
  // cap the two tips: the rings there are all but closed, but a fan seals them
  for(const [ring,fwd] of [[0,false],[NU,true]]){
    const base=pos.length/3, u=ring/NU;
    pos.push(0,rock(u),(u-0.5)*L+notch(u,0));
    S.paint(c,u,0,true); col.push(c.r,c.g,c.b);
    for(let j=0;j<NR;j++){
      const j2=(j+1)%NR;
      if(fwd)idx.push(base,ring*NR+j,ring*NR+j2); else idx.push(base,ring*NR+j2,ring*NR+j);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,color:0xffffff,
    roughness:S.rough!==undefined?S.rough:0.27,metalness:0.02});
  // wet-looking but not mirrored: a low sun on a glassier finish blows the deck out
  // to white and the paint scheme stops reading at all
  mat.envMapIntensity=0.40;
  const mesh=new THREE.Mesh(g,mat);

  const grp=new THREE.Group(); grp.add(mesh);
  // grip pad: a thin skin lying on the deck over the back third
  if(S.pad!==false){
    const P0=S.padU0||0.735, P1=S.padU1||0.945, PU=34, PV=18, pp=[], pi=[];
    for(let i=0;i<=PU;i++){
      // a pad covers the back foot, not the back half: narrower than the outline and
      // rounded off at both ends so it reads as a pad rather than a paint job
      const e=Math.sin(Math.PI*Math.min(1,Math.max(0,i/PU)))*0.5+0.5;
      const u=P0+(P1-P0)*i/PU, w=hw(u)*0.56*Math.pow(e,0.35), t=th(u), r=rock(u);
      for(let j=0;j<=PV;j++){
        const v=-1+2*j/PV;
        const prof=Math.pow(Math.max(0,1-v*v*0.64),S.deckPow||0.56);
        pp.push(w*v, r+T*t*prof+0.006, (u-0.5)*L+notch(u,v*0.8));
      }
    }
    for(let i=0;i<PU;i++)for(let j=0;j<PV;j++){
      const A=i*(PV+1)+j, B=A+1, C=A+PV+1, D=C+1;
      pi.push(A,C,B, B,C,D);
    }
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
    pg.setIndex(pi); pg.computeVertexNormals();
    grp.add(new THREE.Mesh(pg,PBR({color:S.padCol||0x22262b,roughness:0.78,metalness:0.0})));
  }
  // fins
  const finMat=PBR({color:S.finCol||0x14181d,roughness:0.14,metalness:0.05,envMapIntensity:1.2});
  for(const f of S.fins){
    const sh=new THREE.Shape();
    const cL=f.c, d=f.d, rk=f.rake===undefined?0.10:f.rake;
    sh.moveTo(-cL*0.5,0);
    sh.bezierCurveTo(-cL*0.30,-d*0.44, -cL*0.02+rk,-d*0.82, cL*0.14+rk,-d);
    sh.bezierCurveTo(cL*0.30+rk*0.5,-d*0.66, cL*0.42,-d*0.30, cL*0.5,0);
    sh.lineTo(-cL*0.5,0);
    const fg=new THREE.ExtrudeGeometry(sh,{depth:f.t||0.030,bevelEnabled:true,
      bevelSize:(f.t||0.030)*0.45,bevelThickness:(f.t||0.030)*0.40,bevelSegments:3,curveSegments:26});
    fg.translate(0,0,-(f.t||0.030)/2);
    const m=new THREE.Mesh(fg,finMat);
    m.rotation.y=Math.PI/2;                      // thickness now runs across the board
    const u=0.5+f.z/L;
    m.position.set(f.x, rock(u)-T*(S.hullK||0.62)*th(u)*0.92, f.z);
    m.rotation.z=f.cant||0;
    grp.add(m);
  }
  grp.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return grp;
}
// paint helpers: everything is authored in sRGB and moved into linear by vivid()
function _mix(c,hex,k){const t=vivid(hex,1.25);c.lerp(t,k);return c;}
function deckScheme(o){
  const sw=o.sw||0.022, ra=o.railAt||0.88;
  return (c,u,v,top)=>{
    const s=Math.abs(v);
    if(top){
      c.copy(vivid(o.deck,o.vivid===undefined?1.35:o.vivid));
      if(o.bands){                                   // resin bands sprayed across the deck
        for(const [at,wid,hex] of o.bands)c.lerp(vivid(hex,1.4),Math.max(0,1-Math.abs(u-at)/wid));
      }
      if(o.stringer&&s<sw)c.copy(vivid(o.stringer,1.3));
      if(o.vstripes)for(const [at,wd,hex] of o.vstripes)
        if(Math.abs(s-at)<wd)_mix(c,hex,1-Math.abs(s-at)/wd);
      if(s>ra)_mix(c,o.rail,_sm(ra,1.0,s));
    } else {
      c.copy(vivid(o.hull,1.2));
      if(o.stringer&&s<sw)c.copy(vivid(o.stringer,1.3));
      if(o.pin&&s>ra-0.08&&s<ra+0.02)_mix(c,o.pin,1-Math.abs(s-(ra-0.03))/0.05);
      if(s>ra+0.02)_mix(c,o.rail,_sm(ra+0.02,1.0,s));
    }
  };
}

// ---------- shop previews ----------
// Each item is photographed once through the renderer that is already running: put it
// alone in a small scene, render into an off-screen target, read the pixels back and
// keep the picture. Cheaper than a second canvas and it lights everything exactly the
// way the game does.
const PREV_W=176, PREV_H=132;
let prevTarget=null, prevScene=null, prevCam=null;
const prevCache={};
function previewSetup(){
  if(prevScene)return;
  prevTarget=new THREE.WebGLRenderTarget(PREV_W*2,PREV_H*2,
    {minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  prevScene=new THREE.Scene();
  prevScene.environment=scene.environment;
  prevScene.add(new THREE.HemisphereLight(0xffffff,0x8fa6bd,1.05));
  const k=new THREE.DirectionalLight(0xfff3e0,1.8); k.position.set(-1.4,2.2,2.6); prevScene.add(k);
  const f=new THREE.DirectionalLight(0xbfd8ff,0.55); f.position.set(2.0,0.7,-1.8); prevScene.add(f);
  prevCam=new THREE.PerspectiveCamera(32,PREV_W/PREV_H,0.05,90);
}
function snapshot(obj,swing,lift,zoom){
  previewSetup();
  const par=obj.parent;
  const keepP=obj.position.clone(), keepR=obj.rotation.clone();
  prevScene.add(obj);
  obj.position.set(0,0,0); obj.rotation.set(0,0,0);
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj);
  const c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
  const R=Math.max(sz.x,sz.y,sz.z)*0.5;
  const d=R/Math.tan(prevCam.fov*Math.PI/360)*(zoom||1.5);
  prevCam.position.set(c.x+d*Math.sin(swing), c.y+d*lift, c.z+d*Math.cos(swing));
  prevCam.lookAt(c);
  const oldT=renderer.getRenderTarget(), oldAC=renderer.autoClear;
  renderer.autoClear=true;
  renderer.setClearColor(0x000000,0);
  renderer.setRenderTarget(prevTarget);
  renderer.clear();
  renderer.render(prevScene,prevCam);
  const W=PREV_W*2,H=PREV_H*2,buf=new Uint8Array(W*H*4);
  renderer.readRenderTargetPixels(prevTarget,0,0,W,H,buf);
  renderer.setRenderTarget(oldT);
  renderer.setClearColor(0x000000,1);
  renderer.autoClear=oldAC;
  prevScene.remove(obj);
  obj.position.copy(keepP); obj.rotation.copy(keepR);
  if(par)par.add(obj);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d'), img=cx.createImageData(W,H);
  for(let y=0;y<H;y++){                       // GL reads bottom-up; a canvas is top-down
    const src=(H-1-y)*W*4;
    img.data.set(buf.subarray(src,src+W*4), y*W*4);
  }
  cx.putImageData(img,0,0);
  return cv.toDataURL('image/png');
}

  const txt=document.createElement('div');

  if(on){ act.innerHTML='<span class="tag">Riding</span>'; }

    else { btn.textContent=item.price+' puka'; btn.disabled=coins<item.price; btn.onclick=buy; }

    for(const c of charOrder()){

        ()=>{ if(coins<c.price)return; coins-=c.price; ownedChars[c.id]=1; equipChar(c.id); saveGame(); showCoins(); drawShop(); },
        ()=>{ equipChar(c.id); saveGame(); drawShop(); },
        charPreview(c.id)));

      boardPreview(b.id)));

}

const trail=[];                       // {x,y,z,w,age}
let trailT=0;
function pushTrail(x,y,z,w){ trail.unshift({x,y,z,w,age:0}); if(trail.length>WAKE_SEGS)trail.pop(); }
function updateWake(dt,eff){
  for(const t of trail){ t.age+=dt; t.z+=eff*dt; }
  while(trail.length&&trail[trail.length-1].age>1.5)trail.pop();
  for(let i=0;i<WAKE_SEGS;i++){
    const t=trail[i];
    const o=i*6, oa=i*2;
    if(!t){ wakeAlpha[oa]=0;wakeAlpha[oa+1]=0; continue; }
    const k=t.age/1.5;
    const halfW=t.w*(0.55+k*2.6);                  // spreads out behind you
    const y=waveH(t.x,dist*WAVE_DRIFT+t.z,waveClock)+0.05;         // rides the swell like everything else
    wakePos[o]  =t.x-halfW; wakePos[o+1]=y; wakePos[o+2]=t.z;
    wakePos[o+3]=t.x+halfW; wakePos[o+4]=y; wakePos[o+5]=t.z;
    const a=Math.max(0,(1-k))*0.55*Math.min(1,i/2);
    wakeAlpha[oa]=a*0.35; wakeAlpha[oa+1]=a*0.35;  // soft edges
    if(i>0){ wakeAlpha[oa]=a*0.45; wakeAlpha[oa+1]=a*0.45; }
  }
  wakeGeo.attributes.position.needsUpdate=true;
  wakeGeo.attributes.aAlpha.needsUpdate=true;
}

const obstacles=[];
// Arm segment. Suckers are pressed into the mesh and painted through a vertex
// colour attribute, so they read as the contrasting discs of the reference while a
// whole arm still costs only one draw call per segment.
const ARM_SKIN=vivid(0x8a5fd0,1.20), ARM_UNDER=vivid(0x6a44a8,1.15);
const _cTmp=new THREE.Color();
function armSegment(rTop,rBot,len,mtl){
  const g=new THREE.CylinderGeometry(rTop,rBot,len,14,8,false);
  const pos=g.attributes.position;
  const cols=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const rad=Math.hypot(x,z);
    // the underside runs a shade darker than the back of the arm, which is all the
    // shaping it needs — banded suckers just read as stripes at this size
    let k=0;
    if(rad>1e-5){
      const th=Math.atan2(z,x);
      k=Math.pow(Math.max(0,Math.cos(th+Math.PI/2)),2)*0.5;
    }
    _cTmp.copy(ARM_SKIN).lerp(ARM_UNDER,k);
    cols[i*3]=_cTmp.r;cols[i*3+1]=_cTmp.g;cols[i*3+2]=_cTmp.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mtl);
  m.position.y=-len/2;
  return m;
}
// A jointed arm. Every arm gets its own splay, coil, length and tip direction, and
// every joint carries its own pair of frequencies, phases and amplitudes — so the
// motion never lines up between arms and never repeats on a tidy loop.
// Each segment is a straight cone, so the chain shows its corners. A ball dropped at
// every joint, exactly the width of the arm there, fills them in and the whole thing
// reads as one smooth tube instead of a string of beads.
function armKnuckle(r,mtl){
  const g=new THREE.SphereGeometry(r,12,8);
  const n=g.attributes.position.count, cols=new Float32Array(n*3);
  for(let i=0;i<n;i++){cols[i*3]=ARM_SKIN.r;cols[i*3+1]=ARM_SKIN.g;cols[i*3+2]=ARM_SKIN.b;}
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  return new THREE.Mesh(g,mtl);
}
function buildArm(armIndex,angle,mtl){
  const root=new THREE.Group();
  root.rotation.y=angle;
  const SEGS=14;                             // more, shorter links: the bends stay gentle
  const R=()=>Math.random();
  const splay=0.86+R()*0.55;                 // how far out this arm throws
  // some arms curl under themselves and some curl away — an octopus does not hold
  // all eight the same way round
  const coil =(R()<0.5?-1:1)*(0.10+R()*0.13);
  const flick=(R()<0.5?-1:1)*(0.9+R()*0.9);  // and the tips hook either way again
  const twist=(R()-0.5)*0.30;                // a sideways lean down the whole arm
  const lenK =0.92+R()*0.34;
  let parent=root;
  for(let j=0;j<SEGS;j++){
    const t=j/(SEGS-1);
    const len=(0.30-0.13*t)*lenK;
    const rTop=0.240-0.205*Math.pow(t,0.85);
    const rBot=0.240-0.205*Math.pow(Math.min(1,(j+1)/(SEGS-1)),0.85);
    const joint=new THREE.Group();
    // first joint throws the arm outward; the rest coil, with the last few
    // curling back on themselves into the hooks the reference has
    const rx = j===0 ? splay : coil*(j>=SEGS-3 ? flick : 1);
    const ry = twist+(R()-0.5)*0.20;
    const rz = (R()-0.5)*0.14;
    joint.rotation.set(rx,ry,rz);
    joint.userData={tj:1,arm:armIndex,seg:j,rx,ry,rz,
      f1:0.34+R()*0.42, f2:0.22+R()*0.30,      // two unrelated rates per joint, unhurried
      p1:R()*Math.PI*2, p2:R()*Math.PI*2,
      a1:0.13+R()*0.16, a2:0.12+R()*0.16,
      k:0.70+0.95*t};                          // the whole arm works, not just the tip
    if(j===0){
      // the shoulder is what makes the arm travel: it swings the whole limb from up
      // by the animal's face right down to hanging under it, and every arm takes its
      // own time over it, so the eight never move together
      // the arc stops short of the mantle: at full stretch the arm is just above
      // horizontal, never folded back over the animal's own head
      joint.userData.sA=0.62+R()*0.22;
      joint.userData.sM=0.86+R()*0.20;
      joint.userData.sF=0.055+R()*0.085;
      joint.userData.sP=R()*Math.PI*2;
    }
    parent.add(joint);
    joint.add(armKnuckle(rTop*0.99,mtl));
    joint.add(armSegment(rTop,Math.max(0.022,rBot),len,mtl));
    const next=new THREE.Group();
    next.position.y=-len;
    joint.add(next);
    parent=next;
  }
  return root;
}

  const skinLt=PBR({color:0xa885e2,roughness:0.58,vivid:1.15});
  const iris  =PBR({color:0xc9a03c,roughness:0.30,metalness:0.10,envMapIntensity:1.1,vivid:1.2});
  const black =PBR({color:0x0d0a12,roughness:0.14,metalness:0.05});

const OBST_TEMPLATES={};
// each obstacle floats at its own waterline so nothing gets buried by a passing swell
const FLOAT_OFF={buoy:0.36,jelly:0.34,log:0.40,bigfin:0.28,ramp:0.02,octopus:0.26};   // ramp sits low: water laps its base
// clear the cached buoyancy state on a fresh clone so a new spawn doesn't inherit it
function makeObstacle(kind,x,z){
  if(!OBST_TEMPLATES[kind])OBST_TEMPLATES[kind]=buildObstacle(kind);
  const t=OBST_TEMPLATES[kind];
  const m=t.clone(true);
  m.userData={...t.userData,used:false,by:undefined,bv:0,rx:undefined,rz:undefined};
  // re-link animated sub-parts (indexes survive cloning; object references do not)
  if(t.userData.washIdx!==undefined)m.userData.wash=m.children[t.userData.washIdx];
  if(t.userData.bellIdx!==undefined)m.userData.bell=m.children[t.userData.bellIdx];
  if(kind==='jelly')m.userData.pulse=Math.random()*7;
  if(kind==='octopus'){
    // each one is a different shot: 20%–90% of its throws are actually aimed at you
    m.userData.acc=0.20+Math.random()*0.70;
    m.userData.throwT=0.9+Math.random()*1.0;
    m.userData.t=Math.random()*6;
    m.userData.seed=Math.random()*Math.PI*2;   // no two octopuses wave in step
    // collect the arm joints of this clone so the wave can be driven down each arm
    const joints=[];
    m.traverse(o=>{if(o.userData&&o.userData.tj)joints.push(o);});
    m.userData.joints=joints;
  }
  if(kind==='bigfin'){
    const d=Math.random()<0.5?1:-1;
    m.rotation.y=d*Math.PI/2;
    // start just off your side of the field and sweep across your line
    m.userData.startX=px-d*(11+Math.random()*5);
    m.userData.targetX=px+d*(0.5+Math.random()*2.5);
    m.userData.crossT=0;
    m.userData.cross=0;
  }
  m.position.set(kind==='bigfin'?m.userData.startX:x,0,z);
  m.traverse&&m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  scene.add(m);obstacles.push(m);
  return m;
}
// Each obstacle can be replaced the same way. The template is built first so the
// model can be measured against it, then it becomes the thing every future spawn is
// cloned from. Its collision size and float height carry over untouched; the
// hand-animated parts (the jelly's bell, the octopus's arms) do not exist in an
// imported mesh, so those clones simply drift.
for(const kind of ['buoy','jelly','log','bigfin','ramp','octopus'])(k=>{
  loadModel(k+'.glb',s3=>{
    if(!OBST_TEMPLATES[k])OBST_TEMPLATES[k]=buildObstacle(k);
    const t=OBST_TEMPLATES[k];
    const fitted=skinAndFit(k,s3,boxOf(t));
    fitted.userData={kind:k,r:t.userData.r,h:t.userData.h,ramp:t.userData.ramp,used:false};
    OBST_TEMPLATES[k]=fitted;
  });
})(kind);

    if(t.target.closest&&(t.target.closest('.btn')||t.target.closest('.tbtn')))continue;

// the sting: three quick strobes, then a slow bleed back to the scene
const zapEl=document.getElementById('zap');
function zapFlash(){
  if(!zapEl)return;
  const beats=[0,90,150,240,300];
  beats.forEach((ms,i)=>setTimeout(()=>{
    if(i===beats.length-1)zapEl.classList.remove('on');
    else zapEl.classList.toggle('on',i%2===0);
  },ms));
}
function msg(t){trickmsg.textContent=t;trickmsg.style.opacity=1;setTimeout(()=>trickmsg.style.opacity=0,900);}

function doJump(){

function startTrick(type){
  if(!running||!trickReady)return;
  if(type==='spin')spinHeld=true;
  else if(type==='flip')flipHeld=true;
  else if(type==='grab'&&!grabOn){
    grabOn=true;grabPts=0;grabSide=vx>=0?1:-1;
  }
}
function releaseTrick(type){
  if(type==='spin')spinHeld=false;
  else if(type==='flip')flipHeld=false;
}
function releaseSpin(){ spinHeld=false; flipHeld=false; }
function startDrag(){
  if(!running||airborne||hanging||dragOn)return;
  dragOn=true;dragPts=0;dragSide=vx>=0?1:-1;
}
function endDrag(){
  if(dragOn){
    const p=Math.round(dragPts);
    if(p>=25){score+=p;boost=Math.min(16,boost+2.5);msg(`HAND DRAG! +${p}`);}
    dragOn=false;dragPts=0;releaseKick=0.30;
  }
}
function endGrab(){
  if(grabOn){
    const p=Math.round(grabPts);
    if(p>=30){score+=p;boost=Math.min(16,boost+3);msg(`${grabSide>0?'INDY':'MELON'} GRAB! +${p}`);}
    grabOn=false;grabPts=0;releaseKick=0.35;
  }
}
// everything you're doing in the air, scored and judged together
function settleTricks(landed,keepPose){
  let pts=0,names=[];
  const spinRevs=spinRot/(Math.PI*2), flipRevs=flipRot/(Math.PI*2);
  if(spinRot>0.4){pts+=Math.floor(spinRevs*4)*90;names.push(Math.round(spinRevs*360)+'° SPIN');}
  if(flipRot>0.4){pts+=Math.floor(flipRevs*4)*110;names.push(Math.round(flipRevs*360)+'° FLIP');}
  if(grabOn&&grabPts>=30){pts+=Math.round(grabPts);names.push(grabSide>0?'INDY':'MELON');}
  if(landed&&pts>0){
    if(names.length>1)pts=Math.round(pts*1.5);          // combo bonus
    score+=pts;
    boost=Math.min(16,boost+5+Math.min(7,pts/110));   // ride out of it with speed
    msg(names.join(' + ')+(names.length>1?' COMBO':'')+`! +${pts}`);
  }
  spinRot=0;flipRot=0;spinHeld=false;flipHeld=false;
  grabOn=false;grabPts=0;
  if(!keepPose)player.rotation.set(0,0,0);
  return pts;
}

}

// how each kind of crash throws him
const WIPE={
  buoy:  {vy: 9.0, vz:-3.5, spin:[ 9, 3, 2], msg:'BUOY!',        kick:1.8},
  jelly: {vy: 6.5, vz:-1.5, spin:[12, 2, 7], msg:'ZAPPED! \u26a1', kick:2.2},
  log:   {vy: 5.0, vz:-2.0, spin:[14, 1, 3], msg:'LOG!',         kick:2.0},
  bigfin:{vy:11.0, vz:-5.0, spin:[ 7, 8, 4], msg:'SHARK!',       kick:2.6},
  octopus:{vy:7.5, vz:-2.5, spin:[10, 5, 6], msg:'TENTACLED!',   kick:2.0},
  pearl: {vy: 3.0, vz:-7.5, spin:[16, 0, 1], msg:'PEARLED!',     kick:1.4},
  land:  {vy: 6.0, vz: 1.5, spin:[ 5, 6, 9], msg:'SKETCHY LANDING!', kick:1.6},
  under: {vy: 4.5, vz: 0.5, spin:[11, 4, 5], msg:'UNDER-ROTATED!',   kick:1.5},
  foam:  {vy: 2.5, vz:-1.0, spin:[ 6, 2, 8], msg:'ATE IT!',      kick:1.2},
};
let wipe=null,overlayUp=false,revivesLeft=1;
function startWipeout(kind){
  if(wipe)return;
  const W=WIPE[kind]||WIPE.foam;
  running=false;                       // controls stop, but the world keeps running
  endMouseDrag();steer=0;weight=0;
  jumpBtn.classList.add('hidden');ropeBtn.style.display='none';trickBar.classList.add('hidden');
  hanging=false;rope.visible=false;
  msg(W.msg);
  shake=W.kick;
  if(kind==='jelly')zapFlash();               // stung: the screen cracks white-blue
  splash(px,py,0,30,kind==='jelly'?0x9fe8ff:undefined);
  // Everything is launched from what he was actually doing. Forward momentum
  // throws him over the obstacle, his lateral drift carries across, any vertical
  // speed he already had is kept, and if he was mid-rotation he keeps turning that
  // way. The table only supplies the character of each crash on top of that.
  const fwd=lastEff*0.11;                       // faster ride, further he is thrown
  const side=Math.random()<0.5?-1:1;            // he goes one way, the board the other
  const rider={
    vy: Math.max(1.6, W.vy*0.55 + Math.max(-6,vy)*0.45),
    vz: W.vz*0.55 - fwd,
    vx: vx*0.80 + side*(2.0+Math.random()*1.8)
  };
  wipe={
    t:0, rx:player.rotation.x, ry:player.rotation.y, rz:player.rotation.z,
    camX:px, camY:camY, camZ:11.0,        // freeze the shot on the crash spot
    atX:px, atY:py,
    vy:rider.vy, vz:rider.vz, vx:rider.vx,
    // a rotation already under way continues; otherwise the impact starts one
    sx:(Math.random()<0.5?-1:1)*W.spin[0]*0.16,
    sy:carrySpin*0.16 + (Math.random()<0.5?-1:1)*W.spin[1]*0.16,
    sz:carryFlip*0.16 + (Math.random()<0.5?-1:1)*W.spin[2]*0.16,
    // the board is kicked out from under him and tumbles off on its own
    bvx:-side*(2.8+Math.random()*2.4)-vx*0.35, bvy:rider.vy*0.55+1.5, bvz:rider.vz*0.45+1.2,
    landed:false,
    bsx:(Math.random()-0.5)*9, bsz:(Math.random()-0.5)*9,
    bx:px, by:py, bz:0, splashed:false
  };
  carrySpin=0;carryFlip=0;
  // Detach both: the board keeps its lean and tumbles off on its own, and the
  // rider is lifted out of it onto the player group, which is what gets thrown.
  // He was a child of the board, so without this he rode it all the way down.
  const keep={x:rig.rotation.x,y:rig.rotation.y,z:rig.rotation.z};
  player.remove(rig); scene.add(rig);
  rig.remove(pug); player.add(pug);
  pug.position.set(0,0.12,0);
  rig.position.set(px,py,0);
  rig.rotation.set(keep.x+player.rotation.x,keep.y+player.rotation.y,keep.z+player.rotation.z);
  spinHeld=false;flipHeld=false;spinRot=0;flipRot=0;grabOn=false;dragOn=false;
}
function updateWipeout(dt){
  const w=wipe; w.t+=dt;
  // pug: thrown, tumbling, then splashdown
  w.vy-=22*dt;
  w.vx*=(1-Math.min(1,dt*1.6));   // air drag, so he doesn't fly off sideways
  px+=w.vx*dt; py+=w.vy*dt;
  player.position.set(px,py,Math.max(-9,Math.min(2,w.vz*w.t*0.70)));
  w.rx+=w.sx*dt*6; w.ry+=w.sy*dt*6; w.rz+=w.sz*dt*6;
  player.rotation.set(w.rx,w.ry,w.rz);
  const sea=waveH(px,dist*WAVE_DRIFT,waveClock)+0.13;
  if(!w.splashed&&py<=sea){
    w.splashed=true;
    splash(px,sea,w.vz*w.t,34);
    pushTrail(px,sea,w.vz*w.t,2.2);
    shake=Math.max(shake,1.6);
    py=sea;
  }
  if(w.splashed){
    // he floats at the surface, not under it — bobbing with the swell
    py+=((sea-0.06)-py)*Math.min(1,dt*5);
    w.vy=0;
    w.rx+=((Math.PI*0.45)-w.rx)*Math.min(1,dt*2.2);   // settles onto his side in the water
    w.rz*=0.90; w.sx*=0.86; w.sy*=0.86; w.sz*=0.86;
    if(Math.random()<dt*6)splash(px+(Math.random()-0.5)*1.2,sea,w.vz*w.t,1);
  }
  // He is a body, not a prop: arms windmill for balance while he is in the air and
  // wash limp once he is in the water, legs kick out from under him.
  {
    const air=w.splashed?0:1;
    const f=w.t*11.0;
    const amp=air?1.0:0.25;
    armFrontJ.sh.rotation.x=0.6+Math.sin(f)*1.5*amp;
    armFrontJ.sh.rotation.z=1.2+Math.cos(f*0.8)*0.7*amp;
    armFrontJ.el.rotation.x=0.5+Math.sin(f*1.3)*0.6*amp;
    armBackJ.sh.rotation.x=0.6+Math.sin(f+2.2)*1.5*amp;
    armBackJ.sh.rotation.z=-1.2+Math.cos(f*0.8+1.1)*0.7*amp;
    armBackJ.el.rotation.x=0.5+Math.sin(f*1.3+1.7)*0.6*amp;
    legFrontJ.hip.rotation.x=-0.5+Math.sin(f*0.7+0.6)*0.9*amp;
    legFrontJ.knee.rotation.x=0.9+Math.sin(f*0.9)*0.5*amp;
    legBackJ.hip.rotation.x=0.5+Math.sin(f*0.7+2.6)*0.9*amp;
    legBackJ.knee.rotation.x=-0.9+Math.sin(f*0.9+1.4)*0.5*amp;
    headJ.rotation.z=Math.sin(f*0.6)*0.4*amp;
  }
  // board: cartwheels away and slaps down
  w.bvy-=20*dt;
  w.bx+=w.bvx*dt; w.by+=w.bvy*dt; w.bz+=w.bvz*dt;
  const bsea=waveH(w.bx,dist*WAVE_DRIFT+w.bz,waveClock)+0.13;
  if(w.by<bsea){
    w.by=bsea; w.bvy*=-0.30; w.bvx*=0.7; w.bvz*=0.7;
    if(Math.abs(w.bvy)>1.2)splash(w.bx,bsea,w.bz,12);
    w.landed=true;
  }
  rig.position.set(w.bx,w.by,w.bz);
  if(w.landed){
    // the board settles flat on the surface and drifts
    rig.rotation.x+=(0-rig.rotation.x)*Math.min(1,dt*3);
    rig.rotation.z+=(0-rig.rotation.z)*Math.min(1,dt*3);
    rig.rotation.y+=w.bsz*dt*0.25;
    w.by=bsea+0.02;
  } else {
    rig.rotation.x+=w.bsx*dt; rig.rotation.z+=w.bsz*dt;
  }
  // camera holds the crash spot — it does not chase him or drift away
  w.camY+=((sea+4.6)-w.camY)*Math.min(1,dt*2.5);
  camera.up.set(0,1,0);
  camera.position.set(w.camX,w.camY,w.camZ);
  // aim gently toward where he ended up, but clamped so the shot never leaves the area
  const tx=Math.max(w.atX-5,Math.min(w.atX+5,px));
  const ty=Math.max(sea+0.4,Math.min(w.atY+3,py+0.3));
  const tz=Math.max(-7,Math.min(1,w.vz*w.t*0.35));
  camera.lookAt(tx,ty,tz);
  if(w.t>2.4)gameOver();
}
function updateWorldDuringWipeout(dt){
  tNow+=dt;
  waveClock += dt*(1.0 + 0.55*Math.sin(tNow*0.045) + 0.28*Math.sin(tNow*0.017+1.3));
  oceanUniforms.uT.value=waveClock;
  oceanUniforms.uAmp.value=waveAmp;
  oceanUniforms.uDist.value=dist*WAVE_DRIFT;
  oceanUniforms.uWakeZ.value=wkZ;oceanUniforms.uWakeA.value=wkA;oceanUniforms.uWakeX.value=wkX;
  oceanUniforms.uWhX.value=whX;oceanUniforms.uWhZ.value=whZ;oceanUniforms.uWhA.value=whA;
  if(shake>0)shake-=dt*8;
  for(let i=splashes.length-1;i>=0;i--){
    const s2=splashes[i],u=s2.userData;
    u.t-=dt;u.vy-=14*dt;
    s2.position.x+=u.vx*dt;s2.position.y+=u.vy*dt;s2.position.z+=u.vz*dt;
    s2.scale.setScalar(Math.max(0.05,u.t*u.s));
    if(u.t<=0){freeDrop(s2);splashes.splice(i,1);}
  }
  for(const o of obstacles){
    const k=o.userData.knock; if(!k)continue;
    k.vy-=18*dt;
    o.position.x+=k.vx*dt; o.position.y+=k.vy*dt; o.position.z+=k.vz*dt;
    o.rotation.x+=k.sx*dt; o.rotation.z+=k.sz*dt;
    const sea=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock)+(FLOAT_OFF[o.userData.kind]||0.3);
    if(o.position.y<sea){o.position.y=sea; k.vy*=-0.30; k.vx*=0.72; k.vz*=0.72; k.sx*=0.6; k.sz*=0.6;}
  }
  updateWake(dt,0);
  updateSplat(dt);          // a splat taken just before the crash still peels off
  updateDayCycle();
}
function gameOver(){
  if(!running&&overlayUp)return;          // updateWipeout keeps calling this each frame
  overlayUp=true;
  running=false;
  splatT=0;splat3D.visible=false;         // never leave the splat stuck over the menu
  const s=score|0;
  if(s>best){best=s;saveBest();}
  const earned=coinsFor(dist,s);
  coins+=earned; saveGame(); showCoins();
  jumpBtn.classList.add('hidden');ropeBtn.style.display='none';trickBar.classList.add('hidden');
  overlay.querySelector('h1').textContent='Wipeout!';

    `Astro went under...<br><br>`+
    `Distance <b>${dist|0} m</b> &nbsp;→&nbsp; <b>${pukaFromDist(dist)}</b> puka<br>`+
    `Score <b>${s}</b> &nbsp;→&nbsp; <b>${pukaFromScore(s)}</b> puka<br>`+
    `<b>${earned}</b> puka this run &nbsp;·&nbsp; purse <b>${coins}</b><br><br>`+
    `Best <b>${best}</b>`;
  shopBtn.classList.remove('hidden');

  reviveBtn.style.display=revivesLeft>0?'':'none';
  overlay.classList.remove('hidden');
}



// ---------- time of day: starts at dawn, sinks toward a permanent golden sunset ----------
// gradient sky dome: blue up top, sunset bands near the horizon. Ocean colors are NOT touched.
const skyUniforms={
  uTop:{value:new THREE.Color(0x3f8fd6)},
  uMid:{value:new THREE.Color(0x8fd2f5)},
  uHorizon:{value:new THREE.Color(0xd8eefb)},
  uGlow:{value:new THREE.Color(0xffffff)},
  uSunX:{value:0.0},
  uGlowAmt:{value:0.0},
};
const skyDome=new THREE.Mesh(
  new THREE.SphereGeometry(320,32,24),
  new THREE.ShaderMaterial({
    uniforms:skyUniforms,side:THREE.BackSide,depthWrite:false,
    vertexShader:`varying vec3 vP; void main(){vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform vec3 uTop,uMid,uHorizon,uGlow; uniform float uSunX,uGlowAmt;
      varying vec3 vP;
      void main(){
        float h=clamp(vP.y,0.0,1.0);
        vec3 c=mix(uHorizon,uMid,smoothstep(0.0,0.30,h));
        c=mix(c,uTop,smoothstep(0.25,0.85,h));
        // warm glow blooming out of the sun's spot on the horizon
        float d=distance(vec2(vP.x,vP.y*1.7),vec2(uSunX,0.10));
        c=mix(c,uGlow,uGlowAmt*smoothstep(0.90,0.03,d));
        // streaky sunset cloud bands low in the sky
        float band=sin(vP.y*46.0)*0.5+0.5;
        float lowband=smoothstep(0.34,0.02,h)*band*uGlowAmt*0.22;
        c=mix(c,uGlow,lowband);
        c=pow(clamp(c,0.0,1.0),vec3(2.2));
        gl_FragColor=vec4(c,1.0);
      }`
  })
);
skyDome.renderOrder=-20;scene.add(skyDome);
const SKY_KEYS=[
  // The four phases in order, and they are different things: dawn is soft and pale
  // with the sun still under the water and no gold in it at all; sunrise is the hot
  // low disc that follows; sunset is deep orange going red; dusk is what is left once

function updateDayCycle(){
  // paced so a normal run actually gets there: warm by a few hundred metres,

  const tod=1-Math.exp(-dist/1250);
  let i=0;while(i<SKY_KEYS.length-2&&tod>SKY_KEYS[i+1].t)i++;
  const A=SKY_KEYS[i],B=SKY_KEYS[i+1];
  const k=Math.max(0,Math.min(1,(tod-A.t)/(B.t-A.t)));
  lerpHex(A.top,B.top,k,skyUniforms.uTop.value);
  lerpHex(A.mid,B.mid,k,skyUniforms.uMid.value);
  lerpHex(A.hz,B.hz,k,skyUniforms.uHorizon.value);
  lerpHex(A.glow,B.glow,k,skyUniforms.uGlow.value);
  const sxn=A.sunX+(B.sunX-A.sunX)*k, sy=A.sunY+(B.sunY-A.sunY)*k;
  skyUniforms.uSunX.value=sxn;
  const gAmt=A.gAmt+(B.gAmt-A.gAmt)*k;
  skyUniforms.uGlowAmt.value=gAmt;
  skyDome.position.set(camera.position.x,0,camera.position.z);
  skyLayer.position.set(camera.position.x,0,camera.position.z);
  // the disc sinks toward the horizon and reddens; the core stays hotter than the
  // glow around it so it still reads as a sun rather than a flat blob
  // zero now means the horizon itself, so it can genuinely rise out of the sea and
  // go back under it — the ocean paints over the disc once it is down
  const sunY=sy*118;
  sunDisc.position.set(sxn*130,sunY,-195);

  // linear space by hand — the sky dome's shader does its own conversion
  _cSun.copy(skyUniforms.uGlow.value).lerp(_cA.setHex(0xffffff),0.42-gAmt*0.34);
  if(_cSun.convertSRGBToLinear)_cSun.convertSRGBToLinear();

  sunDisc.scale.setScalar(1+gAmt*0.35);            // swells a little as it sits low
  for(const sh of [sunGlowInner,sunGlowOuter]){
    sh.position.set(sunDisc.position.x,sunDisc.position.y,sunDisc.position.z-4);
    sh.material.uniforms.uColor.value.copy(skyUniforms.uGlow.value);

  sunGlowOuter.material.uniforms.uOpacity.value=0.16+gAmt*0.42;

  // would repaint the ocean, the animals, the board and the pug.
  // clouds catch the same light as the sky behind them, so they warm into the
  // sunset instead of staying white cut-outs pasted over it
  _cA.setHex(0xffffff).lerp(skyUniforms.uGlow.value,gAmt*0.85);

  // colour anywhere is touched, there is simply less of it at either end of the day.
  // The floor is deliberately high — this is dusk, not night.
  const daylight=0.62+0.38*Math.max(0,Math.min(1,sy*2.6));

  hemi.intensity=HEMI_I*(0.70+0.30*daylight);

  moon.material.opacity=mo*0.75;
  moon.position.set(-sxn*140,120,-205);
}

function cloudTexture(seed){
  const W=384,H=192,c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  let n=seed*9301+49297;
  const R=()=>{n=(n*9301+49297)%233280; return n/233280;};
  // A cumulus is a pile of soft lumps on a flat base, brighter on top. Every lump is
  // kept clear of the canvas edge, so the alpha has faded to nothing by the border
  // and the plane never shows as a rectangle.
  const lumps=9+((R()*6)|0), BASE=132;
  for(let i=0;i<lumps;i++){
    const t=i/(lumps-1);
    const rad=24+R()*20+18*(1-Math.abs(t-0.45)*1.6);
    const cx=76+t*232+(R()-0.5)*26;
    const cy=BASE-rad*0.55-R()*26*(1-Math.abs(t-0.5)*1.4);
    const g=x.createRadialGradient(cx,cy-rad*0.25,rad*0.12,cx,cy,rad);
    const top=Math.round(238+R()*17);
    g.addColorStop(0,'rgba(255,255,255,0.95)');
    g.addColorStop(0.5,`rgba(${top},${top},${top},0.60)`);
    g.addColorStop(1,'rgba(214,220,230,0)');
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,rad,0,Math.PI*2); x.fill();
  }
  // shade the underside so it does not read as a flat smear
  x.globalCompositeOperation='source-atop';
  const sh=x.createLinearGradient(0,BASE-62,0,BASE+4);
  sh.addColorStop(0,'rgba(150,163,185,0)');
  sh.addColorStop(1,'rgba(138,152,177,0.36)');
  x.fillStyle=sh; x.fillRect(0,0,W,H);
  x.globalCompositeOperation='source-over';
  const t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;
  return t;
}

  const dir=Math.random()<0.5?1:-1;
  const ang=dir*(0.60+Math.random()*0.70);      // +-pi/2 would be straight across
  const spd=5+Math.random()*3.5;

  // held off the straight line so they close on a slant rather than head-on
  o.userData.track=Math.random()<0.55;

function updateSeaLife(dt,eff){

  for(let i=seaLife.length-1;i>=0;i--){
    const o=seaLife[i],u=o.userData;
    u.t+=dt;
    if(u.track){
      // steer toward where the rider is, at a limited turn rate
      let d=Math.atan2(px-o.position.x, pz-o.position.z)-u.ang;
      while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
      let a=u.ang+Math.max(-0.55*dt,Math.min(0.55*dt,d));
      const MIN=0.42;                          // never quite straight down the line
      if(Math.abs(a)<MIN)a=(a<0?-1:1)*MIN;
      u.ang=a;
      u.vx=Math.sin(a)*u.spd; u.vzOwn=Math.cos(a)*u.spd;
    }
    o.position.x+=u.vx*dt;
    o.position.z+=eff*dt*0.5 + u.vzOwn*dt;
    const base=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock);
    const ty=base-0.05+Math.sin(u.t*2+u.wob)*0.04;
    if(u.by===undefined)u.by=ty;
    u.by+=(ty-u.by)*Math.min(1,dt*7);        // fins ride the swell smoothly
    o.position.y=u.by;
    o.rotation.set(0,u.ang+Math.sin(u.t*1.1+u.wob)*0.13,0);
    if(Math.random()<dt*7)splash(o.position.x,base+0.05,o.position.z+0.8,1);
    if(Math.abs(o.position.x-px)>30||o.position.z>22){scene.remove(o);seaLife.splice(i,1);}
  }
}

// ---------- whirlpool ----------
// It spins up ahead of you and drags the sea into it. Everything afloat inside its
// reach is carried round and drawn in, turning to face the way it is being taken
// rather than sliding round sideways, and the rider is pulled off his line with it.
// The middle of it ends the run — so a ramp and a jellyfish are dropped on the near
// rim when it forms and held there instead of being swallowed. There is always a
// way out; you have to take it before the pull gets too strong.
function whirlTexture(){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d');
  x.translate(S/2,S/2);
  let n=8123;
  const R=()=>{n=(n*9301+49297)%233280;return n/233280;};
  // Fine drawn-out filaments rather than painted arms. Water going round a hole
  // shows thin streaks of aerated foam stretched along the flow, sparse and faint
  // near the outside and gathering as they are pulled toward the middle.
  for(let arm=0;arm<26;arm++){
    const a0=R()*Math.PI*2, r0=0.10+R()*0.72, len=0.45+R()*0.85;
    const wind=2.6+R()*1.7;
    x.beginPath();
    for(let i=0;i<=64;i++){
      const t=i/64;
      const rr=r0+(0.96-r0)*t*len;
      if(rr>0.99)break;
      const a=a0+wind*(Math.log(Math.max(0.06,rr))-Math.log(Math.max(0.06,r0)));
      const px=Math.cos(a)*rr*S*0.5, py=Math.sin(a)*rr*S*0.5;
      if(i===0)x.moveTo(px,py); else x.lineTo(px,py);
    }
    x.strokeStyle='rgba(238,248,255,'+(0.10+R()*0.22).toFixed(3)+')';
    x.lineWidth=1.1+R()*2.2; x.lineCap='round';
    x.stroke();
  }
  // the collar of broken water right around the throat, where it is actually white
  for(let i=0;i<180;i++){
    const a=R()*Math.PI*2, rr=(0.15+Math.pow(R(),1.7)*0.16)*S*0.5;
    x.beginPath();
    x.arc(Math.cos(a)*rr,Math.sin(a)*rr,0.6+R()*1.9,0,Math.PI*2);
    x.fillStyle='rgba(245,252,255,'+(0.12+R()*0.32).toFixed(3)+')';
    x.fill();
  }
  // fade to nothing well before the rim so the disc has no edge
  x.globalCompositeOperation='destination-in';
  let g=x.createRadialGradient(0,0,0,0,0,S*0.5);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.55,'rgba(0,0,0,0.9)');
  g.addColorStop(0.86,'rgba(0,0,0,0.25)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(-S/2,-S/2,S,S);

  x.globalCompositeOperation='source-over';
  g=x.createRadialGradient(0,0,0,0,0,S*0.155);
  g.addColorStop(0,'rgba(3,14,26,0.94)');g.addColorStop(0.62,'rgba(4,20,36,0.72)');
  g.addColorStop(1,'rgba(6,28,50,0)');
  x.fillStyle=g; x.beginPath(); x.arc(0,0,S*0.155,0,Math.PI*2); x.fill();
  const t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;
  return t;
}
// The foam is laid straight onto the water every frame rather than given a shape of
// its own: each vertex takes the height of the sea beneath it, dip and swell and all,
// so it can never sink under the chop or hover over it. The swirl comes from turning
// the texture, which leaves the mesh where the samples were taken.
const WH_RINGS=12, WH_SEG=40;
function makeWhirlArt(){
  const pos=[], uvs=[], idx=[];
  for(let i=0;i<=WH_RINGS;i++){
    const t=i/WH_RINGS, r=WH_R*t;
    for(let j=0;j<=WH_SEG;j++){
      const a=j/WH_SEG*Math.PI*2;
      pos.push(Math.cos(a)*r,0,Math.sin(a)*r);
      uvs.push(0.5+Math.cos(a)*t*0.5,0.5+Math.sin(a)*t*0.5);
    }
  }
  for(let i=0;i<WH_RINGS;i++)for(let j=0;j<WH_SEG;j++){
    const A=i*(WH_SEG+1)+j,B=A+1,C=A+WH_SEG+1,D=C+1;
    idx.push(A,C,B, B,C,D);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);
  const tex=whirlTexture();
  tex.center.set(0.5,0.5);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,
    transparent:true,depthWrite:false,side:THREE.DoubleSide}));
  m.renderOrder=1;
  return m;
}

function updateWhirl(dt,eff){
