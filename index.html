<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surf</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button { font-family:inherit; }   /* buttons do not inherit it on their own */
  html,body { width:100%; height:100%; overflow:hidden; background:#7ec8f0; font-family:'Trebuchet MS',sans-serif; touch-action:none; }
  canvas { display:block; }
  /* The readout sat hard against the top edge, under the notch on a phone. It is off the
     edge now, on a scrim that fades out rather than a bar with a line under it, and each
     column carries its own record underneath instead of BEST being a column of its own —
     a best score means nothing next to a distance and vice versa. Digits are tabular so
     the numbers stop jittering sideways every time a figure changes. */
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:calc(15px + env(safe-area-inset-top,0px)) 8px 10px; color:#fff; pointer-events:none;
    background:linear-gradient(180deg, rgba(3,20,40,.34), rgba(3,20,40,.11) 62%, rgba(3,20,40,0));
    font-variant-numeric:tabular-nums; -webkit-font-feature-settings:"tnum"; }
  #hud .cell { flex:1 1 0; text-align:center; position:relative; padding:0 2px; }
  /* hairlines between the columns, faded at both ends so they read as a divider rather
     than a table rule */
  #hud .cell + .cell::before { content:''; position:absolute; left:0; top:14%; bottom:20%;
    width:1px; background:linear-gradient(180deg, rgba(255,255,255,0),
      rgba(255,255,255,.24) 42%, rgba(255,255,255,0)); }
  #hud .lab { display:block; font-size:min(2.7vw,10px); font-weight:700; letter-spacing:1.7px;
    text-transform:uppercase; opacity:.60; text-shadow:0 1px 3px rgba(0,30,60,.6); }
  #hud .val { display:block; font-size:min(5.6vw,22px); font-weight:800; line-height:1.2;
    letter-spacing:.2px; text-shadow:0 2px 5px rgba(0,35,70,.6); }
  #hud .rec { display:block; font-size:min(2.6vw,9.5px); font-weight:700; letter-spacing:.7px;
    text-transform:uppercase; opacity:.52; line-height:1.5; min-height:1.5em;
    text-shadow:0 1px 3px rgba(0,30,60,.6); }
  /* the record lights up for the rest of the run once you pass it */
  /* a tint and a lift, not a glow — an 8px halo at this size fills the gaps between the
     letters and reads as a highlighter pen drawn over the line */
  #hud .rec.new { opacity:.95; color:#ffe25e; text-shadow:0 1px 3px rgba(0,30,60,.75); }
  #trickmsg { position:fixed; top:22%; width:100%; text-align:center; color:#ffdf2e; font-weight:bold; font-size:30px; text-shadow:0 3px 6px rgba(0,40,80,.6); pointer-events:none; opacity:0; transition:opacity .2s; }
  /* Real glass, not an outline. From the references, what makes a pane read as glass is
     four things at once: a bright specular streak sitting across the top, an edge that is
     lit unevenly rather than a uniform ring, a cool bounce caught along the bottom inside,
     and enough blur behind it that you can tell there is thickness. The sea still shows
     through all of it — that was the point of stripping the colour out, and none of this
     puts it back. */
  .glass {
    background:linear-gradient(157deg, rgba(255,255,255,.10), rgba(255,255,255,.015) 45%,
                                       rgba(255,255,255,.055));
    border:1.5px solid rgba(255,255,255,.70);
    -webkit-backdrop-filter:blur(13px) saturate(135%);
    backdrop-filter:blur(13px) saturate(135%);
    box-shadow:0 3px 15px rgba(0,18,42,.26),
               inset 0 1.4px 0 rgba(255,255,255,.88),
               inset 0 -10px 14px -11px rgba(165,225,255,.42);
  }
  /* the streak. Inset from the rim on both sides so it reads as light ON the surface
     rather than as a second border, and fading out before it reaches the middle */
  .glass::before { content:''; position:absolute; left:19%; right:19%; top:7%; height:17%;
    border-radius:50%; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.46), rgba(255,255,255,.06) 78%,
                                       rgba(255,255,255,0)); }
  /* and the cool rim light gathering along the bottom edge, which is the tell that it is
     a solid piece with a far side rather than a hole cut in the screen */
  .glass::after { content:''; position:absolute; inset:0; border-radius:inherit;
    pointer-events:none; box-shadow:inset 0 -1.5px 4px -2px rgba(200,240,255,.60); }
  /* The controls sit on top of the thing you are trying to look at, so they stay
     see-through and keep their white word and white glyph — the glass above is worked
     into the surface, not laid over it as a colour. */
  .btn {
    position:fixed; user-select:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; letter-spacing:1.2px; color:#fff;
    text-shadow:0 1px 3px rgba(0,18,42,.8), 0 0 10px rgba(0,20,45,.35);
    transition:transform .09s ease, box-shadow .09s ease, background .12s ease;
  }
  /* .btn is already position:fixed and positions its own children; giving it relative
     here overrode that and dropped JUMP into the flow at the top of the page */
  .btn { overflow:hidden; }
  .tbtn { position:relative; overflow:hidden; }
  .btn > *, .tbtn > * { position:relative; }
  .btn:active { transform:scale(.93);
    background:linear-gradient(157deg, rgba(255,255,255,.34), rgba(255,255,255,.16));
    box-shadow:0 2px 9px rgba(0,18,42,.28), inset 0 1.6px 0 rgba(255,255,255,.95),
               inset 0 0 24px rgba(190,235,255,.28); }
  #jumpBtn { right:20px; bottom:30px; width:94px; height:94px; font-size:19px; border-width:2.5px; }
  #ropeBtn { right:20px; bottom:142px; width:94px; height:94px; font-size:17px; display:none;
    border-width:2.5px; }
  /* the trick pad is given the width left over beside JUMP and wraps to two rows, so
     the two can never end up on top of each other on a narrow phone */
  #trickBar { position:fixed; bottom:26px; left:12px; z-index:9;
    width:min(135px, calc(100vw - 132px));
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
  .tbtn {
    width:100%; aspect-ratio:1/1;
    border-radius:50%; user-select:none; flex:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-weight:800; font-size:9.5px; letter-spacing:.7px; color:#fff;
    text-shadow:0 1px 3px rgba(0,18,42,.8), 0 0 10px rgba(0,20,45,.35);
    transition:transform .09s ease, box-shadow .09s ease, background .12s ease;
  }
  /* the release cue is the one thing that is allowed colour: it has to be caught out of
     the corner of an eye mid-trick, and a white ring going slightly whiter would not be */
  /* the helicopter is one committed move rather than a hold, so it gets its own shape */
  .tbtn.wide { grid-column:span 2; aspect-ratio:auto; height:38px; flex-direction:row; gap:7px;
    border-radius:20px; font-size:10.5px; letter-spacing:1.1px; }
  .tbtn.wide .ges { width:20px; height:20px; }
  .tbtn.ready { border-color:#fff8c0;
    background:linear-gradient(157deg, rgba(255,247,190,.34), rgba(255,226,110,.16));
    box-shadow:0 0 0 3px rgba(255,246,150,.92), 0 0 26px rgba(255,224,60,.75),
               inset 0 1.6px 0 rgba(255,255,255,.95); }
  .tbtn:active { transform:scale(.9);
    background:linear-gradient(157deg, rgba(255,255,255,.34), rgba(255,255,255,.16));
    box-shadow:0 2px 8px rgba(0,18,42,.26), inset 0 1.6px 0 rgba(255,255,255,.95),
               inset 0 0 22px rgba(190,235,255,.28); }
  /* every button carries the finger movement that does the same thing, so the gesture
     is learnable from the button rather than from a page of instructions */
  .ges { width:54%; height:54%; display:block; overflow:visible;
    fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 1px 3px rgba(0,18,42,.85)); }
  .ges .dot { fill:#fff; stroke:none; }
  #jumpBtn .ges { width:30px; height:30px; stroke-width:2.4; margin-bottom:1px; }
  #jumpBtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  /* The menu no longer lays a flat panel over the game — the sea keeps rolling behind
     it under a soft vignette that has no edge anywhere, and the type carries its own
     legibility instead of borrowing it from a scrim. */
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px;
    background:radial-gradient(150% 108% at 50% 46%,
      rgba(4,22,42,.46) 0%, rgba(4,22,42,.38) 42%, rgba(4,22,42,.20) 74%, rgba(4,22,42,.05) 100%);
  }
  #overlay h1 { font-size:min(11vw,54px); color:#ffdf2e; letter-spacing:-.5px;
    text-shadow:3px 3px 0 #b8641c, 0 6px 22px rgba(0,20,40,.6); }
  #overlay p { margin:12px 0; font-size:min(4.4vw,18px); line-height:1.55; max-width:540px;
    text-shadow:0 2px 8px rgba(0,20,40,.75); }
  /* One button. Every menu button is this size and shape; only the colour changes, so
     the stack reads as one control rather than three different ones. */
  /* Glass, not paint. The fill is a wash of white with the colour carried in a low
     tint, an edge and a soft glow, so the sea genuinely reads through every button
     instead of being covered by a coloured slab. */
  /* Bright colour through glass. The trap is that a translucent colour takes on
     whatever is behind it, and behind these is a dark navy sea — so orange came out
     brown and blue came out navy. The backdrop is therefore brightened and saturated
     hard before the colour is laid over it: the button sits on a light ground of its
     own making, and the hue reads at full strength while you can still see the water
     moving through it. */
  .go { position:relative; overflow:hidden;
    width:min(302px,80vw); padding:15px 22px; font-size:17px; font-weight:800;
    font-family:inherit; letter-spacing:.6px; color:#fff; border-radius:999px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    text-shadow:0 1px 5px rgba(120,50,0,.5);
    border:1.5px solid rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(15px) saturate(150%);
    backdrop-filter:blur(15px) saturate(150%);
    background:linear-gradient(160deg, rgba(255,150,0,.80), rgba(255,64,0,.66)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%);
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 22px rgba(255,140,20,.20),
               inset 0 1px 0 rgba(255,255,255,.8), inset 0 -14px 24px rgba(190,70,0,.18);
    transition:transform .1s ease, box-shadow .14s ease, background .14s ease; }
  /* the sheen: bright at the very top, gone by halfway, curved like a lens */
  .go::before { content:''; position:absolute; left:1px; right:1px; top:1px; height:52%;
    border-radius:999px 999px 52% 52% / 999px 999px 22% 22%;
    background:linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.22) 46%,
                                       rgba(255,255,255,.03) 88%, rgba(255,255,255,0) 100%);
    pointer-events:none; }
  .go > * { position:relative; }
  .go:active { transform:translateY(2px) scale(.988);
    background:linear-gradient(160deg, rgba(255,186,40,.92), rgba(255,64,0,.80)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%);
    box-shadow:0 4px 12px rgba(0,20,40,.3), inset 0 1px 0 rgba(255,255,255,.7); }
  .go.alt { background:linear-gradient(160deg, rgba(0,220,214,.78), rgba(0,140,160,.64)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%);
    border-color:rgba(180,255,250,.72); text-shadow:0 1px 5px rgba(0,60,66,.5);
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 22px rgba(40,180,255,.22),
               inset 0 1px 0 rgba(255,255,255,.8), inset 0 -14px 24px rgba(0,80,130,.18); }
  .go.alt:active { background:linear-gradient(160deg, rgba(110,246,240,.9), rgba(0,140,160,.78)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%); }
  .go.teal { background:linear-gradient(160deg, rgba(80,242,112,.78), rgba(0,172,86,.64)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%);
    border-color:rgba(198,255,208,.72); text-shadow:0 1px 5px rgba(0,66,32,.5);
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 22px rgba(30,230,200,.22),
               inset 0 1px 0 rgba(255,255,255,.8), inset 0 -14px 24px rgba(0,100,88,.18); }
  .go.teal:active { background:linear-gradient(160deg, rgba(150,254,170,.9), rgba(0,172,86,.78)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%); }
  .go.sun { background:linear-gradient(160deg, rgba(255,220,0,.80), rgba(255,150,0,.66)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%);
    border-color:rgba(255,248,190,.78); color:#40260a; text-shadow:0 1px 3px rgba(255,240,180,.55);
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 24px rgba(255,208,0,.28),
               inset 0 1px 0 rgba(255,255,255,.9), inset 0 -14px 24px rgba(190,120,0,.2); }
  .go.sun::before { background:linear-gradient(180deg, rgba(255,255,255,.75) 0%,
    rgba(255,255,255,.26) 46%, rgba(255,255,255,.03) 88%, rgba(255,255,255,0) 100%); }
  .go.sun:active { background:linear-gradient(160deg, rgba(255,234,80,.92), rgba(255,150,0,.80)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%); }
  .go.calm { background:linear-gradient(160deg, rgba(150,186,222,.66), rgba(46,78,120,.52)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%);
    border-color:rgba(214,232,248,.6); text-shadow:0 1px 5px rgba(0,30,60,.5);
    box-shadow:0 14px 30px rgba(0,20,40,.28), inset 0 1px 0 rgba(255,255,255,.66),
               inset 0 -14px 24px rgba(0,30,60,.18); }
  .go.calm:active { background:linear-gradient(160deg, rgba(196,222,244,.84), rgba(46,78,120,.66)), linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.60) 62%, rgba(255,255,255,.78) 100%); }
  #ovBtns { display:flex; flex-direction:column; align-items:center; width:100%; }
  #ovBtns .go { margin-top:10px; }
  /* The wipeout card carries a five-line summary AND a stack of three, so its buttons are
     slimmer than the menu's — same pill, less height — and the stack sits lower, well
     clear of the last line of the summary. Thinning them shortens the block, and the
     overlay centres its content, so without the margin they would have drifted UP rather
     than down. The menu's own buttons are untouched: it has the room and they are the
     first thing you see. */
  /* The stack is anchored to the bottom rather than centred with the rest. Centring
     cannot put it lower: with a centred column the gap below is (screen - content)/2, so
     the ONLY way down is to make the block taller, and thinning the buttons had made it
     shorter — measured, they rose by 48px. Growing it back with a margin would have
     pushed the title up by half of whatever I added, into the notch.
     margin-top:auto takes all the free space above the stack instead, which pins it to
     the bottom padding on a tall screen and collapses to nothing on a short one, so the
     summary can never be overlapped or clipped. */
  #overlay.over { justify-content:flex-start;
    padding-top:calc(21vh + env(safe-area-inset-top,0px));
    padding-bottom:calc(13vh + env(safe-area-inset-bottom,0px)); }
  #overlay.over #ovBtns { margin-top:auto; padding-top:24px; }
  #overlay.over #ovBtns .go { padding:10px 22px; font-size:16px; margin-top:9px; }
  /* On the menu the title stays where it has always sat and the buttons go to the
     bottom of the screen, out of the flow, so the two do not push each other around.
     The wipeout card keeps them together under the summary. */
  #overlay.main { justify-content:flex-start; padding-top:30vh; }
  #overlay.main #ovBtns { position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(9vh + env(safe-area-inset-bottom,0px)); }
  /* Play, and beside it the set-wave button. The row keeps the pair exactly as wide as a
     lone button was, so the stack below it does not shift: Play gives up the width the
     icon takes rather than the column growing. These rules have to sit AFTER the
     "#ovBtns .go { margin-top }" above — same specificity, so source order is what
     decides, and the row owns the spacing now instead of the buttons inside it. */
  #playRow { display:flex; align-items:center; gap:10px; width:min(302px,80vw); margin-top:10px; }
  #playRow .go { margin-top:0; }
  #playRow #startBtn { width:auto; flex:1 1 auto; }
  #playRow #waveBtn { width:auto; flex:0 0 auto; padding:15px; aspect-ratio:1; }
  #waveBtn svg { width:19px; height:19px; fill:currentColor; display:block; }
  /* The wipeout card thins every button it holds, which would stretch a square one. */
  #overlay.over #playRow { margin-top:9px; }
  #overlay.over #playRow #waveBtn { padding:10px; }
  #overlay .hint { opacity:.85; font-size:min(3.8vw,15px); }
  #ovPurse { margin-top:6px; font-size:min(4.6vw,19px); font-weight:800; letter-spacing:.4px;
    color:#ffe9a8; text-shadow:0 2px 8px rgba(0,20,40,.7); }
  #overlay.over h1 { font-size:min(12vw,58px); }
  /* the run summary: the block sits in the middle of the screen, but every line inside
     it starts on the same left edge instead of each being centred on its own length */
  #ovText { width:min(300px,80vw); max-width:none; margin:14px auto 4px;
    font-size:min(4.2vw,17px); text-align:left; }
  #ovText .tr { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
    padding:6px 2px; border-bottom:1px solid rgba(255,255,255,.14); }
  #ovText .tr:last-child { border-bottom:none; }
  #ovText .tr span { opacity:.86; }
  #ovText .tr b { font-weight:800; white-space:nowrap; }
  #ovText .tr.hi b { color:#ffdf2e; }
  /* what it paid out, set beside the figure rather than pointed at with an arrow */
  #ovText .tr em { font-style:normal; font-weight:800; color:#ffe9a8; margin-left:10px; }
  #ovText .lead { text-align:center; opacity:.9; margin-bottom:10px; }
  #zap { position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(190,250,255,.95) 0%, rgba(120,220,255,.55) 26%, rgba(60,140,255,.18) 52%, rgba(0,0,0,0) 74%);
    transition:opacity .28s ease-out; }
  #zap.on { opacity:1; transition:opacity .04s linear; }
  /* clear of the iPhone home indicator. 8px put it right on the bar; the env() term is
     what actually tracks the indicator on a device that reports one, and the 24px floor
     keeps it off the very edge on everything else. */
  #ver { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px));
    left:50%; transform:translateX(-50%); z-index:10;
    color:#fff; opacity:.55; font-size:13px; font-weight:bold; letter-spacing:.5px;
    text-shadow:0 1px 3px rgba(0,40,80,.6); pointer-events:none; }

  /* No panel: the model is rendered onto the page's own canvas and this sits over it,
     with a scrim top and bottom so the type has something to be legible against and the
     middle of the screen stays completely clear. */
  #viewer { position:fixed; inset:0; z-index:14; display:flex; flex-direction:column;
    justify-content:space-between; pointer-events:none; color:#fff;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px
            calc(18px + env(safe-area-inset-bottom,0px)); }
  /* #viewer is pointer-events:none with its children opting back in, so there was nothing
     for a drag to land on. This is that surface. It is the FIRST child, and the name block,
     the arrows and the bottom bar all come after it — a positioned element paints over a
     static one regardless of order, so those three are given a stacking context of their
     own to keep them above it and still tappable. The name block stays pointer-events:none,
     so a drag started over the title falls through to here rather than dying on the text. */
  #viewer #vDrag { position:absolute; inset:0; pointer-events:auto; touch-action:none; }
  #viewer .vtop, #viewer .vbot { position:relative; z-index:1; }
  #viewer .varr { z-index:2; }
  /* A light wash behind the name, fading out completely before it reaches the object — not
     the hard bar that was here before. The bottom has no scrim at all: the stat bars carry
     their own plate and the button carries its own fill, so there is nothing down there
     that needs a background. */
  /* Heavier, and it runs a long way past the last line before it lets go — a wash that
     has faded out by the time it reaches the bottom of the type leaves the type sitting on
     nothing, which is what it was doing. */
  #viewer .vtop { text-align:center; pointer-events:none;
    background:linear-gradient(180deg, rgba(2,10,22,.82) 0%, rgba(2,10,22,.72) 40%,
      rgba(2,10,22,.46) 66%, rgba(2,10,22,.16) 86%, rgba(2,10,22,0) 100%);
    margin:-14px -16px 0; padding:16px 16px 64px; }
  #viewer .vname { font-size:26px; font-weight:800; letter-spacing:.3px;
    text-shadow:0 2px 3px rgba(0,22,48,.95), 0 0 16px rgba(0,22,48,.75), 0 6px 20px rgba(0,22,48,.6); }
  #viewer .vsub { font-size:13px; opacity:.92; margin-top:4px; line-height:1.4;
    max-width:520px; margin-left:auto; margin-right:auto;
    text-shadow:0 1px 3px rgba(0,22,48,.95), 0 0 12px rgba(0,22,48,.8); }
  /* The scrims carry more weight now there is a sky and a beach behind them instead of a
     flat navy: pale sand under the stat bars washed the segments out, and a sunset sky
     behind the name did the same to the type. */
  #viewer .vbot { pointer-events:auto; width:min(520px,100%); margin:0 auto;
    padding:40px 14px 4px; margin-bottom:-4px; }
  /* The Back button is an INLINE-flex box, and auto margins do nothing on an inline-level
     element — which is why setting them last time did not move it. It has to be block-level
     first, then the margins centre it. */
  #viewer .vbot .go { display:flex; margin-left:auto; margin-right:auto; }
  /* Long thick arrows down each side, to walk the rack without going back to the grid.
     No plate behind them: at this size the shape carries on its own, and a button would
     compete with the very thing it is there to let you look at. */
  #viewer .varr { position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:clamp(168px,28vh,240px); padding:0; border:0; background:none;
    cursor:pointer; pointer-events:auto; -webkit-tap-highlight-color:transparent;
    transition:opacity .18s ease, transform .09s ease; }
  /* in off the bezel: hard against the edge they read as part of the phone rather than
     part of the page, and on a curved screen the tip falls away down the shoulder */
  #viewer .varr.prev { left:18px; }
  #viewer .varr.next { right:18px; }
  #viewer .varr svg { width:100%; height:100%; display:block; overflow:visible;
    animation:varrGlow 2.6s ease-in-out infinite; }
  /* Drawn the way a neon tube is drawn: the SAME closed outline stroked three times,
     widest and deepest underneath, thinnest and hottest on top. That is what makes a
     glowing line read as a lit tube rather than as a coloured line — the falloff from a
     white core out through saturated orange happens across the width of the stroke
     itself, so it survives being scaled and never bands the way a blur does.
     The outline is a tapered crescent, not a V: every segment is a bezier, so there is no
     mitre at the point and no blunt cut at the ends. The band is at its widest where it
     turns and runs out to a sharp tip at each end, which is what stops it reading as a
     bar bent in the middle. The two control points either side of each apex share the
     apex's own x, so the tangents through it are collinear and the curve TURNS rather than
     kinking — and turns tightly, because those controls sit close to it. Seven times as
     tall as it is wide, and the hollow is a slot rather than a gap. */
  #viewer .varr svg path { fill:none; stroke-linejoin:round; stroke-linecap:round; }
  /* Blue, and dark enough at the outside to hold an edge against pale sand. The deep navy
     underneath is what makes it read on a bright background; the cyan tube and the near
     white filament are what make it glow. */
  #viewer .varr .a { stroke:#062a4d; stroke-width:3.4; opacity:.66; fill:rgba(12,64,110,.16); }
  #viewer .varr .b { stroke:#2fa8e0; stroke-width:1.55;
    animation:varrTube 2.6s ease-in-out infinite; }
  @keyframes varrTube { 0%,100% { stroke:#1d7fb8; } 45% { stroke:#63d2f7; } }
  /* the hot core breathes a beat out of step with the bloom, so it reads as something
     powered rather than as a shape someone put a glow filter on */
  #viewer .varr .c { stroke:#e8fbff; stroke-width:0.46; opacity:.9;
    animation:varrCore 2.6s ease-in-out infinite; }
  @keyframes varrCore { 0%,100% { opacity:.62; } 42% { opacity:1; } }
  @keyframes varrGlow {
    0%,100% { filter:drop-shadow(0 0 3px rgba(6,42,77,.60)) drop-shadow(0 0 9px rgba(20,90,150,.30)); }
    50%     { filter:drop-shadow(0 0 9px rgba(99,210,247,.95)) drop-shadow(0 0 26px rgba(40,150,220,.55)); } }
  #viewer .varr:active { transform:translateY(-50%) scale(.9); }
  #viewer .varr:active .c { opacity:1; stroke-width:0.75; }
  #viewer .varr:active .a { opacity:.8; }
  /* there is nothing before the first or after the last, so the arrow goes rather than
     sitting there greyed out inviting a tap that does nothing */
  #viewer .varr.off { opacity:0; pointer-events:none; }
  /* The bars sit on a plate of their own, lifted clear of the button rather than sharing
     one dark block with it. Against a beach they need something solid behind them, and the
     button is easier to find when it is not embedded in the same slab. */
  #viewer #vStats:not(:empty) { margin:0 0 16px; padding:13px 15px 11px; border-radius:18px;
    background:rgba(4,15,28,.80); border:1px solid rgba(255,255,255,.13);
    box-shadow:0 10px 26px rgba(0,14,28,.42); }
  #viewer #vStats .st { display:flex; align-items:center; gap:8px; margin:5px 0; }
  #viewer #vStats .st span { font-size:10px; font-weight:800; letter-spacing:.1em;
    opacity:.7; width:48px; text-align:right; flex:none; }
  #viewer #vStats .seg { display:flex; gap:3px; flex:1; }
  #viewer #vStats .seg i { flex:1; height:9px; border-radius:2px; background:rgba(255,255,255,.14); }
  #viewer #vStats .seg i.on { background:currentColor; box-shadow:0 0 8px currentColor; }
  #viewer #vStats .st.speed .seg { color:#ff9a3c; }
  #viewer #vStats .st.turn  .seg { color:#4fd8e8; }
  #viewer #vStats .st.air   .seg { color:#ffd83c; }
  #viewer #vStats .st.tough .seg { color:#6ee88a; }
  /* The shop was a flat navy slab, which is the one screen in the game that does not look
     like the game: everything else is sea and sun. Warmed and lifted into a sky-to-water
     wash, with the cards as light glass on top of it instead of darker holes cut into it. */
  #shop { position:fixed; inset:0; z-index:12; color:#fff;
    background:linear-gradient(180deg, rgba(18,86,150,.96) 0%, rgba(12,62,116,.96) 46%,
      rgba(7,38,74,.97) 100%);
    display:flex; align-items:center; justify-content:center; padding:16px; }
  #shop .shopwrap { width:min(620px,100%); max-height:100%; display:flex; flex-direction:column; }
  #shop .go { align-self:center; margin-top:12px; }

  #clip { position:fixed; inset:0; z-index:14; background:rgba(4,18,34,.96); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:18px; }
  #clip .clipbox { width:min(520px,100%); text-align:center; }
  #clip .clipart { position:relative; height:min(46vh,260px); border-radius:16px; overflow:hidden;
    background:linear-gradient(#3a2a6b 0%, #b4496a 42%, #ff8a3c 62%, #1d7fc4 62%, #0d4f8c 100%); }
  #clip .sun { position:absolute; left:50%; top:44%; width:74px; height:74px; margin:-37px 0 0 -37px;
    border-radius:50%; background:#ffe9b0; box-shadow:0 0 60px 24px rgba(255,190,110,.55); }
  #clip .sea { position:absolute; left:0; right:0; bottom:0; height:38%;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.12) 0 2px, rgba(255,255,255,0) 2px 12px); }
  #clip .sweep { position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 62%);
    transform:translateX(-100%); animation:clipsweep 2.1s linear infinite; }
  @keyframes clipsweep { to { transform:translateX(100%); } }
  #clip .clipmsg { margin-top:16px; font-size:min(5vw,20px); font-weight:bold; }
  #shop h2 { font-size:min(6.5vw,26px); color:#ffdf2e; text-shadow:2px 2px 0 #b8641c; margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #shop h2 span { color:#ffe9a8; font-size:min(4.6vw,19px); text-shadow:none; }
  #shopList { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 4px;
    display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    /* let every row take the height its tile needs — stretched rows squash the
       preview and clip the name and the button straight off the bottom */
    align-content:start; grid-auto-rows:max-content; }
  #shopTabs { display:flex; gap:8px; margin-bottom:11px; }
  #shopTabs .tab { flex:1 1 0; padding:10px 0; font-size:15px; font-weight:800; letter-spacing:.6px;
    color:#eaf6ff; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.26);
    border-radius:999px; cursor:pointer; transition:background .12s, color .12s, border-color .12s; }
  #shopTabs .tab.on { color:#052a2a; border-color:rgba(160,244,232,.75);
    background:linear-gradient(165deg, rgba(143,240,228,.68), rgba(63,199,184,.40)); }
  .card { position:relative; display:flex; flex-direction:column; text-align:left; overflow:hidden;
    border-radius:16px; border:1.5px solid rgba(255,255,255,.26);
    background:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.10));
    box-shadow:0 10px 24px rgba(0,20,44,.30), inset 0 1px 0 rgba(255,255,255,.34); }
  .card.on { border-color:#ffdf2e;
    box-shadow:0 0 0 1px rgba(255,223,46,.45), 0 10px 24px rgba(90,70,0,.34); }
  /* the picture is a rendered beach now, edge to edge, so it fills the tile rather than
     floating on a gradient of its own */
  .card .thumb { width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
    background:#7cc6ee; }
  /* The full-screen preview was only reachable by tapping the picture or the name, and
     nothing on the tile said so. This is the same thing with a handle on it — an eye in
     the corner of every tile. It sits over the picture rather than in the row of
     buttons, so it never competes with Ride it or the price. Specificity beats the
     .card button rule below it, so none of that full-width pill styling lands here. */
  .card .eye { position:absolute; top:8px; right:8px; width:32px; height:32px; padding:0;
    border-radius:50%; display:grid; place-items:center; cursor:pointer; z-index:2;
    border:1.5px solid rgba(255,238,200,.80);
    background:linear-gradient(165deg, #ffb845, #ef7a0e);
    box-shadow:0 4px 12px rgba(58,22,0,.44), inset 0 1px 0 rgba(255,255,255,.62);
    transition:transform .09s ease, filter .12s ease; }
  .card .eye svg { width:19px; height:19px; display:block; }
  .card .eye:active { transform:scale(.88); filter:brightness(1.12); }
  .card .info { padding:9px 11px 11px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .card .nm { font-weight:800; font-size:15px; letter-spacing:.2px; }
  .card .bl { font-size:11.5px; opacity:.76; line-height:1.34; flex:1; }
  .card .act { margin-top:7px; }
  /* GTA-style: label on the left, a track of ten segments on the right, filled to the
     board's level. Segments rather than a smooth bar so a difference of one is countable
     at a glance instead of being judged by eye. */
  .card .stats { display:flex; flex-direction:column; gap:4px; margin:3px 0 1px; }
  .card .st { display:flex; align-items:center; gap:7px; }
  .card .st span { font-size:9px; font-weight:800; letter-spacing:.1em; opacity:.62;
    width:42px; text-align:right; flex:none; }
  .card .seg { display:flex; gap:2px; flex:1; }
  .card .seg i { flex:1; height:7px; border-radius:1.5px; background:rgba(255,255,255,.11);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
  .card .seg i.on { box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 6px currentColor;
    background:currentColor; }
  .card .st.speed .seg { color:#ff9a3c; }
  .card .st.turn  .seg { color:#4fd8e8; }
  .card .st.air   .seg { color:#ffd83c; }
  .card .st.tough .seg { color:#6ee88a; }
  .card button { width:100%; padding:11px 0; font-size:14px; font-weight:800; color:#fff;
    letter-spacing:.3px; border-radius:999px; cursor:pointer;
    text-shadow:0 1px 3px rgba(0,20,40,.5);
    border:1.5px solid rgba(255,255,255,.42);
    background:linear-gradient(165deg, rgba(255,186,96,.80), rgba(238,110,20,.56));
    box-shadow:0 6px 14px rgba(0,20,40,.26), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .08s ease, filter .12s ease; }
  .card button:active { transform:translateY(2px) scale(.985); filter:brightness(1.06); }
  .card button.own { background:linear-gradient(165deg, rgba(104,236,216,.56), rgba(18,152,140,.30));
    border-color:rgba(178,246,236,.55);
    box-shadow:0 6px 14px rgba(0,20,40,.26), inset 0 1px 0 rgba(255,255,255,.55); }
  .card button:disabled { background:linear-gradient(180deg, rgba(120,146,170,.26), rgba(55,72,90,.22));
    border-color:rgba(255,255,255,.16); color:#b4c6d6; text-shadow:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12); cursor:default; transform:none; }
  .card .tag { display:block; text-align:center; padding:11px 0; border-radius:999px;
    font-size:14px; font-weight:800; letter-spacing:.6px; color:#1a1405;
    border:1.5px solid rgba(255,246,200,.6);
    background:linear-gradient(165deg, rgba(255,232,134,.72), rgba(245,197,24,.42)); }

    filter:drop-shadow(0 1px 1px rgba(0,20,40,.35)); }
  #hud .pk { width:.86em; height:.86em; }
  .hidden { display:none !important; }
  /* the panel behind the version number: five taps on it opens the run history */
  #stats { position:fixed; inset:0; z-index:14; background:rgba(4,18,32,.965); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:14px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #stats .wrap { width:min(560px,100%); max-height:100%; display:flex; flex-direction:column; }
  #stats h2 { margin:0 0 10px; font-size:21px; letter-spacing:.4px; display:flex;
    align-items:baseline; gap:9px; }
  #stats h2 small { font-size:11px; font-weight:600; letter-spacing:1.5px;
    text-transform:uppercase; opacity:.5; }
  #stBody { overflow:auto; -webkit-overflow-scrolling:touch; padding-right:2px; }
  #stats .sec { margin:0 0 16px; }
  #stats .sec h3 { margin:0 0 5px; font-size:10.5px; font-weight:800; letter-spacing:1.6px;
    text-transform:uppercase; color:#7ee8d6; }
  #stats .row { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
    padding:5px 1px; border-bottom:1px solid rgba(255,255,255,.075); font-size:13.5px; }
  #stats .row span:first-child { opacity:.78; }
  #stats .row b { font-weight:800; white-space:nowrap; }
  #stats .meter { padding:5px 1px 7px; border-bottom:1px solid rgba(255,255,255,.075); }
  #stats .meter .t { display:flex; justify-content:space-between; font-size:13px; }
  #stats .meter .t span:first-child { opacity:.78; }
  #stats .bar { height:5px; border-radius:3px; margin-top:4px; background:rgba(255,255,255,.13); }
  #stats .bar i { display:block; height:100%; border-radius:3px; min-width:2px;
    background:linear-gradient(90deg,#3fc0e6,#7ee896); }
  #stats .none { opacity:.45; font-size:13px; padding:5px 1px; }
  #stats .heroes { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin:2px 0 16px; }
  #stats .hero { border-radius:15px; padding:12px 13px; border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(160deg, rgba(126,232,220,.14), rgba(255,255,255,.03)); }
  #stats .hero .hv { display:block; font-size:25px; font-weight:800; letter-spacing:-.5px;
    color:#8ff0e4; line-height:1.1; }
  #stats .hero .hk { display:block; font-size:10.5px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; opacity:.62; margin-top:3px; }
  #stats .hero .hs { display:block; font-size:11px; opacity:.55; margin-top:2px; }
  #stats .acts { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  /* the owner's key gets its own line: it is the odd one out in that row and squeezing a
     fourth button in beside the others wrapped its label onto two lines */
  #stats .acts #stClaim { flex:1 0 100%; max-width:none; order:-1; }
  /* three across one row, sharing the width rather than wrapping */
  #stats .acts .go { margin:0; flex:1 1 0; width:auto; min-width:0; max-width:160px;
    padding:12px 8px; font-size:14.5px; }
  #fatal { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#0a2846; color:#fff; text-align:center; padding:24px; font-size:18px; line-height:1.6; z-index:20; }
</style>
</head>
<body>
<div id="hud">
  <div class="cell"><span class="lab">Tricks</span><span class="val" id="hScore">0</span><span class="rec" id="hBest">best 0</span></div>
  <div class="cell"><span class="lab">Dist</span><span class="val" id="hDist">0 m</span><span class="rec" id="hBestD">best 0 m</span></div>
  <div class="cell"><span class="lab">Mph</span><span class="val" id="hSpeed">0</span><span class="rec"></span></div>
  <div class="cell"><span class="lab">Puka</span><span class="val"><i class="pk"></i><span id="hCoins">0</span></span><span class="rec">this run</span></div>
</div>
<div id="trickmsg"></div>
<div id="jumpBtn" class="btn glass hidden">
  <svg class="ges" viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="3.1"/><path d="M6.9 6.9a7.2 7.2 0 0 0 0 10.2M17.1 6.9a7.2 7.2 0 0 1 0 10.2"/></svg>
  JUMP</div>
<div id="ropeBtn" class="btn glass">ROPE!</div>
<!-- Every trick keeps its gesture; the button is the same move with a picture of the
     finger movement on it, so one teaches the other. -->
<div id="trickBar" class="hidden">
  <div class="tbtn glass" id="rollBtn" aria-label="Barrel roll — swipe up or down">
    <svg class="ges" viewBox="0 0 24 24"><path d="M17.9 7.4A6.7 6.7 0 1 1 12 4.3"/><path d="M9.4 1.6 12.2 4.4 9.4 7.2"/><path d="M4 10.3 2.1 11.9 4 13.5M20 10.3l1.9 1.6-1.9 1.6"/></svg>
    ROLL</div>
  <div class="tbtn glass" id="flipBtn" aria-label="Front or back flip — swipe left or right">
    <!-- end over end, so it is drawn as a loop, with the sideways swipe marked either
         side of it. The plain left-right arrows it replaces read as a spin. -->
    <svg class="ges" viewBox="0 0 24 24"><path d="M12 3.5v17M12 3.5l-3.3 3.5M12 3.5l3.3 3.5M12 20.5l-3.3-3.5M12 20.5l3.3-3.5"/></svg>
    FLIP</div>
  <div class="tbtn glass" id="spinBtn" aria-label="Spin — draw a circle with one finger">
    <!-- a spin turns about the up axis, so the loop is flattened into a horizontal
         ring rather than an upright one — which is also the circle your finger draws -->
    <svg class="ges" viewBox="0 0 24 24"><ellipse cx="12" cy="12.4" rx="8.7" ry="4.5"/><path class="dot" d="M11.3 8.2 15.3 7.5 13.4 11.1Z" stroke="none"/></svg>
    SPIN</div>
  <div class="tbtn glass" id="handBtn" aria-label="Handstand — hold a second finger down">
    <svg class="ges" viewBox="0 0 24 24"><circle class="dot" cx="8.2" cy="12" r="2.9"/><circle class="dot" cx="15.8" cy="12" r="2.9"/><path d="M19.8 6.7a8.1 8.1 0 0 1 0 10.6"/></svg>
    HAND</div>
  <div class="tbtn glass wide" id="heliBtn" aria-label="Helicopter — grab the nose and spin the board three times">
    <svg class="ges" viewBox="0 0 24 24"><path d="M12 4.6c4.2 0 7.4 3.1 7.4 7.2s-3.2 7.6-7.4 7.6-7.4-3.3-7.4-7.1c0-3 2-5.3 4.5-5.3"/><path class="dot" d="M8.4 3.7 12.6 6.1 8.7 8.6Z" stroke="none"/></svg>
    HELI</div>
</div>
<div id="stats" class="hidden"><div class="wrap">
  <h2>Stats <small id="stTag"></small></h2>
  <div id="stBody"></div>
  <div class="acts">
    <button class="go alt sm" id="stCopy">Copy</button>
    <button class="go alt sm" id="stClaim">Claim boards</button>
    <button class="go calm sm" id="stWipe">Reset</button>
    <button class="go sm" id="stClose">Close</button>
  </div>
</div></div>
<div id="overlay">
  <h1 id="ovTitle">Surf</h1>
  <div id="ovPurse"><span id="ovCoins">0</span><i class="pk"></i></div>
  <p id="ovText"></p>
  <div id="ovBtns">
    <button class="go sun" id="reviveBtn">Watch a clip</button>
    <div id="playRow">
      <button class="go" id="startBtn">Play</button>
      <button class="go teal" id="waveBtn" type="button" aria-label="Test the set wave"
              title="Start a run and send the set wave in two seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
    </div>
    <button class="go alt" id="shopBtn">Beach shop</button>
    <button class="go sun" id="recordsBtn">Stats</button>
    <button class="go alt" id="menuBtn">Main menu</button>
  </div>
</div>
<!-- A full-screen look at one thing, turning slowly, rendered live rather than
     photographed. The canvas behind it is doing the work; this is only the furniture. -->
<div id="viewer" class="hidden">
  <!-- the surface the turn gesture is caught on; everything after it paints on top -->
  <div id="vDrag"></div>
  <div class="vtop"><div class="vname" id="vName"></div><div class="vsub" id="vSub"></div></div>
  <!-- one outline, stroked three times: bloom, tube, hot core -->
  <button class="varr prev" id="vPrev" type="button" aria-label="Previous"><svg viewBox="0 0 40 200" aria-hidden="true">
    <path class="a" d="M34 6 C26 36 6 88 6 100 C6 112 26 164 34 194 C27 164 10.5 112 10.5 100 C10.5 88 27 36 34 6 Z"/>
    <path class="b" d="M34 6 C26 36 6 88 6 100 C6 112 26 164 34 194 C27 164 10.5 112 10.5 100 C10.5 88 27 36 34 6 Z"/>
    <path class="c" d="M34 6 C26 36 6 88 6 100 C6 112 26 164 34 194 C27 164 10.5 112 10.5 100 C10.5 88 27 36 34 6 Z"/></svg></button>
  <button class="varr next" id="vNext" type="button" aria-label="Next"><svg viewBox="0 0 40 200" aria-hidden="true">
    <path class="a" d="M6 6 C14 36 34 88 34 100 C34 112 14 164 6 194 C13 164 29.5 112 29.5 100 C29.5 88 13 36 6 6 Z"/>
    <path class="b" d="M6 6 C14 36 34 88 34 100 C34 112 14 164 6 194 C13 164 29.5 112 29.5 100 C29.5 88 13 36 6 6 Z"/>
    <path class="c" d="M6 6 C14 36 34 88 34 100 C34 112 14 164 6 194 C13 164 29.5 112 29.5 100 C29.5 88 13 36 6 6 Z"/></svg></button>
  <div class="vbot"><div id="vStats"></div><button class="go alt" id="vClose">Back</button></div>
</div>
<div id="shop" class="hidden">
  <div class="shopwrap">
    <h2>Beach shop <span id="shopCoins">0 puka</span></h2>
    <div id="shopTabs"><button class="tab on" data-tab="boards">Boards</button><button class="tab" data-tab="riders">Surfers</button></div>
    <div id="shopList"></div>
    <button class="go calm" id="shopClose">Back</button>
  </div>
</div>

<script>
if(typeof THREE!=='undefined')(() => {

const hScore=document.getElementById('hScore'), hDist=document.getElementById('hDist');
const hSpeed=document.getElementById('hSpeed'), hBest=document.getElementById('hBest');

const trickBar=document.getElementById('trickBar');
const spinBtn=document.getElementById('spinBtn'), flipBtn=document.getElementById('flipBtn');
const rollBtn=document.getElementById('rollBtn');
const handBtn=document.getElementById('handBtn');
const heliBtn=document.getElementById('heliBtn');

const vTopEl=document.querySelector('#viewer .vtop');

// bump this on every change that ships — it is shown at the bottom of the screen

// ---------- three setup ----------
const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 500);

const hemi=new THREE.HemisphereLight(0xdfeeff,0x2a7ba8,0.62);scene.add(hemi);
const HEMI_I=0.62;
// bake the sky + ocean colours into an environment map — this is what gives every
// surface real reflections instead of flat shading
function buildEnvironment(){
  if(!THREE.PMREMGenerator)return;
  try{
    const envScene=new THREE.Scene();
    const sky=new THREE.Mesh(new THREE.SphereGeometry(50,24,16),
      new THREE.MeshBasicMaterial({color:0x5fa8cf,side:THREE.BackSide}));

      new THREE.MeshBasicMaterial({color:0x14567f}));

    const sunBall=new THREE.Mesh(new THREE.SphereGeometry(5,16,12),

    const pmrem=new THREE.PMREMGenerator(renderer);
    if(pmrem.compileEquirectangularShader)pmrem.compileEquirectangularShader();
    const rt=pmrem.fromScene(envScene,0.04);
    scene.environment=rt.texture;
    pmrem.dispose();
  }catch(e){ /* older builds without PMREM just keep the lights */ }
}
const sunDir=new THREE.Vector3(-0.45,0.75,-0.5).normalize();
const SUN_I=1.75;
const sun=new THREE.DirectionalLight(0xfff2cf,1.75);
sun.position.copy(sunDir.clone().multiplyScalar(60));
sun.castShadow=true;
if(sun.shadow){
  sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;
  const c=sun.shadow.camera;
  if(c){c.left=-22;c.right=22;c.top=22;c.bottom=-22;c.near=1;c.far=140;}
  sun.shadow.bias=-0.0012;sun.shadow.normalBias=0.035;
}
scene.add(sun);
if(sun.target){sun.target.position.set(0,0,0);scene.add(sun.target);}
buildEnvironment();

// ---------- shared wave model ----------
// Real swell: every component propagates at its own speed. In deep water that is
// omega = sqrt(g*k), so short waves travel slower than long ones — dispersion — and
// the interference between them never settles, which is what stops the sea reading
// as one frozen pattern you drive through. Each component also carries an envelope
// travelling at half its phase speed (group velocity), so crests are born at the
// back of a group, peak, and die at the front.
const WAVE_G=9.8, WAVE_TSCALE=1.0;
const WAVES=[
  {dx: 0.00, dz: 1.00, k:0.190, a:1.000, ek:0.38, ep:0.00},
  {dx: 0.60, dz: 0.80, k:0.310, a:0.520, ek:0.42, ep:2.10},
  {dx:-0.74, dz: 0.67, k:0.470, a:0.260, ek:0.50, ep:4.20},
  {dx: 0.40, dz:-0.92, k:0.720, a:0.110, ek:0.58, ep:1.30},
  {dx: 1.00, dz: 0.00, k:1.050, a:0.050, ek:0.66, ep:5.40},
  {dx: 0.86, dz: 0.51, k:1.700, a:0.030, ek:0.72, ep:3.10},   // chop
  {dx:-0.35, dz: 0.94, k:2.600, a:0.016, ek:0.80, ep:0.70},   // finer chop
].map(w=>({...w, w:Math.sqrt(WAVE_G*w.k)*WAVE_TSCALE}));
const ENV_BASE=0.32, ENV_SWING=0.68;      // envelope floor and how far it breathes
// A jet ski's wake is not a separate object floating on the sea — it is the sea. It
// is added straight into the height field as a broad ridge, so the ocean shader
// lights it, foams it and fogs it exactly like every other wave, and the board and
// every floating thing ride over it for free.
const WK_SIGMA=18.0, WK_HALF=64.0;
let wkZ=0, wkA=0, wkX=0;                  // field-space centre, height, lateral centre
function wakeBump(x,z){
  if(wkA<=0.001)return 0;
  const dz=z-wkZ;
  const ez=Math.exp(-(dz*dz)/(2*WK_SIGMA*WK_SIGMA));
  const ax=Math.max(0,Math.min(1,1-Math.abs(x-wkX)/WK_HALF));
  return wkA*ez*ax*ax*(3-2*ax);
}
// A whirlpool is dished into the same field — a smooth bowl the water actually falls
// into, so the shader shades and foams the slope for free and everything afloat rides
// down it rather than hovering over a decal.
// Wide enough to span nearly the whole lane. At 13 it sat inside the water you were
// already using and could be steered round without ever committing to it, which made
// it scenery. The ramp and the jelly on its rim are the way out.
const WH_R=20.0;
let whX=0, whZ=0, whA=0;                  // field-space centre and depth
// A real one is a wide dish that turns into a steep throat in the last few metres,
// not an even bowl. The smooth part joins the sea flat at the rim; the spike is what
// makes the hole in the middle.
function whirlProfile(k){ return k*k*(3-2*k)*(1+2.1*Math.pow(k,7)); }
function whirlDip(x,z){
  if(whA<=0.001)return 0;
  const dx=x-whX, dz=z-whZ, d2=dx*dx+dz*dz;
  if(d2>=WH_R*WH_R)return 0;
  return -whA*whirlProfile(1-Math.sqrt(d2)/WH_R);
}
// ---------- the set wave ----------
// A plane goes down off to one side and the swell it throws walks across the lane at you,
// growing the whole way. Same trick as the wake and the whirlpool, for the same reason:
// it is not an object floating on the sea, it IS the sea — one more additive term in the
// shared height field. So the ocean shader lights it, foams it and fogs it for free, the
// board floats on it without knowing it exists, and steering into the face climbs you up
// it because the water under you is genuinely higher there.
//
// The overhang is the one thing a height field cannot do — a surface that is single-valued
// in y can make a wall but never a roof. The curling lip is a separate shell, built below.
const SW_FACE=10.0;                     // how far the steep front face runs
const SW_BACK=34.0;                     // and the long shoulder behind the crest
// ---- the peel ----
// A wave does not present the same cross-section along its whole length: the break travels
// along it, so at any instant there is unbroken green wall ahead of you, a barrel at you,
// and collapsed whitewater behind. Until now every z presented the same section at once,
// which is a tunnel, not a wave that is breaking.
//
// The break line does not need to move. The rider sits at z~0 and the world scrolls past
// him, so a break fixed in this frame IS a break travelling along the water — which means
// the whole peel is a spatial pattern in z and can be baked into the geometry instead of
// rebuilt every frame.
//
// These live up here, above the ocean's shader, so the shader can interpolate them rather
// than repeat them as literals. The wave's shape has to be identical in both places and the
// surest way to keep two copies equal is to not have two copies.
// The height the wave stands at once it is up. It lives here, above the lip's geometry,
// because the lip is built at load time and needs it — declared down with the phase
// constants it was in the temporal dead zone, and the whole page died on the first frame.
const SW_PEAK=7.0;
// The break sits behind the CAMERA, not behind the rider, and that is the whole reason the
// barrel would not fill the frame. The camera rides at z=25.5 and the collapse used to start
// at z=4 — so the shot was taken from twenty metres inside the section that has already
// closed out, where the shell has shrunk to half its bore and dropped three metres. Correct
// physics, useless cinematography: the tube simply was not around the lens any more, and the
// top of the frame was open sky. A real barrel has a long thrown section with the rider well
// inside it and the collapse a long way back, which is also what every photograph shows.
const SW_BRK=30.0;                      // world z of the break — well behind the camera
const SW_PEEL=78.0;                     // how far ahead of it the wall is still unbroken
const SW_COLL=26.0;                     // and how far behind it takes to fall to whitewater
// The length of fully-thrown tube standing in front of the break. Without it the throw
// peaked exactly AT the break and nowhere else, so nothing could be both fully barrelled and
// ahead of the collapse — which is the one place the shot needs to be.
const SW_HOLD=26.0;
// 0 far ahead of the break (green wall), 1 through the thrown section (barrelling)
function swPeelA(z){ const u=Math.min(1,Math.max(0,(z-(SW_BRK-SW_PEEL))/(SW_PEEL-SW_HOLD))); return u*u*(3-2*u); }
// 0 at the break, 1 well behind it (collapsed)
function swPeelB(z){ const u=Math.min(1,Math.max(0,(z-SW_BRK)/SW_COLL)); return u*u*(3-2*u); }
let swA=0, swX=0, swS=1;                // crest height, crest position in x, side it came from
// d>0 is behind the crest (the wave's own water), d<0 is the trough you ride in
function setWaveH(x,z){
  if(swA<=0.0015)return 0;
  const d=(x-swX)*swS;
  let f;
  // A smoothstep flattens out at its top, so the face arrived at the crest with ZERO slope
  // — a rounded hump — and then the lip left it at nearly a hundred degrees. That crease is
  // what read as "a flat slab and then a separate spiral". A concave power curve instead:
  // flat water, then a wall that is still steepening as it reaches the lip, which is what a
  // wave about to barrel actually does.
  if(d<=0){ const k=Math.max(0,1+d/SW_FACE); f=Math.pow(k,3.2); }
  else    { const k=Math.max(0,1-d/SW_BACK); f=0.34+0.66*k*k*(3-2*k); }
  // z does NOT arrive in world coordinates. Every caller passes dist*WAVE_DRIFT + worldZ,
  // because that is the frame the swell is written in — it has to scroll past as you travel.
  // The set wave does not scroll: it stands still in the world while you ride along it. So
  // the scroll comes back off before the peel is evaluated.
  //
  // This cost a rendering that looked perfect and a board that sank. The shader takes true
  // world z (p.y - uDist, and uDist IS dist*WAVE_DRIFT); the physics was handed the scrolled
  // one, which by 700 m had reached 322 and put the rider permanently past the break — so
  // the visible wave stood at full height while the water the board actually rides had
  // collapsed to 45% underneath it. Exactly the disagreement the two copies are warned about.
  const wz=z-dist*WAVE_DRIFT;
  // Ahead of the break and at it the wall stands at full height — an unbroken wave is not a
  // smaller wave. Behind it the crest drops away as the section turns to whitewater. Only
  // the amplitude varies along z, deliberately: the cross-section keeps one shape, so the
  // shader's derivative stays a couple of terms instead of a page of chain rule.
  return swA*(1-0.55*swPeelB(wz))*f;
}
let waveAmp=0.78;                       // current swell height (varies set to set)
// How much of the ordinary swell survives inside the barrel. On the open sea this is 1 and
// nothing changes; in the tube it falls away, because the inside of a barrel is glassy — and
// because chop rolling through it was lifting the rider off the wall and throwing him at the
// roof. It multiplies waveAmp, which is also what feeds the shader's uAmp, so the water you
// see calms with the water you ride and the two cannot disagree.
let swCalm=1;// smooth pseudo-random drift so wave size wanders between small and extra-large
function setNoise(t){
  return 0.45*Math.sin(t*0.055)+0.30*Math.sin(t*0.021+2.1)+0.25*Math.sin(t*0.009+4.7);
}
const ZSTRETCH=1.0;                     // natural wave shape again
let WAVE_DRIFT=0.46;                    // how fast the swell rolls past — climbs slightly as you go
function waveComp(W,x,z,t){
  const u=W.dx*x+W.dz*z*ZSTRETCH;
  const env=ENV_BASE+ENV_SWING*Math.sin(u*W.k*W.ek - t*W.w*W.ek*0.5 + W.ep);
  return W.a*env*Math.sin(u*W.k - t*W.w);
}
function waveH(x,z,t){
  let h=0;
  for(const W of WAVES)h+=waveComp(W,x,z,t);
  return h*waveAmp*swCalm+wakeBump(x,z)+whirlDip(x,z)+setWaveH(x,z);
}
// the long-period part of the sea only — what a floating object actually rides.
// Short chop is filtered out, so buoys glide over the swell instead of vibrating,
// and because they track the big waves they never get buried by a crest.
function swellH(x,z,t){
  let h=0;
  for(let i=0;i<2;i++)h+=waveComp(WAVES[i],x,z,t);
  return h*waveAmp*1.06*swCalm+wakeBump(x,z)+whirlDip(x,z)+setWaveH(x,z);
}
const OCEAN_Z=-90;
let dist=0;

// ---------- GPU ocean ----------
const ZS=1.0;
const glslWaves=WAVES.map(W=>{
  const u=`(${W.dx.toFixed(2)}*p.x+${(W.dz*ZS).toFixed(4)}*p.y)`;
  const ph=`${u}*${W.k.toFixed(3)}-uT*${W.w.toFixed(4)}`;
  const en=`(${ENV_BASE.toFixed(2)}+${ENV_SWING.toFixed(2)}*sin(${u}*${(W.k*W.ek).toFixed(5)}-uT*${(W.w*W.ek*0.5).toFixed(5)}+${W.ep.toFixed(2)}))`;
  // the envelope varies far more slowly than the wave, so the normals treat it as
  // locally constant — visually indistinguishable and much cheaper
  return `e=${en};
h+=${W.a.toFixed(3)}*e*sin(${ph});
dhx+=${W.a.toFixed(3)}*e*${W.k.toFixed(3)}*${W.dx.toFixed(2)}*cos(${ph});
dhz+=${W.a.toFixed(3)}*e*${W.k.toFixed(3)}*${(W.dz*ZS).toFixed(4)}*cos(${ph});`;
}).join('\n');
const oceanUniforms={
  uT:{value:0}, uDist:{value:0}, uAmp:{value:1.35}, uPeak:{value:2.85},
  uWakeZ:{value:0}, uWakeA:{value:0}, uWakeX:{value:0},
  uWhX:{value:0}, uWhZ:{value:0}, uWhA:{value:0},
  uSwA:{value:0}, uSwX:{value:0}, uSwS:{value:1},
  uSun:{value:sunDir}, uLight:{value:1.0},
  uSky:{value:new THREE.Color(0x8fd2f5)},
  uDeep:{value:new THREE.Color(0x0a5e9c)},
  uShallow:{value:new THREE.Color(0x33aede)},
};
const oceanMat=new THREE.ShaderMaterial({
  uniforms:oceanUniforms,
  vertexShader:`
    uniform float uT; uniform float uDist; uniform float uAmp; uniform float uPeak;
    uniform float uWakeZ; uniform float uWakeA; uniform float uWakeX;
    uniform float uWhX; uniform float uWhZ; uniform float uWhA;
    uniform float uSwA; uniform float uSwX; uniform float uSwS;
    varying vec3 vN; varying vec3 vW; varying float vH; varying vec2 vPh;
    varying float vSw; varying float vBrk; varying float vPa; varying float vDx;
    void main(){
      vSw=0.0; vBrk=0.0; vPa=0.0; vDx=999.0;
      vec2 p = vec2(position.x, (-position.y + (${OCEAN_Z.toFixed(1)})) + uDist);
      float h=0.0, dhx=0.0, dhz=0.0, e=1.0;
      ${glslWaves}
      h*=uAmp; dhx*=uAmp; dhz*=uAmp;
      // the jet ski's wake, folded into the same surface
      if(uWakeA>0.001){
        float dz=p.y-uWakeZ;
        float ez=exp(-(dz*dz)/(2.0*${(WK_SIGMA*WK_SIGMA).toFixed(2)}));
        float ax=clamp(1.0-abs(p.x-uWakeX)/${WK_HALF.toFixed(1)},0.0,1.0);
        float ex=ax*ax*(3.0-2.0*ax);
        h   += uWakeA*ez*ex;
        dhz += uWakeA*ex*ez*(-dz/${(WK_SIGMA*WK_SIGMA).toFixed(2)});
        float sg=(p.x-uWakeX)>=0.0?1.0:-1.0;
        float dex=(ax>0.0&&ax<1.0)?(6.0*ax*(1.0-ax))*(-sg/${WK_HALF.toFixed(1)}):0.0;
        dhx += uWakeA*ez*dex;
      }
      // and the whirlpool, dished into the same surface
      if(uWhA>0.001){
        vec2 wd=vec2(p.x-uWhX, p.y-uWhZ);
        float r=length(wd);
        if(r<${WH_R.toFixed(1)}){
          float k=1.0-r/${WH_R.toFixed(1)};
          float k7=pow(k,7.0);
          float f=k*k*(3.0-2.0*k)*(1.0+2.1*k7);
          h -= uWhA*f;
          if(r>1e-4){
            float dsm=6.0*k*(1.0-k);
            float dfdk=dsm*(1.0+2.1*k7)+k*k*(3.0-2.0*k)*14.7*pow(k,6.0);
            float dfdr=dfdk*(-1.0/${WH_R.toFixed(1)});
            dhx -= uWhA*dfdr*(wd.x/r);
            dhz -= uWhA*dfdr*(wd.y/r);
          }
        }
      }
      // The set wave: a wall standing across the lane, steep on the front face and
      // running out to a long shoulder behind the crest. Same analytic-derivative
      // treatment as the others, so the normal is exact and the shader's own foam and
      // specular find the face without being told anything about it.
      if(uSwA>0.0015){
        float d=(p.x-uSwX)*uSwS;
        float f, dfdd;
        if(d<=0.0){
          float k=clamp(1.0+d/${SW_FACE.toFixed(1)},0.0,1.0);
          f=pow(k,3.2);
          dfdd=(k>0.0)?(3.2*pow(k,2.2)/${SW_FACE.toFixed(1)}):0.0;
        } else {
          float k=clamp(1.0-d/${SW_BACK.toFixed(1)},0.0,1.0);
          f=0.34+0.66*k*k*(3.0-2.0*k);
          dfdd=(k>0.0&&k<1.0)?(-0.66*6.0*k*(1.0-k)/${SW_BACK.toFixed(1)}):0.0;
        }
        // The peel, mirroring swPeelB(). p.y carries the scroll so the swell rolls past;
        // the set wave stands still in the world, so its z is p.y with the scroll removed.
        // This is the first term the set wave has ever contributed to dhz — every earlier
        // version was constant along z, so the wave's normal never tilted down the line at
        // all. Without it the collapse behind the break would light as though it were flat.
        float wz=p.y-uDist;
        float ub=clamp((wz-${SW_BRK.toFixed(1)})/${SW_COLL.toFixed(1)},0.0,1.0);
        float b=ub*ub*(3.0-2.0*ub);
        float dbdz=(ub>0.0&&ub<1.0)?(6.0*ub*(1.0-ub)/${SW_COLL.toFixed(1)}):0.0;
        float m=1.0-0.55*b;
        h   += uSwA*m*f;
        dhx += uSwA*m*dfdd*uSwS;
        dhz += uSwA*(-0.55*dbdz)*f;
        // How far the lip has thrown at this z, mirroring swPeelA() — the same curve the
        // curl's geometry is built from. The face needs it because the whitewater at the
        // foot of the barrel is caused by the lip landing on it, so it can only exist where
        // there IS a lip: none out on the unbroken wall, all of it under the thrown section.
        float ua=clamp((wz-(${(SW_BRK-SW_PEEL).toFixed(1)}))/${(SW_PEEL-SW_HOLD).toFixed(1)},0.0,1.0);
        vPa=ua*ua*(3.0-2.0*ua);
        // Metres out from the crest, negative on the face. The face profile f is a cubic,
        // so it crushes everything past about seven metres out into a sliver of its range —
        // useless for placing something that lives OUT IN FRONT of the wave, which the
        // broken water does. This is the same quantity in metres.
        vDx  = d;
        vSw  = f;                  // 0 at the foot of the face, 1 along the crest
        vBrk = b;                  // 0 ahead of the break, 1 in the whitewater behind it
      }
      // phase of the two main swells — constant along a moving crest
      vPh = vec2( (0.00*p.x + 1.00*p.y)*0.190 + uT*0.013,
                  (0.60*p.x + 0.80*p.y)*0.310 + uT*0.019 );
      vec3 displaced = vec3(position.x, position.y, h);
      vN = normalize(vec3(-dhx, 1.0, -dhz));
      vH = h;
      vec4 wp = modelMatrix * vec4(displaced,1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader:`
    uniform vec3 uSun; uniform vec3 uSky; uniform vec3 uDeep; uniform vec3 uShallow;
    uniform float uT; uniform float uDist; uniform float uAmp; uniform float uPeak;
    uniform float uLight; uniform float uSwA;
    varying vec3 vN; varying vec3 vW; varying float vH; varying vec2 vPh;
    varying float vSw; varying float vBrk; varying float vPa; varying float vDx;
    // Value noise with a rotation between octaves. The rotation is the point: it
    // stops every octave lining up with the same two axes, which is what made the
    // old sine-product foam tile into a visible net.
    float hash21(vec2 p){
      p=fract(p*vec2(123.34,345.45));
      p+=dot(p,p+34.345);
      return fract(p.x*p.y);
    }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      f=f*f*(3.0-2.0*f);

const STATS_KEY='surfStats1';

// called once when the page opens: this is the login, and the streak lives or dies here
function noteOpen(){
  const t=dayStamp(new Date());

  if(stats.last!==t){
    const gap=stats.last?daysApart(stats.last,t):999;
    stats.streak = gap===1 ? stats.streak+1 : 1;   // a missed day starts the count over
    stats.bestStreak=Math.max(stats.bestStreak,stats.streak);

let runDist0=0, runSecs=0, bestDistBeat=false;

  const d=Math.max(0,dist-runDist0);

// Every board bar Astro's own is lofted from a spec rather than modelled: an outline

// makes them dense — a little over ten thousand triangles each — and it means a new

  // much longer span of the board — so a narrow-nosed board finished as a thin vertical

  // narrow one in a small round tip, and neither comes to a point.

  // It used to be the latter — the outline held the nose's own width for the first sixth
  // of the board and only then blended out to the curve, which left a parallel-sided
  // neck at each tip with a shoulder where it flared. Measured on Tiki Mal, the rate at

  // climbed again to 4.9: it stops widening, holds, and flares. That dip-and-peak is the
  // nipple on the end of the board. A real outline widens fastest at the tip and slows
