  }
  const A=armFrontJ,B=armBackJ;
  A.sh.rotation.x=ease(A.sh.rotation.x,shF[0]+armSpread,dt,10);
  A.sh.rotation.y=ease(A.sh.rotation.y,shF[1]+Math.sin(tNow*1.9)*0.10,dt,10);
  A.sh.rotation.z=ease(A.sh.rotation.z,shF[2],dt,10);
  A.el.rotation.x=ease(A.el.rotation.x,elF[0]+Math.sin(tNow*2.6)*0.09,dt,10);
  B.sh.rotation.x=ease(B.sh.rotation.x,shB[0]-armSpread,dt,10);
  B.sh.rotation.y=ease(B.sh.rotation.y,shB[1]-Math.sin(tNow*1.9+0.8)*0.10,dt,10);
  B.sh.rotation.z=ease(B.sh.rotation.z,shB[2],dt,10);
  B.el.rotation.x=ease(B.el.rotation.x,elB[0]+Math.sin(tNow*2.6+1.4)*0.09,dt,10);
  if(heliPose>0.02){
    const h=heliPose;
    // turn to face the nose and go flat over it — his stance is side-on to the board the
    // rest of the time, so the turn is most of what sells him lying along it
    // A positive turn about X tips his top backwards, which laid him face-UP staring at
    // the sky and travelling tail-first. Negative puts his chest on the deck and his face
    // over the nose, which is the whole pose.
    pug.rotation.y=STANCE_ROT+(switchRide?Math.PI:0)+(-STANCE_ROT)*h;
    // Flat ALONG the deck. At 0.95 he was still half upright, which read as perched on
    // the nose leaning over it rather than lying on the board; the body goes down to the
    // deck and the head comes up instead, which is how anyone actually lies on one.
    pug.rotation.x=-1.36*h;
    pelvis.position.y+=0.13*h;                       // down on the deck, not hovering over it
    // and he hauls himself UP the board as he pulls, so his face finishes at the tip
    // rather than over the middle of it
    // forward on the board without hanging off the end of it
    pug.position.z=PUG_Z0-0.92*h;
    pug.position.x=PUG_X0;
    const straight=(j,base)=>{ j.rotation.x=j.rotation.x*(1-h)+base*h; };
    straight(legFrontJ.hip,-0.30); straight(legFrontJ.knee,0.34); straight(legFrontJ.ankle,-0.20);
    straight(legBackJ.hip ,-0.30); straight(legBackJ.knee ,0.34); straight(legBackJ.ankle ,-0.20);
    headJ.rotation.x=headJ.rotation.x*(1-h)+0.66*h;    // chin up off the deck, eyes past the tip
    headJ.rotation.y*=1-h;
  } else if(pug.rotation.x!==0){ pug.rotation.x=0; pug.position.set(PUG_X0,0,PUG_Z0); applyStance(); }
  if(lureMat){
    const flick=0.86+Math.sin(tNow*3.1)*0.08+Math.sin(tNow*7.9)*0.06;
    lureMat.emissiveIntensity=(0.30+dayT*3.1)*flick;
    lureGlow.material.opacity=(0.06+dayT*0.42)*flick;
    lureGlow.scale.setScalar(0.85+dayT*0.5);
  }
  updateLimbs();      // the visible limb is swept from wherever the joints ended up
}

// Astro tips up onto his front paws. The rig turns over about the deck line, so the
// arms have to be thrown overhead first — flipped, they then reach down to the deck
// and take his weight with his head just above them. How far to lift him afterwards
// is measured off the posed rig rather than guessed, so it lands on his paws exactly.
const HAND_POSE=[
  // [joint, axis, angle in the upright frame]
  ['aF','sh','x',-2.62],['aF','el','x',-0.18],['aF','sh','z', 0.30],['aF','sh','y',0],
  ['aB','sh','x',-2.62],['aB','el','x',-0.18],['aB','sh','z',-0.30],['aB','sh','y',0],
  ['lF','hip','x', 0.16],['lF','knee','x',-0.12],['lF','ankle','x',0.34],['lF','hip','z',-0.15],['lF','hip','y',0],
  ['lB','hip','x',-0.16],['lB','knee','x',-0.12],['lB','ankle','x',0.34],['lB','hip','z', 0.15],['lB','hip','y',0],
  ['hd',null,'x',-0.92],
];
function _handJoint(tag,sub){
  const g={aF:armFrontJ,aB:armBackJ,lF:legFrontJ,lB:legBackJ}[tag];
  return tag==='hd'?headJ:g[sub];
}
function applyHandPose(k){
  for(const [tag,sub,ax,to] of HAND_POSE){
    const j=_handJoint(tag,sub);
    j.rotation[ax]=j.rotation[ax]*(1-k)+to*k;
  }
}
let HAND_LIFT=null;
function measureHandLift(){
  const keep=HAND_POSE.map(([t,sb,ax])=>_handJoint(t,sb).rotation[ax]);
  const rx=pug.rotation.x, py=pug.position.y;
  const box=o=>{
    o.updateMatrixWorld(true);
    const inv=new THREE.Matrix4().copy(o.matrixWorld).invert(), b=new THREE.Box3(), m=new THREE.Matrix4();
    o.traverse(c=>{ if(!c.isMesh||!c.geometry.attributes.position)return;
      const g=c.geometry.clone(); g.applyMatrix4(m.multiplyMatrices(inv,c.matrixWorld));
      g.computeBoundingBox(); b.union(g.boundingBox); });
    return b;
  };
  pug.rotation.x=0; pug.position.y=0;
  const stand=box(pug).min.y;                 // where his feet rest when he is upright
  applyHandPose(1);
  const reach=box(pug).max.y;                 // how far the raised paws reach above the deck
  pug.rotation.x=rx; pug.position.y=py;
  HAND_POSE.forEach(([t,sb,ax],i)=>{_handJoint(t,sb).rotation[ax]=keep[i];});
  // turning him over sends that reach the other way, so lifting by the two together
  // puts his paws exactly where his feet were
  return stand+reach+0.10;                    // a little daylight so his chin clears the deck
}
function updateHandstand(dt,carve){
  const want=(handOn&&!hanging&&!wipe)?1:0;
  handT+=(want-handT)*Math.min(1,dt*(want?7:9));
  if(handT<0.002&&!want){
    if(handT!==0){handT=0;pug.rotation.x=0;pug.position.y=0;}
    return;
  }
  if(HAND_LIFT===null)HAND_LIFT=measureHandLift();
  applyHandPose(handT);
  pug.rotation.x=handT*Math.PI;
  pug.position.y=handT*HAND_LIFT;
  if(handT>0.55){
    // Anthony held this the whole way down, so it pays for the first few seconds and
    // then stops paying: a handstand is a trick, not a stance.
    handHold+=dt;
    const tire=Math.max(0,1-Math.max(0,handHold-3.4)/2.6);
    const rate=(airborne?46:26)*(1+Math.min(1,Math.abs(carve))*0.4)*tire;
    score+=rate*dt; handPts+=rate*dt;
    // hands are not feet: lay it right over on the rail and he goes over the front,
    // and the longer he has been up there the less it takes
    if(!airborne&&Math.abs(carve)>0.72-Math.min(0.34,handHold*0.05)){
      handRisk+=dt*(1+handHold*0.30);
      if(handRisk>0.55){handRisk=0;startWipeout('foam');return;}
    } else handRisk=Math.max(0,handRisk-dt*1.6);
    // and past nine seconds his arms simply give out
    if(handHold>9.0){ startWipeout('foam'); msg('ARMS GAVE OUT!'); return; }
  } else handHold=Math.max(0,handHold-dt*2.2);
  if(!want&&handPts>0){
    if(handPts>=30){
      const p=Math.round(handPts);
      score+=p*0.35; boost=Math.min(16,boost+3.5);
      msg(`HANDSTAND! +${Math.round(p*1.35)}`);
      noteTrick('handstand',handSrc);
    }
    handPts=0;
  }
}

// ---------- update ----------
function update(dt){
  tNow+=dt;
  // Before anything asks how high the water is. The whole set piece is a term in the
  // height field, so it has to be current for this frame or the board floats on last
  // frame's wave — which on a face that climbs seven units in five seconds is visible.
  updateSetWave(dt,speed);
  // Outside the barrel the sea comes back, eased, so the calm arrives and leaves with the
  // wave instead of the whole ocean snapping flat the instant the phase changes.
  if(swPh!==SWP.RIDE)swCalm+=(1-swCalm)*Math.min(1,dt*0.9);
  stepSmoke(dt);
  // The HUD reads mph as eff*0.62, so 16.2 is 10 and 113 is 70. It never drops below
  // the first and never passes the second, and climbs the whole way between rather
  // than being most of the way there inside the first kilometre.
  speed=Math.min(100+BS.top,(16.2+dist/210)*BS.speed+BS.top);

  // momentum carving
  // Fore and aft is gone. leanW is kept at rest so everything that consulted it —
  // trim, the board's pitch, how deep the rail digs, where he stands — simply reads
  // as neutral, and the ride is steered left and right alone.
  const wt=0;
  let sx=steer+(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);
  sx=Math.max(-1,Math.min(1,sx));
  vx+=sx*55*BS.turn*dt;
  // Grip. This one constant being shared is most of why every board slid the same: it sets
  // both how far the board runs across the face and how long it takes to stop. A gun holds
  // its line and travels about ten a second; a fish lets go and runs to twenty-five.
  vx-=vx*3.4*BS.grip*dt;
  px+=vx*dt;
  if(px<-17){px=-17;vx=0;}      // slide out to the far lanes and stop there
  if(px>17){px=17;vx=0;}
  // Inside the barrel the lane stops being a line across the water and becomes the tube's
  // own circumference. Steering no longer slides you left and right along a face — it
  // carries you round the ring: up the face, over the roof, down the curtain and back.
  //
  // The RING itself cannot throw you off: it is a closed loop of water and the board is
  // welded to it the whole way round, upside down included, at any speed, so hanging in the
  // roof is a thing you can just do rather than something you have to earn and can lose.
  // Everything else in the game still applies in here — a blown landing and a drum to the
  // chest end the run the same as they do anywhere else. Softening those for the tube alone
  // was worse than either rule: a trick you plainly blew simply evaporated, and the only
  // thing that ever punished you was a board quietly snapping several drums later.
  const wasTube=swTubeRide;
  swTubeRide=false; swOnLip=false;
  if(swPh===SWP.RIDE&&swCurlA>0.55){
    const G=swTubeGeom();
    // Hysteresis, for the same reason: engage on a bore worth riding, and hold on well below
    // that. A single threshold on a radius the rider's own position can move is a switch that
    // chatters.
    if(G.r>(wasTube?0.8:1.6)){                    // only where the wave is actually hollow
      swTubeRide=true;
      // Join the ring wherever he already is, rather than teleporting him to the bottom of
      // it. The angle is read back OUT of his current position on the first frame — the
      // inverse of the placement below — so the takeover is invisible: he is already on the
      // ring at the instant it takes over, and only then starts moving around it.
      if(!wasTube){
        swAng=Math.atan2((px-G.cx)*swS, -(py-G.cy));
        swAngV=vx*swS/Math.max(1.5,G.r);          // and carries the speed he had across
      }
      // Times swS, and it was missing. Increasing swAng carries you round toward +swS in x,
      // so on a wave breaking the other way a drag to the right sent the rider left — the
      // takeover a few lines up already reads swAngV out of vx WITH the swS factor, which is
      // the same convention, so the input was the odd one out. Right on the glass is right
      // on the screen whichever way the wave is breaking.
      swAngV+=sx*swS*3.4*BS.turn*dt;
      swAngV-=swAngV*1.7*dt;
      swAngV=Math.max(-3.6,Math.min(3.6,swAngV));
      const was=swAng;
      const lipStart=Math.PI-SW_ALPHA;
      const lipSpan=SW_SWEEP*(0.30+0.70*swPeelA(pz));
      const WZ2=dist*WAVE_DRIFT+pz;
      // The ring's RADIUS, angle by angle: fire a ray out from the tube's axis and stop at the
      // first water it meets — the lip inside its own arc, the curtain falling off its tip,
      // the sea under both. One rule for the whole circle. Treating the lip's sector and the
      // open sector as two different rules was the failure only a real ride shows: at the
      // boundary the target jumped several metres and the board eased across it through open
      // air, 24% of frames more than a metre off any surface, worst 3.50 m. Every warped test
      // passed, because an angle you set and let settle never crosses a boundary at speed.
      //
      // Two attempts at replacing this with a pure circle are recorded because both looked
      // obviously right and both measured badly: a circle at the arc's radius leaves him a
      // metre and a half over the flat water at the bottom of the open sector, and one shrunk
      // to meet "the water below the axis" collapses to nothing, because the height field at
      // the axis's own x is the WAVE, seven metres of it, not the trough. The section of a
      // barrel is a tall almond, not a circle, and the surface has to be found, not assumed.
      //
      // Reach is 40 m — at 24 a ray fired toward the shoulder could leave over flat water
      // without ever dipping below it, report nothing found, and drop the board out into the
      // air at that one angle.
      // The curtain falling off the tip, mirrored from the shell (SW_FALL). It hangs straight
      // down in the shell's frame, so in the world it is tilted by the same pitch the mesh is
      // given while the lip is still throwing over. Anchored at the ring's own tip — radius
      // G.r at the end of the arc — so the radius coming off the lip onto the fall is
      // continuous by construction rather than by tuning.
      const thEnd=lipStart+lipSpan;
      const tipX=G.cx+swS*Math.sin(thEnd)*G.r, tipY=G.cy-Math.cos(thEnd)*G.r;
      const fz=swPitch(), fdx=Math.sin(fz), fdy=-Math.cos(fz);
      const fallL=SW_FALL*swPeelA(pz)*(G.r+0.35);
      const surfAt=(th,detail)=>{
        const rl=((th-lipStart)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
        const onArc=rl<=lipSpan;                            // on the lip: the arc itself
        const sx=swS*Math.sin(th), sy=-Math.cos(th);
        // Where this ray crosses the falling curtain, if it does at all. Solved rather than
        // marched: it is one straight segment, and a march would round the very corner this
        // exists to remove.
        let curt=Infinity;
        if(fallL>0.01){
          const det=sx*(-fdy)-sy*(-fdx);
          if(Math.abs(det)>1e-6){
            const rx=tipX-G.cx, ry=tipY-G.cy;
            const t=(rx*(-fdy)-ry*(-fdx))/det, s=(sx*ry-sy*rx)/det;
            if(t>0.4&&s>=0&&s<=fallL)curt=t;
          }
        }
        // 132 steps, not 44. At 44 the step was 0.90 m, and a ray fired nearly parallel to
        // the face could step clean over the water and report it metres further out: sampled
        // round the ring, single angles read 4.95 m between neighbours of 3.09 m. Those spikes
        // are a phantom corner in themselves, and they feed straight into the pacing below.
        let sea=Infinity, lo=0.4, hi=40.0, found=false;
        const ST=(40.0-0.4)/132;
        for(let i=1;i<=132;i++){
          const t=0.4+ST*i;
          if(G.cy+sy*t<=waveH(G.cx+sx*t,WZ2,waveClock)){ hi=t; lo=t-ST; found=true; break; }
        }
        if(found){
          for(let i=0;i<6;i++){
            const mid=(lo+hi)*0.5;
            if(G.cy+sy*mid<=waveH(G.cx+sx*mid,WZ2,waveClock))hi=mid; else lo=mid;
          }
          sea=hi-0.30;                           // less the board's draft off whatever it found
        }
        // The weld. The lip grows OUT of the crest — SW_ALPHA is matched to the face's own
        // slope there — so at the arc's start the water and the arc are the same surface, and
        // that boundary is continuous by construction. A ray fired just below it runs almost
        // tangent to the crest, though, and on a frame where the swell dips it passes clean
        // over and finds the back of the wave instead: measured, one angle read 8.18 m against
        // an arc at 5.41, a 2.77 m phantom cliff at the one join that cannot actually have one.
        // Inside that band the water cannot be further out than the lip welded to it.
        const below=((lipStart-th)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
        if(below<0.45)sea=Math.min(sea,G.r);
        if(detail)return{arc:onArc?G.r:Infinity,curt,sea};
        if(onArc)return G.r;
        // Whichever comes first out from the axis — the falling curtain, or the sea under it.
        // Both are real water and the ride is on the nearer one, which is also what makes the
        // handover between them continuous: they agree exactly where they cross.
        const v=Math.min(sea,curt);
        return Math.max(0.5,isFinite(v)?v:G.r);
      };
      // Paced by DISTANCE ALONG THE WALL, not by angle.
      //
      // This is the other half of the corner, and the half that no amount of reshaping the
      // water could have fixed. The tube's section is not a circle and cannot be made into
      // one: the roof is three metres from the axis and the trough under the mouth is five
      // and a half, because that is where the water actually is. Anywhere the radius climbs
      // steeply — the curtain most of all, which falls almost straight out from the axis and
      // so covers four metres of wall in a tenth of a radian — a constant angular rate is a
      // constant rate through a LOT of wall, and the rider is fired along it. That is the
      // "shoots you right and then up, like a ninety degree angle": not a corner in the
      // geometry so much as a corner in the clock.
      //
      // |dP/dth| is hypot(r, dr/dth); dividing by it turns the angular rate into a steady
      // speed over the surface, so a steep stretch takes the time its length deserves. The
      // stretch is capped so a bad sample can slow him but never park him.
      const _e=0.06;
      const _dr=(surfAt(swAng+_e)-surfAt(swAng-_e))/(2*_e);
      const _rN=Math.max(1.5,surfAt(swAng));
      const stretch=Math.max(1,Math.min(5,Math.hypot(_rN,_dr)/_rN));
      swAng+=swAngV*dt/stretch;
      // A whole turn pays, and it is counted on the crossing rather than by rounding, so
      // rocking back and forth over the top does not farm it.
      if(Math.floor(swAng/(Math.PI*2))!==Math.floor(was/(Math.PI*2))){
        swLoops++; score+=450; swPts+=450; msg('LOOP THE TUBE! +450');
      }
      const rel=((swAng-lipStart)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      const onLip=rel<=lipSpan; swOnLip=onLip;
      const ux=swS*Math.sin(swAng), uy=-Math.cos(swAng);
      swSurfAt=surfAt; swRingInfo={cx:G.cx,cy:G.cy,r:G.r,lipStart,lipSpan,ang:swAng,WZ2,
                                   tipX,tipY,fallL,swS,pz,pa:swPeelA(pz),fz};
      // Straight off the surface at his own angle.
      //
      // The corner where the lip's arc ended and the sea began is gone, and it took two
      // changes rather than one: the lip now falls a curtain into the water so there IS a
      // surface across that gap, and the angle is paced by distance so the steep part of it
      // is not crossed at ten times the speed of the rest. Four attempts that treated it as
      // one problem are recorded because all four are plausible and all four measured worse:
      //   damped in time    rounds it, and lags — the board then rides up to a metre off the
      //                     surface whenever he is MOVING, which is the thing the ring exists
      //                     to prevent (0.56 m worst -> 1.58 m)
      //   averaged in angle rounds it without lag, and smears the lip's own radius toward the
      //                     sea's for a third of a radian either side of the boundary, which
      //                     puts him a metre off the mesh he is supposedly riding (1.18 m)
      //   a pure circle     at the arc's radius: 1.5 m over the water at the bottom
      //   a shrunk circle   to "the water below the axis": collapses, see above
      // The kink is real and worth fixing; neither of these is the fix, and shipping either
      // trades a corner you can see for a board that is not on the water.
      const rHit=surfAt(swAng);
      // Smooth the RADIUS, never the position.
      //
      // Easing the position toward a target that is travelling round a circle is the bug
      // behind every "floating in the middle of the tube" report, and it is a property of
      // first-order lag rather than an error in the geometry: a follower chasing a point
      // around a circle always cuts inward, and the faster the point goes the more it cuts.
      // Measured mid-ride, the ring's radius was 6.60 and the lip sat at 6.9-7.2 while the
      // rider orbited at 3.4-4.7 — three metres inside the wall, in open air. Every static
      // test passed, because an angle you set and let settle has no angular velocity to cut
      // against, which is why this survived four rounds of fixes.
      //
      // The angle is his input and is applied exactly. Only the radius is smoothed, which is
      // all the smoothing was ever for: the surface is sampled from a moving sea and breathes
      // with the swell, and that breathing should not reach the board as a shake.
      if(!wasTube||!isFinite(swRad)){ swRad=Math.hypot(px-G.cx,py-G.cy); swRadV=0; swPipeAir=false; }
      if(swPipeAir){
        // A hard ceiling on the air. The landing test is "the radius has come back out to the
        // surface", and the surface moves — round the arc, with the swell, with the peel — so
        // a rider still turning while he is up there can chase it and never quite meet it.
        // Measured stuck for seconds. The arc's own flight is about 1.1 s, so 1.4 is already
        // longer than any honest air and short enough that a stuck one is over quickly.
        swAirT+=dt;
        if(swAirT>1.4){ swRad=rHit; swRadV=0; swPipeAir=false; swPipeLand(); }
        else {
          // Off the wall and across the tube. A pipe has its own gravity: whichever way is
          // out. Pop inward, coast, and get pulled back to the wall — at the roof that means
          // dropping toward the axis and rising back into it, which is the air a skater gets
          // at the top of a full pipe. He cannot leave the barrel doing it, because all that
          // changes is his distance from the axis.
          swRadV+=SW_PIPE_G*dt;
          swRad+=swRadV*dt;
          if(swRadV>0&&swRad>=rHit){ swRad=rHit; swRadV=0; swPipeAir=false; swPipeLand(); }
        }
        airborne=true;
      } else {
        // Fast, because what it is smoothing is now the sea's own breathing rather than a
        // target that leaps: at the edge of the lip's arc the surface really does step from
        // the roof out to the water, and a slow radius crosses that step through the air.
        swRad+=(rHit-swRad)*Math.min(1,dt*(wasTube?16:4));
        airborne=false;
      }
      px=G.cx+ux*swRad;
      // The sea is asked about the point he ENDS UP at, not the one the ray aimed for. While
      // the radius is still catching up those are different places, and asking at the wrong
      // one left him riding a metre and a half over the water at the bottom of the ring.
      py=Math.max(G.cy+uy*swRad, waveH(px,WZ2,waveClock)+0.30);
      vx=0; vy=0;              // airborne is set by the pipe-air branch above
    }
  } else if(swPh!==SWP.RIDE){ swAng=0; swAngV=0; }
  if(!swTubeRide&&swPipeAir){ swPipeAir=false; swRadV=0; }   // the wave ended mid-air
  const carve=Math.max(-1,Math.min(1,vx/9));
  leanW+=(wt-leanW)*Math.min(1,dt*6);
  // A rigid 5m hull does not follow one point on the water. Sample it under the
  // nose, the tail and both rails; the board then rests on whatever is highest
  // beneath it and lies along that surface, the way a real board sits on a face
  // instead of slicing through the crest at its ends.
  const WZ=dist*WAVE_DRIFT;
  const hC=waveH(px,WZ+pz,waveClock);
  const hN=waveH(px,WZ+pz-2.55,waveClock);      // under the nose
  const hT=waveH(px,WZ+pz+2.55,waveClock);      // under the tail
  const hL=waveH(px-0.58,WZ+pz,waveClock);
  const hR=waveH(px+0.58,WZ+pz,waveClock);
  const hullPitch=Math.atan2(hN-hT,5.10);       // nose high on a climb, down on a drop
  const hullRoll =Math.atan2(hR-hL,1.16);
  // dropping down a wave face accelerates you, climbing one costs a little
  const faceDrive=(hT-hN)*3.8;
  // leaning is a real throttle now: forward drives hard, back scrubs hard
  const trim=(leanW>=0 ? leanW*16.0 : leanW*19.0) + faceDrive;
  // Glide: how long the speed you earned stays with you. A log carries it most of the way
  // down the line; a small high-rockered board has spent it by the next section.
  boost=Math.max(0,boost-dt*3.0/BS.glide);
  const eff=Math.max(16.2,Math.min(113+BS.top,speed+Math.abs(vx)*0.3+trim+boost));   // 10 mph floor, 70 ceiling
  lastEff=eff;
  dist+=eff*dt;
  // No score for covering ground. Distance is its own number with its own record, and
  // paying it into the trick score too meant the score was mostly a second, worse
  // distance readout: 0.6 a metre came to six hundred points over a kilometre, several
  // times what the tricks themselves were worth. Distance still pays puka on its own.
  sprayCd=Math.max(0,sprayCd-dt);

  // Where the hull wants to float. It leans on the highest water beneath it so a
  // crest cannot slice through the ends, but it answers to the mean under the whole
  // length as well, and it displaces water rather than resting on top of it — a
  // loaded board sits down in the surface, and harder you carve, the deeper the
  // inside rail is driven in.
  const hHigh=Math.max(hC,hN,hT,(hL+hR)*0.5);
  const hMean=hC*0.34+hN*0.20+hT*0.20+hL*0.13+hR*0.13;
  // Running straight it floats, deck dry, the way a board actually does; only a real
  // turn drives the inside rail under, and there is a dead zone so holding a line
  // never quietly buries it.
  const dig=Math.max(0,Math.abs(carve)-0.20)/0.80;
  const railDig=Math.min(0.17,dig*dig*0.17+Math.max(0,leanW)*0.055);
  // Float: a thick board rides up on the surface, a thin one sits down in it.
  const waterY=hHigh*0.88+hMean*0.12+0.05-railDig+(BS.float-1)*0.30;
  const prevWaterY=_prevWaterY; _prevWaterY=waterY;
  _buoy={waterY:+waterY.toFixed(3),railDig:+railDig.toFixed(3),hHigh:+hHigh.toFixed(3),
         hMean:+hMean.toFixed(3),float:BS.float};
  rideY=waterY;

  // A wall this size falls away under the board fast enough to throw him off its
  // front — ballistic, but not flagged airborne, so the launch then fires while he
  // is already dropping and has to reverse him. While one is on him the hull stays
  // stuck to the face instead: a much harder spring, and far more daylight needed
  // under the board before it counts as air. The crest is then the only way off.
  wakeGrace=Math.max(0,wakeGrace-dt);
  // A wake cannot pick him up off the wall of a barrel. The ring owns his position while he
  // is on it, so a launch here would fight it and win only briefly — throwing him out of a
  // wave the rules say he cannot leave.
  const onWake=wkA>2.5&&skiWake&&skiWake.z<pz+1.0&&!swTubeRide;
  // Riding UP the face, before the crest reaches him. He used to come off the rising
  // water here, go ballistic under full gravity, and be falling hard by the time the
  // launch fired — which is why it read as a drop and then a bounce. He stays welded
  // to the surface the whole way up now, so the only launch is the one at the top.
  const wakeRide=onWake&&skiWake&&!skiWake.hit;

  if(hanging){
    py+=(5.4-py)*Math.min(1,dt*2.4);   // towed above the water, high enough to throw tricks
    px+=(plane.position.x-px)*Math.min(1,dt*1.5);
    score+=60*dt;
    speed=Math.min(60,speed+14*dt);
    if(!planeActive||plane.position.z>2)releaseRope(false);
  } else if(heliPh>=0){ heliStep(dt,waterY);           // the helicopter drives him itself
  } else if(swTubeRide){
    // The tube put him exactly where he belongs on the ring already. Nothing more to do —
    // and in particular no float test, because up in the roof he IS above the water and the
    // ordinary code would call that air and drop him out of the wave.
  } else if(airborne||(!wakeRide&&py>waterY+0.55)){    // clear of the water
    vy-=(wakeAir?6.0:20)*dt;py+=vy*dt;      // off a wave that size, the way down is long
    if(py<=waterY&&wakeGrace<=0){
      const impact=Math.min(1.6,Math.max(0,-vy)/15);
      if(airborne){
        splash(px,waterY,0,20+impact*40);
        pushTrail(px,waterY,0.5,0.95+impact*1.0);
        shake=Math.max(shake,impact*0.55);
        const anySpin=spinRot>0.4||flipRot>0.4||pitchRot>0.4;
        if(grabOn&&(spinRot>0.4||flipRot>0.4||grabPts>40)){
          // still holding the rail when you touch down
          carrySpin=spinHeld?SPIN_RATE:0; carryFlip=flipHeld?FLIP_RATE:0;
          settleTricks(false,true);startWipeout('foam');return;
        }
        if(anySpin){
          // Yaw only has to finish on a half turn — a 180 puts the board under him just
          // as squarely as a 360 does, he is simply facing the other way afterwards. The
          // flip and roll axes still have to come all the way round; you cannot land
          // upside down. The window here is wider than the trick's own timing window,
          // which is what the leniency is.
          const offS=Math.abs(((spinRot+Math.PI/2)%Math.PI)-Math.PI/2);
          const offF=Math.max(Math.abs(((flipRot+Math.PI)%(Math.PI*2))-Math.PI),
                              Math.abs(((pitchRot+Math.PI)%(Math.PI*2))-Math.PI));
          if(offS<0.78&&offF<0.62){
            if(Math.round(spinRot/Math.PI)%2!==0){ switchRide=!switchRide; applyStance();
              waveT=WAVE_DUR;                       // half a turn: he ends up facing us
              msg(switchRide?'SWITCH!':'BACK TO REGULAR!'); }
            settleTricks(true); }
          else {
            // he goes in exactly as he was: same attitude, still turning the same way
            carrySpin=spinHeld?SPIN_RATE:0; carryFlip=flipHeld?FLIP_RATE:0;
            settleTricks(false,true); startWipeout(offF>=0.62?'under':'land'); return;
          }
        } else if(grabOn){ settleTricks(false,true); startWipeout('foam'); return; }
      }
      airborne=false;wakeAir=false;
      // it does not stop dead on the surface: it keeps driving down, buries itself,
      // and the water throws it back — the harder the landing, the deeper it goes
      vy*=0.34;
      player.rotation.set(0,0,0);
    }
  } else {
    // Buoyancy as a spring the hull works against, not a rail it slides along. It
    // plunges when the water drops away and rebounds when it comes back, so the board has
    // weight instead of hovering on the surface.
    //
    // Damped against the SURFACE's motion rather than against the world. A spring damped
    // against the world always lags a face building underneath it, and the lag is not a
    // wobble but a steady offset: measured climbing one, the board sat as much as 0.73 m
    // UNDER the drawn water and rode 0.49 m above it on the way back down — "water and board
    // interaction is weird, water shouldn't overlap too much". Feeding the surface's own rate
    // of rise in means the spring only has to correct the DIFFERENCE between him and it, so
    // every bit of the weight survives and the burial does not.
    const wDot=isFinite(prevWaterY)?Math.max(-14,Math.min(14,(waterY-prevWaterY)/Math.max(1e-3,dt))):0;
    vy+=((waterY-py)*(onWake?110:56) - (vy-wDot)*(onWake?17:10.4))*dt;
    vy=Math.max(-24,Math.min(24,vy));
    py+=vy*dt;
    if(py<waterY-0.45){py=waterY-0.45;vy=Math.max(vy,0);}     // and never buries itself
    if(vy<-5.5&&Math.random()<dt*26)splash(px+(Math.random()-0.5)*0.8,py+0.15,-0.6,2);
  }
  // Run up the kicker rather than being teleported off it. His height is taken from
  // the ramp's own curve, and the speed that gives him vertically is simply how fast
  // that surface is rising underneath him — so a fast approach launches him harder,
  // the lip angle decides the arc, and there is no scripted jump anywhere in it.
  let ramped=null;
  if(!hanging&&!wipe){
    for(const o of obstacles){
      if(!o.userData.ramp)continue;
      const local=pz-o.position.z, RL=o.userData.rampL;
      const t=(RL-local)/(2*RL);
      if(t<0||t>1)continue;
      if(Math.abs(px-o.position.x)>o.userData.rampW+BOARD_HALF_W*0.6)continue;
      const sy=o.position.y+o.userData.rampH*Math.pow(t,o.userData.rampP);
      if(py>sy+1.4)continue;                       // clearing it in the air
      ramped={o,t,sy};
    }
  }
  if(ramped){
    const prev=py;
    // it can only ever lift him. The foot of a kicker floats a little under the
    // waterline, and taking his height from it outright dropped him into it as he
    // arrived — a step down before the climb.
    py=Math.max(py,ramped.sy);
    const lifted=ramped.sy>prev-0.05;
    vy=Math.min(30,Math.max(vy,(py-prev)/Math.max(1e-3,dt)));
    airborne=false;wakeAir=false;
    const P=ramped.o.userData.rampP, H=ramped.o.userData.rampH, RL=ramped.o.userData.rampL;
    // The exit speed taken from the ramp's own curve rather than from how far he
    // happened to move between two frames. That measurement is frame-rate noise as
    // much as anything, which is why the same kicker could throw a big jump or barely
    // lift him. dy/dt at the lip is H*P*t^(P-1) over the ramp's length, times how fast
    // it is coming at him.
    rampExitV=H*P*Math.pow(Math.max(1e-3,ramped.t),P-1)/(2*RL)*Math.max(8,lastEff);
    rampPitchT=lifted?Math.atan(H*P*Math.pow(Math.max(1e-3,ramped.t),P-1)/(2*RL)):0;
    if(!ramped.o.userData.used&&ramped.t>0.72){
      ramped.o.userData.used=true;
      score+=50;boost=Math.min(16,boost+4);msg('RAMP! +50');
      splash(px,py-0.2,pz+1.2,10,0x9ff3ea);
    }
    onRampO=ramped.o;
  } else if(onRampO){
    // off the lip with what the ramp gave him, and never with less than a real jump
    onRampO=null;airborne=true;
    vy=Math.max(vy,Math.min(28,rampExitV),RAMP_MIN_VY);
    rampExitV=0;
  } else rampPitchT=0;
  // The height gate is meaningless on the ring, so pipe air stands in its own right. Out on
  // the flat, "clear of the water" is a height above it; inside a tube it is a distance from
  // a wall that might be over your head — at the roof he is twelve metres up and a foot off
  // the water he is riding, and at the bottom of the ring a good pop is barely a metre. The
  // gate as written let the trick buttons light only at the very top of the ring.
  trickReady=(airborne&&(swPipeAir||py>waterY+0.8))||hanging;   // you can trick while being towed
  // the pad stays put for the whole run — it used to blink out between leaving the
  // water and reaching trick height, which on every small jump read as a glitch.
  // Every trick jumps for you off the water anyway, so all five are always live.
  trickBar.classList.remove('hidden');
  // the button lights while that axis is squared up — this is what teaches the timing
  const sqr=a2=>Math.abs(((a2+Math.PI)%(Math.PI*2))-Math.PI)<0.45;
  rollBtn.classList.toggle('ready',flipHeld &&flipRot >0.5&&sqr(flipRot));
  flipBtn.classList.toggle('ready',pitchHeld&&pitchRot>0.5&&sqr(pitchRot));
  spinBtn.classList.toggle('ready',spinHeld &&spinRot >0.5&&sqr(spinRot));
  heliBtn.classList.toggle('ready',heliAir&&flipRot>0.5&&sqr(flipRot));
  jumpBtn.style.opacity=trickReady?'0.25':'1';

  // Pearling went with the fore-and-aft weight it depended on: without a way to put
  // your weight over the nose there is nothing left to bury it with.

  // carve spray
  if(!airborne&&!hanging){
    // A hard change of direction throws a sheet of water off the tail. It used to be a
    // CUTBACK worth 75 and a speed boost — and swinging back harder than the fins could
    // hold ended the run, reward and wipeout being the same move a little further apart.
    // Both are gone. There is nothing to farm by rocking side to side, and nothing
    // punishing you for turning hard, so you can throw the board about as much as you
    // like and the only thing that comes of it is water. sprayCd is a rate limit on the
    // particles, not a cooldown on a trick.
    if(sprayCd<=0&&Math.abs(vx)>5.5&&sx!==0&&Math.sign(sx)!==Math.sign(vx)){
      sprayCd=0.5;
      const bside=-Math.sign(vx);
      for(let i=0;i<26;i++){
        const m=takeDrop();if(!m)break;
        m.material=SPLASH_MAT;
        const sc=0.8+Math.random()*1.4;m.scale.setScalar(sc);
        m.position.set(px+bside*0.8,waterY+0.1,0.4+Math.random()*0.6);
        m.userData={vx:bside*(4+Math.random()*7),vy:2.5+Math.random()*5,vz:2+Math.random()*4,t:0.6+Math.random()*0.3,s:sc};
        splashes.push(m);
      }
    }
    // The tail is always shovelling water, carving or not. Going straight the board
    // still shoves a wall of it out behind — that is most of what you actually see in
    // a wake shot, and without it the sea read as glass under a board floating on top.
    tailAcc+=dt*(26+eff*1.9);
    while(tailAcc>1){
      tailAcc-=1;
      const m=takeDrop();if(!m)break;
      m.material=SPLASH_MAT;
      const sc=0.62+Math.random()*1.05;m.scale.setScalar(sc);
      const off=(Math.random()-0.5)*1.05;
      m.position.set(px+off, waterY-0.16+Math.random()*0.2, 1.0+Math.random()*1.1);
      m.userData={vx:off*1.6+(Math.random()-0.5)*1.4, vy:0.8+Math.random()*1.8,
                  vz:1.7+Math.random()*2.3, t:0.32+Math.random()*0.26, s:sc};
      splashes.push(m);
    }
    // continuous rail spray while carving — the white fan off the outside rail
    // It was reading as a wall of white either side of the board rather than a rail
    // throwing spray. Less of it, thrown less far, and gone sooner — the board should be
    // the thing you are looking at, not the wash.
    const sprayRate=(Math.abs(carve)*104+8)*(eff/40)*BS.wake;
    sprayAcc+=dt*sprayRate;
    const side=-Math.sign(vx||1);
    while(sprayAcc>1){
      sprayAcc-=1;
      if(Math.abs(carve)<0.10)continue;
      const m=takeDrop();if(!m)break;
      m.material=SPLASH_MAT;
      const sc=0.58+Math.random()*0.82;m.scale.setScalar(sc);
      m.position.set(px+side*(0.46+Math.abs(carve)*0.42),waterY-0.10,0.2+Math.random()*0.9);
      m.userData={vx:side*(1.9+Math.abs(carve)*6.2+Math.random()*1.8),vy:0.9+Math.random()*Math.abs(carve)*5.6,vz:1.0+Math.random()*2.0,t:0.30+Math.random()*0.24,s:sc};
      splashes.push(m);
    }
  }

  // trick progression + rotations (player group spins; camera never tilts)
  // hand drag on the water
  if(dragOn){
    if(airborne||hanging)endDrag();
    else{
      dragPts+=70*dt;
      sprayAcc+=dt*90;
      while(sprayAcc>1){
        sprayAcc-=1;
        const m=takeDrop(); if(!m)break;
        m.material=SPLASH_MAT;
        const sc=0.7+Math.random()*1.0; m.scale.setScalar(sc);
        m.position.set(px+dragSide*(0.95+Math.random()*0.2), waterY-0.12, -0.15+Math.random()*0.7);
        m.userData={vx:dragSide*(1.4+Math.random()*3),vy:1.8+Math.random()*4.2,vz:2.2+Math.random()*3,t:0.5+Math.random()*0.35,s:sc};
        splashes.push(m);
      }
      pushTrail(px+dragSide*0.8,waterY,0.5,0.55);
    }
  }
  // spin / flip / grab all run at once while you're off the water
  if(airborne||hanging){
    const SR=SPIN_RATE*BS.air, FR=FLIP_RATE*BS.air;   // a poppy board spins faster too
    if(heliAir){
      // flipRot is the roll axis — the board turning over the way it is going. spinRot
      // would have been a flat spin, which is a different trick entirely. The wind-up is
      // scripted, but the rotation is yours: it turns for as long as you hold, and where
      // it is pointing when you let go is the attitude he lands in.
      if(heliHeld)flipRot+=dt*HELI_RATE*BS.air;
      // Dead level through the rolls. Tipping it forward looked right in principle and
      // wrong on screen: the camera sits behind him, so any pitch turns the roll into a
      // view of the board's underside swinging past instead of a clean turn. Level, it
      // reads as exactly what it is — the board going over and over.
      heliIncline=ease(heliIncline,0,dt,6);
      // a corkscrew of spray thrown off the rail, turning with him
      for(let i=0;i<2;i++){
        const m=takeDrop(); if(!m)break;
        m.material=SPLASH_MAT;
        const sc=0.42+Math.random()*0.5; m.scale.setScalar(sc);
        const a2=flipRot*1.6+i*Math.PI, r=0.95+Math.random()*0.35;
        m.position.set(px+Math.cos(a2)*r, py+0.10+Math.random()*0.5, Math.sin(a2)*r*0.8);
        m.userData={vx:Math.cos(a2+1.4)*3.2, vy:1.4+Math.random()*1.4,
                    vz:Math.sin(a2+1.4)*2.4, t:0.34+Math.random()*0.22, s:sc};
        splashes.push(m);
      }
    }
    if(spinHeld)spinRot+=dt*SR;
    else if(spinQ>0){const d=Math.min(dt*SR,spinQ);spinRot+=d;spinQ-=d;}
    if(flipHeld)flipRot+=dt*FR;
    else if(flipQ>0){const d=Math.min(dt*FR,flipQ);flipRot+=d;flipQ-=d;}
    if(pitchHeld)pitchRot+=dt*FR;
    else if(pitchQ>0){const d=Math.min(dt*FR,pitchQ);pitchRot+=d;pitchQ-=d;}
    if(grabOn)grabPts+=95*dt;
    // In the tube the trick turns about the BOARD's axes, not the world's.
    //
    // player is the parent and rig the child, so a rotation on player is applied in world
    // axes to a board that has already been banked by the ring. Out on the flat that is the
    // same thing — the board is level, its axes are the world's. Round the tube it is not:
    // banked ninety degrees the board's transverse axis IS world y, so a front flip came out
    // as a flat spin and a spin came out as a flip. Upside down in the roof they swap back
    // and the whole thing reads as the controls being scrambled, which is what it was.
    //
    // Conjugating by the bank fixes it without moving anything in the hierarchy: the total
    // becomes bank * trick * pose, i.e. pose the board, turn it about its own axes, then bank
    // the result onto the wall. The barrel roll is about z, which the bank leaves alone, so
    // that one was always right — it is the other two that were swapping.
    if(swTubeRide){
      _eTrick.set(pitchRot*pitchSign,spinRot*spinSign,flipRot*flipSign,'YZX');
      _qTrick.setFromEuler(_eTrick);
      _qBank.setFromAxisAngle(_zAxis,boardLean);
      player.quaternion.copy(_qBank).multiply(_qTrick).multiply(_qBank.clone().invert());
    } else player.rotation.set(pitchRot*pitchSign,spinRot*spinSign,flipRot*flipSign);
    // rope tricks bank as soon as you square up
    if(hanging&&!spinHeld&&!flipHeld&&(spinRot>0.4||flipRot>0.4)){
      const offS=Math.abs(((spinRot+Math.PI/2)%Math.PI)-Math.PI/2);
      const offF=Math.max(Math.abs(((flipRot+Math.PI)%(Math.PI*2))-Math.PI),
                          Math.abs(((pitchRot+Math.PI)%(Math.PI*2))-Math.PI));
      if(offS<0.7&&offF<0.7)settleTricks(true);
    }
  } else { spinHeld=false; flipHeld=false; pitchHeld=false; }
  if(trick&&trick.type==='back'){
    trick.t+=dt;
    const prog=Math.min(1,trick.t/trick.dur);
    player.rotation.set(-prog*Math.PI*2,spinRot,flipRot);
    if(prog>=1){score+=trick.pts;boost=Math.min(16,boost+6);msg(`${trick.name}! +${trick.pts}`);trick=null;}
  }

  // board rig: damped yaw/lean/pitch — eases onto the rail like a real board
  const grab=grabOn&&(airborne||hanging);
  // the hull banks with the water across its rails as well as leaning into the turn
  // A board banks into its turn the way a bike does — carve right and the right rail
  // goes down, not up. The water's own roll is separate and keeps its sign: it is the
  // surface the hull is lying on, not something the rider is doing.
  // Round the tube the board lies on the wall, so its roll IS where it sits on the ring —
  // upright in the pocket, on its rail up the face, inverted across the roof. The water's
  // own roll is meaningless in there (the height field has no roof to be tilted by), so the
  // ring's angle replaces it rather than adding to it.
  // Square down the line on the ring, and it has to be: the wall is a cylinder about z, so
  // the only heading that lies flat on it is along the tube. Yawing into the way he is
  // travelling — which is around the arc, not along it — takes the board off that line and
  // stands it up on a corner, and with the pitch below doing the same thing at the same time
  // the board sat across the barrel at an angle to everything. A small amount is left in so
  // a hard turn still reads.
  const yawT=swTubeRide?Math.max(-0.13,Math.min(0.13,-swS*swAngV*0.06)):-carve*0.30;
  // Banked to the wall, the way a skateboarder stands in a full pipe: the BOARD is against
  // the wall and the rider stands on it with his head toward the middle of the pipe. What it
  // was doing was the exact opposite — the sign here was inverted, so his up pointed OUT of
  // the tube and the board ended up on the inside of him, toward the axis. Checked against
  // the rig's actual world transform rather than by eye: rider-up dotted with the inward
  // direction was running between -0.23 and +0.09, i.e. anywhere but at the axis.
  //
  // A roll of phi about +z carries local up to (-sin phi, cos phi), and inward is
  // (-swS*sin th, cos th), so phi is swS*th. Not minus.
  //
  // Keyed on swTubeRide, NOT on swOnLip. The ring is one continuous loop of water — the
  // radius is ray-marched to whatever is out there, lip or open sea, precisely so there is
  // no seam — but the roll was still switching between two unrelated targets at the edge of
  // the lip's arc: the ring's angle on one side, the flat sea's carve on the other. Crossing
  // it unwound the board from several radians to nearly zero, which is the whole flip you
  // see going from the top of the wave back down to the bottom. Around the bottom of the
  // ring swS*swAng is already near zero, so one expression covers both and the crossing
  // stops existing. swAng keeps counting past 2*pi and that is fine: it is an Euler angle.
  //
  // Wrapped into (-pi, pi]. swAng counts loops and never resets, so after three times round
  // it is about 19 radians — and the moment the tube lets go, the eased branch below unwinds
  // that to zero, spinning the board three times on the way out. Wrapping costs nothing
  // while he is in there, because the roll is assigned outright and 19 rad draws the same as
  // 0.4 rad, and it leaves at most half a turn to unwind when the wave spits him.
  const ringRoll=swS*swAng - carve*0.22;
  const leanT=swTubeRide ? Math.atan2(Math.sin(ringRoll),Math.cos(ringRoll))
                         : -carve*0.55 + (airborne?0:hullRoll*1.20);
  const faceSlope=hT-hN;                     // downhill when the tail is higher
  // Ride fore and aft rather than sitting on one spot. Leaning drives him up the
  // board, leaning back settles him toward the tail of the shot, and dropping down
  // a face lunges him forward a little. Forward travel is kept short on purpose.
  const pzBase=Math.max(-3.0,Math.min(2.2, -leanW*2.3 - Math.max(-1,Math.min(1,faceSlope))*0.8));
  // Down the line in the barrel, so the CAMERA never has to move. A five-metre ring seen from
  // where the chase camera stands subtends more than the lane is wide, and the orbit runs off
  // the sides. The old answer was to pull the camera back, which reads as a zoom the moment
  // the ring takes over. This is the same fix applied to the thing that is allowed to move:
  // he trims further down the line, the orbit shrinks in frame, and the picture is untouched.
  // Eased slower than the ordinary trim so it reads as him driving forward rather than a cut.
  // Gated on the tube being FORMED, not merely engaged, because pz feeds back into the ring:
  // swTubeGeom reads the peel at the rider's own z, so trimming down the line shrinks the
  // bore, which can drop it back under the engagement threshold, which stops the trim, which
  // grows it again. Measured as the camera unlocking and relocking over and over — 14 m of
  // drift in four seconds on a shot that had held perfectly through the takeover.
  //
  // -11.5 put him twenty-seven metres from the lens and he read as a speck in the mouth of
  // the wave. Most of what that distance was buying has been paid for elsewhere: the near
  // wall is no longer cut away to the rider's own distance, so the tube stands around the
  // camera and the orbit has walls to run against instead of running off into open sky.
  const pzT = (swTubeRide&&swForm>0.6) ? (swTrimHold!==null?swTrimHold:SW_TRIM) : pzBase;
  pz+=(pzT-pz)*Math.min(1,dt*(swTubeRide?1.3:2.2));
  // A foil rides ON its mast, with the hull clear of the surface and only the wing in
  // the water — which is the whole look of the thing. The lift is VISUAL: py still drives
  // the collisions, because the mast and the wing are down there in the water whatever
  // the hull is doing, and a board that floated over hazards would be a different game.
  // The bob is slow on purpose: a foil rises and settles as it finds its trim, it does
  // not bounce.
  foilBob += dt*(1.45+lastEff*0.010);      // ~4s to rise and settle: breathing, not bouncing
  const lift = BS.lift ? BS.lift + Math.sin(foilBob)*0.085 + Math.sin(foilBob*1.63+1.1)*0.035 : 0;
  // The lift is along the surface he is riding, not along the world's up. On a foil the hull
  // stands off the water on its mast, and adding that to world +y is right in the pocket and
  // wrong everywhere else on the ring: at the top of the tube it drove the board a mast's
  // length further into the roof instead of hanging it beneath, which is the board floating
  // free of the wave. Inward here means toward the tube's axis, which IS the way up for
  // someone riding the inside of it.
  if(swTubeRide){
    const inX=-swS*Math.sin(swAng), inY=Math.cos(swAng);
    player.position.set(px+inX*lift,py+inY*lift,pz);
  } else player.position.set(px,py+lift,pz);
  // it lies along the water it is resting on, plus whatever the rider's weight adds
  // On the ring the board lies on the wall it is riding, not on the height field: the hull
  // samples that gave it its pitch are all taken from the flat sea underneath, which up in
  // the tube is metres below and says nothing about the surface he is actually on. Reading
  // them there is what made it look like it was floating over the wave instead of carving
  // it. The nose lifts as he climbs and drops as he comes down the far side, straight from
  // how fast he is going round.
  // Level on the ring for the same reason as the yaw. Going round the arc is not going
  // uphill: the nose was lifting a third of a radian off how fast he was travelling
  // sideways, which is where most of the tilt came from.
  const pitchT=onRampO?rampPitchT
              :swTubeRide?Math.max(-0.12,Math.min(0.12,-swAngV*0.05))
              :(airborne?-0.22:Math.max(-0.62,Math.min(0.68,hullPitch*1.50)) + leanW*0.62);
  boardYaw+=(yawT-boardYaw)*Math.min(1,dt*7);
  // A cracked board is unsteady under you. This is deliberately a slow, readable
  // oscillation rather than random jitter — it pushes you off your line and you steer
  // back, so a damaged board is harder to ride without ever being unfair. Nursing one
  // to a big score is meant to be a story you can tell.
  wobT+=dt;
  if(cracks){
    const k=cracks*(airborne?0.35:1);
    wobRoll=Math.sin(wobT*4.3)*0.045*k+Math.sin(wobT*2.17+1.3)*0.030*k;
    wobYaw =Math.sin(wobT*1.71+1.1)*0.032*k;
    vx+=Math.sin(wobT*1.45)*k*2.1*dt;
  } else { wobRoll=0; wobYaw=0; }
  // On the wall the bank is not a response, it is where he IS: the same angle that places
  // him on the ring. Damping it lags the bank behind the position exactly the way damping
  // the position lagged it behind the ring — measured, up-against-inward fell from 1.00 to
  // 0.61 while turning. Applied straight, like the angle itself.
  if(swTubeRide)boardLean=leanT;
  else boardLean+=(leanT-boardLean)*Math.min(1,dt*8.5);
  boardPitch+=(pitchT-boardPitch)*Math.min(1,dt*13);
  const grabRoll = grab ? grabSide*0.30 : 0;   // board tips toward the rail he's holding
  if(heliPh<0&&!heliAir)heliIncline=ease(heliIncline,0,dt,4);
  rig.rotation.set(boardPitch+heliIncline,boardYaw+wobYaw,boardLean+grabRoll+wobRoll);
  animateRig(dt,carve,grab,waterY);
  updateHandstand(dt,carve);

  // whitewater under the board + wash trail behind it
  if(!airborne&&!hanging){
    // water piles up on the inside rail of the turn and peels off the outside — no discs
    trailT-=dt;
    if(trailT<=0){trailT=0.026;pushTrail(px,waterY,0.9,(0.30+Math.abs(carve)*0.52)*BS.wake);}
  }

  if(!airborne&&Math.random()<dt*14)splash(px+(Math.random()-0.5),waterY-0.1,1.4,1);

  // obstacles
  bigFinCd=Math.max(0,bigFinCd-dt);
  // Nothing else spawns from the moment the plane is in trouble. The lane has to be
  // swept and empty by the time the face arrives, or you are threading buoys inside a
  // barrel, which reads as a bug rather than as surfing.
  if(swPh!==SWP.IDLE)spawnT=Math.max(spawnT,0.6);
  spawnT-=dt;
  if(swPh===SWP.IDLE&&spawnT<=0){
    // Space them by the gap on the water, not by the clock. Timing the spawns meant
    // that as the ramp pulled the interval down while the speed was still low, the
    // obstacles bunched up tighter mid-run than they ever are at the end. Held in
    // metres it only ever opens or closes the way it is meant to: thirty units apart
    // to start, closing to sixteen over about three kilometres, after which the speed
    // alone keeps taking the reaction time away.
    const wantGap=Math.max(15,24-dist/300);
    // ...with a floor on the clock as well, so that once the speed is silly it stays
    // merely hard rather than becoming a wall nothing could be threaded
    spawnT=Math.max(0.40,wantGap/Math.max(16,eff))*(0.75+Math.random()*0.5);
    // ...and the cast arrives a piece at a time. Buoys and logs are the whole game to
    // begin with; ramps, then jellyfish, then sharks, then the octopuses that throw
    // things at you, each one introduced with room to get used to it.
    const WEIGHTS=[['buoy',24,0],['log',18,0],['ramp',17,150],['jelly',21,340],
                   ['bigfin',11,560],['octopus',14,780]].filter(w=>dist>=w[2]);
    let pick=null;
    for(let tries=0;tries<8;tries++){
      let total=0;for(const w of WEIGHTS)total+=w[1];
      let roll=Math.random()*total,cand=WEIGHTS[0][0];
      for(const w of WEIGHTS){roll-=w[1];if(roll<=0){cand=w[0];break;}}
      if(cand===lastKind&&sameRun>=2)continue;          // break up streaks
      if(cand==='bigfin'&&bigFinCd>0)continue;          // big fin needs breathing room
      pick=cand;break;
    }
    if(!pick)pick='buoy';
    sameRun=(pick===lastKind)?sameRun+1:1;
    lastKind=pick;
    if(pick==='bigfin')bigFinCd=9;
    // spread across the full lane, centred on the player, with jittered slots so it
    // never clusters on one side
    // seven lanes spanning wider than you can steer, so the edges are never safe
    laneSlot=(laneSlot+1+((Math.random()*3)|0))%7;
    const laneX=(-3+laneSlot)*4.9+(Math.random()-0.5)*3.0;
    makeObstacle(pick,Math.max(-17,Math.min(17,px*0.55+laneX)),-170);
    // and every so often drop an extra one right against an edge
    // the second one out by the edge only starts once you are well into a run
    if(dist>600&&Math.random()<0.30){
      const edge=(Math.random()<0.5?-1:1)*(11.5+Math.random()*4.5);
      makeObstacle(Math.random()<0.5?'buoy':'log',edge,-176);
    }
  }
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.position.z+=eff*dt;
    // ride the long swell, ignore the chop — and stay on top of it, never under
    const oy=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock)+FLOAT_OFF[o.userData.kind];
    if(o.userData.by===undefined)o.userData.by=oy;
    // a big rigid ramp barely moves; small floats respond more
    const follow=o.userData.ramp?3.0:9.0;
    o.userData.by+=(oy-o.userData.by)*Math.min(1,dt*follow);
    o.position.y=o.userData.by;
    // tilt with the swell face — heavily damped on ramps so they don't wobble
    const tilt=o.userData.ramp?0.06:0.30;
    const span=o.userData.ramp?3.2:1.6;
    const slopeZ=(swellH(o.position.x,dist*WAVE_DRIFT+o.position.z+span,waveClock)-swellH(o.position.x,dist*WAVE_DRIFT+o.position.z-span,waveClock))*tilt;
    const slopeX=(swellH(o.position.x+span,dist*WAVE_DRIFT+o.position.z,waveClock)-swellH(o.position.x-span,dist*WAVE_DRIFT+o.position.z,waveClock))*tilt;
    if(o.userData.rx===undefined){o.userData.rx=slopeZ;o.userData.rz=-slopeX;}
    o.userData.rx+=(slopeZ-o.userData.rx)*Math.min(1,dt*(o.userData.ramp?2.0:6.0));
    o.userData.rz+=((-slopeX)-o.userData.rz)*Math.min(1,dt*(o.userData.ramp?2.0:6.0));
    o.rotation.x=o.userData.rx; o.rotation.z=o.userData.rz;
    if(o.userData.kind==='buoy')o.rotation.z+=Math.sin(tNow*2+o.position.x)*0.06;
    if(o.userData.kind==='bigfin'){
      // pace the crossing so it arrives in your lane just as you reach it
      const togo=Math.max(0.35,(-o.position.z)/Math.max(8,eff));
      o.position.x+=((o.userData.targetX-o.position.x)/togo)*dt;
      if(Math.random()<dt*14)splash(o.position.x,o.position.y+0.1,o.position.z+1.4,1);
    }
    if(o.userData.kind==='octopus'){
      const u=o.userData;
      u.t+=dt;
      // turns to keep the rider in front of it while it drifts past
      o.rotation.y=Math.atan2(o.position.x-px,o.position.z);
      o.position.y+=Math.sin(u.t*1.5)*dt*0.30;                 // gentle bob of its own
      // a travelling wave down every arm: each joint lags the one before it, and the
      // three axes run at different rates so the tips coil and uncoil as they sweep
      for(let k=0;k<u.joints.length;k++){
        const j=u.joints[k], d=j.userData;
        // two unrelated rates per joint, so the sum never repeats on a neat loop,
        // plus a lag down the arm and a per-animal offset — flowing, not metronomic
        const t1=u.t*d.f1+d.p1+u.seed, t2=u.t*d.f2+d.p2+u.seed*1.7;
        const lag=d.seg*0.88;                  // a longer lag makes the wave read as it travels
        const A=d.a1*d.k, B=d.a2*d.k;
        if(d.seg===0)
          j.rotation.x=d.sM+Math.sin(u.t*d.sF*Math.PI*2+d.sP+u.seed)*d.sA;
        else
          j.rotation.x=d.rx+Math.sin(t1-lag)*A+Math.sin(t2*0.63-lag*0.5)*A*0.6;
        j.rotation.y=d.ry+Math.sin(t2-lag*0.8)*B+Math.cos(t1*0.41)*B*0.5;
        j.rotation.z=d.rz+Math.cos((t1+t2)*0.5-lag*0.7)*A*0.8;
      }
      // only throws while it is close enough to be a threat
      if(o.position.z>-72&&o.position.z<-7){
        u.throwT-=dt;
        if(u.throwT<=0){u.throwT=1.05+Math.random()*1.05;throwStarfish(o);}
      }
    }
    if(o.userData.bell){
      // slow swimming pulse: the bell squashes and springs back
      const ph=tNow*1.6+o.userData.pulse;
      const sq=0.5+0.5*Math.sin(ph);
      const hit=o.userData.squash||0;
      if(o.userData.squash)o.userData.squash=Math.max(0,o.userData.squash-dt*2.4);
      o.userData.bell.scale.set(0.95+sq*0.13+hit*0.45,0.95-sq*0.20-hit*0.55,0.95+sq*0.13+hit*0.45);
      o.rotation.y+=dt*0.25;
      o.position.y+=Math.sin(ph)*dt*0.35;          // bobs upward on each pulse
    }
    if(o.userData.wash){const w=1+Math.sin(tNow*3+o.position.x)*0.12;o.userData.wash.scale.set(w,w,1);o.userData.wash.material.opacity=0.4+Math.sin(tNow*3+o.position.x)*0.15;}

    // Everything already on the water gets run over by the swell rather than vanishing:
    // it is pushed past you and culled by the normal rule.
    if(swSweep&&o.userData.kind!=='debris')o.position.z+=42*dt;
    if(o.position.z>18){scene.remove(o);obstacles.splice(i,1);continue;}
    // the jelly closes fast and is only "at" you for a couple of frames, so its
    // window grows with speed — otherwise a jump can pass clean over the contact
    // The board is a 5m plank, not a point. Test it as a capsule running nose to
    // tail, swept over the ground the obstacle covered this frame, so the nose
    // makes contact when it reaches something instead of sliding through it first.
    const R=o.userData.r+BOARD_HALF_W;
    // Sweep sideways as well as forward. A shark fin crosses your line fast, and
    // testing only where it happens to be this frame lets it step straight over the
    // board between two frames — you watch it go through you and nothing happens.
    const ox1=o.position.x, ox0=(o.userData.lx===undefined?ox1:o.userData.lx);
    const xlo=Math.min(ox0,ox1), xhi=Math.max(ox0,ox1);
    const dxo=px<xlo?xlo-px:(px>xhi?px-xhi:0);
    o.userData.lx=ox1;
    let contact=false;
    if(dxo<R){
      const reach=Math.sqrt(R*R-dxo*dxo);          // z it can touch at this x offset
      const z1=o.position.z, z0=z1-eff*dt;         // where it was a frame ago
      const nose=pz-BOARD_HALF_L, tail=pz+BOARD_HALF_L;
      contact=(Math.min(z0,z1)-reach)<tail && (Math.max(z0,z1)+reach)>nose;
    }
    if(contact){
      if(o.userData.ramp){
        /* handled as a surface above, not as something to hit */
      } else if(o.userData.kind==='jelly'&&py<o.position.y+o.userData.h+0.35){
        // You have to actually reach it. `contact` above is a footprint on the water — x and
        // z only — and every other obstacle here pays for that with a height test of its own
        // (py<waterY+h). The jellyfish never had one, so its footprint alone fired: pass six
        // metres over the top of one at the peak of a jump and it still threw you, a bounce
        // arriving out of clear air. The gate is its own top plus a board's thickness, so
        // landing ON it still counts and flying over it no longer does.
        //
        // It sits above the generic obstacle gate below (waterY+h), so a jelly that is out of
        // reach here cannot fall through and be treated as something lethal instead.
        //
        // A jellyfish never ends a run. Hit it however you like and the bell throws
        // you off it — hard from above, more of a shove if you clip it on the water.
        const over=airborne&&py>o.position.y+0.10;
        vy=over?Math.max(12.5,-vy*0.85+9.0):Math.max(9.0,vy+8.0);
        airborne=true;
        py=Math.max(py,o.position.y+0.9);
        score+=60;boost=Math.min(16,boost+3);jellyHits++;
        msg('JELLY BOUNCE! +60');
        shake=over?0.7:1.0;
        splash(o.position.x,o.position.y+0.5,o.position.z,over?14:20);
        if(o.userData.bell)o.userData.squash=1.0;      // the bell flattens under you
      } else if(py<waterY+o.userData.h&&!hanging){
        const topY=waterY+o.userData.h;
        // Dropping onto the top of it is not the same as driving into its side, and
        // until now the code could not tell the difference — both were instant death.
        // Coming down on it costs the board a crack and throws you back up.
        if(vy<-0.5&&py>topY-0.55){ boardHit(o,topY); }
        else{
          // it takes the impact too: shoved aside, lifted and set spinning
          o.userData.knock={vx:(o.position.x-px)*0.9+(Math.random()-0.5)*2.4,
            vy:2.0+Math.random()*2.4, vz:2.2+lastEff*0.06,
            sx:(Math.random()-0.5)*6, sz:(Math.random()-0.5)*6};
          startWipeout(o.userData.kind);return;
        }
      }
    }
  }

  // plane — the tow only runs when the set piece is not flying the same aircraft
  if(swPh===SWP.IDLE)planeT-=dt;
  if(swPh===SWP.IDLE&&planeT<=0&&!planeActive){
    planeActive=true;plane.visible=true;
    plane.scale.setScalar(1);          // the banner tow passes close; it needs no help
    plane.position.set(Math.random()*16-8,11,-190);
    planeT=40+Math.random()*38;
  }
  if(planeActive&&swPh===SWP.IDLE){
    plane.position.z+=(eff*0.45+12)*dt;
    plane.position.y=11+Math.sin(tNow*1.5)*0.6;
    plane.userData.prop.rotation.z+=dt*40;
    plane.rotation.y=Math.PI;
    if(plane.position.z>40){planeActive=false;plane.visible=false;if(hanging)releaseRope(false);}
  }
  const ropeWindow=planeActive&&plane.position.z>-90&&plane.position.z<-4;
  ropeBtn.style.display=(ropeWindow||hanging)?'flex':'none';
  if(hanging){
    rope.geometry.setFromPoints([
      new THREE.Vector3(px,py+1.2,-0.5),
      new THREE.Vector3(plane.position.x,plane.position.y-0.6,plane.position.z)
    ]);
  }

  // splashes
  for(let i=splashes.length-1;i>=0;i--){
    const s2=splashes[i],u=s2.userData;
    u.t-=dt;u.vy-=14*dt;
    s2.position.x+=u.vx*dt;s2.position.y+=u.vy*dt;s2.position.z+=u.vz*dt+eff*dt*0.4;
    s2.scale.setScalar(Math.max(0.05,u.t*u.s));
    if(u.t<=0){freeDrop(s2);splashes.splice(i,1);}
  }
  // keep the contact shadows glued under everything
  {
    const sy=waveH(px,dist*WAVE_DRIFT,waveClock)+0.06;
    // no contact disc under the board — on open water there is nothing for a shadow
    // to fall on, and a dark ellipse tracking him under the hull only ever read as a
    // sticker. The obstacles keep theirs; they sit still enough for it to work.
    boardShadow.visible=false;
    let si=0;
    for(const o of obstacles){
      if(si>=OBST_SHADOWS.length)break;
      if(o.position.z<-70||o.position.z>14)continue;
      const sh=OBST_SHADOWS[si++];
      sh.visible=true;
      const oy=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock)+0.05;
      sh.position.set(o.position.x+0.3,oy,o.position.z+0.3);
      const r=o.userData.r||1.2;
      sh.scale.set(r*0.55,r*0.85,1);
      sh.material.opacity=0.14;
    }
    for(;si<OBST_SHADOWS.length;si++)OBST_SHADOWS[si].visible=false;
  }
  updateWake(dt,eff);

  updateSeaLife(dt,eff);
  updateJetSki(dt,eff);
  updateWhirl(dt,eff);
  updateStars(dt,eff);
  updateSplat(dt);
  updateDayCycle();

  // stage sets the range; sets roll through it so you get small, medium, large and
  // the occasional extra-large — and the whole range climbs the further you get
  const stage=Math.min(1,dist/9000);
  const base=1.12+stage*1.00;                 // typical size for this point in the run
  const swing=0.34+stage*0.50;                // how much the sets vary
  waveAmp=Math.max(0.34, base+setNoise(waveClock)*swing);
  WAVE_DRIFT=0.46+stage*0.16;                 // rolls past a little quicker later on
  oceanUniforms.uAmp.value=waveAmp*swCalm;
  oceanUniforms.uPeak.value=1.58*waveAmp+wkA*0.60;   // so only the wake's crest foams   // total wave height, so foam thresholds track the swell
  // sets: the swell surges and eases instead of ticking at one constant rate
  waveClock += dt*(1.0 + 0.55*Math.sin(tNow*0.045) + 0.28*Math.sin(tNow*0.017+1.3));
  oceanUniforms.uT.value=waveClock;
  oceanUniforms.uDist.value=dist*WAVE_DRIFT;
  oceanUniforms.uWakeZ.value=wkZ;oceanUniforms.uWakeA.value=wkA;oceanUniforms.uWakeX.value=wkX;
  oceanUniforms.uWhX.value=whX;oceanUniforms.uWhZ.value=whZ;oceanUniforms.uWhA.value=whA;
  oceanUniforms.uSwA.value=swA;oceanUniforms.uSwX.value=swX;oceanUniforms.uSwS.value=swS;
  placeCurl(dt);

  // camera: level horizon, smoothed follow, pulls back with speed
  camX+=(px-camX)*Math.min(1,dt*7);     // camera sits directly behind him
  lookX+=(px-lookX)*Math.min(1,dt*7);   // and looks straight down the line
  camera.up.set(0,1,0);
  // On the water the camera only loosely tracks the swell, so the board visibly
  // rises and drops against it. Off the water it follows most of the way up —
  // not the whole height, so the air still reads as air — and it chases faster,
  // eases back a little and lifts its aim, keeping him framed on a ramp, a jump,
  // a wake launch or the plane tow.
  const airH=Math.max(0,py-waterY);
  const flying=airborne||hanging||airH>0.6;
  // Height is measured from the water under the rider, not from zero. On a big
  // swell the sea itself rises many units, and a camera anchored to zero ends up
  // underneath it looking out through the inside of the wave.
  // Inside the barrel the camera drops and sits back: the whole point of the shot is the
  // roof over your head and the light coming through the opening, and the normal chase
  // height puts both of those above the top of the screen.
  camY+=((waterY+4.9-swCam*2.15+airH*0.80)-camY)*Math.min(1,dt*(flying?4.6:1.6));
  camY=Math.max(camY,waterY+2.3);            // never let a fast-building face swallow it
  // follow his fore/aft travel only partly, so it reads on screen instead of the
  // camera cancelling it out and pinning him to one spot again
  camZ+=((11.0+swCam*4.6+eff*0.05+airH*0.22+pz*0.42)-camZ)*Math.min(1,dt*2.4);
  // Inside the barrel the camera is FIXED. Not damped, not eased toward him — fixed. It is
  // set once when he joins the ring and then does not move again until he leaves it, so what
  // you watch is a still shot of a tube with a rider going round the inside of it.
  //
  // It is placed a little further back than the chase camera sits, because a ring five metres
  // across does not fit a lane 31 degrees wide from where the chase camera stands: he would
  // leave the side of the frame a third of the way round. Set once, at ring entry, from the
  // ring's own geometry — that is framing, not chasing.
  if(swTubeRide){
    // Only the SIDEWAYS chase is frozen — and that is the honest limit of this, arrived at
    // by measuring four fully fixed placements that all lost the barrel:
    //   on the tube's axis   the lip is a metre away and unreadable
    //   well back            you see the outside of the collapsed tail, not into the mouth
    //   just past the shell  the camera sits inside the wave
    //   frozen at entry      it holds at axis height aimed down, and the shell fills the frame
    // Hiding the lip proved the last one: with the curl hidden the same frame renders
    // perfectly, so it was the tube itself filling the screen, not the water.
    //
    // Height and aim have to keep following him, because what makes a barrel legible is
    // looking INTO it, and where that is depends on where he is in it. What is removed is
    // the part you actually notice: the camera sliding across to keep him centred.
    // Height held as well as the sideways chase. This was tried before and rejected, and the
    // rejection was worthless: every one of those attempts ran while Z1=13 was ending the
    // shell in front of the camera, so the frame was filled by the tube's exterior whatever
    // the camera did. With the shell restored there is a barrel to frame again, so the
    // height is held too — the whole point being that he moves through the shot rather than
    // the shot moving with him.
    //
    // The aim still tracks a little, because a shot held rigidly at the entry height looks
    // past him entirely once he is up in the roof; a fifth of the climb is enough to keep
    // him in frame without the picture chasing.
    // Centred on the tube's AXIS in x, not on wherever he happened to be when the ring took
    // over: he orbits that axis, so a camera parked off it watches an orbit that runs off one
    // side of the frame. Height and distance stay the chase camera's, which is the geometry
    // that frames a barrel.
    // The aim's DEPTH is part of the lock too, and it was the last thing still moving.
    // swCam ramps from 0 to 1 over the first second of the ride, and the aim point rode it:
    // -14 to -24 in z, which swings the whole picture round while he is going up the wall.
    // Locked at the settled value rather than at whatever it happened to be on the frame he
    // joined the ring, so the shot cuts to its final framing at entry and then holds. The
    // position already cuts at that instant, so this is the same cut, not a second one.
    // Locked EXACTLY WHERE IT ALREADY IS. Every previous version of this cut to a chosen
    // placement — pulled back to 25.5, or re-centred on the tube's axis, or aimed at a
    // settled value — and every one of them is a snap at the instant the ring takes over,
    // which is the thing that keeps getting reported. There is no barrel camera any more.
    // The ride camera simply stops following when the ring takes charge, and holds.
    //
    // The cost is framing: the ring is five metres across and the lane is about 31 degrees
    // wide, so an orbit centred off the camera's own line runs off the side. That is paid
    // for by moving the RIDER down the line instead — see pzT below — which is a thing the
    // water can do without the picture moving at all.
    if(!swCamLock)swCamLock={x:camX,y:camY,z:camZ,lx:lookX,
                             at:waterY+1.05+swCam*1.5+airH*0.62, atZ:-14-swCam*10};
    camX=swCamLock.x; lookX=swCamLock.lx; camZ=swCamLock.z;
    camY=swCamLock.y;
    // Fixed, but not fixed UNDERWATER. This runs after the clamp that keeps the camera above
    // a rising face, so holding the height through it let the swell close over the lens —
    // the screen fills with flat blue and the barrel disappears. The shot holds still; the
    // sea is still allowed to push it up out of itself.
    // Against the rider's own water line, NOT a fresh waveH sample. Sampling the field at
    // the camera's own x picks up the set wave itself, which near the crest is seven metres
    // — so the clamp shoved the camera up to nine and it then looked steeply down into the
    // face, filling the screen with water. waterY is the sea he is floating on, which is the
    // thing the camera must stay above.
    // No ratchet. This used to lift the lock whenever the water under the rider rose, on the
    // grounds that the sea must never close over the lens — but the water under him rises the
    // whole time he is climbing the wall, so the shot rose with him. That is the camera
    // "still moving up" while you ride up the barrel. Inside the tube the sea is held glassy
    // and the lock is taken at the chase camera's own height, which is metres clear of it;
    // there is nothing left for the clamp to save.
    camY=swCamLock.y;
  } else swCamLock=null;
  camera.position.set(camX,camY,camZ);
  // In the tube the aim is nailed down too. It used to track a fifth of the climb, on the
  // reasoning that a rigidly held shot looks past him once he is up in the roof — but the
  // shell is wide enough that he stays in frame anyway, and a fifth of seven metres is a
  // visible drift of the whole picture every time he goes round. "Fixed" has to mean fixed.
  camera.lookAt(lookX, swCamLock?swCamLock.at:(waterY+1.05+swCam*1.5+airH*0.62),
                swCamLock?swCamLock.atZ:(-14-swCam*10));
  // The camera does NOT roll with the ring. A loop camera was tried and taken back out: it
  // keeps the tube wrapped around the view, but the whole shot turning over is disorienting
  // and it throws away the one stable reference — the horizon — that tells you where you are
  // on the wave. The ride angle stays the ride angle however far round the tube he goes; it
  // is the rider that turns upside down, not the picture.

  const sc=score|0, ds=Math.round(dist);
  hScore.textContent=sc.toLocaleString();
  hDist.textContent=ds.toLocaleString()+' m';
  hSpeed.textContent=(eff*0.62)|0;
  // each record counts the run in progress, so passing it lights the line up there and
  // then rather than only being told about it on the wipeout screen
  hBest.textContent='best '+Math.max(best,sc).toLocaleString();
  hBest.classList.toggle('new',sc>best);
  const bd=stats.bestDist||0;
  hBestD.textContent='best '+Math.max(bd,ds).toLocaleString()+' m';
  hBestD.classList.toggle('new',ds>bd);
  // this run's take, not the wallet — the wallet is what the shop is for
  hCoins.textContent=coinsFor(dist,score);
}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(!running&&wipe){                       // crash plays out with the world still alive
    updateWipeout(dt);
    updateWorldDuringWipeout(dt);
  }
  if(running){runSecs+=dt;update(dt);}
  // the menu gets the same sky work the ride does: without it the dome and the sun
  // never follow the camera and the colours never track the time of day
  // The MENU camera, and not while a crash is playing. running goes false the instant you
  // wipe out and stays false until the overlay, so this branch has been running through every
  // wipeout — one line after updateWipeout has placed the camera, and overwriting it. The
  // crash camera has therefore never been seen: what you actually get on every death is the
  // menu's slow drifting wide shot snapping in, which is the "camera zooms out when you die".
  else {oceanUniforms.uT.value+=dt;tNow+=dt;if(!wipe)menuCamera(dt);updateDayCycle();}
  if(viewer){ renderViewer(dt); return; }   // the look takes the whole screen and the frame
  updateSkyLife(dt);          // the sky keeps moving on the menu and through a wipeout
  renderer.render(scene,camera);
  if(splat3D.visible){
    // clear only depth, so it lands on top of the frame but still occludes itself
    renderer.autoClear=false;
    renderer.clearDepth();
    renderer.render(splatScene,splatCam);
    renderer.autoClear=true;
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
