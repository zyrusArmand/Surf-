<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surf</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button { font-family:inherit; }   /* buttons do not inherit it on their own */
  html,body { width:100%; height:100%; overflow:hidden; background:#7ec8f0; font-family:'Trebuchet MS',sans-serif; touch-action:none; }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:calc(6px + env(safe-area-inset-top,0px)) 4px 0; color:#fff; font-weight:bold;
    text-shadow:0 2px 4px rgba(0,40,80,.55); pointer-events:none; }
  #hud .cell { flex:1 1 0; text-align:center; }
  #hud .lab { display:block; font-size:min(2.9vw,11px); letter-spacing:1.4px; opacity:.72; }
  #hud .val { display:block; font-size:min(5.4vw,21px); line-height:1.15; }
  #trickmsg { position:fixed; top:22%; width:100%; text-align:center; color:#ffdf2e; font-weight:bold; font-size:30px; text-shadow:0 3px 6px rgba(0,40,80,.6); pointer-events:none; opacity:0; transition:opacity .2s; }
  .btn {
    position:fixed; user-select:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; letter-spacing:1.2px; color:#fff;
    text-shadow:0 1px 2px rgba(0,20,40,.45);
    background:linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.08));
    border:1.5px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(13px) saturate(160%) brightness(1.22);
    backdrop-filter:blur(13px) saturate(160%) brightness(1.22);
    box-shadow:0 8px 22px rgba(0,25,50,.28), inset 0 1px 0 rgba(255,255,255,.65),
               inset 0 -8px 16px rgba(0,40,80,.16);
    transition:transform .09s ease, box-shadow .09s ease, background .12s ease;
  }
  .btn::before, .tbtn::before { content:''; position:absolute; left:8%; right:8%; top:3%;
    height:44%; border-radius:50%; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.52), rgba(255,255,255,.06) 78%,
                                       rgba(255,255,255,0)); }
  /* .btn is already position:fixed and positions its own children; giving it relative
     here overrode that and dropped JUMP into the flow at the top of the page */
  .btn { overflow:hidden; }
  .tbtn { position:relative; overflow:hidden; }
  .btn > *, .tbtn > * { position:relative; }
  .btn:active { transform:scale(.93);
    box-shadow:0 3px 10px rgba(0,25,50,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  #jumpBtn { right:20px; bottom:30px; width:94px; height:94px; font-size:19px;
    background:linear-gradient(160deg, rgba(255,204,36,.88), rgba(255,116,0,.70));
    border-color:rgba(255,230,170,.8);
    box-shadow:0 10px 26px rgba(120,60,0,.30), inset 0 1px 0 rgba(255,255,255,.75),
               inset 0 -9px 18px rgba(150,70,0,.20); }
  #ropeBtn { right:20px; bottom:142px; width:94px; height:94px; font-size:17px; display:none;
    background:linear-gradient(160deg, rgba(255,110,194,.88), rgba(222,24,128,.68));
    border-color:rgba(255,190,225,.8);
    box-shadow:0 10px 26px rgba(110,10,70,.30), inset 0 1px 0 rgba(255,255,255,.7),
               inset 0 -9px 18px rgba(120,20,80,.20); }
  /* the trick pad is given the width left over beside JUMP and wraps to two rows, so
     the two can never end up on top of each other on a narrow phone */
  #trickBar { position:fixed; bottom:26px; left:12px; z-index:9;
    width:min(135px, calc(100vw - 132px));
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
  .tbtn {
    width:100%; aspect-ratio:1/1;
    border-radius:50%; user-select:none; flex:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-weight:800; font-size:9.5px; letter-spacing:.7px; color:#fff;
    text-shadow:0 1px 2px rgba(0,20,40,.45);
    border:1.5px solid rgba(255,255,255,.5);
    -webkit-backdrop-filter:blur(13px) saturate(160%) brightness(1.22);
    backdrop-filter:blur(13px) saturate(160%) brightness(1.22);
    box-shadow:0 7px 18px rgba(0,25,50,.26), inset 0 1px 0 rgba(255,255,255,.6),
               inset 0 -7px 14px rgba(0,40,80,.16);
    transition:transform .09s ease, box-shadow .09s ease;
  }
  .tbtn:active { transform:scale(.9);
    box-shadow:0 2px 8px rgba(0,25,50,.28), inset 0 1px 0 rgba(255,255,255,.45); }
  #rollBtn { background:linear-gradient(160deg, rgba(50,176,255,.86), rgba(0,110,226,.66)); }
  #flipBtn { background:linear-gradient(160deg, rgba(255,150,30,.86), rgba(242,86,0,.66)); }
  #spinBtn { background:linear-gradient(160deg, rgba(255,214,26,.86), rgba(234,148,0,.66)); }
  #handBtn { background:linear-gradient(160deg, rgba(184,112,255,.86), rgba(104,20,228,.66)); }
  /* every button carries the finger movement that does the same thing, so the gesture
     is learnable from the button rather than from a page of instructions */
  .ges { width:54%; height:54%; display:block; overflow:visible;
    fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 1px 2px rgba(0,20,40,.5)); }
  .ges .dot { fill:#fff; stroke:none; }
  #jumpBtn .ges { width:30px; height:30px; stroke-width:2.4; margin-bottom:1px; }
  #jumpBtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  /* The menu no longer lays a flat panel over the game — the sea keeps rolling behind
     it under a soft vignette that has no edge anywhere, and the type carries its own
     legibility instead of borrowing it from a scrim. */
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px;
    background:radial-gradient(150% 108% at 50% 46%,
      rgba(4,22,42,.46) 0%, rgba(4,22,42,.38) 42%, rgba(4,22,42,.20) 74%, rgba(4,22,42,.05) 100%);
  }
  #overlay h1 { font-size:min(11vw,54px); color:#ffdf2e; letter-spacing:-.5px;
    text-shadow:3px 3px 0 #b8641c, 0 6px 22px rgba(0,20,40,.6); }
  #overlay p { margin:12px 0; font-size:min(4.4vw,18px); line-height:1.55; max-width:540px;
    text-shadow:0 2px 8px rgba(0,20,40,.75); }
  /* One button. Every menu button is this size and shape; only the colour changes, so
     the stack reads as one control rather than three different ones. */
  /* Glass, not paint. The fill is a wash of white with the colour carried in a low
     tint, an edge and a soft glow, so the sea genuinely reads through every button
     instead of being covered by a coloured slab. */
  /* Bright colour through glass. The trap is that a translucent colour takes on
     whatever is behind it, and behind these is a dark navy sea — so orange came out
     brown and blue came out navy. The backdrop is therefore brightened and saturated
     hard before the colour is laid over it: the button sits on a light ground of its
     own making, and the hue reads at full strength while you can still see the water
     moving through it. */
  .go { position:relative; overflow:hidden;
    width:min(302px,80vw); padding:15px 22px; font-size:17px; font-weight:800;
    font-family:inherit; letter-spacing:.6px; color:#fff; border-radius:999px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    text-shadow:0 1px 5px rgba(120,50,0,.5);
    border:1.5px solid rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(15px) saturate(160%) brightness(1.22);
    backdrop-filter:blur(15px) saturate(160%) brightness(1.22);
    background:linear-gradient(160deg, rgba(255,152,16,.86), rgba(244,84,0,.68));
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 22px rgba(255,140,20,.20),
               inset 0 1px 0 rgba(255,255,255,.8), inset 0 -14px 24px rgba(190,70,0,.18);
    transition:transform .1s ease, box-shadow .14s ease, background .14s ease; }
  /* the sheen: bright at the very top, gone by halfway, curved like a lens */
  .go::before { content:''; position:absolute; left:1px; right:1px; top:1px; height:52%;
    border-radius:999px 999px 52% 52% / 999px 999px 22% 22%;
    background:linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.22) 46%,
                                       rgba(255,255,255,.03) 88%, rgba(255,255,255,0) 100%);
    pointer-events:none; }
  .go > * { position:relative; }
  .go:active { transform:translateY(2px) scale(.988);
    background:linear-gradient(160deg, rgba(255,182,74,.95), rgba(244,84,0,.82));
    box-shadow:0 4px 12px rgba(0,20,40,.3), inset 0 1px 0 rgba(255,255,255,.7); }
  .go.alt { background:linear-gradient(160deg, rgba(34,190,255,.86), rgba(0,124,212,.68));
    border-color:rgba(196,240,255,.7); text-shadow:0 1px 5px rgba(0,50,90,.5);
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 22px rgba(40,180,255,.22),
               inset 0 1px 0 rgba(255,255,255,.8), inset 0 -14px 24px rgba(0,80,130,.18); }
  .go.alt:active { background:linear-gradient(160deg, rgba(110,220,255,.95), rgba(0,124,212,.82)); }
  .go.teal { background:linear-gradient(160deg, rgba(16,238,202,.86), rgba(0,172,152,.68));
    border-color:rgba(198,255,246,.7); text-shadow:0 1px 5px rgba(0,70,62,.5);
    box-shadow:0 14px 30px rgba(0,20,40,.26), 0 0 22px rgba(30,230,200,.22),
               inset 0 1px 0 rgba(255,255,255,.8), inset 0 -14px 24px rgba(0,100,88,.18); }
  .go.teal:active { background:linear-gradient(160deg, rgba(110,250,224,.95), rgba(0,172,152,.82)); }
  .go.calm { background:linear-gradient(160deg, rgba(158,190,222,.78), rgba(52,84,124,.62));
    border-color:rgba(214,232,248,.6); text-shadow:0 1px 5px rgba(0,30,60,.5);
    box-shadow:0 14px 30px rgba(0,20,40,.28), inset 0 1px 0 rgba(255,255,255,.66),
               inset 0 -14px 24px rgba(0,30,60,.18); }
  .go.calm:active { background:linear-gradient(160deg, rgba(196,222,244,.92), rgba(52,84,124,.78)); }
  #ovBtns { display:flex; flex-direction:column; align-items:center; width:100%; }
  #ovBtns .go { margin-top:10px; }
  /* On the menu the title stays where it has always sat and the buttons go to the
     bottom of the screen, out of the flow, so the two do not push each other around.
     The wipeout card keeps them together under the summary. */
  #overlay.main { justify-content:flex-start; padding-top:30vh; }
  #overlay.main #ovBtns { position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(9vh + env(safe-area-inset-bottom,0px)); }
  #overlay .hint { opacity:.85; font-size:min(3.8vw,15px); }
  #ovPurse { margin-top:6px; font-size:min(4.6vw,19px); font-weight:800; letter-spacing:.4px;
    color:#ffe9a8; text-shadow:0 2px 8px rgba(0,20,40,.7); }
  #overlay.over h1 { font-size:min(12vw,58px); }
  /* the run summary: the block sits in the middle of the screen, but every line inside
     it starts on the same left edge instead of each being centred on its own length */
  #ovText { width:min(300px,80vw); max-width:none; margin:14px auto 4px;
    font-size:min(4.2vw,17px); text-align:left; }
  #ovText .tr { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
    padding:6px 2px; border-bottom:1px solid rgba(255,255,255,.14); }
  #ovText .tr:last-child { border-bottom:none; }
  #ovText .tr span { opacity:.86; }
  #ovText .tr b { font-weight:800; white-space:nowrap; }
  #ovText .tr.hi b { color:#ffdf2e; }
  /* what it paid out, set beside the figure rather than pointed at with an arrow */
  #ovText .tr em { font-style:normal; font-weight:800; color:#ffe9a8; margin-left:10px; }
  #ovText .lead { text-align:center; opacity:.9; margin-bottom:10px; }
  #zap { position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(190,250,255,.95) 0%, rgba(120,220,255,.55) 26%, rgba(60,140,255,.18) 52%, rgba(0,0,0,0) 74%);
    transition:opacity .28s ease-out; }
  #zap.on { opacity:1; transition:opacity .04s linear; }
  #ver { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); z-index:10;
    color:#fff; opacity:.55; font-size:13px; font-weight:bold; letter-spacing:.5px;
    text-shadow:0 1px 3px rgba(0,40,80,.6); pointer-events:none; }

  #shop { position:fixed; inset:0; z-index:12; background:rgba(6,26,46,.94); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:16px; }
  #shop .shopwrap { width:min(620px,100%); max-height:100%; display:flex; flex-direction:column; }
  #shop .go { align-self:center; margin-top:12px; }

  #clip { position:fixed; inset:0; z-index:14; background:rgba(4,18,34,.96); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:18px; }
  #clip .clipbox { width:min(520px,100%); text-align:center; }
  #clip .clipart { position:relative; height:min(46vh,260px); border-radius:16px; overflow:hidden;
    background:linear-gradient(#3a2a6b 0%, #b4496a 42%, #ff8a3c 62%, #1d7fc4 62%, #0d4f8c 100%); }
  #clip .sun { position:absolute; left:50%; top:44%; width:74px; height:74px; margin:-37px 0 0 -37px;
    border-radius:50%; background:#ffe9b0; box-shadow:0 0 60px 24px rgba(255,190,110,.55); }
  #clip .sea { position:absolute; left:0; right:0; bottom:0; height:38%;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.12) 0 2px, rgba(255,255,255,0) 2px 12px); }
  #clip .sweep { position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 62%);
    transform:translateX(-100%); animation:clipsweep 2.1s linear infinite; }
  @keyframes clipsweep { to { transform:translateX(100%); } }
  #clip .clipmsg { margin-top:16px; font-size:min(5vw,20px); font-weight:bold; }
  #shop h2 { font-size:min(6.5vw,26px); color:#ffdf2e; text-shadow:2px 2px 0 #b8641c; margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #shop h2 span { color:#ffe9a8; font-size:min(4.6vw,19px); text-shadow:none; }
  #shopList { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 4px;
    display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    /* let every row take the height its tile needs — stretched rows squash the
       preview and clip the name and the button straight off the bottom */
    align-content:start; grid-auto-rows:max-content; }
  #shopTabs { display:flex; gap:8px; margin-bottom:11px; }
  #shopTabs .tab { flex:1 1 0; padding:10px 0; font-size:15px; font-weight:800; letter-spacing:.6px;
    color:#cfe2f0; background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.14);
    border-radius:999px; cursor:pointer; transition:background .12s, color .12s, border-color .12s; }
  #shopTabs .tab.on { color:#052a2a; border-color:rgba(160,244,232,.75);
    background:linear-gradient(165deg, rgba(143,240,228,.68), rgba(63,199,184,.40)); }
  .card { display:flex; flex-direction:column; text-align:left; overflow:hidden;
    border-radius:16px; border:1.5px solid rgba(255,255,255,.13);
    background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
    box-shadow:0 8px 20px rgba(0,18,34,.28); }
  .card.on { border-color:#ffdf2e;
    box-shadow:0 0 0 1px rgba(255,223,46,.45), 0 10px 24px rgba(90,70,0,.34); }
  .card .thumb { width:100%; aspect-ratio:4/3; object-fit:contain; display:block;
    background:radial-gradient(circle at 50% 36%, rgba(126,200,236,.22), rgba(6,24,42,.34)); }
  .card .info { padding:9px 11px 11px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .card .nm { font-weight:800; font-size:15px; letter-spacing:.2px; }
  .card .bl { font-size:11.5px; opacity:.76; line-height:1.34; flex:1; }
  .card .act { margin-top:7px; }
  .card button { width:100%; padding:11px 0; font-size:14px; font-weight:800; color:#fff;
    letter-spacing:.3px; border-radius:999px; cursor:pointer;
    text-shadow:0 1px 3px rgba(0,20,40,.5);
    border:1.5px solid rgba(255,255,255,.42);
    background:linear-gradient(165deg, rgba(255,186,96,.80), rgba(238,110,20,.56));
    box-shadow:0 6px 14px rgba(0,20,40,.26), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .08s ease, filter .12s ease; }
  .card button:active { transform:translateY(2px) scale(.985); filter:brightness(1.06); }
  .card button.own { background:linear-gradient(165deg, rgba(104,236,216,.56), rgba(18,152,140,.30));
    border-color:rgba(178,246,236,.55);
    box-shadow:0 6px 14px rgba(0,20,40,.26), inset 0 1px 0 rgba(255,255,255,.55); }
  .card button:disabled { background:linear-gradient(180deg, rgba(120,146,170,.26), rgba(55,72,90,.22));
    border-color:rgba(255,255,255,.16); color:#b4c6d6; text-shadow:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12); cursor:default; transform:none; }
  .card .tag { display:block; text-align:center; padding:11px 0; border-radius:999px;
    font-size:14px; font-weight:800; letter-spacing:.6px; color:#1a1405;
    border:1.5px solid rgba(255,246,200,.6);
    background:linear-gradient(165deg, rgba(255,232,134,.72), rgba(245,197,24,.42)); }
  /* a scallop shell in mother-of-pearl: ribbed, warm at the hinge, cool at the rim.
     The holed disc it replaces read as a CD at small sizes, which is the one thing a
     beach currency should not look like. */
  .pk { display:inline-block; width:1em; height:1em; vertical-align:-0.14em; margin:0 .1em 0 .14em;
    background:url("data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><defs><linearGradient id=%22a%22 x1=%2214%25%22 y1=%228%25%22 x2=%2284%25%22 y2=%2296%25%22><stop offset=%220%22 stop-color=%22%23fffdf7%22/><stop offset=%22.26%22 stop-color=%22%23ffeed4%22/><stop offset=%22.54%22 stop-color=%22%23ffd8e4%22/><stop offset=%22.79%22 stop-color=%22%23cdeef8%22/><stop offset=%221%22 stop-color=%22%237cc6da%22/></linearGradient></defs><path d=%22M11.6 26.2h8.8l-1.5 3.4h-5.8Z%22 fill=%22%23e9d3ae%22 stroke=%22%239d7f5c%22 stroke-opacity=%22.5%22 stroke-width=%22.8%22 stroke-linejoin=%22round%22/><path fill=%22url(%23a)%22 stroke=%22%2379a7b6%22 stroke-opacity=%22.55%22 stroke-width=%22.9%22 stroke-linejoin=%22round%22 d=%22M2.4 12.8Q3.9 8.2 6.5 12.1Q8.9 7.6 11.3 11.7Q13.7 7.2 16 11.4Q18.3 7.2 20.7 11.7Q23.1 7.6 25.5 12.1Q28.1 8.2 29.6 12.8Q29.9 21.4 22.6 26.4Q19.5 28.4 16 28.4Q12.5 28.4 9.4 26.4Q2.1 21.4 2.4 12.8Z%22/><g fill=%22none%22 stroke=%22%23c2917c%22 stroke-opacity=%22.40%22 stroke-width=%221.05%22 stroke-linecap=%22round%22><path d=%22M16 27.3V12.6%22/><path d=%22M12.6 27.0 9.2 13.4%22/><path d=%22M19.4 27.0 22.8 13.4%22/><path d=%22M9.6 25.4 4.6 13.9%22/><path d=%22M22.4 25.4 27.4 13.9%22/></g><path d=%22M5.6 19.6a13 13 0 0 1-1.5-5.8%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%22.8%22 stroke-width=%221.8%22 stroke-linecap=%22round%22/></svg>") center/contain no-repeat;
    filter:drop-shadow(0 1px 1px rgba(0,20,40,.35)); }
  #hud .pk { width:.86em; height:.86em; }
  .hidden { display:none !important; }
  /* the panel behind the version number: five taps on it opens the run history */
  #stats { position:fixed; inset:0; z-index:14; background:rgba(4,18,32,.965); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:14px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #stats .wrap { width:min(560px,100%); max-height:100%; display:flex; flex-direction:column; }
  #stats h2 { margin:0 0 10px; font-size:21px; letter-spacing:.4px; display:flex;
    align-items:baseline; gap:9px; }
  #stats h2 small { font-size:11px; font-weight:600; letter-spacing:1.5px;
    text-transform:uppercase; opacity:.5; }
  #stBody { overflow:auto; -webkit-overflow-scrolling:touch; padding-right:2px; }
  #stats .sec { margin:0 0 16px; }
  #stats .sec h3 { margin:0 0 5px; font-size:10.5px; font-weight:800; letter-spacing:1.6px;
    text-transform:uppercase; color:#7ee8d6; }
  #stats .row { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
    padding:5px 1px; border-bottom:1px solid rgba(255,255,255,.075); font-size:13.5px; }
  #stats .row span:first-child { opacity:.78; }
  #stats .row b { font-weight:800; white-space:nowrap; }
  #stats .meter { padding:5px 1px 7px; border-bottom:1px solid rgba(255,255,255,.075); }
  #stats .meter .t { display:flex; justify-content:space-between; font-size:13px; }
  #stats .meter .t span:first-child { opacity:.78; }
  #stats .bar { height:5px; border-radius:3px; margin-top:4px; background:rgba(255,255,255,.13); }
  #stats .bar i { display:block; height:100%; border-radius:3px; min-width:2px;
    background:linear-gradient(90deg,#3fc0e6,#7ee896); }
  #stats .none { opacity:.45; font-size:13px; padding:5px 1px; }
  #stats .heroes { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin:2px 0 16px; }

const sunDir=new THREE.Vector3(-0.45,0.75,-0.5).normalize();

// ---------- shared wave model ----------
// Real swell: every component propagates at its own speed. In deep water that is

// back of a group, peak, and die at the front.
const WAVE_G=9.8, WAVE_TSCALE=1.0;
const WAVES=[

  {dx: 0.60, dz: 0.80, k:0.310, a:0.520, ek:0.42, ep:2.10},
  {dx:-0.74, dz: 0.67, k:0.470, a:0.260, ek:0.50, ep:4.20},
  {dx: 0.40, dz:-0.92, k:0.720, a:0.110, ek:0.58, ep:1.30},
  {dx: 1.00, dz: 0.00, k:1.050, a:0.050, ek:0.66, ep:5.40},
  {dx: 0.86, dz: 0.51, k:1.700, a:0.030, ek:0.72, ep:3.10},   // chop
  {dx:-0.35, dz: 0.94, k:2.600, a:0.016, ek:0.80, ep:0.70},   // finer chop
].map(w=>({...w, w:Math.sqrt(WAVE_G*w.k)*WAVE_TSCALE}));
const ENV_BASE=0.32, ENV_SWING=0.68;      // envelope floor and how far it breathes
// A jet ski's wake is not a separate object floating on the sea — it is the sea. It
// is added straight into the height field as a broad ridge, so the ocean shader
// lights it, foams it and fogs it exactly like every other wave, and the board and
// every floating thing ride over it for free.
const WK_SIGMA=18.0, WK_HALF=64.0;
let wkZ=0, wkA=0, wkX=0;                  // field-space centre, height, lateral centre
function wakeBump(x,z){
  if(wkA<=0.001)return 0;
  const dz=z-wkZ;

  const ax=Math.max(0,Math.min(1,1-Math.abs(x-wkX)/WK_HALF));
  return wkA*ez*ax*ax*(3-2*ax);
}

// into, so the shader shades and foams the slope for free and everything afloat rides
// down it rather than hovering over a decal.
// Wide enough to span nearly the whole lane. At 13 it sat inside the water you were
// already using and could be steered round without ever committing to it, which made
// it scenery. The ramp and the jelly on its rim are the way out.
const WH_R=20.0;

// makes the hole in the middle.
function whirlProfile(k){ return k*k*(3-2*k)*(1+2.1*Math.pow(k,7)); }

function setNoise(t){
  return 0.45*Math.sin(t*0.055)+0.30*Math.sin(t*0.021+2.1)+0.25*Math.sin(t*0.009+4.7);

const ZSTRETCH=1.0;                     // natural wave shape again
let WAVE_DRIFT=0.46;                    // how fast the swell rolls past — climbs slightly as you go
function waveComp(W,x,z,t){
  const u=W.dx*x+W.dz*z*ZSTRETCH;
  const env=ENV_BASE+ENV_SWING*Math.sin(u*W.k*W.ek - t*W.w*W.ek*0.5 + W.ep);
  return W.a*env*Math.sin(u*W.k - t*W.w);
}

  let h=0;
  for(const W of WAVES)h+=waveComp(W,x,z,t);

// the long-period part of the sea only — what a floating object actually rides.
// Short chop is filtered out, so buoys glide over the swell instead of vibrating,
// and because they track the big waves they never get buried by a crest.
function swellH(x,z,t){
  let h=0;
  for(let i=0;i<2;i++)h+=waveComp(WAVES[i],x,z,t);
  return h*waveAmp*1.06+wakeBump(x,z)+whirlDip(x,z);
}
const OCEAN_Z=-90;
let dist=0;

// ---------- GPU ocean ----------
const ZS=1.0;
const glslWaves=WAVES.map(W=>{
  const u=`(${W.dx.toFixed(2)}*p.x+${(W.dz*ZS).toFixed(4)}*p.y)`;
  const ph=`${u}*${W.k.toFixed(3)}-uT*${W.w.toFixed(4)}`;
  const en=`(${ENV_BASE.toFixed(2)}+${ENV_SWING.toFixed(2)}*sin(${u}*${(W.k*W.ek).toFixed(5)}-uT*${(W.w*W.ek*0.5).toFixed(5)}+${W.ep.toFixed(2)}))`;
  // the envelope varies far more slowly than the wave, so the normals treat it as
  // locally constant — visually indistinguishable and much cheaper
  return `e=${en};
h+=${W.a.toFixed(3)}*e*sin(${ph});
dhx+=${W.a.toFixed(3)}*e*${W.k.toFixed(3)}*${W.dx.toFixed(2)}*cos(${ph});
dhz+=${W.a.toFixed(3)}*e*${W.k.toFixed(3)}*${(W.dz*ZS).toFixed(4)}*cos(${ph});`;
}).join('\n');
const oceanUniforms={
  uT:{value:0}, uDist:{value:0}, uAmp:{value:1.35}, uPeak:{value:2.85},
  uWakeZ:{value:0}, uWakeA:{value:0}, uWakeX:{value:0},
  uWhX:{value:0}, uWhZ:{value:0}, uWhA:{value:0},
  uSun:{value:sunDir}, uLight:{value:1.0},
  uSky:{value:new THREE.Color(0x8fd2f5)},
  uDeep:{value:new THREE.Color(0x0a5e9c)},
  uShallow:{value:new THREE.Color(0x33aede)},

  uniforms:oceanUniforms,
  vertexShader:`
    uniform float uT; uniform float uDist; uniform float uAmp; uniform float uPeak;
    uniform float uWakeZ; uniform float uWakeA; uniform float uWakeX;
    uniform float uWhX; uniform float uWhZ; uniform float uWhA;
    varying vec3 vN; varying vec3 vW; varying float vH; varying vec2 vPh;
    void main(){
      vec2 p = vec2(position.x, (-position.y + (${OCEAN_Z.toFixed(1)})) + uDist);
      float h=0.0, dhx=0.0, dhz=0.0, e=1.0;
      ${glslWaves}
      h*=uAmp; dhx*=uAmp; dhz*=uAmp;
      // the jet ski's wake, folded into the same surface
      if(uWakeA>0.001){
        float dz=p.y-uWakeZ;

        float ax=clamp(1.0-abs(p.x-uWakeX)/${WK_HALF.toFixed(1)},0.0,1.0);

        dhz += uWakeA*ex*ez*(-dz/${(WK_SIGMA*WK_SIGMA).toFixed(2)});
        float sg=(p.x-uWakeX)>=0.0?1.0:-1.0;
        float dex=(ax>0.0&&ax<1.0)?(6.0*ax*(1.0-ax))*(-sg/${WK_HALF.toFixed(1)}):0.0;

      if(uWhA>0.001){
        vec2 wd=vec2(p.x-uWhX, p.y-uWhZ);

  fragmentShader:`
    uniform vec3 uSun; uniform vec3 uSky; uniform vec3 uDeep; uniform vec3 uShallow;
    uniform float uT; uniform float uDist; uniform float uAmp; uniform float uPeak;
    uniform float uLight;
    varying vec3 vN; varying vec3 vW; varying float vH; varying vec2 vPh;
    // Value noise with a rotation between octaves. The rotation is the point: it
    // stops every octave lining up with the same two axes, which is what made the
    // old sine-product foam tile into a visible net.
    float hash21(vec2 p){
      p=fract(p*vec2(123.34,345.45));
      p+=dot(p,p+34.345);
      return fract(p.x*p.y);
    }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      f=f*f*(3.0-2.0*f);
      float a=hash21(i), b=hash21(i+vec2(1.0,0.0));
      float c=hash21(i+vec2(0.0,1.0)), d=hash21(i+vec2(1.0,1.0));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    }
    float fbm(vec2 p){
      float v=0.0, a=0.5;
      mat2 m=mat2(1.62,1.18,-1.18,1.62);
      for(int i=0;i<3;i++){ v+=a*vnoise(p); p=m*p; a*=0.5; }
      return v/0.875;
    }
    void main(){
      vec3 N = normalize(vN);
      vec3 L = normalize(uSun);
      vec3 V = normalize(cameraPosition - vW);
      float diff = max(dot(N,L),0.0);
      vec3 H = normalize(L+V);
      float spec = pow(max(dot(N,H),0.0),140.0)*0.9;
      float fres = pow(1.0-max(dot(N,V),0.0),3.0);
      vec3 base = mix(uDeep,uShallow,clamp(vH*0.28+0.5,0.0,1.0));
      vec3 col = base*(0.38+0.72*diff) + uSky*fres*0.5 + vec3(spec);
      // Foam: crest caps, torn patches and fine flecks, all from drifting noise. Each
      // layer is anchored in a slower-moving frame than the one below it, because they
      // were all riding the full drift: at nearly four cycles a unit the flecks were
      // stepping more than a whole cycle between frames once the speed came up, which
      // reads as the sea running backwards. The coarse foam keeps the real drift, so
      // the water still travels; only the detail is held back.
      vec2 fpC = vec2(vW.x, vW.z + uDist*0.55);
      vec2 fpM = vec2(vW.x, vW.z + uDist*0.30);
      vec2 fpF = vec2(vW.x, vW.z + uDist*0.12);
      float shimmer = fbm(fpC*0.55 + vec2(uT*0.05,-uT*0.04))*2.0 - 1.0;
      float crest = smoothstep(0.42*uPeak, 0.71*uPeak, vH+shimmer*0.10);
      float lace  = smoothstep(0.40,0.84, fbm(fpM*1.45 + vec2(-uT*0.07, uT*0.06))) * crest;
      float fleck = smoothstep(0.56,0.93, fbm(fpF*3.90 + vec2( uT*0.11, uT*0.09))) * crest;
      float slope = 1.0-clamp(N.y,0.0,1.0);
      float lip = smoothstep(0.16,0.34,slope)*smoothstep(0.25*uPeak,0.55*uPeak,vH);
      float foam = clamp(crest*0.50 + lace*0.68 + fleck*0.34 + lip*0.60, 0.0, 1.0);
      col = mix(col, vec3(0.96,0.99,1.0), foam*0.85);
      col += vec3(1.0)*pow(max(dot(N,H),0.0),480.0)*0.6;

      // tone-map + encode returns exactly the intended shade
      col = pow(clamp(col,0.0,1.0), vec3(2.2));

const oceanGeo=new THREE.PlaneGeometry(220,300,300,340);

function vivid(hex,boost){
  const c=new THREE.Color(hex);
  const b=boost===undefined?1.0:boost;
  // push saturation: pull each channel away from its own average
  const avg=(c.r+c.g+c.b)/3, k=0.30*b;
  c.r=Math.max(0,Math.min(1,avg+(c.r-avg)*(1+k)));
  c.g=Math.max(0,Math.min(1,avg+(c.g-avg)*(1+k)));
  c.b=Math.max(0,Math.min(1,avg+(c.b-avg)*(1+k)));

}

  if(o.opacity!==undefined)params.opacity=o.opacity;

function makeFin(x,z,tilt,size){

// Drop a .glb into models/ and it replaces the built-in shape: models/board.glb for
// the surfboard, models/buoy.glb, log.glb, jelly.glb, ramp.glb, octopus.glb,
// bigfin.glb, jetski.glb, pug.glb for the rest. If a file is not there the load
// fails quietly and the procedural version stays, so the game always runs and parts

function boxOf(o){o.updateMatrixWorld(true);return new THREE.Box3().setFromObject(o);}

  spin.add(root); flip.add(spin); wrap.add(flip);

  const tSize=target.getSize(new THREE.Vector3());
  const q=AXIS_SPIN[longAxis(size)+longAxis(tSize)];

  if(orient)orient(wrap,flip);                 // sets flip.rotation, if anything is upside down
  size=boxOf(wrap).getSize(new THREE.Vector3());

  wrap.scale.setScalar(k);

// tail. Turn it until the fins hang down and trail behind.
// A Mirror modifier left unapplied in Blender exports as half the object: every
// vertex on one side of the origin, with a clean edge sitting exactly on it. Build
// the missing half rather than sending the model back — mirroring reverses the face
// winding and the normals, so both are put back the right way round.
function mendMirror(root){
  root.updateMatrixWorld(true);

  const meshes=[];
  root.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.attributes.position)meshes.push(o);});
  if(!meshes.length)return;
  const flat=[], box=new THREE.Box3();
  for(const o of meshes){
    const g=(o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone());
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));   // into the model's own frame
    g.computeBoundingBox(); box.union(g.boundingBox); flat.push(g);

    for(let k=0;k<p.count;k++)p.setX(k,-p.getX(k));

          a.array[(t+2)*a.itemSize+c]=x;

// The layer a flat object's body lies in: slice it and take the layer whose plan
// covers the most ground. For a board that is the deck — the fins, the pad and the
// rocker of the nose all cover far less of it. Counting vertices instead would only
// find wherever the mesh happens to be dense.
function slabInfo(root){
  const pts=sampleVerts(root);
  if(pts.length<64)return null;
  let y0=Infinity,y1=-Infinity,cz=0;
  for(const p of pts){ if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; cz+=p.z; }
  cz/=pts.length;
  if(y1-y0<1e-6)return null;
  const N=24, lo=new Float64Array(N).fill(Infinity), hi=new Float64Array(N).fill(-Infinity),
        zlo=new Float64Array(N).fill(Infinity), zhi=new Float64Array(N).fill(-Infinity);
  for(const p of pts){
    const b=Math.min(N-1,Math.floor((p.y-y0)/(y1-y0)*N));
    if(p.x<lo[b])lo[b]=p.x; if(p.x>hi[b])hi[b]=p.x;
    if(p.z<zlo[b])zlo[b]=p.z; if(p.z>zhi[b])zhi[b]=p.z;
  }
  let bestB=0,bestA=-1;
  for(let b=0;b<N;b++){
    if(hi[b]<lo[b])continue;
    const a=(hi[b]-lo[b])*(zhi[b]-zlo[b]);
    if(a>bestA){bestA=a;bestB=b;}
  }
  return {pts,cz,y0,y1,ys:y0+(bestB+0.5)/N*(y1-y0)};

// deck, so the face they are on is the underside and the end they sit at is the tail.
// Turn it until they hang down and trail behind.
function orientBoard(wrap,flip){
  const s=slabInfo(wrap);

  const above=s.y1-s.ys, below=s.ys-s.y0;
  const upsideDown = above>below*1.5;                 // the fins stand clear on top
  if(!upsideDown && below<=above*1.5)return;          // nothing to read: leave it as exported
  const fy = upsideDown ? s.ys+above*0.45 : s.ys-below*0.45;

  for(const p of s.pts){ if(upsideDown ? p.y>fy : p.y<fy){fz+=p.z;fn++;} }

  const box=new THREE.Box3(), tmp=new THREE.Box3(), m0=new THREE.Matrix4();
  root.traverse(o=>{
    if(!o.isMesh||!o.geometry)return;
    if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
    tmp.copy(o.geometry.boundingBox).applyMatrix4(m0.multiplyMatrices(inv,o.matrixWorld));
    box.union(tmp);
  });
  const c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
  const body=new THREE.MeshStandardMaterial({vertexColors:true,color:0xffffff,
    roughness:0.31,metalness:0.02});
  body.envMapIntensity=0.38;      // glassed, but not so glassed the paint disappears
  const fin=new THREE.MeshStandardMaterial({color:AS_FIN.clone(),roughness:0.18,metalness:0.05});
  fin.envMapIntensity=0.55;
  const v=new THREE.Vector3(), m4=new THREE.Matrix4();
  root.traverse(o=>{
    if(!o.isMesh||!o.geometry||!o.geometry.attributes.position)return;
    const lum=o.material&&o.material.color
      ? o.material.color.r*0.3+o.material.color.g*0.6+o.material.color.b*0.1 : 1;
    if(lum<0.04){ o.material=fin; return; }      // the export's black group is the fins
    m4.multiplyMatrices(inv,o.matrixWorld);
    // Paint by which way the surface faces rather than by how far across it is. A
    // board narrows toward both ends, so a fraction of the overall width only lands
    // on the rail at the widest point; the rail is wherever the surface turns over,
    // and that reads as an even outline the whole way round.
    const nm=new THREE.Matrix3().getNormalMatrix(m4);
    const p=o.geometry.attributes.position, nrm=o.geometry.attributes.normal;
    const col=new Float32Array(p.count*3), n=new THREE.Vector3();
    for(let i=0;i<p.count;i++){
      v.fromBufferAttribute(p,i).applyMatrix4(m4);
      let t;
      if(nrm){
        n.fromBufferAttribute(nrm,i).applyMatrix3(nm).normalize();
        t=(n.y<-0.12||Math.abs(n.x)>0.45)?AS_BLACK:AS_TEAL;
      } else {
        t=(v.y<c.y)?AS_BLACK:AS_TEAL;
      }
      col[i*3]=t.r;col[i*3+1]=t.g;col[i*3+2]=t.b;
    }
    o.geometry.setAttribute('color',new THREE.BufferAttribute(col,3));
    o.material=body;
  });
  return box;
}
loadModel('board.glb',s=>{
  const fitted=skinAndFit('board',s,BOARD_BOX,orientBoard);
  // Match deck to deck rather than box to box. A thin model has nothing like the
  // built-in board's deep fins, so centring the two boxes would perch it on top of
  // the water and leave the rider's feet in the air; lining the decks up puts the
  // hull at the same depth and the feet back on the grip.
  fitted.userData.frame.position.y+=(BOARD_SLAB-slabY(fitted))/fitted.userData.k;
  stockBoard.clear ? stockBoard.clear() : (stockBoard.children.length=0);
  stockBoard.add(fitted);
  fitted.add(astroDecal(astroLivery(fitted)));
  // its shop picture, if one was already taken, was of the unpainted model
  try{ prevCache['b:astro']=''; }catch(e){}
});

// ---------- telemetry ----------
// Everything here stays on the device: it is written to this browser's local storage
// and read back by the panel behind the version number. Nothing is sent anywhere, so
// it is one player's history — the person holding the phone — not an audience.
const STATS_KEY='surfStats1';
const BUCKET=100;                              // how far he got, to the nearest 100 m
function blankStats(){
  return {opens:0, first:'', last:'', days:0, streak:0, bestStreak:0,
    runs:0, dist:0, bestDist:0, score:0, secs:0,
    deaths:{}, where:{}, tricks:{}, src:{gesture:0,button:0,key:0},
    earned:0, spent:0, revives:0, buys:[]};
}
let stats=blankStats();
function loadStats(){
  try{ stats=Object.assign(blankStats(),JSON.parse(localStorage.getItem(STATS_KEY)||'{}')); }
  catch(e){ stats=blankStats(); }
}
let statsDirty=false;
function saveStats(){
  try{ localStorage.setItem(STATS_KEY,JSON.stringify(stats)); statsDirty=false; }catch(e){}
}
function bump(o,k,n){ o[k]=(o[k]||0)+(n===undefined?1:n); statsDirty=true; }
function dayStamp(d){
  const p=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function daysApart(a,b){                        // both 'YYYY-MM-DD', local calendar days
  const A=new Date(a+'T00:00:00'), B=new Date(b+'T00:00:00');
  return Math.round((B-A)/86400000);
}
// called once when the page opens: this is the login, and the streak lives or dies here
function noteOpen(){
  const t=dayStamp(new Date());
  bump(stats,'opens');
  if(!stats.first)stats.first=t;
  if(stats.last!==t){
    const gap=stats.last?daysApart(stats.last,t):999;
    stats.streak = gap===1 ? stats.streak+1 : 1;   // a missed day starts the count over
    stats.bestStreak=Math.max(stats.bestStreak,stats.streak);
    bump(stats,'days');
    stats.last=t;
  }
  if(!stats.streak){stats.streak=1;stats.bestStreak=Math.max(1,stats.bestStreak);}
  saveStats();
}
// Coming back is not always a fresh page load — on a phone the tab is usually still
// there, so a return after a long spell in the background counts as a visit of its
// own. That also picks up the streak when somebody plays either side of midnight.
let hidAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hidAt=Date.now(); return; }
  if(hidAt&&Date.now()-hidAt>30*60*1000)noteOpen();
  hidAt=0;
});
function noteTrick(name,src){
  bump(stats.tricks,name);
  bump(stats.src,src||'gesture');
}
function noteBuy(kind,id,price){
  stats.buys.push({k:kind,id,p:price,d:dayStamp(new Date())});
  if(stats.buys.length>200)stats.buys.shift();
  bump(stats,'spent',price);
  saveStats();
}
// a run ends at every wipeout, revived or not — the distance is banked as a delta so a
// revived run does not count the ground it already covered a second time
let runDist0=0, runSecs=0;
function noteWipe(kind){
  const d=Math.max(0,dist-runDist0);
  bump(stats,'runs');
  bump(stats.deaths,kind);
  bump(stats.where,String(Math.floor(dist/BUCKET)*BUCKET));
  bump(stats,'dist',Math.round(d));
  bump(stats,'secs',Math.round(runSecs));
  stats.bestDist=Math.max(stats.bestDist,Math.round(dist));
  runDist0=dist; runSecs=0;
  saveStats();
}

// ---------- the board rack ----------
// Every board bar Astro's own is lofted from a spec rather than modelled: an outline
// curve, a rocker, a rail profile and a paint scheme. Sampling that finely is what
// makes them dense — a little over ten thousand triangles each — and it means a new
// shape is a dozen numbers rather than a new mesh.
const _sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
function buildBoardMesh(S){
  const NU=S.nu||160, NR=S.nr||46, L=S.L, W=S.W, T=S.T;
  // outline: a single-peaked curve whose wide point moves with the two exponents,
  // then blended into whatever width the nose and tail actually finish at
  const a=S.noseA, b=S.tailA, up=a/(a+b);
  const peak=Math.pow(up,a)*Math.pow(1-up,b);
  const beta=u=>Math.pow(Math.max(0,u),a)*Math.pow(Math.max(0,1-u),b)/peak;
  // Both ends have to close. The thickness envelope below already runs to nothing at
  // the tips, so if the plan outline still finished at its full nose width the last
  // ring would be a flat, zero-thickness flange the width of the nose — a lens of
  // board sticking out past the shape. Each end is rounded off over a span equal to
  // its own half-width, which is exactly a semicircle in plan: a wide nose finishes in
  // a broad curve, a narrow one comes to a point, and both close on the thickness.
  const tipR=(wid)=>Math.min(0.14,Math.max(0.004,W*wid/L*(S.tipK||1)));
  const tN=tipR(S.noseW), tT=tipR(S.tailW);
  const round=(d,r)=>d>=r?1:Math.sqrt(Math.max(0,1-(1-d/r)*(1-d/r)));
  const hw=u=>{
    const kn=1-_sm(0,0.16,u), kt=_sm(0.82,1,u);
    return W*(beta(u)*(1-kn)*(1-kt) + S.noseW*kn + S.tailW*kt)*round(u,tN)*round(1-u,tT);
  };
  // thickness runs to nothing at both tips, so the loft closes on a thin edge the
  // way a real board does, with its fullest point just ahead of centre
  const th=u=>Math.pow(Math.sin(Math.PI*Math.pow(Math.max(0,Math.min(1,u)),S.thSkew||1.0)),S.thPow||0.5);
  const rock=u=>S.rockN*Math.pow(Math.max(0,(S.noseR-u)/S.noseR),2.2)
                +S.rockT*Math.pow(Math.max(0,(u-1+S.tailR)/S.tailR),2.2);
  // a swallow tail is the middle of the tail cut forward, so it is a shift in z
  const swal=S.swallow?(u,v)=>-S.swallow*_sm(0.80,1,u)*(1-Math.pow(Math.abs(v),1.7)):null;
  // an asymmetric board is genuinely two different halves: the heel side can run
  // wider and its tail can be cut forward of the toe side's
  const asW=(v)=>v<0?(S.asymW||1):1;
  const notch=(u,v)=>(swal?swal(u,v):0)
    +(S.asymZ&&v<0?-S.asymZ*_sm(0.62,1,u)*Math.abs(v):0);

  const pos=[],col=[],idx=[];
  const c=new THREE.Color();
  for(let i=0;i<=NU;i++){
    const u=i/NU, w=hw(u), t=th(u), r=rock(u);
    for(let j=0;j<NR;j++){
      const phi=j/NR*Math.PI*2;
      const v=Math.sin(phi), sAbs=Math.abs(v), top=Math.cos(phi)>=0;
      const prof=Math.pow(Math.max(0,1-sAbs*sAbs), top?(S.deckPow||0.56):(S.hullPow||0.42));
      pos.push(w*v*asW(v), r+(top?T*t*prof:-T*(S.hullK||0.62)*t*prof), (u-0.5)*L+notch(u,v));
      S.paint(c,u,v,top);
      col.push(c.r,c.g,c.b);
    }
  }
  for(let i=0;i<NU;i++)for(let j=0;j<NR;j++){
    const j2=(j+1)%NR, A=i*NR+j, B=i*NR+j2, C=(i+1)*NR+j, D=(i+1)*NR+j2;
    idx.push(A,C,B, B,C,D);
  }
  // cap the two tips: the rings there are all but closed, but a fan seals them
  for(const [ring,fwd] of [[0,false],[NU,true]]){
    const base=pos.length/3, u=ring/NU;
    pos.push(0,rock(u),(u-0.5)*L+notch(u,0));
    S.paint(c,u,0,true); col.push(c.r,c.g,c.b);
    for(let j=0;j<NR;j++){
      const j2=(j+1)%NR;
      if(fwd)idx.push(base,ring*NR+j,ring*NR+j2); else idx.push(base,ring*NR+j2,ring*NR+j);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,color:0xffffff,
    roughness:S.rough!==undefined?S.rough:0.27,metalness:0.02});
  // wet-looking but not mirrored: a low sun on a glassier finish blows the deck out
  // to white and the paint scheme stops reading at all
  mat.envMapIntensity=0.40;
  const mesh=new THREE.Mesh(g,mat);

  const grp=new THREE.Group(); grp.add(mesh);
  // grip pad: a thin skin lying on the deck over the back third
  // a twin-tip carries two of them, one under each binding, rather than one long strip
  const padRanges=S.pads||[[S.padU0||0.735,S.padU1||0.945]];
  if(S.pad!==false)for(const [P0,P1] of padRanges){
    const PU=34, PV=18, pp=[], pi=[];
    const wide=S.padW||0.56;
    for(let i=0;i<=PU;i++){
      // a pad covers the back foot, not the back half: narrower than the outline and
      // rounded off at both ends so it reads as a pad rather than a paint job
      const e=Math.sin(Math.PI*Math.min(1,Math.max(0,i/PU)))*0.5+0.5;
      const u=P0+(P1-P0)*i/PU, w=hw(u)*wide*Math.pow(e,0.35), t=th(u), r=rock(u);
      for(let j=0;j<=PV;j++){
        const v=-1+2*j/PV;
        const prof=Math.pow(Math.max(0,1-v*v*0.64),S.deckPow||0.56);
        pp.push(w*v*asW(v), r+T*t*prof+0.006, (u-0.5)*L+notch(u,v*0.8));
      }
    }
    for(let i=0;i<PU;i++)for(let j=0;j<PV;j++){
      const A=i*(PV+1)+j, B=A+1, C=A+PV+1, D=C+1;
      pi.push(A,C,B, B,C,D);
    }
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
    pg.setIndex(pi); pg.computeVertexNormals();
    grp.add(new THREE.Mesh(pg,PBR({color:S.padCol||0x22262b,roughness:0.78,metalness:0.0})));
  }
  // fins
  const finMat=PBR({color:S.finCol||0x14181d,roughness:0.14,metalness:0.05,envMapIntensity:1.2});
  for(const f of S.fins){
    const sh=new THREE.Shape();
    const cL=f.c, d=f.d, rk=f.rake===undefined?0.10:f.rake;
    sh.moveTo(-cL*0.5,0);
    sh.bezierCurveTo(-cL*0.30,-d*0.44, -cL*0.02+rk,-d*0.82, cL*0.14+rk,-d);
    sh.bezierCurveTo(cL*0.30+rk*0.5,-d*0.66, cL*0.42,-d*0.30, cL*0.5,0);
    sh.lineTo(-cL*0.5,0);
    const fg=new THREE.ExtrudeGeometry(sh,{depth:f.t||0.030,bevelEnabled:true,
      bevelSize:(f.t||0.030)*0.45,bevelThickness:(f.t||0.030)*0.40,bevelSegments:3,curveSegments:26});
    fg.translate(0,0,-(f.t||0.030)/2);
    const m=new THREE.Mesh(fg,finMat);
    m.rotation.y=Math.PI/2;                      // thickness now runs across the board
    const u=0.5+f.z/L;
    m.position.set(f.x, rock(u)-T*(S.hullK||0.62)*th(u)*0.92, f.z);
    m.rotation.z=f.cant||0;
    grp.add(m);
  }
  grp.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return grp;
}
// paint helpers: everything is authored in sRGB and moved into linear by vivid()
function _mix(c,hex,k){const t=vivid(hex,1.25);c.lerp(t,k);return c;}
function deckScheme(o){
  const sw=o.sw||0.022, ra=o.railAt||0.88;
  return (c,u,v,top)=>{
    const s=Math.abs(v);
    if(top){
      c.copy(vivid(o.deck,o.vivid===undefined?1.35:o.vivid));
      if(o.bands){                                   // resin bands sprayed across the deck
        for(const [at,wid,hex] of o.bands)c.lerp(vivid(hex,1.4),Math.max(0,1-Math.abs(u-at)/wid));
      }
      if(o.stringer&&s<sw)c.copy(vivid(o.stringer,1.3));
      if(o.vstripes)for(const [at,wd,hex] of o.vstripes)
        if(Math.abs(s-at)<wd)_mix(c,hex,1-Math.abs(s-at)/wd);
      if(s>ra)_mix(c,o.rail,_sm(ra,1.0,s));
    } else {
      c.copy(vivid(o.hull,1.2));
      if(o.stringer&&s<sw)c.copy(vivid(o.stringer,1.3));
      if(o.pin&&s>ra-0.08&&s<ra+0.02)_mix(c,o.pin,1-Math.abs(s-(ra-0.03))/0.05);
      if(s>ra+0.02)_mix(c,o.rail,_sm(ra+0.02,1.0,s));
    }
  };
}

const BOARD_BY_ID={}; for(const b of BOARDS)BOARD_BY_ID[b.id]=b;
const _rack={};
function boardArtFor(id){
  if(id==='astro')return stockBoard;
  if(!_rack[id]){
    const g=buildBoardMesh(BOARD_BY_ID[id].spec);
    g.position.y+=BOARD_SLAB-slabY(g);        // decks line up, so every board rides the same
    _rack[id]=g;
  }
  return _rack[id];
}
function equipBoard(id){
  if(!BOARD_BY_ID[id])id='astro';
  equipped=id;
  boardArt.clear ? boardArt.clear() : (boardArt.children.length=0);
  boardArt.add(boardArtFor(id));
}

loadSave(); loadStats(); noteOpen(); equipBoard(equipped);

// ---------- the shop ----------
// Coins come out of a run: how far Astro got and how well he scored getting there.
// Everything bought is cosmetic — the boards ride identically, they just look
// different, so buying one can never make the game easier or harder.
// Puka shells: what a run is worth. Distance pays the steady part and score pays for
// how you rode it, and both halves are shown so it is obvious where they came from.
function pukaFromDist(d){ return Math.floor(d/5); }
function pukaFromScore(sc){ return Math.floor(sc/18); }
function coinsFor(d,sc){ return pukaFromDist(d)+pukaFromScore(sc); }
function showCoins(){
  const t=String(coins);
  if(hCoins)hCoins.textContent=t;
  if(ovCoins)ovCoins.textContent=t;
  if(shopCoins)shopCoins.innerHTML=t+'<i class="pk"></i>';
}
const RACK_ORDER=BOARDS.slice().sort((a,b)=>a.price-b.price);
// ---------- shop previews ----------
// Each item is photographed once through the renderer that is already running: put it
// alone in a small scene, render into an off-screen target, read the pixels back and
// keep the picture. Cheaper than a second canvas and it lights everything exactly the
// way the game does.
const PREV_W=248, PREV_H=186;
let prevTarget=null, prevScene=null, prevCam=null;
const prevCache={};
function previewSetup(){
  if(prevScene)return;
  prevTarget=new THREE.WebGLRenderTarget(PREV_W*2,PREV_H*2,
    {minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  prevScene=new THREE.Scene();
  prevScene.environment=scene.environment;
  prevScene.add(new THREE.HemisphereLight(0xffffff,0x8fa6bd,1.05));
  const k=new THREE.DirectionalLight(0xfff3e0,1.8); k.position.set(-1.4,2.2,2.6); prevScene.add(k);
  const f=new THREE.DirectionalLight(0xbfd8ff,0.55); f.position.set(2.0,0.7,-1.8); prevScene.add(f);
  prevCam=new THREE.PerspectiveCamera(32,PREV_W/PREV_H,0.05,90);

function snapshot(obj,swing,lift,zoom){
  previewSetup();
  const par=obj.parent;
  const keepP=obj.position.clone(), keepR=obj.rotation.clone();
  prevScene.add(obj);
  obj.position.set(0,0,0); obj.rotation.set(0,0,0);
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj);
  const c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
  const R=Math.max(sz.x,sz.y,sz.z)*0.5;
  const d=R/Math.tan(prevCam.fov*Math.PI/360)*(zoom||1.5);
  prevCam.position.set(c.x+d*Math.sin(swing), c.y+d*lift, c.z+d*Math.cos(swing));
  prevCam.lookAt(c);
  const oldT=renderer.getRenderTarget(), oldAC=renderer.autoClear;
  renderer.autoClear=true;
  renderer.setClearColor(0x000000,0);
  renderer.setRenderTarget(prevTarget);
  renderer.clear();
  renderer.render(prevScene,prevCam);
  const W=PREV_W*2,H=PREV_H*2,buf=new Uint8Array(W*H*4);
  renderer.readRenderTargetPixels(prevTarget,0,0,W,H,buf);
  renderer.setRenderTarget(oldT);
  renderer.setClearColor(0x000000,1);
  renderer.autoClear=oldAC;
  prevScene.remove(obj);
  obj.position.copy(keepP); obj.rotation.copy(keepR);
  if(par)par.add(obj);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d'), img=cx.createImageData(W,H);
  for(let y=0;y<H;y++){                       // GL reads bottom-up; a canvas is top-down
    const src=(H-1-y)*W*4;
    img.data.set(buf.subarray(src,src+W*4), y*W*4);
  }
  cx.putImageData(img,0,0);
  return cv.toDataURL('image/png');
}

// it all before the shop appears reads as a hang. The cards go up straight away and
// the pictures are taken one per frame afterwards, so the list is scrollable while
// they arrive and an already-cached shot fills in immediately.
let shopFillId=0;
function fillThumbs(jobs){
  const mine=++shopFillId;
  const step=()=>{
    if(mine!==shopFillId)return;                 // a redraw superseded this pass
    const t0=performance.now();
    while(jobs.length&&performance.now()-t0<9){
      const [im,make]=jobs.shift();
      const src=make(); if(src)im.src=src;
    }
    if(jobs.length)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  {id:'pig',   name:'Kiwi the Pig',   price:1400,
   blurb:'Round, pink and unreasonably buoyant. Floats before the board does.',

  {id:'corgi', name:'Waffle the Corgi',price:2400,

  {id:'panda', name:'Bao the Panda',  price:5500,

  {id:'frog',  name:'Lily the Frog',  price:900,
   blurb:'Born for this. Wide mouth, wider eyes, sticks every landing wetly.',

  {id:'otter', name:'Nori the Otter', price:1900,

  {id:'raccoon',name:'Bandit the Raccoon',price:3000,

  {id:'sloth', name:'Chill the Sloth', price:4200,
   blurb:'Takes the whole wave to make one turn and somehow still makes it.',
   fur:0xa9977c, dark:0x574734, nose:0x2a211a, face:'long',  ears:'tuft',    tail:'stub', eyes:'patch'},
  {id:'lizard',name:'Basil the Lizard',price:6200,
   blurb:'Crested, long-tailed and entirely unbothered. Runs across the flat bits.',
   fur:0x2fb37e, dark:0x18704e, nose:0x0f3a29, iris:0xf2c72a, crest:0xf2a71b, drum:0x1f8a5e,
   face:'lizard',ears:'hole',  tail:'long',   eyes:'reptile', tailTilt:1.05},
  {id:'penguin',name:'Tux the Penguin',price:7500,
   blurb:'Overdressed for the beach. Still the fastest thing off the line.',
   fur:0x20242c, dark:0xf6f6f2, nose:0xf2a01b, beak:0xf2a01b, bib:0xf7f5ee,
   face:'beak',  ears:'none',   tail:'stub',   eyes:'beady'},
  {id:'ant',   name:'De Soto the Ant',price:2700,
   blurb:'Six legs, none of them needed. Carries three times his weight in puka.',
   fur:0xe23a1c, dark:0x8e1b08, nose:0x3a0c04, feelerCol:0xd0300f,
   face:'ant',   ears:'none',   tail:'none',  eyes:'wide',
   segs:true, feelers:true, gloss:0.22, metal:0.15,
   // narrow through the middle, big in the head, and the sockets pulled in with the
   // body so the legs leave it instead of hanging beside it
   // the gaster is the biggest thing on an ant and the head is not — getting that the
   // wrong way round is most of what made the first one look like a balloon
   build:[0.50,0.74,0.52], socket:0.58, limb:0.46, limbLen:1.10, headS:[0.80,0.76,0.82]},
  {id:'rex',   name:'Rexy the T. rex',price:11000,
   blurb:'Tiny arms, enormous everything else. The wave gets out of the way.',
   fur:0x4c7a3a, dark:0x2f5226, nose:0x1c3418, crest:0xd8892a,
   face:'rex',   ears:'none',   tail:'thick',  eyes:'reptile', iris:0xe0532a, spines:true},
];
const CHAR_BY_ID={}; for(const c of CHARS)CHAR_BY_ID[c.id]=c;
function buildChar(id){
  const C=CHAR_BY_ID[id]||CHAR_BY_ID.pug;
  clearKit();
  furMat.color.copy(vivid(C.fur,1.5));
  darkMat.color.copy(vivid(C.dark,1.0));
  const noseMat=mat(C.nose,90);
  const inner=PBR({color:C.inner||(C.face==='snout'?0xd4708a:0xe79aa6),roughness:0.6});
  // proportions: how thick the limbs are and how full the body is
  const L=C.limb||1, B=C.build||[1,1,1], K=C.socket||1;
  for(const m of limbMeshes){
    // the paw keeps its own proportions, so scale it rather than overwrite it
    const b=m.userData.baseScale||(m.userData.baseScale=m.scale.clone());
    m.scale.set(b.x*L, b.y*(C.limbLen||1), b.z*L);
  }
  // arms and legs leave the body where the body actually is
  for(const j of limbJoints){const q=j.userData.socket;j.position.set(q[0]*K,q[1],q[2]*K);}
  torso.scale.set(B[0],B[1],B[2]);
  collar.scale.set(1.15*B[0],1.0*B[1],1.1*B[2]);
  head.scale.set(C.headS?C.headS[0]:1, C.headS?C.headS[1]:1, C.headS?C.headS[2]:1);
  furMat.roughness=C.gloss!==undefined?C.gloss:0.62;
  furMat.metalness=C.metal||0.0;
  kitEyes(C,inner);

  // ---- an insect's body ----
  // Everything overlaps its neighbour on purpose. Built as separate lumps sitting near
  // each other they read as parts floating in formation, which is exactly what the
  // first version looked like; a waist that physically bridges the two and a neck that
  // fills under the head are what make it one animal.
  if(C.segs){
    const shell=PBR({color:C.fur,roughness:C.gloss!==undefined?C.gloss:0.26,
                     metalness:C.metal||0.14,vivid:1.5});
    const band=PBR({color:C.dark,roughness:0.34,metalness:0.1,vivid:1.25});
    const GR=0.345, GZ=0.40, GL=0.50;            // gaster radius, centre, half length
    // the gaster: a big glossy teardrop, front end pushed well inside the thorax
    const gas=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(GR,26,20),shell));
    gas.position.set(0,0.11,GZ);gas.scale.set(0.98,0.98,GL/GR);
    // the segment ridges that make it read as an abdomen and not an egg
    for(let i=0;i<3;i++){
      const dz=(i-0.55)*0.135;
      const rr=GR*0.985*Math.sqrt(Math.max(0.12,1-(dz/GL)*(dz/GL)));
      const b=kit(spine,new THREE.Mesh(new THREE.TorusGeometry(rr,0.016,8,28),band));
      b.position.set(0,0.11,GZ+dz);
    }
    // petiole: a real tapered bridge from the back of the thorax into the gaster
    const pet=kit(spine,new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.085,0.30,16),shell));
    pet.position.set(0,0.17,0.15);pet.rotation.x=Math.PI/2;
    // the thorax, sitting over the shared body so the shoulders have something to be on
    const th=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(0.205,20,16),shell));
    th.position.set(0,0.37,-0.02);th.scale.set(1.0,0.98,1.14);
    // and the neck, filling the space under the head
    const nk=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(0.165,18,14),shell));
    nk.position.set(0,0.60,-0.03);nk.scale.set(1,0.95,1);
  }
  // ---- antennae ----
  if(C.feelers){
    const shell=PBR({color:C.feelerCol||C.dark,roughness:0.3,metalness:0.12,vivid:1.45});
    for(const sx of [-1,1]){
      const base=new THREE.Group();
      base.position.set(sx*0.13,0.30,-0.22);
      base.rotation.set(-0.55,0,sx*0.42);
      headJ.add(base); kitParts.push(base);
      const a1=kit(base,new THREE.Mesh(new THREE.CylinderGeometry(0.019,0.026,0.30,8),shell));
      a1.position.y=0.15;
      const elb=new THREE.Group(); elb.position.y=0.30; elb.rotation.x=0.95; base.add(elb); kitParts.push(elb);
      const a2=kit(elb,new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.019,0.26,8),shell));
      a2.position.y=0.13;
      const tip=kit(elb,new THREE.Mesh(new THREE.SphereGeometry(0.028,10,8),shell));
      tip.position.y=0.27;
      charEars.push(base);
      base.userData.baseX=base.rotation.x; base.userData.side=sx;
    }
  }
  // ---- chest bib: the pale front a penguin or an otter wears ----
  if(C.bib){
    const bm=PBR({color:C.bib,roughness:0.62,vivid:1.2});
    const b=kit(spine,new THREE.Mesh(new THREE.SphereGeometry(0.30,22,18),bm));
    b.position.set(0,0.30,-0.16);b.scale.set(0.98,1.55,0.98);
    const t=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.30,20,16),bm));
    t.position.set(0,-0.15,-0.16);t.scale.set(0.80,0.58,0.94);   // carries up under the chin
  }

  // ---- muzzle ----
  if(C.face==='pug'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.22,18,14),darkMat));
    m.position.set(0,-0.08,-0.34);m.scale.set(1.1,0.85,0.95);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),noseMat)).position.set(0,-0.05,-0.51);
    const t=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),mat(0xff8fa0)));
    t.position.set(0,-0.17,-0.42);t.scale.set(0.8,1.5,0.6);
  } else if(C.face==='snout'){
    const m=kit(headJ,new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.175,0.20,18),inner));
    m.rotation.x=Math.PI/2;m.position.set(0,-0.06,-0.44);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.032,10,8),mat(0x8f4a5e,60)));
      n.position.set(sx*0.058,-0.05,-0.545);n.scale.set(1,1.3,0.5);
    }
  } else if(C.face==='cat'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.17,16,13),furMat));
    m.position.set(0,-0.10,-0.32);m.scale.set(1.15,0.78,0.92);
    const n=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.052,0.07,4),noseMat));
    n.rotation.x=Math.PI/2;n.position.set(0,-0.04,-0.47);
  } else if(C.face==='bunny'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.16,16,13),furMat));
    m.position.set(0,-0.11,-0.31);m.scale.set(1.2,0.80,0.95);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8),noseMat)).position.set(0,-0.05,-0.45);
    for(const sx of [-1,1]){
      const t=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.045,0.07,0.03),mat(0xfffdf6)));
      t.position.set(sx*0.028,-0.155,-0.42);
    }
  } else if(C.face==='frog'){
    // a wide flat mouth cut right across the head, and a broad soft jaw under it
    const j=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.33,24,18),furMat));
    j.position.set(0,-0.12,-0.13);j.scale.set(1.12,0.62,1.05);
    const mouth=kit(headJ,new THREE.Mesh(new THREE.TorusGeometry(0.235,0.030,10,26,Math.PI*0.95),
      PBR({color:0x2a1d22,roughness:0.5})));
    mouth.position.set(0,-0.10,-0.30);mouth.rotation.set(1.62,0,Math.PI);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.028,10,8),mat(0x1d2a1a,60)));
      n.position.set(sx*0.075,0.055,-0.40);
    }
  } else if(C.face==='lizard'){
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.20,20,16),furMat));
    m.position.set(0,-0.06,-0.42);m.scale.set(0.86,0.72,1.65);
    const jaw=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.26,0.045,0.44),
      PBR({color:0x2c2118,roughness:0.55})));
    jaw.position.set(0,-0.135,-0.46);
    for(const sx of [-1,1]){
      const n=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.024,10,8),mat(0x1a2418,60)));
      n.position.set(sx*0.05,-0.02,-0.66);
    }
    for(let i=0;i<7;i++){                              // a crest down the skull
      const t=i/6;
      const sp=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.038-0.018*t,0.11-0.04*t,6),
        PBR({color:C.crest||0xf2a71b,roughness:0.5,vivid:1.5})));
      sp.position.set(0,0.34-t*0.10,-0.02-t*0.30);sp.rotation.x=-0.35-t*0.25;
    }
  } else if(C.face==='rex'){
    // a long heavy skull with a jaw that opens, and a row of teeth in it
    const sk=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.24,22,18),furMat));
    sk.position.set(0,0.02,-0.44);sk.scale.set(0.92,0.86,1.75);
    const jaw=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.19,18,14),furMat));
    jaw.position.set(0,-0.16,-0.46);jaw.scale.set(0.86,0.5,1.6);jaw.rotation.x=0.13;
    const gum=kit(headJ,new THREE.Mesh(new THREE.BoxGeometry(0.30,0.05,0.60),
      PBR({color:0x6d2a34,roughness:0.55})));
    gum.position.set(0,-0.085,-0.52);
    for(let i=0;i<7;i++){
      const z=-0.28-i*0.075;
      for(const sx of [-1,1]){
        const up=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.026,0.075,6),mat(0xfdfaf0,70)));
        up.position.set(sx*0.13,-0.115,z);up.rotation.x=Math.PI;
        const lo=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.022,0.062,6),mat(0xfdfaf0,70)));
        lo.position.set(sx*0.12,-0.145,z);
      }
    }
    const brow=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.10,14,12),darkMat));
    brow.position.set(0,0.19,-0.30);brow.scale.set(1.8,0.5,0.9);
  } else if(C.face==='ant'){
    // a cheerful cartoon ant, so a smile rather than mandibles
    const sm=PBR({color:C.dark,roughness:0.4,vivid:1.2});
    const mouth=kit(headJ,new THREE.Mesh(new THREE.TorusGeometry(0.10,0.019,8,20,Math.PI*0.8),sm));
    mouth.position.set(0,-0.06,-0.31);
    mouth.rotation.set(0.16,0,Math.PI+0.43);
  } else if(C.face==='beak'){
    const b=kit(headJ,new THREE.Mesh(new THREE.ConeGeometry(0.10,0.32,10),
      PBR({color:C.beak||0xf2a01b,roughness:0.35,vivid:1.6})));
    b.rotation.x=-Math.PI/2;b.position.set(0,-0.04,-0.50);
    const c2=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.17,18,14),darkMat));
    c2.position.set(0,0.06,-0.28);c2.scale.set(1.25,1.05,0.55);
  } else {                                   // a proper snout: corgi, panda
    const m=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.19,18,14),furMat));
    m.position.set(0,-0.09,-0.36);m.scale.set(1.0,0.82,1.25);
    kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.062,12,10),noseMat)).position.set(0,-0.045,-0.56);
  }

  // ---- ears ----
  // whatever shape they are, the ears are registered so the rig can still flap them
  const earAt=(sx,mk)=>{
    const e=kit(headJ,mk());
    e.position.x*=sx; e.rotation.z*=sx; e.rotation.y*=sx;
    e.userData.baseX=e.rotation.x; e.userData.side=sx;
    charEars.push(e); return e;
  };
  for(const sx of [-1,1]){
    if(C.ears==='floppy'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),darkMat);
        e.position.set(0.27,0.26,0.03);e.scale.set(1,1.5,0.65);e.rotation.z=-0.35;return e;});
    } else if(C.ears==='pointed'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.115,0.30,4),furMat);
        e.position.set(0.20,0.42,0.02);e.rotation.z=-0.22;return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.062,0.18,4),inner);
        e.position.set(0.20,0.42,-0.035);e.rotation.z=-0.22;return e;});
    } else if(C.ears==='small'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.10,0.18,4),darkMat);
        e.position.set(0.22,0.34,-0.02);e.rotation.set(0.55,0,-0.30);return e;});
    } else if(C.ears==='big'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.145,0.40,5),furMat);
        e.position.set(0.235,0.46,0.0);e.rotation.z=-0.16;return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.082,0.24,5),inner);
        e.position.set(0.235,0.45,-0.045);e.rotation.z=-0.16;return e;});
    } else if(C.ears==='long'){
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.085,12,14),furMat);
        e.position.set(0.15,0.60,0.0);e.scale.set(0.75,3.5,0.55);e.rotation.z=-0.13;return e;});
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,12),inner);
        e.position.set(0.15,0.60,-0.048);e.scale.set(0.75,3.2,0.35);e.rotation.z=-0.13;return e;});
    } else if(C.ears==='tuft'){               // sloth: a scruff of fur, no real ear
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.10,14,12),furMat);
        e.position.set(0.30,0.20,0.06);e.scale.set(0.75,1.15,0.75);return e;});
    } else if(C.ears==='hole'){                // frogs and lizards: a disc on the skull
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.CircleGeometry(0.075,16),
        PBR({color:C.drum||0x3f6a2a,roughness:0.45}));
        e.position.set(0.30,0.10,-0.05);e.rotation.y=Math.PI/2;return e;});
    } else if(C.ears!=='none'){               // round
      earAt(sx,()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.135,14,12),darkMat);
        e.position.set(0.29,0.33,0.03);e.scale.set(1,1,0.55);return e;});
    }
  }
  if(C.patches)for(const sx of [-1,1]){
    const p=kit(headJ,new THREE.Mesh(new THREE.SphereGeometry(0.135,14,12),darkMat));
    p.position.set(sx*0.175,0.055,-0.315);p.scale.set(1.05,1.25,0.45);p.rotation.z=sx*0.34;
  }
  if(C.whiskers)for(const sx of [-1,1])for(let i=0;i<3;i++){
    const w=kit(headJ,new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.003,0.30,5),mat(0xfdf6e6)));
    w.position.set(sx*0.13,-0.10+i*0.045,-0.42);
    w.rotation.set(0,0,sx*(Math.PI/2-0.20+i*0.16));
  }

  // ---- tail ----
  // chain tails hang off a base that can be pitched: a cat carries one up, a rex
  // holds its out behind as a counterweight
  const tailRoot=(tilt)=>{ if(!tilt)return tailJ;
    const g=new THREE.Group(); g.rotation.x=tilt; tailJ.add(g); kitParts.push(g); return g; };
  if(C.tail==='curl'){
    const t=kit(tailJ,new THREE.Mesh(new THREE.TorusGeometry(0.115,0.055,12,22,5.4),furMat));
    t.rotation.set(0.35,Math.PI/2,0);
    const b=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10),furMat));
    b.position.set(0,-0.10,0.02);b.scale.set(1,1.5,1);
  } else if(C.tail==='long'){
    let par=tailRoot(C.tailTilt||0);
    for(let i=0;i<7;i++){
      const seg=kit(par,new THREE.Mesh(new THREE.CylinderGeometry(0.055-i*0.005,0.062-i*0.005,0.15,10),furMat));
      seg.position.y=0.075; seg.rotation.x=0;
      const nx=new THREE.Group(); nx.position.y=0.15; nx.rotation.x=-0.30+i*0.09; par.add(nx);
      kitParts.push(nx); par=nx;
    }
  } else if(C.tail==='puff'){
    const t=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.125,14,12),furMat));
    t.position.set(0,0.02,0.05);
  } else if(C.tail==='thick'){                // a counterweight: heavy at the root
    let par=tailRoot(C.tailTilt!==undefined?C.tailTilt:1.35);
    for(let i=0;i<8;i++){
      const r0=0.165-i*0.018, r1=0.158-i*0.018;
      const seg=kit(par,new THREE.Mesh(new THREE.CylinderGeometry(Math.max(0.012,r1),Math.max(0.016,r0),0.20,14),furMat));
      seg.position.y=0.10;
      const nx=new THREE.Group(); nx.position.y=0.20; nx.rotation.x=-0.09+i*0.012; par.add(nx);
      kitParts.push(nx); par=nx;
      if(C.spines&&i<6){
        const sp=kit(seg,new THREE.Mesh(new THREE.ConeGeometry(0.035,0.09,6),
          PBR({color:C.crest||0xd8892a,roughness:0.5,vivid:1.4})));
        sp.position.set(0,0.02,-r0-0.02);sp.rotation.x=-Math.PI/2;
      }
    }

function updateWake(dt,eff){
  for(const t of trail){ t.age+=dt; t.z+=eff*dt; }
  while(trail.length&&trail[trail.length-1].age>1.5)trail.pop();
  for(let i=0;i<WAKE_SEGS;i++){
    const t=trail[i];
    const o=i*6, oa=i*2;

    const a=Math.max(0,(1-k))*0.55*Math.min(1,i/2);

// Arm segment. Suckers are pressed into the mesh and painted through a vertex
// colour attribute, so they read as the contrasting discs of the reference while a
// whole arm still costs only one draw call per segment.
const ARM_SKIN=vivid(0x8a5fd0,1.20), ARM_UNDER=vivid(0x6a44a8,1.15);
const _cTmp=new THREE.Color();
function armSegment(rTop,rBot,len,mtl){
  const g=new THREE.CylinderGeometry(rTop,rBot,len,14,8,false);
  const pos=g.attributes.position;
  const cols=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const rad=Math.hypot(x,z);
    // the underside runs a shade darker than the back of the arm, which is all the
    // shaping it needs — banded suckers just read as stripes at this size
    let k=0;
    if(rad>1e-5){
      const th=Math.atan2(z,x);
      k=Math.pow(Math.max(0,Math.cos(th+Math.PI/2)),2)*0.5;
    }
    _cTmp.copy(ARM_SKIN).lerp(ARM_UNDER,k);
    cols[i*3]=_cTmp.r;cols[i*3+1]=_cTmp.g;cols[i*3+2]=_cTmp.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mtl);
  m.position.y=-len/2;
  return m;
}
// A jointed arm. Every arm gets its own splay, coil, length and tip direction, and
// every joint carries its own pair of frequencies, phases and amplitudes — so the
// motion never lines up between arms and never repeats on a tidy loop.
// Each segment is a straight cone, so the chain shows its corners. A ball dropped at
// every joint, exactly the width of the arm there, fills them in and the whole thing
// reads as one smooth tube instead of a string of beads.
function armKnuckle(r,mtl){
  const g=new THREE.SphereGeometry(r,12,8);
  const n=g.attributes.position.count, cols=new Float32Array(n*3);
  for(let i=0;i<n;i++){cols[i*3]=ARM_SKIN.r;cols[i*3+1]=ARM_SKIN.g;cols[i*3+2]=ARM_SKIN.b;}
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  return new THREE.Mesh(g,mtl);
}
function buildArm(armIndex,angle,mtl){
  const root=new THREE.Group();
  root.rotation.y=angle;
  const SEGS=14;                             // more, shorter links: the bends stay gentle
  const R=()=>Math.random();
  const splay=0.86+R()*0.55;                 // how far out this arm throws
  // some arms curl under themselves and some curl away — an octopus does not hold
  // all eight the same way round
  const coil =(R()<0.5?-1:1)*(0.10+R()*0.13);
  const flick=(R()<0.5?-1:1)*(0.9+R()*0.9);  // and the tips hook either way again
  const twist=(R()-0.5)*0.30;                // a sideways lean down the whole arm
  const lenK =0.92+R()*0.34;
  let parent=root;
  for(let j=0;j<SEGS;j++){
    const t=j/(SEGS-1);
    const len=(0.30-0.13*t)*lenK;
    const rTop=0.240-0.205*Math.pow(t,0.85);
    const rBot=0.240-0.205*Math.pow(Math.min(1,(j+1)/(SEGS-1)),0.85);
    const joint=new THREE.Group();
    // first joint throws the arm outward; the rest coil, with the last few
    // curling back on themselves into the hooks the reference has
    const rx = j===0 ? splay : coil*(j>=SEGS-3 ? flick : 1);
    const ry = twist+(R()-0.5)*0.20;
    const rz = (R()-0.5)*0.14;
    joint.rotation.set(rx,ry,rz);
    joint.userData={tj:1,arm:armIndex,seg:j,rx,ry,rz,
      f1:0.34+R()*0.42, f2:0.22+R()*0.30,      // two unrelated rates per joint, unhurried
      p1:R()*Math.PI*2, p2:R()*Math.PI*2,
      a1:0.13+R()*0.16, a2:0.12+R()*0.16,
      k:0.70+0.95*t};                          // the whole arm works, not just the tip
    if(j===0){
      // the shoulder is what makes the arm travel: it swings the whole limb from up
      // by the animal's face right down to hanging under it, and every arm takes its
      // own time over it, so the eight never move together
      // the arc stops short of the mantle: at full stretch the arm is just above
      // horizontal, never folded back over the animal's own head
      joint.userData.sA=0.62+R()*0.22;
      joint.userData.sM=0.86+R()*0.20;
      joint.userData.sF=0.055+R()*0.085;
      joint.userData.sP=R()*Math.PI*2;
    }
    parent.add(joint);
    joint.add(armKnuckle(rTop*0.99,mtl));
    joint.add(armSegment(rTop,Math.max(0.022,rBot),len,mtl));
    const next=new THREE.Group();
    next.position.y=-len;
    joint.add(next);
    parent=next;
  }
  return root;
}

      // quarter of a circle is indistinguishable from a flick and throws a roll before
      // the loop has had a chance to declare itself.

// everything you're doing in the air, scored and judged together
// A trick thrown over and over is worth less each time; the count decays back as you
// do other things. Spamming one button was the cheapest score in the game.
const trickFade={};
function fade(k){
  const n=trickFade[k]||0; trickFade[k]=n+1;
  return Math.max(0.25, Math.pow(0.72,n));
}
function coolTricks(dt){
  for(const k in trickFade){ trickFade[k]=Math.max(0,trickFade[k]-dt*0.34);
    if(trickFade[k]<=0)delete trickFade[k]; }
}
function settleTricks(landed,keepPose){
  let pts=0,names=[];
  const spinRevs=spinRot/(Math.PI*2), flipRevs=flipRot/(Math.PI*2), pitchRevs=pitchRot/(Math.PI*2);
  if(spinRot>0.4){pts+=Math.round(Math.floor(spinRevs*4)*90*fade('spin'));names.push(Math.round(spinRevs*360)+'° SPIN');}
  if(flipRot>0.4){pts+=Math.round(Math.floor(flipRevs*4)*110*fade('roll'));names.push(Math.round(flipRevs*360)+'° ROLL');}
  if(pitchRot>0.4){pts+=Math.round(Math.floor(pitchRevs*4)*130*fade('flip'));names.push(Math.round(pitchRevs*360)+'° FLIP');}
  if(grabOn&&grabPts>=30){pts+=Math.round(grabPts);names.push(grabSide>0?'INDY':'MELON');}
  if(landed&&pts>0){
    if(names.length>1)pts=Math.round(pts*1.5);          // combo bonus
    score+=pts;
    boost=Math.min(16,boost+5+Math.min(7,pts/110));   // ride out of it with speed
    msg(names.join(' + ')+(names.length>1?' COMBO':'')+`! +${pts}`);
  }
  spinRot=0;flipRot=0;pitchRot=0;pitchQ=0;spinHeld=false;flipHeld=false;
  grabOn=false;grabPts=0;
  spinQ=0;flipQ=0;pitchQ=0;pitchRot=0;   // anything still owed dies with the landing
  if(!keepPose)player.rotation.set(0,0,0);
  return pts;
}

// how each kind of crash throws him
const WIPE={
  buoy:  {vy: 9.0, vz:-3.5, spin:[ 9, 3, 2], msg:'BUOY!',        kick:1.8},
  jelly: {vy: 6.5, vz:-1.5, spin:[12, 2, 7], msg:'ZAPPED! \u26a1', kick:2.2},
  log:   {vy: 5.0, vz:-2.0, spin:[14, 1, 3], msg:'LOG!',         kick:2.0},
  bigfin:{vy:11.0, vz:-5.0, spin:[ 7, 8, 4], msg:'SHARK!',       kick:2.6},
  octopus:{vy:7.5, vz:-2.5, spin:[10, 5, 6], msg:'TENTACLED!',   kick:2.0},
  pearl: {vy: 3.0, vz:-7.5, spin:[16, 0, 1], msg:'PEARLED!',     kick:1.4},
  land:  {vy: 6.0, vz: 1.5, spin:[ 5, 6, 9], msg:'SKETCHY LANDING!', kick:1.6},
  under: {vy: 4.5, vz: 0.5, spin:[11, 4, 5], msg:'UNDER-ROTATED!',   kick:1.5},
  foam:  {vy: 2.5, vz:-1.0, spin:[ 6, 2, 8], msg:'ATE IT!',      kick:1.2},
};
let wipe=null,overlayUp=false,revivesLeft=1;
function startWipeout(kind){
  if(wipe)return;
  noteWipe(kind);
  const W=WIPE[kind]||WIPE.foam;
  running=false;                       // controls stop, but the world keeps running
  endMouseDrag();steer=0;weight=0;
  jumpBtn.classList.add('hidden');ropeBtn.style.display='none';trickBar.classList.add('hidden');
  hanging=false;rope.visible=false;
  msg(W.msg);
  shake=W.kick;
  if(kind==='jelly')zapFlash();               // stung: the screen cracks white-blue
  splash(px,py,0,30,kind==='jelly'?0x9fe8ff:undefined);
  // Everything is launched from what he was actually doing. Forward momentum
  // throws him over the obstacle, his lateral drift carries across, any vertical
  // speed he already had is kept, and if he was mid-rotation he keeps turning that
  // way. The table only supplies the character of each crash on top of that.
  const fwd=lastEff*0.11;                       // faster ride, further he is thrown
  const side=Math.random()<0.5?-1:1;            // he goes one way, the board the other
  const rider={
    vy: Math.max(1.6, W.vy*0.55 + Math.max(-6,vy)*0.45),
    vz: W.vz*0.55 - fwd,
    vx: vx*0.80 + side*(2.0+Math.random()*1.8)
  };
  wipe={
    t:0, rx:player.rotation.x, ry:player.rotation.y, rz:player.rotation.z,
    camX:px, camY:camY, camZ:11.0,        // freeze the shot on the crash spot
    atX:px, atY:py,
    vy:rider.vy, vz:rider.vz, vx:rider.vx,
    // a rotation already under way continues; otherwise the impact starts one
    sx:(Math.random()<0.5?-1:1)*W.spin[0]*0.16,
    sy:carrySpin*0.16 + (Math.random()<0.5?-1:1)*W.spin[1]*0.16,
    sz:carryFlip*0.16 + (Math.random()<0.5?-1:1)*W.spin[2]*0.16,
    // the board is kicked out from under him and tumbles off on its own
    bvx:-side*(2.8+Math.random()*2.4)-vx*0.35, bvy:rider.vy*0.55+1.5, bvz:rider.vz*0.45+1.2,
    landed:false,
    bsx:(Math.random()-0.5)*9, bsz:(Math.random()-0.5)*9,
    bx:px, by:py, bz:0, splashed:false
  };
  carrySpin=0;carryFlip=0;
  // Detach both: the board keeps its lean and tumbles off on its own, and the
  // rider is lifted out of it onto the player group, which is what gets thrown.
  // He was a child of the board, so without this he rode it all the way down.
  const keep={x:rig.rotation.x,y:rig.rotation.y,z:rig.rotation.z};
  player.remove(rig); scene.add(rig);
  rig.remove(pug); player.add(pug);
  pug.position.set(0,0.12,0);
  rig.position.set(px,py,0);
  rig.rotation.set(keep.x+player.rotation.x,keep.y+player.rotation.y,keep.z+player.rotation.z);
  spinHeld=false;flipHeld=false;spinRot=0;flipRot=0;pitchRot=0;pitchQ=0;grabOn=false;dragOn=false;
}
function updateWipeout(dt){
  const w=wipe; w.t+=dt;
  // pug: thrown, tumbling, then splashdown
  w.vy-=22*dt;
  w.vx*=(1-Math.min(1,dt*1.6));   // air drag, so he doesn't fly off sideways
  px+=w.vx*dt; py+=w.vy*dt;
  player.position.set(px,py,Math.max(-9,Math.min(2,w.vz*w.t*0.70)));
  w.rx+=w.sx*dt*6; w.ry+=w.sy*dt*6; w.rz+=w.sz*dt*6;
  player.rotation.set(w.rx,w.ry,w.rz);
  const sea=waveH(px,dist*WAVE_DRIFT,waveClock)+0.13;
  if(!w.splashed&&py<=sea){
    w.splashed=true;
    splash(px,sea,w.vz*w.t,34);
    pushTrail(px,sea,w.vz*w.t,2.2);
    shake=Math.max(shake,1.6);
    py=sea;
  }
  if(w.splashed){
    // he floats at the surface, not under it — bobbing with the swell
    py+=((sea-0.06)-py)*Math.min(1,dt*5);
    w.vy=0;
    w.rx+=((Math.PI*0.45)-w.rx)*Math.min(1,dt*2.2);   // settles onto his side in the water
    w.rz*=0.90; w.sx*=0.86; w.sy*=0.86; w.sz*=0.86;
    if(Math.random()<dt*6)splash(px+(Math.random()-0.5)*1.2,sea,w.vz*w.t,1);
  }
  // He is a body, not a prop: arms windmill for balance while he is in the air and

function cloudTexture(seed){
  const W=384,H=192,c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  let n=seed*9301+49297;
  const R=()=>{n=(n*9301+49297)%233280; return n/233280;};
  // A cumulus is a pile of soft lumps on a flat base, brighter on top. Every lump is
  // kept clear of the canvas edge, so the alpha has faded to nothing by the border
  // and the plane never shows as a rectangle.
  const lumps=9+((R()*6)|0), BASE=132;
  for(let i=0;i<lumps;i++){
    const t=i/(lumps-1);
    const rad=24+R()*20+18*(1-Math.abs(t-0.45)*1.6);
    const cx=76+t*232+(R()-0.5)*26;
    const cy=BASE-rad*0.55-R()*26*(1-Math.abs(t-0.5)*1.4);
    const g=x.createRadialGradient(cx,cy-rad*0.25,rad*0.12,cx,cy,rad);
    const top=Math.round(238+R()*17);
    g.addColorStop(0,'rgba(255,255,255,0.95)');
    g.addColorStop(0.5,`rgba(${top},${top},${top},0.60)`);
    g.addColorStop(1,'rgba(214,220,230,0)');
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,rad,0,Math.PI*2); x.fill();
  }
  // shade the underside so it does not read as a flat smear
  x.globalCompositeOperation='source-atop';
  const sh=x.createLinearGradient(0,BASE-62,0,BASE+4);
  sh.addColorStop(0,'rgba(150,163,185,0)');
  sh.addColorStop(1,'rgba(138,152,177,0.36)');
  x.fillStyle=sh; x.fillRect(0,0,W,H);
  x.globalCompositeOperation='source-over';
  const t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;
  return t;
}
