    // It hung off the end of the tail joint like a paddle on a stick. A tail fin does not
    // start somewhere behind the animal — it grows straight off the back of it, so this
    // sits ON the joint with a peduncle filling the gap, and it is swept back rather than
    // standing square.
    const root=tailRoot(C.tailTilt===undefined?1.05:C.tailTilt);
    const ped=kit(root,new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),furMat));
    ped.position.y=0.04;ped.scale.set(0.72,1.15,0.86);
    const t=kit(root,new THREE.Mesh(new THREE.SphereGeometry(0.26,18,14),furMat));
    t.position.y=0.15;t.scale.set(0.13,1.05,0.80);t.rotation.x=-0.22;
  } else if(C.tail==='plume'){
    // A squirrel IS its tail: a big S-curved plume that leaves the rump, sweeps up
    // behind and folds forward over its own back. Built as a chain like the other long
    // tails, but every link is a fat lobe rather than a segment of rope.
    let par=tailRoot(C.tailTilt===undefined?0.35:C.tailTilt);
    for(let i=0;i<8;i++){
      const t2=i/7;
      const r=0.105+Math.sin(t2*Math.PI)*0.215;
      const seg=kit(par,new THREE.Mesh(new THREE.SphereGeometry(r,16,13),furMat));
      seg.position.y=0.11; seg.scale.set(0.82,1.22,0.82);
      // a long gentle arc, not a curl: it has to stand clear of the back and come over
      // the top, or it reads as a lump of fur stuck to him
      const nx=new THREE.Group(); nx.position.y=0.215; nx.rotation.x=-0.16-i*0.072; par.add(nx);
      kitParts.push(nx); par=nx;
    }
  } else if(C.tail==='fan'){
    // A cock's tail: a spray of long feathers leaving the rump together and splaying up
    // and back, each one a flattened blade rather than a lobe. Built as a fan about the
    // root instead of a chain, because they all start from the same place.
    // tailJ carries a yaw of its own that the curled and roped tails are built around, so
    // the fan undoes it first — splayed about a turned axis it comes out lopsided.
    const yaw=new THREE.Group(); yaw.rotation.y=1.16; tailJ.add(yaw); kitParts.push(yaw);
    const root=new THREE.Group();
    root.rotation.x=C.tailTilt===undefined?-0.62:C.tailTilt; yaw.add(root); kitParts.push(root);
    // and the whole spray stands clear of the rump before it splays: started at the joint
    // the feathers begin inside the body and only their tips ever come out of it
    const base=new THREE.Group(); base.position.set(0,0.11,0.05); root.add(base); kitParts.push(base);
    const fm=C.tailCol?PBR({color:C.tailCol,roughness:0.58,vivid:1.15}):furMat;
    for(let i=0;i<7;i++){
      const t2=i/6, off=(t2-0.5)*2;            // -1 on one side, +1 on the other
      const len=0.40-Math.abs(off)*0.12;
      const g2=new THREE.Group();
      g2.rotation.z=off*0.46;                  // splayed sideways
      g2.rotation.x=-0.10-Math.abs(off)*0.30;  // and the outer ones swept further back
      base.add(g2); kitParts.push(g2);
      const f=kit(g2,new THREE.Mesh(new THREE.SphereGeometry(len,16,12),fm));
      f.position.y=len*0.94;
      f.scale.set(0.155,1.0,0.42);
    }
  } else if(C.tail!=='none'){                 // bushy
    const t=kit(tailJ,new THREE.Mesh(new THREE.SphereGeometry(0.11,14,12),furMat));
    t.position.set(0,0.13,0.02);t.scale.set(1,1.9,1);t.rotation.x=-0.4;
  }
}

function equipChar(id){
  if(!CHAR_BY_ID[id])id='pug';
  rider=id; buildChar(id);
}

// legs: hip -> knee -> ankle -> foot (front foot toward board nose, back foot toward tail)
// Every character shares one body, and that body is a fat pug. A character that is
// not built like that — an insect, say — needs the shared parts to change shape as
// well as colour, so the limbs and the torso are collected here and rescaled per
// character rather than being fixed at the pug's proportions.
const limbJoints=[], footMesh=[], handMesh=[], armRoot=[], legStretch=[], limbTubes=[];
// ---------------------------------------------------------------------------
// A limb is ONE mesh, swept along the joint chain.
//
// Building an arm out of a cylinder for the upper, a cylinder for the lower and a ball
// at the elbow can never look like Human Fall Flat or Gang Beasts, because in those the
// arm is a single continuous surface — there is nothing AT the elbow to look wrong. Any
// amount of tuning ball sizes only moves the seam around. So the segments are gone: the
// joints still drive everything, but the visible limb is a tube swept along a smooth
// curve through hip, knee and ankle, with a radius profile that thickens at the thigh,
// nips in at the knee and swells again at the calf. It rebuilds every frame, which is
// cheap at this size and means it bends smoothly at any angle.
// ---------------------------------------------------------------------------
const LR=15, LRAD=12;                                  // rings along, points around
function newTube(){
  const g=new THREE.BufferGeometry(), n=LR*LRAD+2;
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  const idx=[];
  for(let i=0;i<LR-1;i++)for(let k=0;k<LRAD;k++){
    const a=i*LRAD+k, b=i*LRAD+(k+1)%LRAD;
    idx.push(a,a+LRAD,b, b,a+LRAD,b+LRAD);
  }
  const capA=LR*LRAD, capB=capA+1;                     // the two poles that close the ends
  for(let k=0;k<LRAD;k++){
    idx.push(capA,k,(k+1)%LRAD);
    const o=(LR-1)*LRAD;
    idx.push(capB,o+(k+1)%LRAD,o+k);
  }
  g.setIndex(idx);
  return g;
}
// a radius profile sampled smoothly: six numbers from inside the body down to the wrist
const smoothstep=u=>u*u*(3-2*u);
function sampleProfile(P,t){
  const g=Math.min(P.length-1.001,t*(P.length-1)), i=Math.floor(g), f=smoothstep(g-i);
  return P[i]*(1-f)+P[i+1]*f;
}
// hip/shoulder, upper, joint, lower, ankle/wrist — the nip at index 2 IS the knee
const LEG_PROFILE=[0.205,0.190,0.152,0.163,0.126,0.104];
const ARM_PROFILE=[0.180,0.152,0.122,0.133,0.104,0.088];
const _p=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()];
const _t=new THREE.Vector3(), _n=new THREE.Vector3(), _b=new THREE.Vector3(), _w=new THREE.Vector3();
function sweepLimb(mesh,chain,prof,thick,flat,blend){
  const g=mesh.geometry, pos=g.attributes.position.array;
  // the chain in the mesh's own space, with a control point pushed up inside the body so
  // the limb grows out of the torso instead of starting at its surface
  for(let i=0;i<4;i++){ chain[i].getWorldPosition(_w); pug.worldToLocal(_w); _p[i+1].copy(_w); }
  // how far up INSIDE the torso the limb starts. Push it far enough and a thick-topped
  // profile merges with the body and with its opposite number, so the trunk carries on
  // into the legs as one mass with a notch in it rather than a belly with two pipes
  // hanging off it — which is the whole silhouette of a Gang Beasts body.
  _p[0].copy(_p[1]).sub(_p[2]).setLength(blend).add(_p[1]);
  const curve=mesh.userData.curve;
  curve.points=_p;
  _n.set(1,0,0);
  for(let i=0;i<LR;i++){
    const t=i/(LR-1);
    curve.getPoint(t,_w);
    curve.getTangent(t,_t).normalize();
    // parallel transport: carry the last frame forward rather than recomputing it, so the
    // tube does not spin where the curve straightens out
    _n.addScaledVector(_t,-_n.dot(_t));
    if(_n.lengthSq()<1e-6)_n.set(0,0,1).addScaledVector(_t,-_t.z);
    _n.normalize();
    _b.crossVectors(_t,_n);
    // ends taper to nothing so the caps close cleanly instead of showing a rim
    const edge=Math.min(1,Math.min(t,1-t)*9+0.18);
    const r=sampleProfile(prof,t)*thick*edge;
    for(let k=0;k<LRAD;k++){
      const a=k/LRAD*Math.PI*2, c=Math.cos(a)*r*flat[0], d=Math.sin(a)*r*flat[1], o=(i*LRAD+k)*3;
      pos[o  ]=_w.x+_n.x*c+_b.x*d;
      pos[o+1]=_w.y+_n.y*c+_b.y*d;
      pos[o+2]=_w.z+_n.z*c+_b.z*d;
    }
  }
  curve.getPoint(0,_w); pos[LR*LRAD*3]=_w.x; pos[LR*LRAD*3+1]=_w.y; pos[LR*LRAD*3+2]=_w.z;
  curve.getPoint(1,_w); pos[(LR*LRAD+1)*3]=_w.x; pos[(LR*LRAD+1)*3+1]=_w.y; pos[(LR*LRAD+1)*3+2]=_w.z;
  g.attributes.position.needsUpdate=true;
  g.computeVertexNormals();
  g.computeBoundingSphere();
}
function limbMesh(){
  const m=new THREE.Mesh(newTube(),furMat);
  m.userData.curve=new THREE.CatmullRomCurve3(_p.map(v=>v.clone()),false,'catmullrom',0.5);
  m.frustumCulled=false;
  pug.add(m); limbTubes.push(m);
  return m;
}
let legThick=1, armThick=1, legProf=LEG_PROFILE, armProf=ARM_PROFILE, armFlat=[1,1];
let legBlend=0.16, armBlend=0.16;
function updateLimbs(){
  pug.updateMatrixWorld(true);
  // averaged over both legs: they sit at different angles on the board, so correcting off
  // one alone leaves the other foot high
  let d2=0;
  for(const g of [legFrontJ,legBackJ]){
    g.hip.getWorldPosition(_w); pug.worldToLocal(_w); const hy=_w.y;
    g.ankle.getWorldPosition(_w); pug.worldToLocal(_w); d2+=hy-_w.y;
  }
  legDrop=d2*0.5;
  sweepLimb(legFrontJ.tube,legFrontJ.chain,legProf,legThick,[1,1],legBlend);
  sweepLimb(legBackJ.tube ,legBackJ.chain ,legProf,legThick,[1,1],legBlend);
  sweepLimb(armFrontJ.tube,armFrontJ.chain,armProf,armThick,armFlat,armBlend);
  sweepLimb(armBackJ.tube ,armBackJ.chain ,armProf,armThick,armFlat,armBlend);
}
function makeLeg(zoff,xoff){
  const hip=joint(pelvis,xoff,0.02,zoff);
  hip.userData.socket=[xoff,0.02,zoff];  limbJoints.push(hip);
  // apply the body-alignment turn BEFORE the splay, so the leg swings along the board
  hip.rotation.order='YXZ';
  const knee=joint(hip,0,-0.185,0);   knee.rotation.order='YXZ';
  const ankle=joint(knee,0,-0.155,0); ankle.rotation.order='YXZ';
  // a stumpy-legged animal moves these down the chain; each remembers where it started
  for(const j of [knee,ankle]){ j.userData.baseY=j.position.y; legStretch.push(j); }
  const toe=joint(ankle,0,-0.055,-0.020);      // the curve runs on past the ankle into the foot
  // one soft stub, no toes — the moment a foot has parts it looks mechanical
  const foot=new THREE.Mesh(new THREE.SphereGeometry(0.152,20,15),furMat);
  foot.scale.set(0.94,0.62,1.24);foot.position.set(0,-0.040,-0.028);
  ankle.add(foot);footMesh.push(foot);
  return {hip,knee,ankle,zoff,chain:[hip,knee,ankle,toe],tube:limbMesh()};
}
// place the feet in BOARD space (nose-to-tail), then convert into the rotated body's space
const STANCE_ROT=-1.16;
function boardToBody(bx,bz){
  const c=Math.cos(-STANCE_ROT), sn=Math.sin(-STANCE_ROT);
  return [bx*c+bz*sn, -bx*sn+bz*c];
}
const STANCE_F=-0.45, STANCE_B=0.85;        // front ahead of centre, back toward the fins
const HIP_F=-0.10,   HIP_B=0.50;            // hip sockets inside the body, directly over each foot
const [fx0,fz0]=boardToBody(-0.04,HIP_F);
const [bx0,bz0]=boardToBody( 0.04,HIP_B);
// shift the whole body back so his weight sits between the feet, not over the nose
const [pgx,pgz]=boardToBody(0,(STANCE_F+STANCE_B)*0.5);
const legFrontJ=makeLeg(fz0,fx0);
const legBackJ=makeLeg(bz0,bx0);
function makeArm(xoff,zoff){
  const sh=joint(chestJ,xoff,0.14,zoff);
  sh.userData.socket=[xoff,0.14,zoff];  limbJoints.push(sh); armRoot.push(sh);
  const el=joint(sh,0,-0.225,0);
  const wr=joint(el,0,-0.200,0);
  const tip=joint(wr,0,-0.060,0);
  // a mitten: one rounded lump, no fingers
  const paw=new THREE.Mesh(new THREE.SphereGeometry(0.128,18,14),furMat);
  paw.position.y=-0.030;paw.scale.set(1.0,0.96,1.08);
  wr.add(paw);handMesh.push(paw);
  return {sh,el,chain:[sh,el,wr,tip],tube:limbMesh()};
}
// shoulders sit just INSIDE the chest, so the arm grows out of the body instead of
// starting at the silhouette edge with daylight behind it
const armFrontJ=makeArm(-0.44,-0.10);
const armBackJ=makeArm(0.44,0.06);
// equipChar sizes the limbs as well as colouring them, so it has to wait until they
// exist — called any earlier it reaches for meshes that are not built yet
equipChar(rider);

pug.position.set(pgx,0,pgz);   // centred over the board's balance point
const PUG_X0=pgx, PUG_Z0=pgz;
pug.rotation.y=STANCE_ROT;   // side-on to the board, angled slightly toward the nose
rig.add(pug);
// A pug model replaces the built-in one wholesale; the joint chain above it is
// detached, so an imported dog rides rigid rather than paddling and leaning.
const PUG_BOX=boxOf(pug);
loadModel('pug.glb',s3=>{
  const fitted=skinAndFit('pug',s3,PUG_BOX);
  pug.clear ? pug.clear() : (pug.children.length=0);
  pug.add(fitted);
});
const PUG_HOME={x:pug.position.x,y:pug.position.y,z:pug.position.z};
player.add(rig);
player.traverse&&player.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
scene.add(player);

// splash particles — pooled: one shared geometry + a fixed set of meshes, reused forever
const SPLASH_GEO=new THREE.SphereGeometry(0.12,6,5);
const SPLASH_MAT=new THREE.MeshBasicMaterial({color:0xffffff});
const SPLASH_MAT_WARN=new THREE.MeshBasicMaterial({color:0xffc23e});
const SPLASH_MAT_HIT=new THREE.MeshBasicMaterial({color:0xff5f5f});
const SPLASH_MAT_ZAP=new THREE.MeshBasicMaterial({color:0x9fe8ff});
const POOL=[],splashes=[];
for(let i=0;i<420;i++){
  const m=new THREE.Mesh(SPLASH_GEO,SPLASH_MAT);
  m.visible=false;scene.add(m);POOL.push(m);
}
function takeDrop(){
  const m=POOL.pop();
  if(m){m.visible=true;return m;}
  const old=splashes.shift();          // recycle the oldest if we run dry
  if(old)return old;
  return null;
}
function freeDrop(m){m.visible=false;POOL.push(m);}
function splash(x,y,z,n=8,col){
  const mtl=col===0xffc23e?SPLASH_MAT_WARN:(col===0xff5f5f?SPLASH_MAT_HIT:
            (col===0x9fe8ff?SPLASH_MAT_ZAP:SPLASH_MAT));
  for(let i=0;i<n;i++){
    const m=takeDrop();if(!m)return;
    m.material=mtl;
    m.position.set(x,y,z);
    const sc=0.7+Math.random()*1.1;
    m.scale.setScalar(sc);
    m.userData={vx:(Math.random()-0.5)*6,vy:2+Math.random()*4,vz:(Math.random()-0.5)*6,t:0.7,s:sc};
    splashes.push(m);
  }
}
// soft contact shadows so nothing floats — the water shader can't receive real ones
const shadowGeo=new THREE.CircleGeometry(1,20);
function makeContactShadow(size){
  const m=new THREE.Mesh(shadowGeo,new THREE.MeshBasicMaterial({
    color:0x0a2c4a,transparent:true,opacity:0.16,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.scale.setScalar(size);scene.add(m);return m;
}
const boardShadow=makeContactShadow(1.5);
boardShadow.visible=false;   // open water has nothing for it to fall on
const OBST_SHADOWS=[];
for(let i=0;i<16;i++){const sh=makeContactShadow(1);sh.visible=false;OBST_SHADOWS.push(sh);}

// wake: a continuous ribbon that traces the board's actual path through the water,
// widening and fading behind it (replaces the old stack of overlapping circles)
const WAKE_SEGS=64;
const wakeGeo=new THREE.BufferGeometry();

// Arm segment. Suckers are pressed into the mesh and painted through a vertex
// colour attribute, so they read as the contrasting discs of the reference while a
// whole arm still costs only one draw call per segment.
const ARM_SKIN=vivid(0x8a5fd0,1.20), ARM_UNDER=vivid(0x6a44a8,1.15);
const _cTmp=new THREE.Color();
function armSegment(rTop,rBot,len,mtl){
  const g=new THREE.CylinderGeometry(rTop,rBot,len,14,8,false);
  const pos=g.attributes.position;
  const cols=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const rad=Math.hypot(x,z);
    // the underside runs a shade darker than the back of the arm, which is all the
    // shaping it needs — banded suckers just read as stripes at this size
    let k=0;
    if(rad>1e-5){
      const th=Math.atan2(z,x);
      k=Math.pow(Math.max(0,Math.cos(th+Math.PI/2)),2)*0.5;
    }
    _cTmp.copy(ARM_SKIN).lerp(ARM_UNDER,k);
    cols[i*3]=_cTmp.r;cols[i*3+1]=_cTmp.g;cols[i*3+2]=_cTmp.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mtl);
  m.position.y=-len/2;
  return m;
}
// A jointed arm. Every arm gets its own splay, coil, length and tip direction, and
// every joint carries its own pair of frequencies, phases and amplitudes — so the
// motion never lines up between arms and never repeats on a tidy loop.
// Each segment is a straight cone, so the chain shows its corners. A ball dropped at
// every joint, exactly the width of the arm there, fills them in and the whole thing
// reads as one smooth tube instead of a string of beads.
function armKnuckle(r,mtl){
  const g=new THREE.SphereGeometry(r,12,8);
  const n=g.attributes.position.count, cols=new Float32Array(n*3);
  for(let i=0;i<n;i++){cols[i*3]=ARM_SKIN.r;cols[i*3+1]=ARM_SKIN.g;cols[i*3+2]=ARM_SKIN.b;}
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));
  return new THREE.Mesh(g,mtl);
}
function buildArm(armIndex,angle,mtl){
  const root=new THREE.Group();
  root.rotation.y=angle;
  const SEGS=14;                             // more, shorter links: the bends stay gentle
  const R=()=>Math.random();
  const splay=0.86+R()*0.55;                 // how far out this arm throws
  // some arms curl under themselves and some curl away — an octopus does not hold
  // all eight the same way round
  const coil =(R()<0.5?-1:1)*(0.10+R()*0.13);
  const flick=(R()<0.5?-1:1)*(0.9+R()*0.9);  // and the tips hook either way again
  const twist=(R()-0.5)*0.30;                // a sideways lean down the whole arm
  const lenK =0.92+R()*0.34;
  let parent=root;
  for(let j=0;j<SEGS;j++){
    const t=j/(SEGS-1);
    const len=(0.30-0.13*t)*lenK;
    const rTop=0.240-0.205*Math.pow(t,0.85);
    const rBot=0.240-0.205*Math.pow(Math.min(1,(j+1)/(SEGS-1)),0.85);
    const joint=new THREE.Group();
    // first joint throws the arm outward; the rest coil, with the last few
    // curling back on themselves into the hooks the reference has
    const rx = j===0 ? splay : coil*(j>=SEGS-3 ? flick : 1);
    const ry = twist+(R()-0.5)*0.20;
    const rz = (R()-0.5)*0.14;
    joint.rotation.set(rx,ry,rz);
    joint.userData={tj:1,arm:armIndex,seg:j,rx,ry,rz,
      f1:0.34+R()*0.42, f2:0.22+R()*0.30,      // two unrelated rates per joint, unhurried
      p1:R()*Math.PI*2, p2:R()*Math.PI*2,
      a1:0.13+R()*0.16, a2:0.12+R()*0.16,
      k:0.70+0.95*t};                          // the whole arm works, not just the tip
    if(j===0){
      // the shoulder is what makes the arm travel: it swings the whole limb from up
      // by the animal's face right down to hanging under it, and every arm takes its
      // own time over it, so the eight never move together
      // the arc stops short of the mantle: at full stretch the arm is just above
      // horizontal, never folded back over the animal's own head
      joint.userData.sA=0.62+R()*0.22;
      joint.userData.sM=0.86+R()*0.20;
      joint.userData.sF=0.055+R()*0.085;
      joint.userData.sP=R()*Math.PI*2;
    }
    parent.add(joint);
    joint.add(armKnuckle(rTop*0.99,mtl));
    joint.add(armSegment(rTop,Math.max(0.022,rBot),len,mtl));
    const next=new THREE.Group();
    next.position.y=-len;
    joint.add(next);
    parent=next;
  }
  return root;
}

// Runs the beats. It owns py outright while it is going, which is the only way he can
// go UNDER the water and come back up — the ordinary ride physics exist to keep a board
// on the surface and would fight it the whole way down.
function heliStep(dt2,waterY){
  heliT+=dt2;
  const dur=HELI_PHASE[heliPh], k=Math.min(1,heliT/dur);
  const smooth=k*k*(3-2*k);
  if(heliPh===0){                                   // crouch
    rigCrouch=Math.max(rigCrouch,0.30+smooth*0.55);
    py=waterY;
  } else if(heliPh===1){                            // pull himself onto the nose
    py=waterY;
  } else if(heliPh===2){                            // a small hop off the deck
    py=waterY+Math.sin(k*Math.PI)*0.62;
    heliIncline=-smooth*0.18;
  } else if(heliPh===3){                            // sinks under, board and all
    // A shallower angle but far deeper: he does not spear in nose-first, he slides under
    // and keeps going until the whole thing is below the surface.
    py=waterY-smooth*2.30;
    heliIncline=-0.18-smooth*0.30;
    if(heliT-dt2<=0)splash(px,waterY,0,26);
    if(Math.random()<dt2*16)splash(px+(Math.random()-0.5)*0.8,waterY,0.2,1);
  } else if(heliPh===4){                            // and is fired back out of it
    const shot=k*k;                                 // slow to leave, then all at once
    py=waterY-2.30+shot*2.65;
    heliIncline=-0.48+shot*0.48;
    if(k>0.35&&Math.random()<dt2*40)splash(px+(Math.random()-0.5)*1.2,waterY,0.3,2);
  }
  if(k>=1){
    heliPh++; heliT=0;
    if(heliPh>=HELI_PHASE.length){                  // hand over to the launch
      heliPh=-1; heliAir=true;
      vy=HELI_POP*BS.air; airborne=true;
      splash(px,waterY,0,34);
      shake=Math.max(shake,0.7);
    }
  }
}

function doJump(){
  if(!running)return;
  // In the tube there is no "up" to jump into — the wall is all around you. Jumping pushes
  // off it toward the axis instead, and the pipe pulls you back. This is also what makes
  // tricks work in there: every trick calls doJump when you are not already airborne, and
  // with the ring pinning airborne to false every frame, nothing ever left the water.
  if(swTubeRide){
    if(swPipeAir)return;
    swPipeAir=true; swRadV=-SW_PIPE_POP*BS.air; airborne=true; swAirT=0;
    // Lit here as well as in the frame loop. The loop sets it after the ring has run, which
    // is a frame away, and a trick pressed in that gap found the buttons still dead.
    trickReady=true;
    splash(px,py,pz,10);
    return;
  }
  if(airborne)return;
  vy=10.8*BS.air;airborne=true;splash(px,0.4,0,10);
}

// everything you're doing in the air, scored and judged together
function settleTricks(landed,keepPose){
  let pts=0,names=[];
  const spinRevs=spinRot/(Math.PI*2), flipRevs=flipRot/(Math.PI*2), pitchRevs=pitchRot/(Math.PI*2);
  if(spinRot>0.4){pts+=Math.floor(spinRevs*4)*90;names.push(Math.round(spinRevs*360)+'° SPIN');}
  if(flipRot>0.4){pts+=Math.floor(flipRevs*4)*110;names.push(Math.round(flipRevs*360)+'° ROLL');}
  if(pitchRot>0.4){pts+=Math.floor(pitchRevs*4)*130;names.push(Math.round(pitchRevs*360)+'° FLIP');}
  if(grabOn&&grabPts>=30){pts+=Math.round(grabPts);names.push(grabSide>0?'INDY':'MELON');}
  // it scores as the roll it is, and takes the name when it was rolled that way
  if(heliUsed&&flipRot>0.4){
    pts=Math.round(pts*1.35);
    // rename the ROLL entry wherever it landed — a grab or a flip in the same air would
    // otherwise leave the name on the wrong trick
    const ri=names.findIndex(n=>n.endsWith('\u00b0 ROLL'));
    if(ri>=0)names[ri]=names[ri].replace('ROLL','HELICOPTER');
  }
  heliUsed=false; heliAir=false; heliPh=-1; heliHeld=false;
  if(landed&&pts>0){
    if(names.length>1)pts=Math.round(pts*1.5);          // combo bonus
    // How square he came down. Releasing on the beat is the whole skill now, so it is
    // what the score is actually paying for.
    const sq=a2=>Math.abs(((a2+Math.PI)%(Math.PI*2))-Math.PI);
    const half=a2=>Math.abs(((a2+Math.PI/2)%Math.PI)-Math.PI/2);
    const off=Math.max(half(spinRot),sq(flipRot),sq(pitchRot));
    // the window narrows with every crack: damage costs you style, not just health
    const tight=1-cracks*0.20;
    if(off<0.16*tight){ pts=Math.round(pts*2.0); names.push('PERFECT'); }
    else if(off<0.45*tight){ pts=Math.round(pts*1.4); names.push('CLEAN'); }
    score+=pts;
    boost=Math.min(16,boost+5+Math.min(7,pts/110));   // ride out of it with speed
    msg(names.join(' + ')+(names.length>1?' COMBO':'')+`! +${pts}`);
  }
  spinRot=0;flipRot=0;pitchRot=0;pitchQ=0;spinHeld=false;flipHeld=false;pitchHeld=false;
  grabOn=false;grabPts=0;
  spinQ=0;flipQ=0;pitchQ=0;pitchRot=0;   // anything still owed dies with the landing
  if(!keepPose)player.rotation.set(0,0,0);
  return pts;
}

// ---------------------------------------------------------------------------
// Board damage. Coming down ON something used to be the same as driving into it —
// the collision test only asked whether you were below its height, so a landing you
// survived by a hair and one you missed by a hair were both instant death, and the
// "I was on top of it!" case did not exist at all. It does now: land on a hazard and
// the board cracks instead of ending the run. Three cracks and it snaps in half.
// The damage is worn, not read off a bar — each crack makes the board wobble under
// you and narrows the window for a clean trick, and every hit dumps your speed boost
// so a mistake costs something immediately as well as slowly. It resets every run:
// nobody should have to pay to repair a board they already bought.
// ---------------------------------------------------------------------------
const BOARD_LIVES=3;
let cracks=0, wobT=0, crackMarks=[], snapHalves=null, snapHidden=[], snapZ=0;
const crackMat=new THREE.MeshBasicMaterial({color:0x14100d,transparent:true,opacity:0.9,
  side:THREE.DoubleSide,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3});
const _crc=new THREE.Raycaster();
const _cro=new THREE.Vector3(), _crd=new THREE.Vector3(), _crp=new THREE.Vector3(), _crq=new THREE.Vector3();
// the deck point under a spot on the board, in the board's own space. Raycast rather
// than maths: it is exact for any hull, including a rocker, and it works just as well
// on an imported model as on the lofted ones.
// Both faces, from one ray. Hits come back sorted by distance, so the first is the deck
// and the last is the hull — a crack goes THROUGH a board, and on the deck alone it was
// hidden under the rider from the only camera angle anybody actually plays from.
function deckAt(lx,lz,top,bot,lock){
  _cro.set(lx,3.0,lz); boardArt.localToWorld(_cro);
  _crd.set(0,-1,0).transformDirection(boardArt.matrixWorld).normalize();
  _crc.set(_cro,_crd);
  const h=_crc.intersectObject(boardArt,true);
  if(!h.length)return null;
  // A strand has to stay on the ONE surface it started on. Walking outward it can pass
  // over a deck pad or a fin, and taking whatever the ray hit next put a segment at a
  // different height with the ribbon spanning up to it — which is the crack that looked
  // like it was hovering above the board rather than cut into it.
  const t=lock&&lock.top?h.find(q=>q.object===lock.top):h[0];
  const b=lock&&lock.bot?h.slice().reverse().find(q=>q.object===lock.bot):h[h.length-1];
  if(!t||!b)return null;
  // lifted along the face's own normal, so it stays proud of a curved hull everywhere
  top.copy(t.point).addScaledVector(t.face?t.face.normal.clone().transformDirection(t.object.matrixWorld):_crd,-0.012);
  bot.copy(b.point).addScaledVector(b.face?b.face.normal.clone().transformDirection(b.object.matrixWorld):_crd,-0.012);
  boardArt.worldToLocal(top); boardArt.worldToLocal(bot);
  return {top:t.object,bot:b.object};
}
// a fissure that starts where it was hit and forks outward, laid ON the deck so it
// follows the rocker instead of floating over it
function addCrack(lx,lz){
  boardArt.updateWorldMatrix(true,false);
  const v=[];
  const lock0=deckAt(lx,lz,_crp,_crq,null);
  if(!lock0)return;                       // the hit missed the hull entirely
  for(let s=0;s<4;s++){
    let a=Math.random()*Math.PI*2, x=lx, z=lz;
    const prev=[null,null];
    const segs=5+Math.floor(Math.random()*3), step=0.28+Math.random()*0.22;
    for(let i=0;i<=segs;i++){
      if(!deckAt(x,z,_crp,_crq,lock0))break;
      const t=i/segs, w=0.070*(1-t)+0.008;
      const nx=Math.cos(a+Math.PI/2)*w, nz=Math.sin(a+Math.PI/2)*w;
      for(let f=0;f<2;f++){
        const P=f?_crq:_crp;

function clearCracks(){

// Split the board in two down the middle. Every triangle is moved into the board's own
// space first, so a fin sitting under the tail with its own transform is cut by the
// same plane the hull is, and each half then rides the tumble the wipeout already runs.
// Reading one component of one vertex, safely. A model loaded from a GLB usually has
// its attributes INTERLEAVED in a single buffer, where .array is the whole shared buffer
// and indexing it by itemSize walks straight off into the neighbouring attribute — which
// is what turned a split hull half black. Byte-packed attributes are normalized too.
function attrRead(at,idx,c){
  let v = at.isInterleavedBufferAttribute
    ? at.data.array[idx*at.data.stride+at.offset+c]
    : at.array[idx*at.itemSize+c];
  if(at.normalized){
    const A=at.isInterleavedBufferAttribute?at.data.array:at.array;
    if(A instanceof Int8Array)v=Math.max(v/127,-1);
    else if(A instanceof Uint8Array||A instanceof Uint8ClampedArray)v/=255;
    else if(A instanceof Int16Array)v=Math.max(v/32767,-1);
    else if(A instanceof Uint16Array)v/=65535;
  }
  return v;
}
function snapBoard(){
  boardArt.updateWorldMatrix(true,true);

  const A=new THREE.Group(), B=new THREE.Group(), halves=[A,B];
  const src=[];
  boardArt.traverse(o=>{ if(o.isMesh&&crackMarks.indexOf(o)<0)src.push(o); });

    M.copy(inv).multiply(m.matrixWorld);
    const g=m.geometry.index?m.geometry.toNonIndexed():m.geometry;
    const pos=g.attributes.position;
    bb.makeEmpty();
    for(let i2=0;i2<pos.count;i2++)bb.expandByPoint(p.set(attrRead(pos,i2,0),attrRead(pos,i2,1),attrRead(pos,i2,2)));
    bb.applyMatrix4(M);

    // one end — so those move across whole. That skips rebuilding twelve thousand fin
    // triangles and, more importantly, keeps them exactly as they were.
    if(bb.min.z>=snapZ||bb.max.z<=snapZ){

    }
    // Everything the geometry carries is copied, not just position and colour. Rebuilding
    // with only those is what turned the board's decal — a textured quad — into a solid
    // black slab, because its UVs went missing and it lost its texture.
    const keys=Object.keys(g.attributes);
    const out=[{},{}];
    for(const k of keys){ out[0][k]=[]; out[1][k]=[]; }
    nm.getNormalMatrix(M);
    const tp=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()];
    for(let i2=0;i2<pos.count;i2+=3){
      let cz=0;
      for(let j=0;j<3;j++){
        tp[j].set(attrRead(pos,i2+j,0),attrRead(pos,i2+j,1),attrRead(pos,i2+j,2)).applyMatrix4(M);
        cz+=tp[j].z;
      }
      const k=cz/3<snapZ?0:1;
      for(let j=0;j<3;j++)for(const key of keys){
        const at=g.attributes[key], sz=at.itemSize;
        if(key==='position')out[k][key].push(tp[j].x,tp[j].y,tp[j].z);

          p.set(attrRead(at,i2+j,0),attrRead(at,i2+j,1),attrRead(at,i2+j,2)).applyMatrix3(nm).normalize();
          out[k][key].push(p.x,p.y,p.z);
        }
        else for(let c2=0;c2<sz;c2++)out[k][key].push(attrRead(at,i2+j,c2));
      }
    }
    for(let k=0;k<2;k++){
      if(!out[k].position.length)continue;
      const ng=new THREE.BufferGeometry();
      for(const key of keys)ng.setAttribute(key,new THREE.Float32BufferAttribute(out[k][key],g.attributes[key].itemSize));

}
// landing on a hazard: it cracks rather than kills, until the third one
function boardHit(o,topY){

let wipe=null,overlayUp=false,revivesLeft=1;
let swInvuln=false;                     // tests only, and never on in a real run
function startWipeout(kind){

  // long before the lip has finished throwing, so every question about the barrel would be
  // asked of a dead run. The checks that are ABOUT wiping out turn this back off.

  // something that can be chased without knowing which of the eight call sites fired.

  noteWipe(kind);

  // throws him over the obstacle, his lateral drift carries across, any vertical
  // speed he already had is kept, and if he was mid-rotation he keeps turning that
  // way. The table only supplies the character of each crash on top of that.
  const fwd=lastEff*0.11;                       // faster ride, further he is thrown
  const side=Math.random()<0.5?-1:1;            // he goes one way, the board the other
  const rider={
    vy: Math.max(1.6, W.vy*0.55 + Math.max(-6,vy)*0.45),
    vz: W.vz*0.55 - fwd,
    vx: vx*0.80 + side*(2.0+Math.random()*1.8)
  };

  // Two of the three terms above are wrong in there: vx is the lane velocity, and the ring
  // writes px itself every frame while vx goes on integrating the steering underneath it, so
  // it can be metres a second of something he is not doing; and the vy floor throws him
  // UPWARD off a wall he is already twelve metres up. Between them he left sideways and kept
  // going — "flew to the right bottom" — instead of coming off the wall and falling down it.
  //
  // What he is actually doing on the ring is going round it, so the launch is the ring's own
  // tangential motion, halved, with no random kick and no upward floor. Gravity takes it from
  // there, which is the whole of what a wipeout off the top of a wave should look like.

  // pulls back to the held wide shot it used to snap to.

function gameOver(){
  if(!running&&overlayUp)return;          // updateWipeout keeps calling this each frame
  overlayUp=true;
  running=false;
  splatT=0;splat3D.visible=false;         // never leave the splat stuck over the menu
  // Math.round, not |0: noteWipe banks the record with Math.round, and truncating here
  // instead showed a run of 3,485 m setting a record of 3,486 m.
  const s=score|0, d=Math.round(dist);
  const newScore=s>best, newDist=bestDistBeat;
  if(newScore){best=s;saveBest();}
  const earned=coinsFor(dist,s);
  coins+=earned; saveGame(); showCoins();
  bump(stats,'earned',earned); bump(stats,'score',s); saveStats();
  jumpBtn.classList.add('hidden');ropeBtn.style.display='none';trickBar.classList.add('hidden');
  overlay.querySelector('h1').textContent='Wipeout!';
  // one row per line, all sharing a left edge, the whole block centred on the screen
  const tr=(k,v,hi)=>`<div class="tr${hi?' hi':''}"><span>${k}</span><b>${v}</b></div>`;
  document.getElementById('ovText').innerHTML=
    `<div class="lead">Astro went under…</div>`+
    tr('Distance',`${d.toLocaleString()} m <em>${pukaFromDist(dist)}</em><i class="pk"></i>`)+
    tr('Tricks',`${s.toLocaleString()} <em>${pukaFromScore(s)}</em><i class="pk"></i>`)+
    tr('This run',`${earned}<i class="pk"></i>`,true)+
    // one record per column, and the one you just beat says so
    tr('Best distance',`${(stats.bestDist||0).toLocaleString()} m${newDist?' <em>NEW!</em>':''}`)+
    tr('Best tricks',`${best.toLocaleString()}${newScore?' <em>NEW!</em>':''}`);
  showMenu('over');
}



// ---------- time of day: starts at dawn, sinks toward a permanent golden sunset ----------

function cloudTexture(seed){

  // A cumulus is a pile of soft lumps on a flat base, brighter on top. Every lump is
  // kept clear of the canvas edge, so the alpha has faded to nothing by the border
  // and the plane never shows as a rectangle.
  const lumps=9+((R()*6)|0), BASE=132;
  for(let i=0;i<lumps;i++){
    const t=i/(lumps-1);
    const rad=24+R()*20+18*(1-Math.abs(t-0.45)*1.6);
    const cx=76+t*232+(R()-0.5)*26;

    const top=Math.round(238+R()*17);

    g.addColorStop(0.5,`rgba(${top},${top},${top},0.60)`);

  const sh=x.createLinearGradient(0,BASE-62,0,BASE+4);
  sh.addColorStop(0,'rgba(150,163,185,0)');
  sh.addColorStop(1,'rgba(138,152,177,0.36)');

  // Every fin now cruises a diagonal line of its own. None of them swim straight
  // at the rider any more — they cut across the field at an angle and carry on past.
  const dir=Math.random()<0.5?1:-1;
  const ang=dir*(0.60+Math.random()*0.70);      // +-pi/2 would be straight across
  const spd=5+Math.random()*3.5;
  o.position.set(px-dir*(13+Math.random()*7),0,-45-Math.random()*70);
  o.userData.vx=Math.sin(ang)*spd;
  o.userData.vzOwn=Math.cos(ang)*spd;
  o.userData.ang=ang;
  o.userData.spd=spd;
  // most of them hunt: they turn onto the rider over time, but the heading is
  // held off the straight line so they close on a slant rather than head-on
  o.userData.track=Math.random()<0.55;
  o.rotation.y=ang;

function updateSeaLife(dt,eff){
  lifeT-=dt;
  if(lifeT<=0){lifeT=5+Math.random()*7;spawnSeaLife();}
  for(let i=seaLife.length-1;i>=0;i--){
    const o=seaLife[i],u=o.userData;
    u.t+=dt;
    if(u.track){
      // steer toward where the rider is, at a limited turn rate
      let d=Math.atan2(px-o.position.x, pz-o.position.z)-u.ang;
      while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
      let a=u.ang+Math.max(-0.55*dt,Math.min(0.55*dt,d));
      const MIN=0.42;                          // never quite straight down the line
      if(Math.abs(a)<MIN)a=(a<0?-1:1)*MIN;
      u.ang=a;
      u.vx=Math.sin(a)*u.spd; u.vzOwn=Math.cos(a)*u.spd;
    }
    o.position.x+=u.vx*dt;
    o.position.z+=eff*dt*0.5 + u.vzOwn*dt;
    const base=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock);
    const ty=base-0.05+Math.sin(u.t*2+u.wob)*0.04;
    if(u.by===undefined)u.by=ty;
    u.by+=(ty-u.by)*Math.min(1,dt*7);        // fins ride the swell smoothly
    o.position.y=u.by;
    o.rotation.set(0,u.ang+Math.sin(u.t*1.1+u.wob)*0.13,0);
    if(Math.random()<dt*7)splash(o.position.x,base+0.05,o.position.z+0.8,1);
    if(Math.abs(o.position.x-px)>30||o.position.z>22){scene.remove(o);seaLife.splice(i,1);}
  }
}

// what makes you look up in time — the wake it leaves is on its way long before it
// is anywhere near you.

// sticker pasted on the water — sunlight on a hull is a soft bloom, so this is a wide
// falloff with no hard edge anywhere in it and no spikes at all.

  const S=160,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');x.translate(S/2,S/2);

  g.addColorStop(0.84,'rgba(255,184,110,0.018)');

let skiT=16, skiOn=false, skiDir=1, skiWake=null;
function spawnJetSki(){
  skiOn=true;
  skiDir=Math.random()<0.5?1:-1;
  jetSki.visible=true;
  // close enough to actually see it go past; the wake still has fifty units to build
  jetSki.position.set(px-skiDir*36,0,-104-Math.random()*22);

function updateJetSki(dt,eff){
  if(!skiOn){
    skiT-=dt;
    // Not during the set wave, at any stage of it. A ski crossing the lane while the barrel
    // is up puts a wake through the one part of the game where the water is supposed to be
    // glassy, and the launch it gives fires while the ring owns the rider's position — so he
    // is thrown out of a wave he cannot fall out of. The clock keeps running and it fires
    // once the wave is done, so waiting does not cost you the encounter.
    //
    // And spread further apart besides: 40-64 s came round often enough that two could
    // bracket a single set wave, one on the way in and one on the way out.
    if(swPh!==SWP.IDLE)skiT=Math.max(skiT,8);
    if(skiT<=0&&dist>480&&swPh===SWP.IDLE){skiT=62+Math.random()*38;spawnJetSki();}
  } else {
    // rips across the field
    jetSki.position.x+=skiDir*15*dt;      // slower, so it is on screen long enough to see
    jetSki.position.z+=eff*dt*0.35;
    const sy=waveH(jetSki.position.x,dist*WAVE_DRIFT+jetSki.position.z,waveClock);
    jetSki.position.y=sy+0.34+Math.sin(tNow*9)*0.05;
    jetSki.rotation.z=-skiDir*0.22+Math.sin(tNow*7)*0.05;
    jetSki.rotation.x=-0.10;
    // the trim catches the light in passes rather than glowing steadily
    for(let i=0;i<jetSki.userData.sparkles.length;i++)
      jetSki.userData.sparkles[i].material.opacity=
        0.30+0.70*Math.pow(Math.max(0,Math.sin(tNow*3.1+i*1.7)),3);
    // the glow sits behind the ski and swells slowly, so it reads as light coming off
    // the water around it rather than a twinkle stuck to the hull
    skiGlint.visible=true;
    // set behind the hull, so with depth testing on the ski occludes the middle of it
    // and what is left is a halo around its silhouette
    skiGlint.position.set(jetSki.position.x,sy+0.95,jetSki.position.z-1.8);
    skiGlint.quaternion.copy(camera.quaternion);
    // sized off how far away it is, so it holds the same size on screen whether the
    // ski is a hundred units out or going past — a fixed world size vanishes at range
    const gd=camera.position.distanceTo(jetSki.position);
    skiGlint.scale.setScalar(gd*0.30*(0.94+0.10*Math.sin(tNow*1.5)+0.045*Math.sin(tNow*2.6)));
    skiGlint.material.opacity=0.58+0.14*Math.sin(tNow*1.5);
    // rooster tail of spray behind it
    for(let i=0;i<4;i++){
      const m=takeDrop(); if(!m)break;
      m.material=SPLASH_MAT;
      const sc=1.1+Math.random()*1.6;m.scale.setScalar(sc);
      m.position.set(jetSki.position.x-skiDir*1.8,sy+0.2,jetSki.position.z+0.4);
      m.userData={vx:-skiDir*(3+Math.random()*5),vy:3+Math.random()*6,vz:1.5+Math.random()*3,t:0.6+Math.random()*0.4,s:sc};
      splashes.push(m);
    }
    // once it has crossed in front of you, it leaves a wake wave rolling your way
    if(!skiWake&&Math.abs(jetSki.position.x-px)<6){
      // it now has a hundred units to travel, so it needs to live long enough to get
      // here — at eleven seconds it was fading out on the way in and arriving half size
      skiWake={z:jetSki.position.z-2,z0:jetSki.position.z-2,life:22.0,hit:false,x:jetSki.position.x};
      msg('WAKE INCOMING!');
    }
    if(Math.abs(jetSki.position.x-px)>48){skiOn=false;jetSki.visible=false;skiGlint.visible=false;}
  }
  // the wake rolls in as a ridge in the ocean itself
  if(skiWake){
    skiWake.life-=dt;
    skiWake.z+=(eff*0.28+7.5)*dt;         // a long roll in, so the wall has time to grow on you
    // measured from where it was born rather than from a fixed line, and squared, so
    // it leaves the ski as nothing and swells the whole way in instead of stepping
    // straight up to half height the moment he passes
    const p=Math.max(0,Math.min(1,(skiWake.z-skiWake.z0)/112));
    // It used to start at nothing, so the water was flat at the moment he went past
    // and the swell appeared out of empty sea some way behind him. A small standing
    // bump from the instant he passes, then the same build to the same wave.
    const grow=0.055+0.945*p*p;
    const fade=Math.max(0,Math.min(1,skiWake.life/1.4));
    // a swell several times the height of the surrounding sea, in the same water
    wkA=21.0*grow*fade;
    wkZ=dist*WAVE_DRIFT+skiWake.z;
    wkX=skiWake.x;
    skiWake.H=wkA;
    // He leaves at the top and nowhere else. The crest reaching his z is the peak by
    // construction, and at the peak he is already travelling with the water, so the
    // launch keeps whatever speed he has and only adds a nudge on top. Nothing is
    // overwritten, so there is no reversal and no seam — he simply carries on off the
    // lip and then has the whole height of the wave to fall back down.
    if(!skiWake.hit&&skiWake.z>=pz&&!airborne&&!hanging){
      skiWake.hit=true;
      // One launch off the top, not a nudge on top of whatever he was already doing.
      // He arrives at the crest still attached to the water, so vy here is the face
      // throwing him up; the floor guarantees the hang time whatever the face gave.
      // At the wake's reduced gravity this is four to six full rotations of air.
      vy=Math.max(vy,WAKE_LAUNCH_VY);
      // He is standing on the crest at this instant, so the water is level with his
      // feet: without this he "lands" on the same frame he takes off. Pop him clear
      // and hold the landing test off while the ridge slides out from under him.
      py=Math.max(py,rideY+1.6);
      wakeGrace=0.34;
      airborne=true; wakeAir=true;
      score+=120;boost=Math.min(16,boost+4);
      msg('WAKE LAUNCH! +120');
      shake=1.8;
      splash(px,py,pz,26);
    }
    if(skiWake.life<=0||skiWake.z>20){skiWake=null;wkA=0;}
  } else if(wkA>0){ wkA=Math.max(0,wkA-dt*3); }
}

// ---------- the set wave: a plane goes down, and what it throws you can ride ----------
const SWP={IDLE:-1,FLY:0,IMPACT:1,SWELL:2,RIDE:3,EXIT:4};
const SW_CRASH_X=46, SW_HOLD_X=9.0, SW_TUBE=4.6;   // SW_PEAK is up with the peel
const SW_FLY=5.2, SW_IMP=1.3, SW_SWELL=5.0, SW_OUT=2.6;
let swPh=SWP.IDLE, swT=0, swRide=0, swRideMax=0, swPts=0, swDeep=0;
let swOver=0;                           // seconds ridden past the clock, on held loops
let swCurlA=0, swCam=0, swClose=0, swDebT=0, swSweep=0, swNext=30+Math.random()*15;
// Where you are around the inside of the tube, rather than where you are across it. Zero is
// the pocket at the bottom; a whole turn takes you up the face, over the roof upside down,
// down the falling curtain and back to the water.
let swAng=0, swAngV=0, swLoops=0, swHoldX=0, swTubeRide=false;
// Air inside the pipe. swRadV is how fast he is moving toward or away from the axis; the
// only "gravity" in a tube points outward, at the wall he came off.
let swPipeAir=false, swRadV=0, swAirT=0;
let swNoDeb=false;                       // debug only: hold the wreckage off
let swHold=false;                        // debug only: stop the wave ever spitting you out
let swForm=0;                            // how far the lip has thrown over: 0 crest, 1 full bore
// How far the arc is still laid back against the face. Zero once it is fully thrown.
function swPitch(){ return -swS*1.15*(1-swForm)*(1-swForm); }
// Gentle on purpose. At 9.0 against a gravity of 13 the pop carried three metres off a
// wall six and a half from the axis — nearly half way across the tube, which from the
// bottom of the ring is straight up and reads as being launched out of the wave. The tube
// has its own gravity and it should feel like it: a metre and a half of air, held for about
// a second, which is enough to throw a trick without ever leaving the wall behind.
const SW_PIPE_G=9.5, SW_PIPE_POP=5.2;
// Back on the wall, and judged exactly as a landing anywhere else in the game is. A crooked
// one ends the run — same windows, same names, same wipeout. It used to score nothing and
// let you carry on, which is worse than either rule on its own: a trick you plainly blew
// simply evaporated, and the only thing that ever punished you in there was a board quietly
// snapping several drums later, with nothing to connect it to.
function swPipeLand(){
  const spun=spinRot>0.4||flipRot>0.4||pitchRot>0.4;
  if(spun){
    const offS=Math.abs(((spinRot+Math.PI/2)%Math.PI)-Math.PI/2);
    const offF=Math.max(Math.abs(((flipRot+Math.PI)%(Math.PI*2))-Math.PI),
                        Math.abs(((pitchRot+Math.PI)%(Math.PI*2))-Math.PI));
    if(offS<0.78&&offF<0.62){
      settleTricks(true);
    } else {
      carrySpin=spinHeld?SPIN_RATE:0; carryFlip=flipHeld?FLIP_RATE:0;
      settleTricks(false,true);
      startWipeout(offF>=0.62?'under':'land');
      return;
    }
  } else if(grabOn){ settleTricks(false,true); startWipeout('foam'); return; }
  else settleTricks(false);
  splash(px,py,pz,14);
}

// It spins up ahead of you and drags the sea into it. Everything afloat inside its
// reach is carried round and drawn in, turning to face the way it is being taken
// rather than sliding round sideways, and the rider is pulled off his line with it.
// The middle of it ends the run — so a ramp and a jellyfish are dropped on the near

  // shows thin streaks of aerated foam stretched along the flow, sparse and faint
  // near the outside and gathering as they are pulled toward the middle.

    const wind=2.6+R()*1.7;

    x.fillStyle='rgba(245,252,255,'+(0.12+R()*0.32).toFixed(3)+')';
    x.fill();

  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.55,'rgba(0,0,0,0.9)');

}

    // point it along the circle it is being carried round, not down the lane
    o.rotation.y=Math.atan2(-Math.sin(a)*w.spin,Math.cos(a)*w.spin);
    o.userData.swirl=1;
    if(!held&&nr<=1.9){                          // over the edge and gone
      splash(o.position.x,o.position.y,o.position.z,14);
      scene.remove(o);obstacles.splice(i,1);
    }
  }
  // and it has hold of the rider too
  const dxp=w.x-px, dzp=w.z-pz, d=Math.hypot(dxp,dzp);
  if(d<WH_R*1.5&&!hanging){
    const pull=1-d/(WH_R*1.5), inv=1/Math.max(0.5,d);
    vx+=(dxp*inv)*pull*pull*30*dt;                // dragged toward the middle
    vx+=(-dzp*inv)*w.spin*pull*15*dt;             // and swept around it
    if(Math.random()<dt*10)splash(px+(Math.random()-0.5)*2.2,py-0.15,pz+1.2,1);
  }
  if(!w.hit&&d<WH_R*0.32&&!airborne&&!hanging){
    w.hit=true;startWipeout('foam');msg('SUCKED UNDER!');return;
  }
  if(w.z>24){whirl=null;}
}


// ---------- starfish projectiles hurled by the octopuses ----------
// pillowy five-point star: a rounded star outline given real thickness by a deep bevel
// A grey speckle map: it multiplies the tint, so it adds grain without shifting
// the colour, and one texture serves every starfish.
let _starTex=null;
function starfishTexture(){
  if(_starTex)return _starTex;
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,256,256);
  for(let i=0;i<3400;i++){
    const x=Math.random()*256,y=Math.random()*256,r=0.8+Math.random()*3.4;
    const v=Math.random()<0.55?(150+Math.random()*70):(235+Math.random()*20);
    g.fillStyle='rgba('+(v|0)+','+(v|0)+','+(v|0)+','+(0.20+Math.random()*0.45)+')';
    g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  _starTex=new THREE.CanvasTexture(c);
  _starTex.wrapS=_starTex.wrapT=THREE.RepeatWrapping;
  _starTex.repeat.set(2.4,2.4);
  return _starTex;
}
function buildStarfish(variant){
  const TINT=[0xff8a3d,0xff5f8a,0xffb037][variant%3];
  const g=new THREE.Group();
  const skin=PBR({color:TINT,roughness:0.52,metalness:0.0,envMapIntensity:0.8,vivid:1.7});
  skin.map=starfishTexture();   // grain over the tint
  const dot=PBR({color:0xfff1de,roughness:0.40,vivid:1.2});
  const black=PBR({color:0x1a1016,roughness:0.18});
  const sh=new THREE.Shape();
  const R=0.62, r=0.335, N=5;
  for(let i=0;i<N;i++){
    const a0=(i/N)*Math.PI*2-Math.PI/2;
    const a1=a0+Math.PI/N, a2=a0+2*Math.PI/N;
    const tip=[Math.cos(a0)*R,Math.sin(a0)*R];
    const vly=[Math.cos(a1)*r,Math.sin(a1)*r];
    const nxt=[Math.cos(a2)*R,Math.sin(a2)*R];
    if(i===0)sh.moveTo(tip[0],tip[1]);
    // bulge each edge outward so the arms read as plump, not knife-sharp
    sh.quadraticCurveTo(vly[0]*1.34,vly[1]*1.34,vly[0],vly[1]);
    sh.quadraticCurveTo(vly[0]*1.34,vly[1]*1.34,nxt[0],nxt[1]);
  }
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.14,curveSegments:26,bevelEnabled:true,
    bevelThickness:0.10,bevelSize:0.062,bevelSegments:7});
  geo.center();
  const body=new THREE.Mesh(geo,skin);
  g.add(body);
  // pale bumps down each arm, on both faces — kept clear of the middle so the face reads
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2-Math.PI/2;
    for(let k=0;k<3;k++){
      const d=0.27+k*0.135;
      for(const zz of [0.185,-0.185]){   // body surface sits at |z| = 0.18, so these read as bumps
        const b=new THREE.Mesh(new THREE.SphereGeometry(0.050-k*0.009,12,10),dot);
        b.position.set(Math.cos(a)*d,Math.sin(a)*d,zz);
        b.scale.z=0.5;g.add(b);
      }
    }
  }
  // a face on the front only, sitting just proud of the surface
  for(const sx of [-1,1]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.066,16,14),black);
    eye.position.set(sx*0.125,0.115,0.200);eye.scale.set(0.88,1.1,0.42);g.add(eye);
    const gleam=new THREE.Mesh(new THREE.SphereGeometry(0.021,10,8),dot);
    gleam.position.set(sx*0.148,0.150,0.224);gleam.scale.z=0.5;g.add(gleam);
  }
  const grin=new THREE.Mesh(new THREE.TorusGeometry(0.088,0.021,10,24,Math.PI),black);
  grin.position.set(0,-0.010,0.203);grin.rotation.set(0,0,Math.PI);grin.scale.z=0.45;g.add(grin);
  g.scale.setScalar(0.92);
  g.userData.tint=TINT;
  g.userData.skin=skin;         // so the splat copy can be recoloured to the one that hit
  return g;
}
const STAR_POOL=[],stars=[];
for(let i=0;i<10;i++){const st=buildStarfish(i);st.visible=false;scene.add(st);STAR_POOL.push(st);}

// The splat is the real starfish, not a picture of one. It gets its own tiny scene
// and camera, drawn in a second pass over the finished frame with the depth buffer
// cleared. Previously it was drawn with depth testing switched off so it would sit
// over the world, which also meant its own far side showed through its near side —
// that was the overlapping, half-transparent mess on screen.
const splatScene=new THREE.Scene();
const splatCam=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.05, 8);
splatScene.add(new THREE.HemisphereLight(0xffffff,0x6a5a70,1.05));
{
  const l=new THREE.DirectionalLight(0xfff4e2,1.5); l.position.set(-0.6,1.0,1.4);
  splatScene.add(l);
}
const splat3D=buildStarfish(0);
splat3D.visible=false;
splat3D.traverse(o=>{ if(o.isMesh){ o.material=o.material.clone(); o.material.transparent=true; } });
const splatSkins=[];
splat3D.traverse(o=>{if(o.isMesh&&o.material.color.getHex()===splat3D.userData.skin.color.getHex())splatSkins.push(o.material);});
const splatMats=[];
splat3D.traverse(o=>{if(o.isMesh)splatMats.push(o.material);});
splatScene.add(splat3D);
let splatT=0,splatSpin=0,splatX=0,splatCd=0;

// Aimed shot: solve the flight so it arrives at your line, then decide whether that
// aim is honest. A miss is thrown wide on purpose rather than left to chance.
function throwStarfish(oct){
  const st=STAR_POOL.pop(); if(!st)return;
  st.visible=true;
  const fx=oct.position.x, fy=oct.position.y+1.15, fz=oct.position.z;
  st.position.set(fx,fy,fz);
  st.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  const onTarget=Math.random()<oct.userData.acc;
  const wide=onTarget?0:(Math.random()<0.5?-1:1)*(2.6+Math.random()*3.8);
  const tx=px+vx*0.22+wide, ty=py+0.55, tz=0;
  const T=Math.max(0.40,Math.hypot(tx-fx,tz-fz)/(26+Math.random()*5));
  stars.push({m:st,
    vx:(tx-fx)/T,
    vy:((ty-fy)+0.5*13*T*T)/T,          // matches the 13 u/s^2 drop applied below
    vz:(tz-fz)/T-lastEff*0.4,           // the world scroll adds eff*0.4 to z each frame
    sx:(Math.random()-0.5)*13,sy:(Math.random()-0.5)*13,t:0});
}
function updateStars(dt,eff){
  splatCd=Math.max(0,splatCd-dt);
  for(let i=stars.length-1;i>=0;i--){
    const s2=stars[i];s2.t+=dt;
    s2.vy-=13*dt;
    s2.m.position.x+=s2.vx*dt; s2.m.position.y+=s2.vy*dt; s2.m.position.z+=s2.vz*dt+eff*dt*0.4;
    s2.m.rotation.x+=s2.sx*dt; s2.m.rotation.y+=s2.sy*dt;
    const hit=Math.abs(s2.m.position.x-px)<1.5 && Math.abs(s2.m.position.z-pz)<2.2
              && Math.abs(s2.m.position.y-py)<2.2;
    const sea=waveH(s2.m.position.x,dist*WAVE_DRIFT+s2.m.position.z,waveClock);
    if(hit){
      // One splat at a time. A second star landing while the first is still across
      // your view just breaks apart beside you instead of stacking another on top.
      if(splatCd<=0){ splatOnScreen(s2.m.userData.tint); splatCd=splatT+0.9; }
      else { splash(s2.m.position.x,s2.m.position.y,s2.m.position.z,6,0xff8a3d); }
      splash(s2.m.position.x,s2.m.position.y,s2.m.position.z,10,0xff8a3d);
      s2.m.visible=false;STAR_POOL.push(s2.m);stars.splice(i,1);continue;
    }
    if(s2.m.position.y<sea||s2.t>5||s2.m.position.z>18){
      if(s2.m.position.y<sea)splash(s2.m.position.x,sea,s2.m.position.z,6,0xff8a3d);
      s2.m.visible=false;STAR_POOL.push(s2.m);stars.splice(i,1);
    }
  }
}
// the starfish stuck to the lens: it squashes on impact, then peels off and slides
// down the view, tumbling slowly, before dropping away
function updateSplat(dt){
  if(splatT<=0)return;
  splatT-=dt;
  const k=Math.max(0,Math.min(1,splatT/2.4));      // 1 at impact, 0 when gone
  const age=1-k;
  const squash=1+Math.max(0,0.20-age*2.6);         // brief flatten as it lands
  // Size it against the real viewport instead of a fixed number. A fixed scale is
  // fine in landscape and swallows a portrait phone whole, because the visible
  // width there is a fraction of the height. Tip-to-tip lands just inside the
  // narrower axis, so you can always see past its points.
  const D=1.05;
  const vh=2*D*Math.tan(splatCam.fov*Math.PI/360);
  const vw=vh*splatCam.aspect;
  const STAR_W=1.09;                               // tip to tip at scale 1
  const S=Math.min(vw*0.82, vh*0.62)/STAR_W;
  splat3D.position.set(splatX*vw*0.16+Math.sin(age*7)*0.02, (0.10-age*age*1.45)*vh*0.85, -D);
  splat3D.rotation.set(0.10*Math.sin(age*4), 0.16*Math.sin(age*3), splatSpin+age*0.55);
  splat3D.scale.set(S*squash,S/squash,S);
  const fade=splatT<0.55?splatT/0.55:1;
  for(const m of splatMats)m.opacity=fade;
  if(splatT<=0)splat3D.visible=false;
}
function splatOnScreen(tint){
  splatT=2.4;shake=1.1;
  // it is the same starfish that hit you, in its own colour
  if(tint!==undefined)for(const m of splatSkins)m.color.copy(vivid(tint,1.7));
  splatSpin=(Math.random()-0.5)*0.9;
  splatX=(Math.random()-0.5)*0.28;
  splat3D.visible=true;
  for(const m of splatMats)m.opacity=1;
  updateSplat(0);
  msg('SPLAT!');
}

// ---------- character animation: waves, g-force, jump crouch, grab reach ----------
let rigCrouch=0,rigAir=0,releaseKick=0;
let rigTuck=0;      // 0 riding, 1 folded up mid-rotation
// how far each thigh must lean to carry the foot from its socket out to the stance
const LEG_LEN=0.25+0.20+0.08;
const SPLAY_F=Math.asin(Math.max(-0.9,Math.min(0.9,(STANCE_F-HIP_F)/LEG_LEN)));
const SPLAY_B=Math.asin(Math.max(-0.9,Math.min(0.9,(STANCE_B-HIP_B)/LEG_LEN)));
function ease(cur,tgt,dt,k){return cur+(tgt-cur)*Math.min(1,dt*k);}
// The menu never called update(), so the camera had never been placed: it sat at the
// world origin, which is sea level, looking straight through the wave field. What you
// saw was a slab of water on edge across the middle of the screen with sky above it
// and more water below — a hard-edged dark rectangle that was not any object at all.
// It gets the same framing the ride uses, plus a slow drift so the menu is not a
// frozen photograph.
let menuT=0;
function menuCamera(dt){
  menuT+=dt;
  const wy=waveH(0,dist*WAVE_DRIFT,waveClock);
  const x=Math.sin(menuT*0.11)*2.6;
  camera.position.set(x, wy+4.9, 11.6+Math.sin(menuT*0.07)*0.8);
  camera.lookAt(x*0.45, wy+1.5, -14);
}
function animateRig(dt,carve,grab,waterY){
  const g=Math.abs(carve);
  // how much the wave is heaving under the board right now
  const heave=(waveH(px,dist*WAVE_DRIFT+0.6,waveClock)-waveH(px,dist*WAVE_DRIFT-0.6,waveClock));
  const chop=Math.sin(tNow*4.2)*0.35+Math.sin(tNow*7.7)*0.18;

  // knees absorb the swell and the g-force of the carve
  const dragging = dragOn&&!airborne;
  // Nobody throws a rotation standing up straight. While one is actually turning he
  // pulls into a tuck — knees to the chest, spine curled, paws in — because that is
  // what makes a body spin. The moment the rotation runs out he opens back up and
  // spots the landing, which is what makes the tuck read as effort rather than a pose.
  const rotQ = spinQ+flipQ+pitchQ;
  rigTuck = ease(rigTuck, (airborne||hanging)&&rotQ>0.15 && !grab ? 1 : 0, dt, rotQ>0.15?13:7);
  const compress = airborne ? (grab?1.05:-0.16+rigTuck*1.30) : (g*0.42 + Math.abs(heave)*0.5 + chop*0.05 + (dragging?0.55:0));   // grabs crouch, no forward pitch
  releaseKick=Math.max(0,releaseKick-dt);
  rigCrouch=ease(rigCrouch,compress-releaseKick*0.55,dt,9);   // pops upright out of a grab
  rigAir=ease(rigAir,airborne?1:0,dt,8);

  pelvis.position.y=pelvisHeight()-Math.max(0,Math.min(0.24,rigCrouch))*0.14;
  pelvis.rotation.z=carve*0.10;
  pelvis.rotation.x=heave*0.22;

  // hip/knee/ankle chain — deeper bend the more you compress
  // the crouch is normally capped so he cannot fold up on the wave; a tuck is exactly
  // the case where he should, so the ceiling lifts with it
  const cr=Math.max(-0.08,Math.min(0.26+rigTuck*0.72,rigCrouch));
  const bendF=0.30+cr*0.55, bendB=0.32+cr*0.58;   // knees bent into a surf crouch
  legFrontJ.hip.rotation.x=ease(legFrontJ.hip.rotation.x,-SPLAY_F-bendF*0.5+heave*0.10,dt,10);
  legFrontJ.knee.rotation.x=ease(legFrontJ.knee.rotation.x,SPLAY_F*0.55+bendF,dt,12);
  legFrontJ.ankle.rotation.x=ease(legFrontJ.ankle.rotation.x,SPLAY_F*0.45-bendF*0.9,dt,10);   // paw stays flat on the deck
  legFrontJ.hip.rotation.y=-STANCE_ROT;
  legFrontJ.knee.rotation.y=0;legFrontJ.ankle.rotation.y=0;
  legFrontJ.hip.rotation.z=carve*0.10;
  legBackJ.hip.rotation.x=ease(legBackJ.hip.rotation.x,SPLAY_B+bendB*0.5-heave*0.10,dt,10);
  legBackJ.knee.rotation.x=ease(legBackJ.knee.rotation.x,-SPLAY_B*0.55-bendB,dt,12);
  legBackJ.ankle.rotation.x=ease(legBackJ.ankle.rotation.x,-SPLAY_B*0.45+bendB*0.9,dt,10);
  legBackJ.hip.rotation.y=-STANCE_ROT;
  legBackJ.knee.rotation.y=0;legBackJ.ankle.rotation.y=0;
  legBackJ.hip.rotation.z=carve*0.08;

  // spine/chest counter-rotate against the board like a real surfer
  // He turns to face down the board, goes flat over the deck and pulls himself up on the
  // nose — elbows bent, head up past the tip — and holds that while it spins under him.
  const heliOnNow=heliAir||heliPh>=1;
  heliPose=ease(heliPose,heliOnNow?1:0,dt,heliOnNow?12:6);
  const gSide = grab ? grabSide : 0;
  const dragLean = dragging ? dragSide*0.42 : 0;
  spine.rotation.z=ease(spine.rotation.z,carve*0.16+gSide*0.58+dragLean,dt,8);   // stays stacked over the rail he is on
  const crouchLean = grab ? 0.62 : rigCrouch*0.30 + Math.max(0,boardPitch)*0.55;   // leans forward as the nose drops
  spine.rotation.x=ease(spine.rotation.x,
    (0.18+crouchLean+(airborne?-0.32:0)+leanW*0.80+rigTuck*0.85)*(1-heliPose)+0.62*heliPose,dt,8);
  chestJ.rotation.y=ease(chestJ.rotation.y,0.30+carve*0.55,dt,7);   // shoulders swing with the turn
  chestJ.rotation.z=ease(chestJ.rotation.z,carve*0.14,dt,7);
  // head keeps looking down the line, level with the horizon
  // chin tucks to the chest through the rotation, then comes up to find the water
  neck.rotation.x=ease(neck.rotation.x,-spine.rotation.x*0.8+(airborne?0.12:0)+rigTuck*0.46,dt,9);
  // The head no longer cranes back when he lands the 180. His whole body has already
  // come round to face us, and adding a 2.30 yaw on top of that screwed his neck away
  // from the camera at the one moment you actually want to see his face.
  headJ.rotation.y=ease(headJ.rotation.y,0.90+carve*0.34,dt,6);
  headJ.rotation.z=ease(headJ.rotation.z,-carve*0.10,dt,6);
  // ears and tail flap with speed and motion
  const flap=Math.sin(tNow*11)*(0.18+g*0.35);
  for(const e of charEars)e.rotation.x=e.userData.baseX+flap*(e.userData.side>0?1:-0.85);

  // arms: reach for the rail on a grab, windmill for balance in the air, drop and counterweight on the wave
  let shF,elF,shB,elB,armSpread;
  if(grab){

    const gs = grabSide;

    shF=[0.22, gs*0.18, gs*0.52]; elF=[0.30,0,0];
    shB=[-0.55,-0.25,-1.85];      elB=[-0.50,0,0];   // free paw thrown high behind
    armSpread=0;
  } else if(airborne||hanging){
    const w=tNow*8, k=rigTuck;
    // windmilling wide when he is just floating, wrapped tight around himself when a
    // rotation is running — the arms come in, which is half of why a tuck spins
    shF=[(0.55+Math.sin(w)*0.35)*(1-k)+1.28*k, 0.20*(1-k)+0.46*k, (1.50+Math.sin(w)*0.25)*(1-k)+0.30*k];
    elF=[0.35*(1-k)+2.05*k,0,0];
    shB=[(-0.35+Math.sin(w+2.1)*0.35)*(1-k)+1.18*k, -0.20*(1-k)-0.46*k, (-1.50+Math.sin(w+2.1)*0.25)*(1-k)-0.30*k];
    elB=[0.30*(1-k)+2.05*k,0,0];
    armSpread=0;
  } else if(dragging){
    // crouched low with one paw carving through the water beside the board
    const ds=dragSide;
    shF=[1.15, ds*0.25, 1.05*ds]; elF=[0.55,0,0];    // reaching down and out to the surface
    shB=[-0.35,-0.15,-1.45];      elB=[0.30,0,0];    // other paw up for balance
    armSpread=0;
  } else {
    // planted surf stance: both paws out wide and slightly forward, like the reference
    const drag=Math.max(0,carve), drag2=Math.max(0,-carve);
    shF=[0.42+drag*0.55, 0.18, 1.32+drag*0.30];   // z rotation swings the arm out sideways
    elF=[0.30-drag*0.18,0,0];
    shB=[0.30+drag2*0.55,-0.18,-1.38-drag2*0.30];
    elB=[0.28-drag2*0.18,0,0];
    armSpread=Math.sin(tNow*2.4)*0.16 + heave*0.55;   // arms sway with the swell and the ride
    if(waveT>0){
      // He has just come round to face us, so he puts a hand up and waves — for three
      // seconds, then back to surfing. It used to run for as long as he rode switch,
      // which meant a wave that started on the landing and never stopped.
      waveT=Math.max(0,waveT-dt);
      const el=WAVE_DUR-waveT;                            // time since the landing
      // eased up and eased back down, so the arm rises into it rather than snapping
      const k=Math.min(1,el/0.26)*Math.min(1,waveT/0.36), w=Math.sin(el*8.6);
      const mx=(a2,b2)=>a2*(1-k)+b2*k;
      shF=[mx(shF[0],0.06), mx(shF[1],0.10), mx(shF[2],2.52+w*0.46)];

    }

  if(heliPose>0.02){

    // and his face is at the tip. The pull tracks the spin, so the effort and the rotation
    // are visibly the same motion rather than two things happening at once.
    const pull=heliPose;
    const h=heliPose, mx=(a2,b2)=>a2*(1-h)+b2*h;
    const tF=[2.12+pull*0.26, 0.15, 0.30], tB=[2.12+pull*0.26,-0.15,-0.30];
    const teF=0.28+pull*1.42, teB=0.28+pull*1.42;
    shF=[mx(shF[0],tF[0]),mx(shF[1],tF[1]),mx(shF[2],tF[2])];
    shB=[mx(shB[0],tB[0]),mx(shB[1],tB[1]),mx(shB[2],tB[2])];
    elF=[mx(elF[0],teF),0,0]; elB=[mx(elB[0],teB),0,0];
