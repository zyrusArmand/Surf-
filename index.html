    if(f.position.x<-CLOUD_SPAN*0.5)f.position.x+=CLOUD_SPAN;

    f.position.y+=Math.sin(u.bob*0.7)*dt*1.4;
    f.rotation.y=u.v>0?0:Math.PI;             // they face the way they are going
    for(const b of f.children){
      const d=b.userData;
      // wings beat with a fast downstroke and a slower recovery, and no two birds
      // in a flock are in step
      const ph=tNow*d.f+d.p;
      const beat=Math.sin(ph)*0.5+0.5;
      const a=0.62*Math.pow(beat,0.65)-0.22;
      d.L.rotation.z=a; d.Rw.rotation.z=-a;
    }
  }
}

// a real dorsal fin: swept-back curved blade with a trailing notch
function makeDorsal(height,mtl){
  const sh=new THREE.Shape();
  sh.moveTo(-0.42,0);
  sh.bezierCurveTo(-0.34,0.45, -0.14,0.80, 0.30,1.00);   // leading edge curving back
  sh.bezierCurveTo(0.06,0.72, 0.02,0.42, 0.10,0.10);     // trailing edge scoops in
  sh.lineTo(0.38,0);
  sh.lineTo(-0.42,0);
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.13,bevelEnabled:true,bevelSize:0.05,bevelThickness:0.04,bevelSegments:2});
  g.center();
  const m=new THREE.Mesh(g,mtl);
  m.scale.set(height,height,height*0.85);
  return m;
}

  const dir=Math.random()<0.5?1:-1;

function updateSeaLife(dt,eff){
  lifeT-=dt;

  for(let i=seaLife.length-1;i>=0;i--){
    const o=seaLife[i],u=o.userData;
    u.t+=dt;
    if(u.track){
      // steer toward where the rider is, at a limited turn rate
      let d=Math.atan2(px-o.position.x, pz-o.position.z)-u.ang;
      while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
      let a=u.ang+Math.max(-0.55*dt,Math.min(0.55*dt,d));
      const MIN=0.42;                          // never quite straight down the line
      if(Math.abs(a)<MIN)a=(a<0?-1:1)*MIN;
      u.ang=a;
      u.vx=Math.sin(a)*u.spd; u.vzOwn=Math.cos(a)*u.spd;
    }
    o.position.x+=u.vx*dt;
    o.position.z+=eff*dt*0.5 + u.vzOwn*dt;
    const base=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock);
    const ty=base-0.05+Math.sin(u.t*2+u.wob)*0.04;
    if(u.by===undefined)u.by=ty;
    u.by+=(ty-u.by)*Math.min(1,dt*7);        // fins ride the swell smoothly
    o.position.y=u.by;
    o.rotation.set(0,u.ang+Math.sin(u.t*1.1+u.wob)*0.13,0);
    if(Math.random()<dt*7)splash(o.position.x,base+0.05,o.position.z+0.8,1);
    if(Math.abs(o.position.x-px)>30||o.position.z>22){scene.remove(o);seaLife.splice(i,1);}
  }
}

// what makes you look up in time — the wake it leaves is on its way long before it
// is anywhere near you.
// A haze of low sun sitting behind the ski, not a star. The drawn rays read as a
// sticker pasted on the water — sunlight on a hull is a soft bloom, so this is a wide
// falloff with no hard edge anywhere in it and no spikes at all.
function glintTexture(){
  const S=160,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');x.translate(S/2,S/2);
  const g=x.createRadialGradient(0,0,0,0,0,S*0.5);
  g.addColorStop(0.00,'rgba(255,252,238,0.80)');
  g.addColorStop(0.16,'rgba(255,238,196,0.46)');
  g.addColorStop(0.36,'rgba(255,214,148,0.20)');
  g.addColorStop(0.62,'rgba(255,196,120,0.070)');
  g.addColorStop(0.84,'rgba(255,184,110,0.018)');
  g.addColorStop(1.00,'rgba(255,180,105,0)');
  x.fillStyle=g;x.fillRect(-S/2,-S/2,S,S);
  const t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;
  return t;
}

let skiT=16, skiOn=false, skiDir=1, skiWake=null;
function spawnJetSki(){
  skiOn=true;
  skiDir=Math.random()<0.5?1:-1;
  jetSki.visible=true;
  // close enough to actually see it go past; the wake still has fifty units to build
  jetSki.position.set(px-skiDir*36,0,-104-Math.random()*22);
  msg('JET SKI!');
  jetSki.rotation.y=-skiDir*Math.PI/2;   // bow is local -z, so it must face the way it drives
  skiWake=null;
}
function updateJetSki(dt,eff){
  if(!skiOn){
    skiT-=dt;
    if(skiT<=0&&dist>480){skiT=40+Math.random()*24;spawnJetSki();}
  } else {
    // rips across the field
    jetSki.position.x+=skiDir*15*dt;      // slower, so it is on screen long enough to see
    jetSki.position.z+=eff*dt*0.35;
    const sy=waveH(jetSki.position.x,dist*WAVE_DRIFT+jetSki.position.z,waveClock);
    jetSki.position.y=sy+0.34+Math.sin(tNow*9)*0.05;
    jetSki.rotation.z=-skiDir*0.22+Math.sin(tNow*7)*0.05;
    jetSki.rotation.x=-0.10;
    // the trim catches the light in passes rather than glowing steadily
    for(let i=0;i<jetSki.userData.sparkles.length;i++)
      jetSki.userData.sparkles[i].material.opacity=
        0.30+0.70*Math.pow(Math.max(0,Math.sin(tNow*3.1+i*1.7)),3);
    // the glow sits behind the ski and swells slowly, so it reads as light coming off
    // the water around it rather than a twinkle stuck to the hull
    skiGlint.visible=true;
    // set behind the hull, so with depth testing on the ski occludes the middle of it
    // and what is left is a halo around its silhouette
    skiGlint.position.set(jetSki.position.x,sy+0.95,jetSki.position.z-1.8);
    skiGlint.quaternion.copy(camera.quaternion);
    // sized off how far away it is, so it holds the same size on screen whether the
    // ski is a hundred units out or going past — a fixed world size vanishes at range
    const gd=camera.position.distanceTo(jetSki.position);
    skiGlint.scale.setScalar(gd*0.30*(0.94+0.10*Math.sin(tNow*1.5)+0.045*Math.sin(tNow*2.6)));
    skiGlint.material.opacity=0.58+0.14*Math.sin(tNow*1.5);
    // rooster tail of spray behind it
    for(let i=0;i<4;i++){
      const m=takeDrop(); if(!m)break;
      m.material=SPLASH_MAT;
      const sc=1.1+Math.random()*1.6;m.scale.setScalar(sc);
      m.position.set(jetSki.position.x-skiDir*1.8,sy+0.2,jetSki.position.z+0.4);
      m.userData={vx:-skiDir*(3+Math.random()*5),vy:3+Math.random()*6,vz:1.5+Math.random()*3,t:0.6+Math.random()*0.4,s:sc};
      splashes.push(m);
    }
    // once it has crossed in front of you, it leaves a wake wave rolling your way
    if(!skiWake&&Math.abs(jetSki.position.x-px)<6){
      // it now has a hundred units to travel, so it needs to live long enough to get
      // here — at eleven seconds it was fading out on the way in and arriving half size
      skiWake={z:jetSki.position.z-2,z0:jetSki.position.z-2,life:22.0,hit:false,x:jetSki.position.x};
      msg('WAKE INCOMING!');
    }
    if(Math.abs(jetSki.position.x-px)>48){skiOn=false;jetSki.visible=false;skiGlint.visible=false;}
  }
  // the wake rolls in as a ridge in the ocean itself
  if(skiWake){
    skiWake.life-=dt;
    skiWake.z+=(eff*0.28+7.5)*dt;         // a long roll in, so the wall has time to grow on you
    // measured from where it was born rather than from a fixed line, and squared, so
    // it leaves the ski as nothing and swells the whole way in instead of stepping
    // straight up to half height the moment he passes
    const p=Math.max(0,Math.min(1,(skiWake.z-skiWake.z0)/112));
    // It used to start at nothing, so the water was flat at the moment he went past
    // and the swell appeared out of empty sea some way behind him. A small standing
    // bump from the instant he passes, then the same build to the same wave.
    const grow=0.055+0.945*p*p;
    const fade=Math.max(0,Math.min(1,skiWake.life/1.4));
    // a swell several times the height of the surrounding sea, in the same water
    wkA=21.0*grow*fade;
    wkZ=dist*WAVE_DRIFT+skiWake.z;
    wkX=skiWake.x;
    skiWake.H=wkA;
    // He leaves at the top and nowhere else. The crest reaching his z is the peak by
    // construction, and at the peak he is already travelling with the water, so the
    // launch keeps whatever speed he has and only adds a nudge on top. Nothing is
    // overwritten, so there is no reversal and no seam — he simply carries on off the
    // lip and then has the whole height of the wave to fall back down.
    if(!skiWake.hit&&skiWake.z>=pz&&!airborne&&!hanging){
      skiWake.hit=true;
      // One launch off the top, not a nudge on top of whatever he was already doing.
      // He arrives at the crest still attached to the water, so vy here is the face
      // throwing him up; the floor guarantees the hang time whatever the face gave.
      // At the wake's reduced gravity this is four to six full rotations of air.
      vy=Math.max(vy,WAKE_LAUNCH_VY);
      // He is standing on the crest at this instant, so the water is level with his
      // feet: without this he "lands" on the same frame he takes off. Pop him clear
      // and hold the landing test off while the ridge slides out from under him.
      py=Math.max(py,rideY+1.6);
      wakeGrace=0.34;
      airborne=true; wakeAir=true;
      score+=120;boost=Math.min(16,boost+4);
      msg('WAKE LAUNCH! +120');
      shake=1.8;
      splash(px,py,pz,26);
    }
    if(skiWake.life<=0||skiWake.z>20){skiWake=null;wkA=0;}
  } else if(wkA>0){ wkA=Math.max(0,wkA-dt*3); }
}

// ---------- whirlpool ----------
// It spins up ahead of you and drags the sea into it. Everything afloat inside its
// reach is carried round and drawn in, turning to face the way it is being taken
// rather than sliding round sideways, and the rider is pulled off his line with it.
// The middle of it ends the run — so a ramp and a jellyfish are dropped on the near
// rim when it forms and held there instead of being swallowed. There is always a
// way out; you have to take it before the pull gets too strong.
function whirlTexture(){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d');
  x.translate(S/2,S/2);
  let n=8123;
  const R=()=>{n=(n*9301+49297)%233280;return n/233280;};
  // Fine drawn-out filaments rather than painted arms. Water going round a hole
  // shows thin streaks of aerated foam stretched along the flow, sparse and faint
  // near the outside and gathering as they are pulled toward the middle.
  for(let arm=0;arm<26;arm++){
    const a0=R()*Math.PI*2, r0=0.10+R()*0.72, len=0.45+R()*0.85;
    const wind=2.6+R()*1.7;
    x.beginPath();
    for(let i=0;i<=64;i++){
      const t=i/64;
      const rr=r0+(0.96-r0)*t*len;
      if(rr>0.99)break;
      const a=a0+wind*(Math.log(Math.max(0.06,rr))-Math.log(Math.max(0.06,r0)));
      const px=Math.cos(a)*rr*S*0.5, py=Math.sin(a)*rr*S*0.5;
      if(i===0)x.moveTo(px,py); else x.lineTo(px,py);
    }
    x.strokeStyle='rgba(238,248,255,'+(0.10+R()*0.22).toFixed(3)+')';
    x.lineWidth=1.1+R()*2.2; x.lineCap='round';
    x.stroke();
  }
  // the collar of broken water right around the throat, where it is actually white
  for(let i=0;i<180;i++){
    const a=R()*Math.PI*2, rr=(0.15+Math.pow(R(),1.7)*0.16)*S*0.5;
    x.beginPath();
    x.arc(Math.cos(a)*rr,Math.sin(a)*rr,0.6+R()*1.9,0,Math.PI*2);
    x.fillStyle='rgba(245,252,255,'+(0.12+R()*0.32).toFixed(3)+')';
    x.fill();
  }
  // fade to nothing well before the rim so the disc has no edge
  x.globalCompositeOperation='destination-in';
  let g=x.createRadialGradient(0,0,0,0,0,S*0.5);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.55,'rgba(0,0,0,0.9)');
  g.addColorStop(0.86,'rgba(0,0,0,0.25)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(-S/2,-S/2,S,S);
  // ...and drop the throat itself into shadow, which is what makes it read as a hole
  x.globalCompositeOperation='source-over';
  g=x.createRadialGradient(0,0,0,0,0,S*0.155);
  g.addColorStop(0,'rgba(3,14,26,0.94)');g.addColorStop(0.62,'rgba(4,20,36,0.72)');
  g.addColorStop(1,'rgba(6,28,50,0)');
  x.fillStyle=g; x.beginPath(); x.arc(0,0,S*0.155,0,Math.PI*2); x.fill();
  const t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;
  return t;
}
// The foam is laid straight onto the water every frame rather than given a shape of
// its own: each vertex takes the height of the sea beneath it, dip and swell and all,
// so it can never sink under the chop or hover over it. The swirl comes from turning
// the texture, which leaves the mesh where the samples were taken.
const WH_RINGS=12, WH_SEG=40;
function makeWhirlArt(){
  const pos=[], uvs=[], idx=[];
  for(let i=0;i<=WH_RINGS;i++){
    const t=i/WH_RINGS, r=WH_R*t;
    for(let j=0;j<=WH_SEG;j++){
      const a=j/WH_SEG*Math.PI*2;
      pos.push(Math.cos(a)*r,0,Math.sin(a)*r);
      uvs.push(0.5+Math.cos(a)*t*0.5,0.5+Math.sin(a)*t*0.5);
    }
  }
  for(let i=0;i<WH_RINGS;i++)for(let j=0;j<WH_SEG;j++){
    const A=i*(WH_SEG+1)+j,B=A+1,C=A+WH_SEG+1,D=C+1;
    idx.push(A,C,B, B,C,D);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);
  const tex=whirlTexture();
  tex.center.set(0.5,0.5);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,
    transparent:true,depthWrite:false,side:THREE.DoubleSide}));
  m.renderOrder=1;
  return m;
}
let whirl=null, whirlT=26+Math.random()*16;
const whirlArt=makeWhirlArt(); whirlArt.visible=false; scene.add(whirlArt);
function spawnWhirl(){
  whirl={x:Math.max(-4,Math.min(4,px+(Math.random()-0.5)*7)), z:-112,
         spin:(Math.random()<0.5?-1:1), hit:false};
  msg('WHIRLPOOL!');
  // the way out, placed on the near rim as it forms
  const side=whirl.spin>0?1:-1;
  const lane=x=>Math.max(-15.5,Math.min(15.5,x));
  const a=makeObstacle('ramp', lane(whirl.x-side*WH_R*0.62), whirl.z+15);
  if(a)a.userData.escape=1;
  const b=makeObstacle('jelly', lane(whirl.x+side*WH_R*0.58), whirl.z+23);
  if(b)b.userData.escape=1;
}
function updateWhirl(dt,eff){
  if(!whirl){
    whirlT-=dt;
    if(whirlT<=0&&dist>700){whirlT=45+Math.random()*30;spawnWhirl();}
    if(whA>0){whA=Math.max(0,whA-dt*5);whirlArt.scale.y=Math.max(0.001,whA);}
    if(whA<=0)whirlArt.visible=false;
    return;
  }
  const w=whirl;
  w.z+=eff*dt;                                   // it comes to you like everything else
  const grow=Math.max(0,Math.min(1,(w.z+100)/56));
  const fade=Math.max(0,Math.min(1,(24-w.z)/14));
  whA=7.6*grow*fade; whX=w.x; whZ=dist*WAVE_DRIFT+w.z;
  whirlArt.visible=whA>0.02;
  whirlArt.position.set(w.x,0,w.z);
  if(whirlArt.visible){
    const P=whirlArt.geometry.attributes.position;
    for(let i=0;i<P.count;i++)
      P.setY(i, waveH(w.x+P.getX(i), whZ+P.getZ(i), waveClock)+0.07);
    P.needsUpdate=true;
  }
  whirlArt.material.map.rotation-=w.spin*dt*(0.5+whA*0.2);
  whirlArt.material.opacity=Math.min(0.96,whA*0.22);

  // everything afloat is taken round and drawn in
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    const ox=o.position.x-w.x, oz=o.position.z-w.z;
    const r=Math.hypot(ox,oz);
    if(r>WH_R*1.35)continue;
    const held=o.userData.escape?1:0;
    const grip=0.40+0.60*(1-Math.min(1,r/WH_R));
    // the escapes barely drift: they have to still be where you need them when you
    // arrive, which is the whole point of putting them there
    const a=Math.atan2(oz,ox)+w.spin*(held?0.11:1.85)*grip*dt;
    const nr=held?r:Math.max(0.5,r-grip*3.1*dt);
    o.position.x=w.x+Math.cos(a)*nr;
    o.position.z=w.z+Math.sin(a)*nr;
    // point it along the circle it is being carried round, not down the lane
    o.rotation.y=Math.atan2(-Math.sin(a)*w.spin,Math.cos(a)*w.spin);
    o.userData.swirl=1;
    if(!held&&nr<=1.9){                          // over the edge and gone
      splash(o.position.x,o.position.y,o.position.z,14);
      scene.remove(o);obstacles.splice(i,1);
    }
  }
  // and it has hold of the rider too
  const dxp=w.x-px, dzp=w.z-pz, d=Math.hypot(dxp,dzp);
  if(d<WH_R*1.5&&!hanging){
    const pull=1-d/(WH_R*1.5), inv=1/Math.max(0.5,d);
    vx+=(dxp*inv)*pull*pull*30*dt;                // dragged toward the middle
    vx+=(-dzp*inv)*w.spin*pull*15*dt;             // and swept around it
    if(Math.random()<dt*10)splash(px+(Math.random()-0.5)*2.2,py-0.15,pz+1.2,1);
  }
  if(!w.hit&&d<WH_R*0.32&&!airborne&&!hanging){
    w.hit=true;startWipeout('foam');msg('SUCKED UNDER!');return;
  }
  if(w.z>24){whirl=null;}
}


// ---------- starfish projectiles hurled by the octopuses ----------
// pillowy five-point star: a rounded star outline given real thickness by a deep bevel
// A grey speckle map: it multiplies the tint, so it adds grain without shifting
// the colour, and one texture serves every starfish.
let _starTex=null;
function starfishTexture(){
  if(_starTex)return _starTex;
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,256,256);
  for(let i=0;i<3400;i++){
    const x=Math.random()*256,y=Math.random()*256,r=0.8+Math.random()*3.4;
    const v=Math.random()<0.55?(150+Math.random()*70):(235+Math.random()*20);
    g.fillStyle='rgba('+(v|0)+','+(v|0)+','+(v|0)+','+(0.20+Math.random()*0.45)+')';
    g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  _starTex=new THREE.CanvasTexture(c);
  _starTex.wrapS=_starTex.wrapT=THREE.RepeatWrapping;
  _starTex.repeat.set(2.4,2.4);
  return _starTex;
}
function buildStarfish(variant){
  const TINT=[0xff8a3d,0xff5f8a,0xffb037][variant%3];
  const g=new THREE.Group();
  const skin=PBR({color:TINT,roughness:0.52,metalness:0.0,envMapIntensity:0.8,vivid:1.7});
  skin.map=starfishTexture();   // grain over the tint
  const dot=PBR({color:0xfff1de,roughness:0.40,vivid:1.2});
  const black=PBR({color:0x1a1016,roughness:0.18});
  const sh=new THREE.Shape();
  const R=0.62, r=0.335, N=5;
  for(let i=0;i<N;i++){
    const a0=(i/N)*Math.PI*2-Math.PI/2;
    const a1=a0+Math.PI/N, a2=a0+2*Math.PI/N;
    const tip=[Math.cos(a0)*R,Math.sin(a0)*R];
    const vly=[Math.cos(a1)*r,Math.sin(a1)*r];
    const nxt=[Math.cos(a2)*R,Math.sin(a2)*R];
    if(i===0)sh.moveTo(tip[0],tip[1]);
    // bulge each edge outward so the arms read as plump, not knife-sharp
    sh.quadraticCurveTo(vly[0]*1.34,vly[1]*1.34,vly[0],vly[1]);
    sh.quadraticCurveTo(vly[0]*1.34,vly[1]*1.34,nxt[0],nxt[1]);
  }
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.14,curveSegments:26,bevelEnabled:true,
    bevelThickness:0.10,bevelSize:0.062,bevelSegments:7});
  geo.center();
  const body=new THREE.Mesh(geo,skin);
  g.add(body);
  // pale bumps down each arm, on both faces — kept clear of the middle so the face reads
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2-Math.PI/2;
    for(let k=0;k<3;k++){
      const d=0.27+k*0.135;
      for(const zz of [0.185,-0.185]){   // body surface sits at |z| = 0.18, so these read as bumps
        const b=new THREE.Mesh(new THREE.SphereGeometry(0.050-k*0.009,12,10),dot);
        b.position.set(Math.cos(a)*d,Math.sin(a)*d,zz);
        b.scale.z=0.5;g.add(b);
      }
    }
  }
  // a face on the front only, sitting just proud of the surface
  for(const sx of [-1,1]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.066,16,14),black);
    eye.position.set(sx*0.125,0.115,0.200);eye.scale.set(0.88,1.1,0.42);g.add(eye);
    const gleam=new THREE.Mesh(new THREE.SphereGeometry(0.021,10,8),dot);
    gleam.position.set(sx*0.148,0.150,0.224);gleam.scale.z=0.5;g.add(gleam);
  }
  const grin=new THREE.Mesh(new THREE.TorusGeometry(0.088,0.021,10,24,Math.PI),black);
  grin.position.set(0,-0.010,0.203);grin.rotation.set(0,0,Math.PI);grin.scale.z=0.45;g.add(grin);
  g.scale.setScalar(0.92);
  g.userData.tint=TINT;
  g.userData.skin=skin;         // so the splat copy can be recoloured to the one that hit
  return g;
}
const STAR_POOL=[],stars=[];
for(let i=0;i<10;i++){const st=buildStarfish(i);st.visible=false;scene.add(st);STAR_POOL.push(st);}

// The splat is the real starfish, not a picture of one. It gets its own tiny scene
// and camera, drawn in a second pass over the finished frame with the depth buffer
// cleared. Previously it was drawn with depth testing switched off so it would sit
// over the world, which also meant its own far side showed through its near side —
// that was the overlapping, half-transparent mess on screen.
const splatScene=new THREE.Scene();
const splatCam=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.05, 8);
splatScene.add(new THREE.HemisphereLight(0xffffff,0x6a5a70,1.05));
{
  const l=new THREE.DirectionalLight(0xfff4e2,1.5); l.position.set(-0.6,1.0,1.4);
  splatScene.add(l);
}
const splat3D=buildStarfish(0);
splat3D.visible=false;
splat3D.traverse(o=>{ if(o.isMesh){ o.material=o.material.clone(); o.material.transparent=true; } });
const splatSkins=[];
splat3D.traverse(o=>{if(o.isMesh&&o.material.color.getHex()===splat3D.userData.skin.color.getHex())splatSkins.push(o.material);});
const splatMats=[];
splat3D.traverse(o=>{if(o.isMesh)splatMats.push(o.material);});
splatScene.add(splat3D);
let splatT=0,splatSpin=0,splatX=0,splatCd=0;

// Aimed shot: solve the flight so it arrives at your line, then decide whether that
// aim is honest. A miss is thrown wide on purpose rather than left to chance.
function throwStarfish(oct){
  const st=STAR_POOL.pop(); if(!st)return;
  st.visible=true;
  const fx=oct.position.x, fy=oct.position.y+1.15, fz=oct.position.z;
  st.position.set(fx,fy,fz);
  st.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  const onTarget=Math.random()<oct.userData.acc;
  const wide=onTarget?0:(Math.random()<0.5?-1:1)*(2.6+Math.random()*3.8);
  const tx=px+vx*0.22+wide, ty=py+0.55, tz=0;
  const T=Math.max(0.40,Math.hypot(tx-fx,tz-fz)/(26+Math.random()*5));
  stars.push({m:st,
    vx:(tx-fx)/T,
    vy:((ty-fy)+0.5*13*T*T)/T,          // matches the 13 u/s^2 drop applied below
    vz:(tz-fz)/T-lastEff*0.4,           // the world scroll adds eff*0.4 to z each frame
    sx:(Math.random()-0.5)*13,sy:(Math.random()-0.5)*13,t:0});
}
function updateStars(dt,eff){
  splatCd=Math.max(0,splatCd-dt);
  for(let i=stars.length-1;i>=0;i--){
    const s2=stars[i];s2.t+=dt;
    s2.vy-=13*dt;
    s2.m.position.x+=s2.vx*dt; s2.m.position.y+=s2.vy*dt; s2.m.position.z+=s2.vz*dt+eff*dt*0.4;
    s2.m.rotation.x+=s2.sx*dt; s2.m.rotation.y+=s2.sy*dt;
    const hit=Math.abs(s2.m.position.x-px)<1.5 && Math.abs(s2.m.position.z-pz)<2.2
              && Math.abs(s2.m.position.y-py)<2.2;
    const sea=waveH(s2.m.position.x,dist*WAVE_DRIFT+s2.m.position.z,waveClock);
    if(hit){
      // One splat at a time. A second star landing while the first is still across
      // your view just breaks apart beside you instead of stacking another on top.
      if(splatCd<=0){ splatOnScreen(s2.m.userData.tint); splatCd=splatT+0.9; }
      else { splash(s2.m.position.x,s2.m.position.y,s2.m.position.z,6,0xff8a3d); }
      splash(s2.m.position.x,s2.m.position.y,s2.m.position.z,10,0xff8a3d);
      s2.m.visible=false;STAR_POOL.push(s2.m);stars.splice(i,1);continue;
    }
    if(s2.m.position.y<sea||s2.t>5||s2.m.position.z>18){
      if(s2.m.position.y<sea)splash(s2.m.position.x,sea,s2.m.position.z,6,0xff8a3d);
      s2.m.visible=false;STAR_POOL.push(s2.m);stars.splice(i,1);
    }
  }
}
// the starfish stuck to the lens: it squashes on impact, then peels off and slides
// down the view, tumbling slowly, before dropping away
function updateSplat(dt){
  if(splatT<=0)return;
  splatT-=dt;
  const k=Math.max(0,Math.min(1,splatT/2.4));      // 1 at impact, 0 when gone
  const age=1-k;
  const squash=1+Math.max(0,0.20-age*2.6);         // brief flatten as it lands
  // Size it against the real viewport instead of a fixed number. A fixed scale is
  // fine in landscape and swallows a portrait phone whole, because the visible
  // width there is a fraction of the height. Tip-to-tip lands just inside the
  // narrower axis, so you can always see past its points.
  const D=1.05;
  const vh=2*D*Math.tan(splatCam.fov*Math.PI/360);
  const vw=vh*splatCam.aspect;
  const STAR_W=1.09;                               // tip to tip at scale 1
  const S=Math.min(vw*0.82, vh*0.62)/STAR_W;
  splat3D.position.set(splatX*vw*0.16+Math.sin(age*7)*0.02, (0.10-age*age*1.45)*vh*0.85, -D);
  splat3D.rotation.set(0.10*Math.sin(age*4), 0.16*Math.sin(age*3), splatSpin+age*0.55);
  splat3D.scale.set(S*squash,S/squash,S);
  const fade=splatT<0.55?splatT/0.55:1;
  for(const m of splatMats)m.opacity=fade;

}
function splatOnScreen(tint){
  splatT=2.4;shake=1.1;
  // it is the same starfish that hit you, in its own colour
  if(tint!==undefined)for(const m of splatSkins)m.color.copy(vivid(tint,1.7));
  splatSpin=(Math.random()-0.5)*0.9;
  splatX=(Math.random()-0.5)*0.28;
  splat3D.visible=true;
  for(const m of splatMats)m.opacity=1;
  updateSplat(0);
  msg('SPLAT!');
}

// ---------- character animation: waves, g-force, jump crouch, grab reach ----------
let rigCrouch=0,rigAir=0,releaseKick=0;
let rigTuck=0;      // 0 riding, 1 folded up mid-rotation
// how far each thigh must lean to carry the foot from its socket out to the stance
const LEG_LEN=0.25+0.20+0.08;
const SPLAY_F=Math.asin(Math.max(-0.9,Math.min(0.9,(STANCE_F-HIP_F)/LEG_LEN)));
const SPLAY_B=Math.asin(Math.max(-0.9,Math.min(0.9,(STANCE_B-HIP_B)/LEG_LEN)));
function ease(cur,tgt,dt,k){return cur+(tgt-cur)*Math.min(1,dt*k);}
// The menu never called update(), so the camera had never been placed: it sat at the
// world origin, which is sea level, looking straight through the wave field. What you
// saw was a slab of water on edge across the middle of the screen with sky above it
// and more water below — a hard-edged dark rectangle that was not any object at all.
// It gets the same framing the ride uses, plus a slow drift so the menu is not a
// frozen photograph.
let menuT=0;
function menuCamera(dt){
  menuT+=dt;
  const wy=waveH(0,dist*WAVE_DRIFT,waveClock);
  const x=Math.sin(menuT*0.11)*2.6;
  camera.position.set(x, wy+4.9, 11.6+Math.sin(menuT*0.07)*0.8);
  camera.lookAt(x*0.45, wy+1.5, -14);
}
function animateRig(dt,carve,grab,waterY){
  const g=Math.abs(carve);
  // how much the wave is heaving under the board right now
  const heave=(waveH(px,dist*WAVE_DRIFT+0.6,waveClock)-waveH(px,dist*WAVE_DRIFT-0.6,waveClock));
  const chop=Math.sin(tNow*4.2)*0.35+Math.sin(tNow*7.7)*0.18;

  // knees absorb the swell and the g-force of the carve
  const dragging = dragOn&&!airborne;
  // Nobody throws a rotation standing up straight. While one is actually turning he
  // pulls into a tuck — knees to the chest, spine curled, paws in — because that is
  // what makes a body spin. The moment the rotation runs out he opens back up and
  // spots the landing, which is what makes the tuck read as effort rather than a pose.
  const rotQ = spinQ+flipQ+pitchQ;
  rigTuck = ease(rigTuck, (airborne||hanging)&&rotQ>0.15 && !grab ? 1 : 0, dt, rotQ>0.15?13:7);
  const compress = airborne ? (grab?1.05:-0.16+rigTuck*1.30) : (g*0.42 + Math.abs(heave)*0.5 + chop*0.05 + (dragging?0.55:0));   // grabs crouch, no forward pitch
  releaseKick=Math.max(0,releaseKick-dt);
  rigCrouch=ease(rigCrouch,compress-releaseKick*0.55,dt,9);   // pops upright out of a grab
  rigAir=ease(rigAir,airborne?1:0,dt,8);

  pelvis.position.y=0.59-Math.max(0,Math.min(0.24,rigCrouch))*0.14;
  pelvis.rotation.z=carve*0.10;
  pelvis.rotation.x=heave*0.22;

  // hip/knee/ankle chain — deeper bend the more you compress
  // the crouch is normally capped so he cannot fold up on the wave; a tuck is exactly
  // the case where he should, so the ceiling lifts with it
  const cr=Math.max(-0.08,Math.min(0.26+rigTuck*0.72,rigCrouch));
  const bendF=0.30+cr*0.55, bendB=0.32+cr*0.58;   // knees bent into a surf crouch
  legFrontJ.hip.rotation.x=ease(legFrontJ.hip.rotation.x,-SPLAY_F-bendF*0.5+heave*0.10,dt,10);
  legFrontJ.knee.rotation.x=ease(legFrontJ.knee.rotation.x,SPLAY_F*0.55+bendF,dt,12);
  legFrontJ.ankle.rotation.x=ease(legFrontJ.ankle.rotation.x,SPLAY_F*0.45-bendF*0.9,dt,10);   // paw stays flat on the deck
  legFrontJ.hip.rotation.y=-STANCE_ROT;
  legFrontJ.knee.rotation.y=0;legFrontJ.ankle.rotation.y=0;
  legFrontJ.hip.rotation.z=carve*0.10;
  legBackJ.hip.rotation.x=ease(legBackJ.hip.rotation.x,SPLAY_B+bendB*0.5-heave*0.10,dt,10);
  legBackJ.knee.rotation.x=ease(legBackJ.knee.rotation.x,-SPLAY_B*0.55-bendB,dt,12);
  legBackJ.ankle.rotation.x=ease(legBackJ.ankle.rotation.x,-SPLAY_B*0.45+bendB*0.9,dt,10);
  legBackJ.hip.rotation.y=-STANCE_ROT;
  legBackJ.knee.rotation.y=0;legBackJ.ankle.rotation.y=0;
  legBackJ.hip.rotation.z=carve*0.08;

  // spine/chest counter-rotate against the board like a real surfer
  const gSide = grab ? grabSide : 0;
  const dragLean = dragging ? dragSide*0.42 : 0;
  spine.rotation.z=ease(spine.rotation.z,carve*0.16+gSide*0.58+dragLean,dt,8);   // stays stacked over the rail he is on
  const crouchLean = grab ? 0.62 : rigCrouch*0.30 + Math.max(0,boardPitch)*0.55;   // leans forward as the nose drops
  spine.rotation.x=ease(spine.rotation.x,0.18+crouchLean+(airborne?-0.32:0)+leanW*0.80+rigTuck*0.85,dt,8);
  chestJ.rotation.y=ease(chestJ.rotation.y,0.30+carve*0.55,dt,7);   // shoulders swing with the turn
  chestJ.rotation.z=ease(chestJ.rotation.z,carve*0.14,dt,7);
  // head keeps looking down the line, level with the horizon
  // chin tucks to the chest through the rotation, then comes up to find the water
  neck.rotation.x=ease(neck.rotation.x,-spine.rotation.x*0.8+(airborne?0.12:0)+rigTuck*0.46,dt,9);
  headJ.rotation.y=ease(headJ.rotation.y,0.90+carve*0.34,dt,6);   // head still looks down the line
  headJ.rotation.z=ease(headJ.rotation.z,-carve*0.10,dt,6);
  // ears and tail flap with speed and motion
  const flap=Math.sin(tNow*11)*(0.18+g*0.35);
  for(const e of charEars)e.rotation.x=e.userData.baseX+flap*(e.userData.side>0?1:-0.85);

  // arms: reach for the rail on a grab, windmill for balance in the air, drop and counterweight on the wave
  let shF,elF,shB,elB,armSpread;
  if(grab){
    // fold right over and take the rail underneath the board
    const gs = grabSide;
    // arm hangs down and leans out to the rail — small angles, paw lands on the edge
    shF=[0.22, gs*0.18, gs*0.52]; elF=[0.30,0,0];
    shB=[-0.55,-0.25,-1.85];      elB=[-0.50,0,0];   // free paw thrown high behind
    armSpread=0;
  } else if(airborne||hanging){
    const w=tNow*8, k=rigTuck;
    // windmilling wide when he is just floating, wrapped tight around himself when a
    // rotation is running — the arms come in, which is half of why a tuck spins
    shF=[(0.55+Math.sin(w)*0.35)*(1-k)+1.28*k, 0.20*(1-k)+0.46*k, (1.50+Math.sin(w)*0.25)*(1-k)+0.30*k];
    elF=[0.35*(1-k)+2.05*k,0,0];
    shB=[(-0.35+Math.sin(w+2.1)*0.35)*(1-k)+1.18*k, -0.20*(1-k)-0.46*k, (-1.50+Math.sin(w+2.1)*0.25)*(1-k)-0.30*k];
    elB=[0.30*(1-k)+2.05*k,0,0];
    armSpread=0;
  } else if(dragging){
    // crouched low with one paw carving through the water beside the board
    const ds=dragSide;
    shF=[1.15, ds*0.25, 1.05*ds]; elF=[0.55,0,0];    // reaching down and out to the surface
    shB=[-0.35,-0.15,-1.45];      elB=[0.30,0,0];    // other paw up for balance
    armSpread=0;
  } else {
    // planted surf stance: both paws out wide and slightly forward, like the reference
    const drag=Math.max(0,carve), drag2=Math.max(0,-carve);
    shF=[0.42+drag*0.55, 0.18, 1.32+drag*0.30];   // z rotation swings the arm out sideways
    elF=[0.30-drag*0.18,0,0];
    shB=[0.30+drag2*0.55,-0.18,-1.38-drag2*0.30];
    elB=[0.28-drag2*0.18,0,0];
    armSpread=Math.sin(tNow*2.4)*0.16 + heave*0.55;   // arms sway with the swell and the ride
  }
  const A=armFrontJ,B=armBackJ;
  A.sh.rotation.x=ease(A.sh.rotation.x,shF[0]+armSpread,dt,10);
  A.sh.rotation.y=ease(A.sh.rotation.y,shF[1]+Math.sin(tNow*1.9)*0.10,dt,10);
  A.sh.rotation.z=ease(A.sh.rotation.z,shF[2],dt,10);
  A.el.rotation.x=ease(A.el.rotation.x,elF[0]+Math.sin(tNow*2.6)*0.09,dt,10);
  B.sh.rotation.x=ease(B.sh.rotation.x,shB[0]-armSpread,dt,10);
  B.sh.rotation.y=ease(B.sh.rotation.y,shB[1]-Math.sin(tNow*1.9+0.8)*0.10,dt,10);
  B.sh.rotation.z=ease(B.sh.rotation.z,shB[2],dt,10);
  B.el.rotation.x=ease(B.el.rotation.x,elB[0]+Math.sin(tNow*2.6+1.4)*0.09,dt,10);
}

// Astro tips up onto his front paws. The rig turns over about the deck line, so the
// arms have to be thrown overhead first — flipped, they then reach down to the deck
// and take his weight with his head just above them. How far to lift him afterwards
// is measured off the posed rig rather than guessed, so it lands on his paws exactly.
const HAND_POSE=[
  // [joint, axis, angle in the upright frame]
  ['aF','sh','x',-2.62],['aF','el','x',-0.18],['aF','sh','z', 0.30],['aF','sh','y',0],
  ['aB','sh','x',-2.62],['aB','el','x',-0.18],['aB','sh','z',-0.30],['aB','sh','y',0],
  ['lF','hip','x', 0.16],['lF','knee','x',-0.12],['lF','ankle','x',0.34],['lF','hip','z',-0.15],['lF','hip','y',0],
  ['lB','hip','x',-0.16],['lB','knee','x',-0.12],['lB','ankle','x',0.34],['lB','hip','z', 0.15],['lB','hip','y',0],
  ['hd',null,'x',-0.92],
];
function _handJoint(tag,sub){
  const g={aF:armFrontJ,aB:armBackJ,lF:legFrontJ,lB:legBackJ}[tag];
  return tag==='hd'?headJ:g[sub];
}
function applyHandPose(k){
  for(const [tag,sub,ax,to] of HAND_POSE){
    const j=_handJoint(tag,sub);
    j.rotation[ax]=j.rotation[ax]*(1-k)+to*k;
  }
}
let HAND_LIFT=null;
function measureHandLift(){
  const keep=HAND_POSE.map(([t,sb,ax])=>_handJoint(t,sb).rotation[ax]);
  const rx=pug.rotation.x, py=pug.position.y;
  const box=o=>{
    o.updateMatrixWorld(true);
    const inv=new THREE.Matrix4().copy(o.matrixWorld).invert(), b=new THREE.Box3(), m=new THREE.Matrix4();
    o.traverse(c=>{ if(!c.isMesh||!c.geometry.attributes.position)return;
      const g=c.geometry.clone(); g.applyMatrix4(m.multiplyMatrices(inv,c.matrixWorld));
      g.computeBoundingBox(); b.union(g.boundingBox); });
    return b;
  };
  pug.rotation.x=0; pug.position.y=0;
  const stand=box(pug).min.y;                 // where his feet rest when he is upright
  applyHandPose(1);
  const reach=box(pug).max.y;                 // how far the raised paws reach above the deck
  pug.rotation.x=rx; pug.position.y=py;
  HAND_POSE.forEach(([t,sb,ax],i)=>{_handJoint(t,sb).rotation[ax]=keep[i];});
  // turning him over sends that reach the other way, so lifting by the two together
  // puts his paws exactly where his feet were
  return stand+reach+0.10;                    // a little daylight so his chin clears the deck
}
function updateHandstand(dt,carve){
  const want=(handOn&&!hanging&&!wipe)?1:0;
  handT+=(want-handT)*Math.min(1,dt*(want?7:9));
  if(handT<0.002&&!want){
    if(handT!==0){handT=0;pug.rotation.x=0;pug.position.y=0;}
    return;
  }
  if(HAND_LIFT===null)HAND_LIFT=measureHandLift();
  applyHandPose(handT);
  pug.rotation.x=handT*Math.PI;
  pug.position.y=handT*HAND_LIFT;
  if(handT>0.55){
    // Anthony held this the whole way down, so it pays for the first few seconds and
    // then stops paying: a handstand is a trick, not a stance.
    handHold+=dt;
    const tire=Math.max(0,1-Math.max(0,handHold-3.4)/2.6);
    const rate=(airborne?46:26)*(1+Math.min(1,Math.abs(carve))*0.4)*tire;
    score+=rate*dt; handPts+=rate*dt;
    // hands are not feet: lay it right over on the rail and he goes over the front,
    // and the longer he has been up there the less it takes
    if(!airborne&&Math.abs(carve)>0.72-Math.min(0.34,handHold*0.05)){
      handRisk+=dt*(1+handHold*0.30);
      if(handRisk>0.55){handRisk=0;startWipeout('foam');return;}
    } else handRisk=Math.max(0,handRisk-dt*1.6);
    // and past nine seconds his arms simply give out
    if(handHold>9.0){ startWipeout('foam'); msg('ARMS GAVE OUT!'); return; }
  } else handHold=Math.max(0,handHold-dt*2.2);
  if(!want&&handPts>0){
    if(handPts>=30){
      const p=Math.round(handPts);
      score+=p*0.35; boost=Math.min(16,boost+3.5);
      msg(`HANDSTAND! +${Math.round(p*1.35)}`);
      noteTrick('handstand',handSrc);
    }
    handPts=0;
  }
}

// ---------- update ----------
function update(dt){
  tNow+=dt;
  // The HUD reads mph as eff*0.62, so 16.2 is 10 and 113 is 70. It never drops below
  // the first and never passes the second, and climbs the whole way between rather
  // than being most of the way there inside the first kilometre.
  speed=Math.min(100,16.2+dist/210);

  // momentum carving
  // Fore and aft is gone. leanW is kept at rest so everything that consulted it —
  // trim, the board's pitch, how deep the rail digs, where he stands — simply reads
  // as neutral, and the ride is steered left and right alone.
  const wt=0;
  let sx=steer+(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);
  sx=Math.max(-1,Math.min(1,sx));
  vx+=sx*55*dt;
  vx-=vx*3.4*dt;
  px+=vx*dt;
  if(px<-17){px=-17;vx=0;}      // slide out to the far lanes and stop there
  if(px>17){px=17;vx=0;}
  const carve=Math.max(-1,Math.min(1,vx/9));
  leanW+=(wt-leanW)*Math.min(1,dt*6);
  // A rigid 5m hull does not follow one point on the water. Sample it under the
  // nose, the tail and both rails; the board then rests on whatever is highest
  // beneath it and lies along that surface, the way a real board sits on a face
  // instead of slicing through the crest at its ends.
  const WZ=dist*WAVE_DRIFT;
  const hC=waveH(px,WZ+pz,waveClock);
  const hN=waveH(px,WZ+pz-2.55,waveClock);      // under the nose
  const hT=waveH(px,WZ+pz+2.55,waveClock);      // under the tail
  const hL=waveH(px-0.58,WZ+pz,waveClock);
  const hR=waveH(px+0.58,WZ+pz,waveClock);
  const hullPitch=Math.atan2(hN-hT,5.10);       // nose high on a climb, down on a drop
  const hullRoll =Math.atan2(hR-hL,1.16);
  // dropping down a wave face accelerates you, climbing one costs a little
  const faceDrive=(hT-hN)*3.8;
  // leaning is a real throttle now: forward drives hard, back scrubs hard
  const trim=(leanW>=0 ? leanW*16.0 : leanW*19.0) + faceDrive;
  boost=Math.max(0,boost-dt*3.0);            // speed carried out of a trick, bleeding off
  const eff=Math.max(16.2,Math.min(113,speed+Math.abs(vx)*0.3+trim+boost));   // 10 mph floor, 70 ceiling
  lastEff=eff;
  dist+=eff*dt;
  score+=eff*dt*0.6;
  cutCd=Math.max(0,cutCd-dt);

  // Where the hull wants to float. It leans on the highest water beneath it so a
  // crest cannot slice through the ends, but it answers to the mean under the whole
  // length as well, and it displaces water rather than resting on top of it — a
  // loaded board sits down in the surface, and harder you carve, the deeper the
  // inside rail is driven in.
  const hHigh=Math.max(hC,hN,hT,(hL+hR)*0.5);
  const hMean=hC*0.34+hN*0.20+hT*0.20+hL*0.13+hR*0.13;
  // Running straight it floats, deck dry, the way a board actually does; only a real
  // turn drives the inside rail under, and there is a dead zone so holding a line
  // never quietly buries it.
  const dig=Math.max(0,Math.abs(carve)-0.20)/0.80;
  const railDig=Math.min(0.17,dig*dig*0.17+Math.max(0,leanW)*0.055);
  const waterY=hHigh*0.88+hMean*0.12+0.05-railDig;
  rideY=waterY;

  // A wall this size falls away under the board fast enough to throw him off its
  // front — ballistic, but not flagged airborne, so the launch then fires while he
  // is already dropping and has to reverse him. While one is on him the hull stays
  // stuck to the face instead: a much harder spring, and far more daylight needed
  // under the board before it counts as air. The crest is then the only way off.
  wakeGrace=Math.max(0,wakeGrace-dt);
  coolTricks(dt);
  const onWake=wkA>2.5&&skiWake&&skiWake.z<pz+1.0;
  // Riding UP the face, before the crest reaches him. He used to come off the rising
  // water here, go ballistic under full gravity, and be falling hard by the time the
  // launch fired — which is why it read as a drop and then a bounce. He stays welded
  // to the surface the whole way up now, so the only launch is the one at the top.
  const wakeRide=onWake&&skiWake&&!skiWake.hit;

  if(hanging){
    py+=(5.4-py)*Math.min(1,dt*2.4);   // towed above the water, high enough to throw tricks
    px+=(plane.position.x-px)*Math.min(1,dt*1.5);
    score+=60*dt;
    speed=Math.min(60,speed+14*dt);
    if(!planeActive||plane.position.z>2)releaseRope(false);
  } else if(airborne||(!wakeRide&&py>waterY+0.55)){    // clear of the water
    vy-=(wakeAir?6.0:20)*dt;py+=vy*dt;      // off a wave that size, the way down is long
    if(py<=waterY&&wakeGrace<=0){
      const impact=Math.min(1.6,Math.max(0,-vy)/15);
      if(airborne){
        splash(px,waterY,0,20+impact*40);
        pushTrail(px,waterY,0.5,1.4+impact*1.6);
        shake=Math.max(shake,impact*0.55);
        const anySpin=spinRot>0.4||flipRot>0.4||pitchRot>0.4;
        if(grabOn&&(spinRot>0.4||flipRot>0.4||grabPts>40)){
          // still holding the rail when you touch down
          carrySpin=spinHeld?SPIN_RATE:0; carryFlip=flipHeld?FLIP_RATE:0;
          settleTricks(false,true);startWipeout('foam');return;
        }
        if(anySpin){
          const offS=Math.abs(((spinRot+Math.PI)%(Math.PI*2))-Math.PI);
          const offF=Math.max(Math.abs(((flipRot+Math.PI)%(Math.PI*2))-Math.PI),
                              Math.abs(((pitchRot+Math.PI)%(Math.PI*2))-Math.PI));
          if(offS<0.62&&offF<0.62){ settleTricks(true); }
          else {
            // he goes in exactly as he was: same attitude, still turning the same way
            carrySpin=spinHeld?SPIN_RATE:0; carryFlip=flipHeld?FLIP_RATE:0;
            settleTricks(false,true); startWipeout(offF>=0.62?'under':'land'); return;
          }
        } else if(grabOn){ settleTricks(false,true); startWipeout('foam'); return; }
      }
      airborne=false;wakeAir=false;
      // it does not stop dead on the surface: it keeps driving down, buries itself,
      // and the water throws it back — the harder the landing, the deeper it goes
      vy*=0.34;
      player.rotation.set(0,0,0);
    }
  } else {
    // Buoyancy as a spring the hull works against, not a rail it slides along. It
    // lags a fast-building face, plunges when the water drops away and rebounds when
    // it comes back, so the board has weight instead of hovering on the surface.
    vy+=((waterY-py)*(onWake?110:56) - vy*(onWake?17:10.4))*dt;
    vy=Math.max(-24,Math.min(24,vy));
    py+=vy*dt;
    if(py<waterY-1.20){py=waterY-1.20;vy=Math.max(vy,0);}     // it never goes right under
    if(vy<-5.5&&Math.random()<dt*26)splash(px+(Math.random()-0.5)*0.8,py+0.15,-0.6,2);
  }
  // Run up the kicker rather than being teleported off it. His height is taken from
  // the ramp's own curve, and the speed that gives him vertically is simply how fast
  // that surface is rising underneath him — so a fast approach launches him harder,
  // the lip angle decides the arc, and there is no scripted jump anywhere in it.
  let ramped=null;
  if(!hanging&&!wipe){
    for(const o of obstacles){
      if(!o.userData.ramp)continue;
      const local=pz-o.position.z, RL=o.userData.rampL;
      const t=(RL-local)/(2*RL);
      if(t<0||t>1)continue;
      if(Math.abs(px-o.position.x)>o.userData.rampW+BOARD_HALF_W*0.6)continue;
      const sy=o.position.y+o.userData.rampH*Math.pow(t,o.userData.rampP);
      if(py>sy+1.4)continue;                       // clearing it in the air
      ramped={o,t,sy};
    }
  }
  if(ramped){
    const prev=py;
    // it can only ever lift him. The foot of a kicker floats a little under the
    // waterline, and taking his height from it outright dropped him into it as he
    // arrived — a step down before the climb.
    py=Math.max(py,ramped.sy);
    const lifted=ramped.sy>prev-0.05;
    vy=Math.min(30,Math.max(vy,(py-prev)/Math.max(1e-3,dt)));
    airborne=false;wakeAir=false;
    const P=ramped.o.userData.rampP, H=ramped.o.userData.rampH, RL=ramped.o.userData.rampL;
    // The exit speed taken from the ramp's own curve rather than from how far he
    // happened to move between two frames. That measurement is frame-rate noise as
    // much as anything, which is why the same kicker could throw a big jump or barely
    // lift him. dy/dt at the lip is H*P*t^(P-1) over the ramp's length, times how fast
    // it is coming at him.
    rampExitV=H*P*Math.pow(Math.max(1e-3,ramped.t),P-1)/(2*RL)*Math.max(8,lastEff);
    rampPitchT=lifted?Math.atan(H*P*Math.pow(Math.max(1e-3,ramped.t),P-1)/(2*RL)):0;
    if(!ramped.o.userData.used&&ramped.t>0.72){
      ramped.o.userData.used=true;
      score+=50;boost=Math.min(16,boost+4);msg('RAMP! +50');
      splash(px,py-0.2,pz+1.2,10,0x9ff3ea);
    }
    onRampO=ramped.o;
  } else if(onRampO){
    // off the lip with what the ramp gave him, and never with less than a real jump
    onRampO=null;airborne=true;
    vy=Math.max(vy,Math.min(28,rampExitV),RAMP_MIN_VY);
    rampExitV=0;
  } else rampPitchT=0;
  trickReady=(airborne&&py>waterY+0.8)||hanging;   // you can trick while being towed
  // the pad stays put for the whole run — it used to blink out between leaving the
  // water and reaching trick height, which on every small jump read as a glitch.
  // Every trick jumps for you off the water anyway, so all five are always live.
  trickBar.classList.remove('hidden');
  jumpBtn.style.opacity=trickReady?'0.25':'1';

  // Pearling went with the fore-and-aft weight it depended on: without a way to put
  // your weight over the nose there is nothing left to bury it with.

  // cutback + carve spray
  if(!airborne&&!hanging){
    if(cutCd<=0&&Math.abs(vx)>5.5&&sx!==0&&Math.sign(sx)!==Math.sign(vx)){
      // Throw it back harder than the fins can hold and they let go. This is what
      // stops a cutback being farmed by swinging side to side: the reward and the
      // wipeout are the same move, a little further apart.
      if(Math.abs(vx)>10.4){ startWipeout('foam'); msg('BLEW THE TAIL OUT!'); return; }
      cutCd=1.2;score+=75;boost=Math.min(16,boost+3.5);msg('CUTBACK! +75');
      const bside=-Math.sign(vx);
      for(let i=0;i<26;i++){
        const m=takeDrop();if(!m)break;
        m.material=SPLASH_MAT;
        const sc=0.8+Math.random()*1.4;m.scale.setScalar(sc);
        m.position.set(px+bside*0.8,waterY+0.1,0.4+Math.random()*0.6);
        m.userData={vx:bside*(4+Math.random()*7),vy:2.5+Math.random()*5,vz:2+Math.random()*4,t:0.6+Math.random()*0.3,s:sc};
        splashes.push(m);
      }
    }
    // The tail is always shovelling water, carving or not. Going straight the board
    // still shoves a wall of it out behind — that is most of what you actually see in
    // a wake shot, and without it the sea read as glass under a board floating on top.
    tailAcc+=dt*(26+eff*1.9);
    while(tailAcc>1){
      tailAcc-=1;
      const m=takeDrop();if(!m)break;
      m.material=SPLASH_MAT;
      const sc=0.75+Math.random()*1.5;m.scale.setScalar(sc);
      const off=(Math.random()-0.5)*1.5;
      m.position.set(px+off, waterY-0.16+Math.random()*0.2, 1.0+Math.random()*1.1);
      m.userData={vx:off*2.4+(Math.random()-0.5)*2.2, vy:1.0+Math.random()*2.6,
                  vz:2.4+Math.random()*3.4, t:0.45+Math.random()*0.4, s:sc};
      splashes.push(m);
    }
    // continuous rail spray while carving — the white fan off the outside rail
    const sprayRate=(Math.abs(carve)*170+14)*(eff/40);
    sprayAcc+=dt*sprayRate;
    const side=-Math.sign(vx||1);
    while(sprayAcc>1){
      sprayAcc-=1;
      if(Math.abs(carve)<0.10)continue;
      const m=takeDrop();if(!m)break;
      m.material=SPLASH_MAT;
      const sc=0.7+Math.random()*1.1;m.scale.setScalar(sc);
      m.position.set(px+side*(0.5+Math.abs(carve)*0.6),waterY-0.10,0.2+Math.random()*0.9);
      m.userData={vx:side*(3.0+Math.abs(carve)*11+Math.random()*3),vy:1.2+Math.random()*Math.abs(carve)*9,vz:1.5+Math.random()*3,t:0.45+Math.random()*0.35,s:sc};
      splashes.push(m);
    }
  }

  // trick progression + rotations (player group spins; camera never tilts)
  // hand drag on the water
  if(dragOn){
    if(airborne||hanging)endDrag();
    else{
      dragPts+=70*dt;
      sprayAcc+=dt*90;
      while(sprayAcc>1){
        sprayAcc-=1;
        const m=takeDrop(); if(!m)break;
        m.material=SPLASH_MAT;
        const sc=0.7+Math.random()*1.0; m.scale.setScalar(sc);
        m.position.set(px+dragSide*(0.95+Math.random()*0.2), waterY-0.12, -0.15+Math.random()*0.7);
        m.userData={vx:dragSide*(1.4+Math.random()*3),vy:1.8+Math.random()*4.2,vz:2.2+Math.random()*3,t:0.5+Math.random()*0.35,s:sc};
        splashes.push(m);
      }
      pushTrail(px+dragSide*0.8,waterY,0.5,0.55);
    }
  }
  // spin / flip / grab all run at once while you're off the water
  if(airborne||hanging){
    if(spinHeld)spinRot+=dt*SPIN_RATE;
    else if(spinQ>0){const d=Math.min(dt*SPIN_RATE,spinQ);spinRot+=d;spinQ-=d;}
    if(flipHeld)flipRot+=dt*FLIP_RATE;
    else if(flipQ>0){const d=Math.min(dt*FLIP_RATE,flipQ);flipRot+=d;flipQ-=d;}
    if(pitchQ>0){const d=Math.min(dt*FLIP_RATE,pitchQ);pitchRot+=d;pitchQ-=d;}
    if(grabOn)grabPts+=95*dt;
    player.rotation.set(pitchRot*pitchSign,spinRot*spinSign,flipRot*flipSign);
    // rope tricks bank as soon as you square up
    if(hanging&&!spinHeld&&!flipHeld&&(spinRot>0.4||flipRot>0.4)){
      const offS=Math.abs(((spinRot+Math.PI)%(Math.PI*2))-Math.PI);
      const offF=Math.max(Math.abs(((flipRot+Math.PI)%(Math.PI*2))-Math.PI),
                          Math.abs(((pitchRot+Math.PI)%(Math.PI*2))-Math.PI));
      if(offS<0.7&&offF<0.7)settleTricks(true);
    }
  } else { spinHeld=false; flipHeld=false; }
  if(trick&&trick.type==='back'){
    trick.t+=dt;
    const prog=Math.min(1,trick.t/trick.dur);
    player.rotation.set(-prog*Math.PI*2,spinRot,flipRot);
    if(prog>=1){score+=trick.pts;boost=Math.min(16,boost+6);msg(`${trick.name}! +${trick.pts}`);trick=null;}
  }

  // board rig: damped yaw/lean/pitch — eases onto the rail like a real board
  const grab=grabOn&&(airborne||hanging);
  // the hull banks with the water across its rails as well as leaning into the turn
  // A board banks into its turn the way a bike does — carve right and the right rail
  // goes down, not up. The water's own roll is separate and keeps its sign: it is the
  // surface the hull is lying on, not something the rider is doing.
  const yawT=-carve*0.30, leanT=-carve*0.55 + (airborne?0:hullRoll*1.20);
  const faceSlope=hT-hN;                     // downhill when the tail is higher
  // Ride fore and aft rather than sitting on one spot. Leaning drives him up the
  // board, leaning back settles him toward the tail of the shot, and dropping down
  // a face lunges him forward a little. Forward travel is kept short on purpose.
  const pzT=Math.max(-3.0,Math.min(2.2, -leanW*2.3 - Math.max(-1,Math.min(1,faceSlope))*0.8));
  pz+=(pzT-pz)*Math.min(1,dt*2.2);
  player.position.set(px,py,pz);
  // it lies along the water it is resting on, plus whatever the rider's weight adds
  const pitchT=onRampO?rampPitchT
              :(airborne?-0.22:Math.max(-0.62,Math.min(0.68,hullPitch*1.50)) + leanW*0.62);
  boardYaw+=(yawT-boardYaw)*Math.min(1,dt*7);
  boardLean+=(leanT-boardLean)*Math.min(1,dt*8.5);
  boardPitch+=(pitchT-boardPitch)*Math.min(1,dt*13);
  const grabRoll = grab ? grabSide*0.30 : 0;   // board tips toward the rail he's holding
  rig.rotation.set(boardPitch,boardYaw,boardLean+grabRoll);
  animateRig(dt,carve,grab,waterY);
  updateHandstand(dt,carve);

  // whitewater under the board + wash trail behind it
  if(!airborne&&!hanging){
    // water piles up on the inside rail of the turn and peels off the outside — no discs
    trailT-=dt;
    if(trailT<=0){trailT=0.026;pushTrail(px,waterY,0.9,0.42+Math.abs(carve)*0.85);}
  }

  if(!airborne&&Math.random()<dt*14)splash(px+(Math.random()-0.5),waterY-0.1,1.4,1);

  // obstacles
  bigFinCd=Math.max(0,bigFinCd-dt);
  spawnT-=dt;
  if(spawnT<=0){
    // Space them by the gap on the water, not by the clock. Timing the spawns meant
    // that as the ramp pulled the interval down while the speed was still low, the
    // obstacles bunched up tighter mid-run than they ever are at the end. Held in
    // metres it only ever opens or closes the way it is meant to: thirty units apart
    // to start, closing to sixteen over about three kilometres, after which the speed
    // alone keeps taking the reaction time away.
    const wantGap=Math.max(15,24-dist/300);
    // ...with a floor on the clock as well, so that once the speed is silly it stays
    // merely hard rather than becoming a wall nothing could be threaded
    spawnT=Math.max(0.40,wantGap/Math.max(16,eff))*(0.75+Math.random()*0.5);
    // ...and the cast arrives a piece at a time. Buoys and logs are the whole game to
    // begin with; ramps, then jellyfish, then sharks, then the octopuses that throw
    // things at you, each one introduced with room to get used to it.
    const WEIGHTS=[['buoy',24,0],['log',18,0],['ramp',17,150],['jelly',21,340],
                   ['bigfin',11,560],['octopus',14,780]].filter(w=>dist>=w[2]);
    let pick=null;
    for(let tries=0;tries<8;tries++){
      let total=0;for(const w of WEIGHTS)total+=w[1];
      let roll=Math.random()*total,cand=WEIGHTS[0][0];
      for(const w of WEIGHTS){roll-=w[1];if(roll<=0){cand=w[0];break;}}
      if(cand===lastKind&&sameRun>=2)continue;          // break up streaks
      if(cand==='bigfin'&&bigFinCd>0)continue;          // big fin needs breathing room
      pick=cand;break;
    }
    if(!pick)pick='buoy';
    sameRun=(pick===lastKind)?sameRun+1:1;
    lastKind=pick;
    if(pick==='bigfin')bigFinCd=9;
    // spread across the full lane, centred on the player, with jittered slots so it
    // never clusters on one side
    // seven lanes spanning wider than you can steer, so the edges are never safe
    laneSlot=(laneSlot+1+((Math.random()*3)|0))%7;
    const laneX=(-3+laneSlot)*4.9+(Math.random()-0.5)*3.0;
    makeObstacle(pick,Math.max(-17,Math.min(17,px*0.55+laneX)),-170);
    // and every so often drop an extra one right against an edge
    // the second one out by the edge only starts once you are well into a run
    if(dist>600&&Math.random()<0.30){
      const edge=(Math.random()<0.5?-1:1)*(11.5+Math.random()*4.5);
      makeObstacle(Math.random()<0.5?'buoy':'log',edge,-176);
    }
  }
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.position.z+=eff*dt;
    // ride the long swell, ignore the chop — and stay on top of it, never under
    const oy=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock)+FLOAT_OFF[o.userData.kind];
    if(o.userData.by===undefined)o.userData.by=oy;
    // a big rigid ramp barely moves; small floats respond more
    const follow=o.userData.ramp?3.0:9.0;
    o.userData.by+=(oy-o.userData.by)*Math.min(1,dt*follow);
    o.position.y=o.userData.by;
    // tilt with the swell face — heavily damped on ramps so they don't wobble
    const tilt=o.userData.ramp?0.06:0.30;
    const span=o.userData.ramp?3.2:1.6;
    const slopeZ=(swellH(o.position.x,dist*WAVE_DRIFT+o.position.z+span,waveClock)-swellH(o.position.x,dist*WAVE_DRIFT+o.position.z-span,waveClock))*tilt;
    const slopeX=(swellH(o.position.x+span,dist*WAVE_DRIFT+o.position.z,waveClock)-swellH(o.position.x-span,dist*WAVE_DRIFT+o.position.z,waveClock))*tilt;
    if(o.userData.rx===undefined){o.userData.rx=slopeZ;o.userData.rz=-slopeX;}
    o.userData.rx+=(slopeZ-o.userData.rx)*Math.min(1,dt*(o.userData.ramp?2.0:6.0));
    o.userData.rz+=((-slopeX)-o.userData.rz)*Math.min(1,dt*(o.userData.ramp?2.0:6.0));
    o.rotation.x=o.userData.rx; o.rotation.z=o.userData.rz;
    if(o.userData.kind==='buoy')o.rotation.z+=Math.sin(tNow*2+o.position.x)*0.06;
    if(o.userData.kind==='bigfin'){
      // pace the crossing so it arrives in your lane just as you reach it
      const togo=Math.max(0.35,(-o.position.z)/Math.max(8,eff));
      o.position.x+=((o.userData.targetX-o.position.x)/togo)*dt;
      if(Math.random()<dt*14)splash(o.position.x,o.position.y+0.1,o.position.z+1.4,1);
    }
    if(o.userData.kind==='octopus'){
      const u=o.userData;
      u.t+=dt;
      // turns to keep the rider in front of it while it drifts past
      o.rotation.y=Math.atan2(o.position.x-px,o.position.z);
      o.position.y+=Math.sin(u.t*1.5)*dt*0.30;                 // gentle bob of its own
      // a travelling wave down every arm: each joint lags the one before it, and the
      // three axes run at different rates so the tips coil and uncoil as they sweep
      for(let k=0;k<u.joints.length;k++){
        const j=u.joints[k], d=j.userData;
        // two unrelated rates per joint, so the sum never repeats on a neat loop,
        // plus a lag down the arm and a per-animal offset — flowing, not metronomic
        const t1=u.t*d.f1+d.p1+u.seed, t2=u.t*d.f2+d.p2+u.seed*1.7;
        const lag=d.seg*0.88;                  // a longer lag makes the wave read as it travels
        const A=d.a1*d.k, B=d.a2*d.k;
        if(d.seg===0)
          j.rotation.x=d.sM+Math.sin(u.t*d.sF*Math.PI*2+d.sP+u.seed)*d.sA;
        else
          j.rotation.x=d.rx+Math.sin(t1-lag)*A+Math.sin(t2*0.63-lag*0.5)*A*0.6;
        j.rotation.y=d.ry+Math.sin(t2-lag*0.8)*B+Math.cos(t1*0.41)*B*0.5;
        j.rotation.z=d.rz+Math.cos((t1+t2)*0.5-lag*0.7)*A*0.8;
      }
      // only throws while it is close enough to be a threat
      if(o.position.z>-72&&o.position.z<-7){
        u.throwT-=dt;
        if(u.throwT<=0){u.throwT=1.05+Math.random()*1.05;throwStarfish(o);}
      }
    }
    if(o.userData.bell){
      // slow swimming pulse: the bell squashes and springs back
      const ph=tNow*1.6+o.userData.pulse;
      const sq=0.5+0.5*Math.sin(ph);
      const hit=o.userData.squash||0;
      if(o.userData.squash)o.userData.squash=Math.max(0,o.userData.squash-dt*2.4);
      o.userData.bell.scale.set(0.95+sq*0.13+hit*0.45,0.95-sq*0.20-hit*0.55,0.95+sq*0.13+hit*0.45);
      o.rotation.y+=dt*0.25;
      o.position.y+=Math.sin(ph)*dt*0.35;          // bobs upward on each pulse
    }
    if(o.userData.wash){const w=1+Math.sin(tNow*3+o.position.x)*0.12;o.userData.wash.scale.set(w,w,1);o.userData.wash.material.opacity=0.4+Math.sin(tNow*3+o.position.x)*0.15;}

    if(o.position.z>18){scene.remove(o);obstacles.splice(i,1);continue;}
    // the jelly closes fast and is only "at" you for a couple of frames, so its
    // window grows with speed — otherwise a jump can pass clean over the contact
    // The board is a 5m plank, not a point. Test it as a capsule running nose to
    // tail, swept over the ground the obstacle covered this frame, so the nose
    // makes contact when it reaches something instead of sliding through it first.
    const R=o.userData.r+BOARD_HALF_W;
    // Sweep sideways as well as forward. A shark fin crosses your line fast, and
    // testing only where it happens to be this frame lets it step straight over the
    // board between two frames — you watch it go through you and nothing happens.
    const ox1=o.position.x, ox0=(o.userData.lx===undefined?ox1:o.userData.lx);
    const xlo=Math.min(ox0,ox1), xhi=Math.max(ox0,ox1);
    const dxo=px<xlo?xlo-px:(px>xhi?px-xhi:0);
    o.userData.lx=ox1;
    let contact=false;
    if(dxo<R){
      const reach=Math.sqrt(R*R-dxo*dxo);          // z it can touch at this x offset
      const z1=o.position.z, z0=z1-eff*dt;         // where it was a frame ago
      const nose=pz-BOARD_HALF_L, tail=pz+BOARD_HALF_L;
      contact=(Math.min(z0,z1)-reach)<tail && (Math.max(z0,z1)+reach)>nose;
    }
    if(contact){
      if(o.userData.ramp){
        /* handled as a surface above, not as something to hit */
      } else if(o.userData.kind==='jelly'){
        // A jellyfish never ends a run. Hit it however you like and the bell throws
        // you off it — hard from above, more of a shove if you clip it on the water.
        const over=airborne&&py>o.position.y+0.10;
        vy=over?Math.max(12.5,-vy*0.85+9.0):Math.max(9.0,vy+8.0);
        airborne=true;
        py=Math.max(py,o.position.y+0.9);
        score+=60;boost=Math.min(16,boost+3);
        msg('JELLY BOUNCE! +60');
        shake=over?0.7:1.0;
        splash(o.position.x,o.position.y+0.5,o.position.z,over?14:20);
        if(o.userData.bell)o.userData.squash=1.0;      // the bell flattens under you
      } else if(py<waterY+o.userData.h&&!hanging){
        // it takes the impact too: shoved aside, lifted and set spinning
        o.userData.knock={vx:(o.position.x-px)*0.9+(Math.random()-0.5)*2.4,
          vy:2.0+Math.random()*2.4, vz:2.2+lastEff*0.06,
          sx:(Math.random()-0.5)*6, sz:(Math.random()-0.5)*6};
        startWipeout(o.userData.kind);return;
      }
    }
  }

  // plane
  planeT-=dt;
  if(planeT<=0&&!planeActive){
    planeActive=true;plane.visible=true;
    plane.position.set(Math.random()*16-8,11,-190);
    planeT=40+Math.random()*38;
  }
  if(planeActive){
    plane.position.z+=(eff*0.45+12)*dt;
    plane.position.y=11+Math.sin(tNow*1.5)*0.6;
    plane.userData.prop.rotation.z+=dt*40;
    plane.rotation.y=Math.PI;
    if(plane.position.z>40){planeActive=false;plane.visible=false;if(hanging)releaseRope(false);}
  }
  const ropeWindow=planeActive&&plane.position.z>-90&&plane.position.z<-4;
  ropeBtn.style.display=(ropeWindow||hanging)?'flex':'none';
  if(hanging){
    rope.geometry.setFromPoints([
      new THREE.Vector3(px,py+1.2,-0.5),
      new THREE.Vector3(plane.position.x,plane.position.y-0.6,plane.position.z)
    ]);
  }

  // splashes
  for(let i=splashes.length-1;i>=0;i--){
    const s2=splashes[i],u=s2.userData;
    u.t-=dt;u.vy-=14*dt;
    s2.position.x+=u.vx*dt;s2.position.y+=u.vy*dt;s2.position.z+=u.vz*dt+eff*dt*0.4;
    s2.scale.setScalar(Math.max(0.05,u.t*u.s));
    if(u.t<=0){freeDrop(s2);splashes.splice(i,1);}
  }
  // keep the contact shadows glued under everything
  {
    const sy=waveH(px,dist*WAVE_DRIFT,waveClock)+0.06;
    // no contact disc under the board — on open water there is nothing for a shadow
    // to fall on, and a dark ellipse tracking him under the hull only ever read as a
    // sticker. The obstacles keep theirs; they sit still enough for it to work.
    boardShadow.visible=false;
    let si=0;
    for(const o of obstacles){
      if(si>=OBST_SHADOWS.length)break;
      if(o.position.z<-70||o.position.z>14)continue;
      const sh=OBST_SHADOWS[si++];
      sh.visible=true;
      const oy=swellH(o.position.x,dist*WAVE_DRIFT+o.position.z,waveClock)+0.05;
      sh.position.set(o.position.x+0.3,oy,o.position.z+0.3);
      const r=o.userData.r||1.2;
      sh.scale.set(r*0.55,r*0.85,1);
      sh.material.opacity=0.14;
    }
    for(;si<OBST_SHADOWS.length;si++)OBST_SHADOWS[si].visible=false;
  }
  updateWake(dt,eff);

  updateSeaLife(dt,eff);
  updateJetSki(dt,eff);
  updateWhirl(dt,eff);
  updateStars(dt,eff);
  updateSplat(dt);
  updateDayCycle();

  // stage sets the range; sets roll through it so you get small, medium, large and
  // the occasional extra-large — and the whole range climbs the further you get
  const stage=Math.min(1,dist/9000);
  const base=1.12+stage*1.00;                 // typical size for this point in the run
  const swing=0.34+stage*0.50;                // how much the sets vary
  waveAmp=Math.max(0.34, base+setNoise(waveClock)*swing);
  WAVE_DRIFT=0.46+stage*0.16;                 // rolls past a little quicker later on
  oceanUniforms.uAmp.value=waveAmp;
  oceanUniforms.uPeak.value=1.58*waveAmp+wkA*0.60;   // so only the wake's crest foams   // total wave height, so foam thresholds track the swell
  // sets: the swell surges and eases instead of ticking at one constant rate
  waveClock += dt*(1.0 + 0.55*Math.sin(tNow*0.045) + 0.28*Math.sin(tNow*0.017+1.3));
  oceanUniforms.uT.value=waveClock;
  oceanUniforms.uDist.value=dist*WAVE_DRIFT;
  oceanUniforms.uWakeZ.value=wkZ;oceanUniforms.uWakeA.value=wkA;oceanUniforms.uWakeX.value=wkX;
  oceanUniforms.uWhX.value=whX;oceanUniforms.uWhZ.value=whZ;oceanUniforms.uWhA.value=whA;

  // camera: level horizon, smoothed follow, pulls back with speed
  camX+=(px-camX)*Math.min(1,dt*7);     // camera sits directly behind him
  lookX+=(px-lookX)*Math.min(1,dt*7);   // and looks straight down the line
  camera.up.set(0,1,0);
  // On the water the camera only loosely tracks the swell, so the board visibly
  // rises and drops against it. Off the water it follows most of the way up —
  // not the whole height, so the air still reads as air — and it chases faster,
  // eases back a little and lifts its aim, keeping him framed on a ramp, a jump,
  // a wake launch or the plane tow.
  const airH=Math.max(0,py-waterY);
  const flying=airborne||hanging||airH>0.6;
  // Height is measured from the water under the rider, not from zero. On a big
  // swell the sea itself rises many units, and a camera anchored to zero ends up
  // underneath it looking out through the inside of the wave.
  camY+=((waterY+4.9+airH*0.80)-camY)*Math.min(1,dt*(flying?4.6:1.6));
  camY=Math.max(camY,waterY+2.3);            // never let a fast-building face swallow it
  // follow his fore/aft travel only partly, so it reads on screen instead of the
  // camera cancelling it out and pinning him to one spot again
  camZ+=((11.0+eff*0.05+airH*0.22+pz*0.42)-camZ)*Math.min(1,dt*2.4);
  camera.position.set(camX,camY,camZ);
  camera.lookAt(lookX,waterY+1.05+airH*0.62,-14);

  hScore.textContent=score|0;
  hDist.textContent=(dist|0)+' m';
  hSpeed.textContent=(eff*0.62)|0;
  hBest.textContent=best;
  hCoins.textContent=coins+coinsFor(dist,score);
}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(!running&&wipe){                       // crash plays out with the world still alive
    updateWipeout(dt);
    updateWorldDuringWipeout(dt);
  }
  if(running){runSecs+=dt;update(dt);}
  // the menu gets the same sky work the ride does: without it the dome and the sun
  // never follow the camera and the colours never track the time of day
  else {oceanUniforms.uT.value+=dt;tNow+=dt;menuCamera(dt);updateDayCycle();}
  updateSkyLife(dt);          // the sky keeps moving on the menu and through a wipeout
  renderer.render(scene,camera);
  if(splat3D.visible){
    // clear only depth, so it lands on top of the frame but still occludes itself
    renderer.autoClear=false;
    renderer.clearDepth();
    renderer.render(splatScene,splatCam);
    renderer.autoClear=true;
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
