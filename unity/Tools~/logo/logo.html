<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="s" width="1200" height="520" viewBox="100 40 1200 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8b06a"/><stop offset="0.45" stop-color="#c47f3f"/><stop offset="1" stop-color="#83491f"/>
  </linearGradient>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.11" numOctaves="5" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0 0.03  0 0 0 2.6 -1.05" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="gi"/>
    <feMerge result="woodg"><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
    <!-- the carved bevel: light from the upper left along the edges -->
    <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
    <feSpecularLighting in="b" surfaceScale="9" specularConstant="0.9" specularExponent="22" lighting-color="#fff1d6" result="sp">
      <feDistantLight azimuth="235" elevation="38"/>
    </feSpecularLighting>
    <feComposite in="sp" in2="SourceAlpha" operator="in" result="spi"/>
    <feComposite in="woodg" in2="spi" operator="arithmetic" k1="0" k2="1" k3="0.42" k4="0" result="lit"/>
    <!-- and the carving: a dark inner edge, as a gouge leaves -->
    <feMorphology in="SourceAlpha" operator="erode" radius="6" result="er"/>
    <feComposite in="SourceAlpha" in2="er" operator="out" result="edge"/>
    <feGaussianBlur in="edge" stdDeviation="2.5" result="edgeb"/>
    <feFlood flood-color="#4a250c" flood-opacity="0.55"/>
    <feComposite in2="edgeb" operator="in" result="edged"/>
    <feMerge><feMergeNode in="lit"/><feMergeNode in="edged"/></feMerge>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dx="0" dy="14" result="o"/>
    <feComponentTransfer in="o"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#shadow)" transform="rotate(-4 700 300)">
  <!-- the carved outline, a dark rim the letters sit in -->
  <text x="700" y="400" text-anchor="middle" font-family="Lilita One" font-size="330" letter-spacing="10"
        fill="#3a1e0c" stroke="#3a1e0c" stroke-width="34" stroke-linejoin="round">SURF</text>
  <text x="700" y="400" text-anchor="middle" font-family="Lilita One" font-size="330" letter-spacing="10"
        fill="url(#wood)" filter="url(#grain)">SURF</text>
  <!-- a sea-green wave carved in under the word -->
  <path d="M300 470 C 420 420, 520 520, 640 470 S 860 420, 980 470 S 1100 500, 1120 470" fill="none" stroke="#3a1e0c" stroke-width="54" stroke-linecap="round"/>
  <path d="M300 470 C 420 420, 520 520, 640 470 S 860 420, 980 470 S 1100 500, 1120 470" fill="none" stroke="#24a7b3" stroke-width="30" stroke-linecap="round"/>
  <path d="M310 464 C 420 418, 520 512, 640 464 S 860 416, 980 464" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
</g>
</svg></body></html>
