name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only main deploys. A feature branch used to build too, and because both runs share
# this concurrency group the one that started a second later cancelled the other — so
# whether a push actually shipped came down to which run GitHub queued last. When the
# branch won that race it then failed anyway, because Pages only publishes from the
# default branch.
#
# cancel-in-progress was false for a while, on the reasoning that queueing rather than
# cancelling meant two quick pushes would both land. That was wrong for a DEPLOY: pushes
# to main are fast-forwards, so a later commit already contains the earlier one and
# publishing only the newest is exactly right. What it actually bought was a dam — one
# run that no runner ever picked up sat queued for twenty minutes and held three later
# deploys behind it, leaving the site three versions stale.
concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are two jobs, which is how GitHub's own Pages workflow is laid out and
# not a stylistic choice. With both in one job, deploy-pages queries the artifact API
# moments after upload-pages-artifact finalises, and it kept coming back "Found 0
# artifact(s)" for an artifact whose upload had just reported success — the metadata had
# not propagated yet, so the deploy failed on an artifact that plainly existed. A job
# boundary makes the runner wait for the artifact to be genuinely available before the
# deploy starts, which removes the race rather than retrying through it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled once under Settings -> Pages -> Source: GitHub Actions.
      # The workflow token is not allowed to create the Pages site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
